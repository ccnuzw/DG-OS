 - |\n| 版本兼容性检查 | 🔴 未开始 | 0% | TBD | - |\n| 回滚机制 | 🔴 未开始 | 0% | TBD | - |\n| 前端 UI | 🔴 未开始 | 0% | TBD | - |\n| 测试用例 | 🔴 未开始 | 0% | TBD | - |\n\n详见 [V1 实现状态](../../../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**风险级别**：🔴 高风险（需要重点关注）  \n**下一步**：评审通过后进入开发\n", "doc-021": "# V1-FR-005：统一设计系统\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-005 |\n| 功能名称 | 统一设计系统 |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 |\n| 优先级 | P0（必须） |\n| 风险级别 | 标准（UI 规范，技术成熟） |\n| 依赖功能 | 无 |\n| 被依赖功能 | **所有功能**（全局强制使用） |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n建立完整的 Design Tokens 体系、主题系统、密度系统、基础组件库和错误通知规范，所有模块强制复用，确保 DGOS 全局视觉和交互的完全一致性。\n\n### 2.2 详细说明\n\n统一设计系统是 DGOS 的**视觉和交互基础设施**，定义了从原子级别（颜色、字号）到分子级别（组件）再到有机体级别（错误处理、通知）的完整规范。\n\n**核心价值**：\n- ✅ **原子化设计**：Design Tokens 定义所有视觉基础变量\n- ✅ **主题系统**：支持亮色/暗色模式、自定义主题、跟随系统\n- ✅ **密度系统**：支持 5 种密度级别（75%-175%），适应不同用户偏好\n- ✅ **组件库**：10+ 基础组件，统一样式和交互\n- ✅ **错误与通知**：统一的错误处理和通知样式\n- ✅ **强制复用**：ESLint 规则禁止自定义样式\n\n**用户价值**：\n- 视觉一致：全局统一的外观\n- 个性化：可调节主题、字号、密度\n- 无障碍：符合 WCAG 2.1 AA 标准\n\n**从老项目学到的教训**：\n- ❌ 老项目：内联样式、重复组件、视觉不一致\n- ✅ DGOS：Design Tokens、强制复用、全局一致\n\n### 2.3 功能边界\n\n**包含**：\n\n**Design Tokens（设计令牌）**：\n- ✅ 色彩系统（主题色、语义色、中性色、透明度）\n- ✅ 字体系统（字体家族、字号、行高、字重）\n- ✅ 间距系统（4px 基准、倍数规则）\n- ✅ 圆角系统（4px、8px、12px、16px、9999px）\n- ✅ 阴影系统（sm、md、lg、xl）\n- ✅ 动画系统（过渡时长、缓动函数）\n- ✅ 断点系统（响应式，V6 移动端）\n\n**主题系统**：\n- ✅ 亮色模式（Light）\n- ✅ 暗色模式（Dark）\n- ✅ 自定义主题（壁纸取色）\n- ✅ 跟随系统（自动切换）\n- ✅ 主题持久化\n\n**密度系统**：\n- ✅ 5 种密度级别：更紧凑（75%）、标准（100%）、较大（125%）、大（150%）、更大（175%）\n- ✅ 字号缩放规则\n- ✅ 间距缩放规则\n- ✅ 组件尺寸自适应\n\n**基础组件库（12 个）**：\n- ✅ Button（按钮）\n- ✅ Input（输入框）\n- ✅ Select（选择器）\n- ✅ Checkbox（复选框）\n- ✅ Radio（单选框）\n- ✅ Switch（开关）\n- ✅ Modal（模态框）\n- ✅ Toast（轻提示）\n- ✅ Card（卡片）\n- ✅ Tooltip（提示）\n- ✅ Loading（加载）\n- ✅ Divider（分割线）\n\n**错误处理与通知体系**：\n- ✅ Toast 通知（4 种类型：成功、错误、警告、信息）\n- ✅ Modal 对话框（确认、警告、表单）\n- ✅ Inline 错误提示（表单验证）\n- ✅ 全局错误页面（404、500）\n- ✅ 统一动画和样式\n\n**强制复用机制**：\n- ✅ ESLint 规则禁止内联样式\n- ✅ ESLint 规则禁止自定义颜色\n- ✅ 代码审查检查点\n\n**不包含**（明确说明原因）：\n- ❌ 复杂业务组件（Table、Chart） → V2 根据需求扩展\n- ❌ 动画库（Framer Motion） → V1 简化，使用 CSS transitions\n- ❌ 完整图标库 → V1 只包含 20 个必要图标，V2 扩展\n- ❌ 国际化 i18n → V2 再做\n- ❌ 移动端响应式 → V6 移动端时做\n\n---\n\n## 3. 核心流程\n\n### 3.1 主题切换流程\n\n```\n用户打开系统设置\n  ↓\n点击\"外观\"标签\n  ↓\n选择主题：亮色 / 暗色 / 自动（跟随系统）\n  ↓\n前端调用：updateTheme('dark')\n  ↓\n更新 CSS 变量（--color-bg, --color-text, ...）\n  ↓\n所有组件自动响应新主题\n  ↓\n保存用户偏好到 app_config 表\n  ↓\n下次启动自动应用\n```\n\n### 3.2 密度调整流程\n\n```\n用户打开系统设置\n  ↓\n点击\"系统缩放\"\n  ↓\n选择密度：75% / 100% / 125% / 150% / 175%\n  ↓\n前端调用：updateDensity(125)\n  ↓\n更新根元素字号：font-size: calc(14px * 1.25)\n  ↓\n所有使用 rem 的尺寸自动缩放\n  ↓\n保存用户偏好到 app_config 表\n```\n\n### 3.3 错误通知流程\n\n```\n用户操作失败（如 Provider 调用失败）\n  ↓\n后端返回错误码：1001004\n  ↓\n前端捕获错误\n  ↓\n查找错误码映射：ERROR_MESSAGES['1001004'] = 'Provider 不存在'\n  ↓\n调用 Toast 组件：toast.error('Provider 不存在')\n  ↓\n显示 Toast：红色背景 + 错误图标 + 消息\n  ↓\n3 秒后自动消失（或用户手动关闭）\n  ↓\n（如果是严重错误）显示 Modal 对话框引导用户操作\n```\n\n### 3.4 开发者使用组件流程\n\n```\n开发者开发新模块\n  ↓\n需要按钮组件\n  ↓\n导入统一组件：import { Button } from '@dgos/design-system'\n  ↓\n使用组件：<Button variant=\"primary\">确定</Button>\n  ↓\n组件自动使用当前主题和密度\n  ↓\n（如果尝试写内联样式）ESLint 报错：禁止使用 style 属性\n```\n\n---\n\n## 4. Design Tokens（设计令牌）\n\n### 4.1 色彩系统\n\n#### 4.1.1 主题色（Brand Colors）\n\n**用途**：品牌识别、主要操作按钮、强调元素\n\n| Token | 亮色模式 | 暗色模式 | 用途 |\n|-------|---------|---------|------|\n| `--color-primary` | `#3B82F6` | `#60A5FA` | 主色（按钮、链接） |\n| `--color-primary-hover` | `#2563EB` | `#3B82F6` | 主色悬停 |\n| `--color-primary-active` | `#1D4ED8` | `#2563EB` | 主色按下 |\n| `--color-primary-light` | `#DBEAFE` | `#1E3A8A` | 主色浅色背景 |\n\n**颜色值来源**：Tailwind CSS Blue 色系\n\n#### 4.1.2 语义色（Semantic Colors）\n\n**用途**：传达状态和意图\n\n| Token | 亮色模式 | 暗色模式 | 用途 |\n|-------|---------|---------|------|\n| `--color-success` | `#10B981` | `#34D399` | 成功状态 |\n| `--color-success-bg` | `#D1FAE5` | `#064E3B` | 成功背景 |\n| `--color-error` | `#EF4444` | `#F87171` | 错误状态 |\n| `--color-error-bg` | `#FEE2E2` | `#7F1D1D` | 错误背景 |\n| `--color-warning` | `#F59E0B` | `#FBBF24` | 警告状态 |\n| `--color-warning-bg` | `#FEF3C7` | `#78350F` | 警告背景 |\n| `--color-info` | `#3B82F6` | `#60A5FA` | 信息状态 |\n| `--color-info-bg` | `#DBEAFE` | `#1E3A8A` | 信息背景 |\n\n#### 4.1.3 中性色（Neutral Colors）\n\n**用途**：背景、文本、边框、分割线\n\n| Token | 亮色模式 | 暗色模式 | 用途 |\n|-------|---------|---------|------|\n| `--color-bg-primary` | `#FFFFFF` | `#1F1F1F` | 主背景 |\n| `--color-bg-secondary` | `#F9FAFB` | `#2A2A2A` | 次要背景 |\n| `--color-bg-tertiary` | `#F3F4F6` | `#363636` | 三级背景 |\n| `--color-text-primary` | `#111827` | `#F9FAFB` | 主文本 |\n| `--color-text-secondary` | `#6B7280` | `#9CA3AF` | 次要文本 |\n| `--color-text-tertiary` | `#9CA3AF` | `#6B7280` | 三级文本 |\n| `--color-text-disabled` | `#D1D5DB` | `#4B5563` | 禁用文本 |\n| `--color-border` | `#E5E7EB` | `#374151` | 边框 |\n| `--color-divider` | `#F3F4F6` | `#2A2A2A` | 分割线 |\n\n#### 4.1.4 透明度（Opacity）\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--opacity-disabled` | `0.4` | 禁用元素 |\n| `--opacity-hover` | `0.8` | 悬停效果 |\n| `--opacity-overlay` | `0.6` | 遮罩层 |\n\n### 4.2 字体系统\n\n#### 4.2.1 字体家族\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--font-family-base` | `-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif` | 正文字体 |\n| `--font-family-mono` | `\"SF Mono\", Monaco, \"Cascadia Code\", monospace` | 等宽字体（代码） |\n\n**说明**：使用系统字体，确保跨平台一致性和性能。\n\n#### 4.2.2 字号（Font Size）\n\n**基准**：`--font-size-base = 14px`（可通过密度系统缩放）\n\n| Token | 值（px） | rem | 用途 |\n|-------|---------|-----|------|\n| `--font-size-xs` | 12 | 0.857rem | 辅助文本 |\n| `--font-size-sm` | 13 | 0.929rem | 小号文本 |\n| `--font-size-base` | 14 | 1rem | 正文 |\n| `--font-size-lg` | 16 | 1.143rem | 大号文本 |\n| `--font-size-xl` | 18 | 1.286rem | 标题 H4 |\n| `--font-size-2xl` | 20 | 1.429rem | 标题 H3 |\n| `--font-size-3xl` | 24 | 1.714rem | 标题 H2 |\n| `--font-size-4xl` | 30 | 2.143rem | 标题 H1 |\n\n**密度缩放示例**：\n```css\n/* 标准（100%） */\nhtml { font-size: 14px; }\n\n/* 较大（125%） */\nhtml { font-size: calc(14px * 1.25); } /* 17.5px */\n\n/* 更紧凑（75%） */\nhtml { font-size: calc(14px * 0.75); } /* 10.5px */\n```\n\n#### 4.2.3 行高（Line Height）\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--line-height-tight` | 1.25 | 标题 |\n| `--line-height-normal` | 1.5 | 正文 |\n| `--line-height-relaxed` | 1.75 | 长文本 |\n\n#### 4.2.4 字重（Font Weight）\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--font-weight-normal` | 400 | 正文 |\n| `--font-weight-medium` | 500 | 次要强调 |\n| `--font-weight-semibold` | 600 | 主要强调 |\n| `--font-weight-bold` | 700 | 标题 |\n\n### 4.3 间距系统\n\n**基准**：`--spacing-unit = 4px`\n\n**规则**：所有间距都是 4px 的倍数\n\n| Token | 值（px） | rem | 用途 |\n|-------|---------|-----|------|\n| `--spacing-0` | 0 | 0 | 无间距 |\n| `--spacing-1` | 4 | 0.286rem | 极小间距 |\n| `--spacing-2` | 8 | 0.571rem | 小间距 |\n| `--spacing-3` | 12 | 0.857rem | 中小间距 |\n| `--spacing-4` | 16 | 1.143rem | 标准间距 |\n| `--spacing-5` | 20 | 1.429rem | 中大间距 |\n| `--spacing-6` | 24 | 1.714rem | 大间距 |\n| `--spacing-8` | 32 | 2.286rem | 超大间距 |\n| `--spacing-10` | 40 | 2.857rem | 巨大间距 |\n| `--spacing-12` | 48 | 3.429rem | 特大间距 |\n\n**密度缩放**：间距使用 `rem` 单位，自动跟随密度缩放。\n\n### 4.4 圆角系统\n\n| Token | 值（px） | 用途 |\n|-------|---------|------|\n| `--radius-none` | 0 | 无圆角 |\n| `--radius-sm` | 4 | 小圆角（按钮、输入框） |\n| `--radius-md` | 8 | 中圆角（卡片） |\n| `--radius-lg` | 12 | 大圆角（Modal） |\n| `--radius-xl` | 16 | 超大圆角 |\n| `--radius-full` | 9999px | 全圆角（Tag、Avatar） |\n\n### 4.5 阴影系统\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--shadow-sm` | `0 1px 2px rgba(0,0,0,0.05)` | 小阴影（卡片） |\n| `--shadow-md` | `0 4px 6px rgba(0,0,0,0.1)` | 中阴影（下拉菜单） |\n| `--shadow-lg` | `0 10px 15px rgba(0,0,0,0.1)` | 大阴影（Modal） |\n| `--shadow-xl` | `0 20px 25px rgba(0,0,0,0.15)` | 超大阴影（浮动面板） |\n\n**暗色模式**：阴影自动调整为更深的颜色。\n\n### 4.6 动画系统\n\n#### 4.6.1 过渡时长\n\n| Token | 值（ms） | 用途 |\n|-------|---------|------|\n| `--duration-fast` | 150 | 快速过渡（按钮） |\n| `--duration-base` | 250 | 标准过渡（大多数） |\n| `--duration-slow` | 350 | 慢速过渡（Modal） |\n\n#### 4.6.2 缓动函数\n\n| Token | 值 | 用途 |\n|-------|---|------|\n| `--ease-in-out` | `cubic-bezier(0.4, 0, 0.2, 1)` | 标准缓动 |\n| `--ease-out` | `cubic-bezier(0, 0, 0.2, 1)` | 出现动画 |\n| `--ease-in` | `cubic-bezier(0.4, 0, 1, 1)` | 消失动画 |\n\n---\n\n## 5. 主题系统\n\n### 5.1 主题类型\n\n#### 5.1.1 亮色模式（Light）\n\n**默认主题**，适合白天使用。\n\n**特点**：\n- 白色背景（`#FFFFFF`）\n- 深色文本（`#111827`）\n- 高对比度\n- 明亮清爽\n\n#### 5.1.2 暗色模式（Dark）\n\n**护眼主题**，适合夜间使用。\n\n**特点**：\n- 深色背景（`#1F1F1F`）\n- 浅色文本（`#F9FAFB`）\n- 降低蓝光\n- 省电（OLED 屏幕）\n\n#### 5.1.3 跟随系统（Auto）\n\n**智能切换**，根据系统设置自动切换。\n\n**实现**：\n```typescript\n// 监听系统主题变化\nwindow.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {\n  if (userPreference === 'auto') {\n    updateTheme(e.matches ? 'dark' : 'light');\n  }\n});\n```\n\n#### 5.1.4 自定义主题（V2）\n\n**壁纸取色**，从用户壁纸提取主题色。\n\n**实现**（V2）：\n- 分析壁纸主色调\n- 生成和谐的配色方案\n- 应用到 Design Tokens\n\n### 5.2 主题切换实现\n\n#### 5.2.1 CSS 变量切换\n\n```css\n/* 亮色模式 */\n:root {\n  --color-bg-primary: #FFFFFF;\n  --color-text-primary: #111827;\n  /* ... */\n}\n\n/* 暗色模式 */\n:root[data-theme=\"dark\"] {\n  --color-bg-primary: #1F1F1F;\n  --color-text-primary: #F9FAFB;\n  /* ... */\n}\n```\n\n#### 5.2.2 组件响应主题\n\n```tsx\n// 组件自动使用 CSS 变量\nconst Button = styled.button`\n  background-color: var(--color-primary);\n  color: var(--color-bg-primary);\n  \n  &:hover {\n    background-color: var(--color-primary-hover);\n  }\n`;\n```\n\n#### 5.2.3 主题持久化\n\n**数据模型**：\n```sql\n-- app_config 表\nINSERT INTO app_config (key, value) VALUES ('theme', '\"light\"');\n-- 值：'light' | 'dark' | 'auto'\n```\n\n**读取逻辑**：\n```typescript\n// 启动时加载用户主题偏好\nasync function loadTheme() {\n  const theme = await invoke('get_app_config', { key: 'theme' });\n  updateTheme(theme || 'light');\n}\n```\n\n### 5.3 主题预览\n\n**UI 设计**（参考你提供的截图）：\n\n```\n┌─────────────────────────────────────┐\n│ 桌面壁纸                             │\n│ 分别设置浅色与深色壁纸，切换外观...   │\n│                                     │\n│ ┌──────┐  ┌──────┐                 │\n│ │ 浅色 │  │ 深色 │                 │\n│ │ 模式 │  │ 模式 │                 │\n│ │ [✓] │  │ [ ] │                  │\n│ └──────┘  └──────┘                 │\n│                                     │\n│ 系统壁纸                             │\n│ ┌──────────┐  ┌──────────┐         │\n│ │          │  │          │         │\n│ │ 预览图   │  │ 预览图   │         │\n│ │ （浅色）│  │ （深色）│         │\n│ │ [自动]   │  │          │         │\n│ └──────────┘  └──────────┘         │\n└─────────────────────────────────────┘\n```\n\n---\n\n## 6. 密度系统\n\n### 6.1 密度级别\n\n| 级别 | 缩放比例 | 根字号 | 用途 |\n|------|---------|--------|------|\n| **更紧凑** | 75% | 10.5px | 最大化内容密度 |\n| **标准** | 100% | 14px | 推荐设置 |\n| **较大文字** | 125% | 17.5px | 轻度视力障碍 |\n| **大文字** | 150% | 21px | 中度视力障碍 |\n| **更大文字** | 175% | 24.5px | 重度视力障碍 |\n\n**UI 设计**（参考你提供的截图）：\n\n```\n系统缩放\n调整菜单、窗口、桌面图标和应用内容的大小，\n适配不同尺寸与分辨率的屏幕。\n\n┌────────┐  ┌────────┐  ┌────────┐  ┌────────┐  ┌────────┐\n│ 更多   │  │ 标准   │  │ 较大   │  │ 大文字 │  │ 更大   │\n│ 空间   │  │        │  │ 文字   │  │        │  │ 文字   │\n│ [  ]   │  │ [✓]    │  │ [  ]   │  │ [  ]   │  │ [  ]   │\n│ 75%    │  │ 100%   │  │ 125%   │  │ 150%   │  │ 175%   │\n└────────┘  └────────┘  └────────┘  └────────┘  └────────┘\n```\n\n### 6.2 实现方式\n\n#### 6.2.1 根字号缩放\n\n```css\n/* 标准密度（100%） */\nhtml {\n  font-size: 14px;\n}\n\n/* 较大密度（125%） */\nhtml[data-density=\"125\"] {\n  font-size: calc(14px * 1.25); /* 17.5px */\n}\n\n/* 更紧凑密度（75%） */\nhtml[data-density=\"75\"] {\n  font-size: calc(14px * 0.75); /* 10.5px */\n}\n```\n\n#### 6.2.2 使用 rem 单位\n\n**所有尺寸都使用 `rem`，自动跟随根字号缩放**：\n\n```css\n.button {\n  font-size: 1rem;          /* 14px → 17.5px（125%） */\n  padding: 0.571rem 1rem;   /* 8px 16px → 10px 20px */\n  border-radius: 0.286rem;  /* 4px → 5px */\n}\n```\n\n#### 6.2.3 组件自适应\n\n**所有组件使用 `rem`，无需单独适配**：\n\n```tsx\nconst Button = styled.button`\n  font-size: var(--font-size-base); /* 1rem */\n  padding: var(--spacing-2) var(--spacing-4); /* 0.571rem 1.143rem */\n  border-radius: var(--radius-sm); /* 0.286rem */\n`;\n```\n\n### 6.3 密度持久化\n\n**数据模型**：\n```sql\n-- app_config 表\nINSERT INTO app_config (key, value) VALUES ('density', '100');\n-- 值：75 | 100 | 125 | 150 | 175\n```\n\n**读取逻辑**：\n```typescript\nasync function loadDensity() {\n  const density = await invoke('get_app_config', { key: 'density' });\n  updateDensity(parseInt(density) || 100);\n}\n\nfunction updateDensity(density: number) {\n  document.documentElement.setAttribute('data-density', density.toString());\n  document.documentElement.style.fontSize = `${14 * (density / 100)}px`;\n}\n```\n\n---\n\n## 7. 基础组件库\n\n### 7.1 组件列表\n\n#### 7.1.1 Button（按钮）\n\n**变体**：\n- `primary`：主要按钮（蓝色）\n- `secondary`：次要按钮（灰色）\n- `danger`：危险按钮（红色）\n- `ghost`：幽灵按钮（透明）\n- `link`：链接按钮（无边框）\n\n**尺寸**：\n- `sm`：小按钮（高度 32px）\n- `md`：标准按钮（高度 36px）\n- `lg`：大按钮（高度 40px）\n\n**状态**：\n- `disabled`：禁用状态\n- `loading`：加载状态（显示 spinner）\n\n**示例**：\n```tsx\n<Button variant=\"primary\" size=\"md\">确定</Button>\n<Button variant=\"secondary\" size=\"md\">取消</Button>\n<Button variant=\"danger\" size=\"md\" loading>删除中...</Button>\n```\n\n#### 7.1.2 Input（输入框）\n\n**类型**：\n- `text`：文本\n- `password`：密码\n- `email`：邮箱\n- `number`：数字\n\n**状态**：\n- `disabled`：禁用\n- `error`：错误（红色边框）\n- `success`：成功（绿色边框）\n\n**示例**：\n```tsx\n<Input \n  type=\"text\" \n  placeholder=\"请输入用户名\"\n  error=\"用户名已存在\"\n/>\n```\n\n#### 7.1.3 Select（选择器）\n\n**示例**：\n```tsx\n<Select \n  options={[\n    { value: '1', label: 'OpenAI' },\n    { value: '2', label: 'Anthropic' }\n  ]}\n  placeholder=\"选择 Provider\"\n  onChange={handleChange}\n/>\n```\n\n#### 7.1.4 Modal（模态框）\n\n**类型**：\n- `confirm`：确认对话框\n- `alert`：警告对话框\n- `form`：表单对话框\n\n**示例**：\n```tsx\n<Modal\n  open={isOpen}\n  title=\"删除确认\"\n  onConfirm={handleDelete}\n  onCancel={handleCancel}\n>\n  确定要删除这个 Provider 吗？\n</Modal>\n```\n\n#### 7.1.5 Toast（轻提示）\n\n**类型**：\n- `success`：成功（绿色）\n- `error`：错误（红色）\n- `warning`：警告（黄色）\n- `info`：信息（蓝色）\n\n**示例**：\n```tsx\ntoast.success('保存成功');\ntoast.error('Provider 不存在');\ntoast.warning('连接不稳定');\ntoast.info('正在同步模型列表');\n```\n\n**样式规范**：\n```css\n.toast {\n  min-width: 300px;\n  padding: var(--spacing-3) var(--spacing-4);\n  border-radius: var(--radius-md);\n  box-shadow: var(--shadow-lg);\n  \n  /* 成功 */\n  &.success {\n    background: var(--color-success-bg);\n    color: var(--color-success);\n    border-left: 4px solid var(--color-success);\n  }\n  \n  /* 错误 */\n  &.error {\n    background: var(--color-error-bg);\n    color: var(--color-error);\n    border-left: 4px solid var(--color-error);\n  }\n}\n```\n\n**动画**：\n- 出现：从右侧滑入（`translateX(100%)` → `translateX(0)`）\n- 消失：淡出（`opacity: 1` → `opacity: 0`）\n- 时长：`--duration-base`（250ms）\n\n#### 7.1.6 Card（卡片）\n\n**示例**：\n```tsx\n<Card>\n  <Card.Header>Provider 列表</Card.Header>\n  <Card.Body>\n    {/* 内容 */}\n  </Card.Body>\n</Card>\n```\n\n#### 7.1.7 其他组件\n\n- **Checkbox**：复选框\n- **Radio**：单选框\n- **Switch**：开关\n- **Tooltip**：提示\n- **Loading**：加载动画\n- **Divider**：分割线\n\n### 7.2 组件开发规范\n\n#### 7.2.1 强制使用 Design Tokens\n\n❌ **禁止**：\n```tsx\nconst Button = styled.button`\n  background-color: #3B82F6;  /* 硬编码颜色 */\n  padding: 8px 16px;          /* 硬编码间距 */\n`;\n```\n\n✅ **正确**：\n```tsx\nconst Button = styled.button`\n  background-color: var(--color-primary);\n  padding: var(--spacing-2) var(--spacing-4);\n`;\n```\n\n#### 7.2.2 响应主题和密度\n\n**自动响应**：\n```tsx\nconst Button = styled.button`\n  /* 主题自动切换 */\n  background-color: var(--color-primary);\n  \n  /* 密度自动缩放 */\n  font-size: var(--font-size-base); /* 使用 rem */\n  padding: var(--spacing-2) var(--spacing-4);\n`;\n```\n\n#### 7.2.3 无障碍性（A11y）\n\n**必须包含**：\n- ✅ `aria-label`：按钮标签\n- ✅ `aria-disabled`：禁用状态\n- ✅ 键盘导航：Tab、Enter、Esc\n- ✅ 焦点指示器：`:focus-visible`\n\n**示例**：\n```tsx\n<Button\n  aria-label=\"删除 Provider\"\n  aria-disabled={isDeleting}\n  onKeyDown={(e) => {\n    if (e.key === 'Enter') handleClick();\n  }}\n>\n  删除\n</Button>\n```\n\n---\n\n## 8. 错误处理与通知体系\n\n### 8.1 通知类型\n\n#### 8.1.1 Toast 通知（轻提示）\n\n**用途**：短暂的、非阻塞的反馈\n\n**使用场景**：\n- ✅ 操作成功：保存成功、删除成功\n- ✅ 操作失败：网络错误、参数错误\n- ✅ 系统提示：正在同步、已断开连接\n\n**设计规范**：\n- 位置：右上角（距离顶部 80px，距离右侧 20px）\n- 宽度：最小 300px，最大 400px\n- 高度：自动（根据内容）\n- 持续时间：3 秒（error 类型 5 秒）\n- 最多显示：3 个（超过则队列等待）\n- 动画：滑入（250ms）+ 淡出（250ms）\n\n**结构**：\n```\n┌─────────────────────────────────┐\n│ [图标] 消息内容                  │\n│        （可选）详细描述           │  [×]\n└─────────────────────────────────┘\n```\n\n**示例代码**：\n```typescript\n// 成功\ntoast.success('Provider 创建成功');\n\n// 错误（显示错误码和用户建议）\ntoast.error('Provider 不存在（错误码：1001001）', {\n  description: '请检查 Provider ID 是否正确',\n  duration: 5000,\n});\n\n// 警告\ntoast.warning('连接不稳定，正在重试...');\n\n// 信息\ntoast.info('正在同步模型列表');\n```\n\n#### 8.1.2 Modal 对话框（模态框）\n\n**用途**：需要用户确认或输入的反馈\n\n**使用场景**：\n- ✅ 确认删除：删除 Provider、删除用户\n- ✅ 严重错误：数据库损坏、权限被拒绝\n- ✅ 表单输入：创建 Provider、配置 Skills\n\n**设计规范**：\n- 位置：屏幕居中\n- 宽度：400px - 600px（根据内容）\n- 遮罩：半透明黑色（`rgba(0, 0, 0, 0.6)`）\n- 圆角：`--radius-lg`（12px）\n- 阴影：`--shadow-xl`\n- 动画：缩放 + 淡入（350ms）\n\n**结构**：\n```\n        遮罩层（半透明）\n┌────────────────────────────┐\n│ [×]                         │\n│                             │\n│   [图标] 标题               │\n│                             │\n│   内容描述...               │\n│                             │\n│   ┌──────┐  ┌──────┐       │\n│   │ 取消 │  │ 确定 │       │\n│   └──────┘  └──────┘       │\n└────────────────────────────┘\n```\n\n**示例代码**：\n```tsx\n// 确认对话框\nModal.confirm({\n  title: '删除确认',\n  icon: 'warning',\n  content: '确定要删除 Provider \"OpenAI\" 吗？此操作不可恢复。',\n  onConfirm: async () => {\n    await deleteProvider(id);\n    toast.success('删除成功');\n  },\n});\n\n// 错误对话框\nModal.error({\n  title: '权限被拒绝',\n  content: '该模块没有 Provider 访问权限。',\n  okText: '授予权限',\n  onOk: () => navigate('/settings/permissions'),\n});\n```\n\n#### 8.1.3 Inline 错误提示（内联）\n\n**用途**：表单验证错误\n\n**使用场景**：\n- ✅ 必填项未填写\n- ✅ 格式错误（邮箱、URL）\n- ✅ 长度限制\n\n**设计规范**：\n- 位置：输入框下方\n- 颜色：`--color-error`\n- 字号：`--font-size-sm`\n- 图标：感叹号\n\n**结构**：\n```\n用户名\n┌────────────────────────┐\n│                        │  ← 输入框（红色边框）\n└────────────────────────┘\n⚠ 用户名已存在            ← 错误提示\n```\n\n**示例代码**：\n```tsx\n<Input\n  label=\"用户名\"\n  value={username}\n  error={errors.username}  // \"用户名已存在\"\n  onChange={handleChange}\n/>\n```\n\n#### 8.1.4 全局错误页面\n\n**用途**：严重错误或页面级错误\n\n**使用场景**：\n- ✅ 404 Not Found\n- ✅ 500 Internal Server Error\n- ✅ 网络断开\n- ✅ 数据库连接失败\n\n**设计**：\n```\n┌────────────────────────────────┐\n│                                │\n│          [大图标]              │\n│                                │\n│        404 页面不存在          │\n│                                │\n│   您访问的页面不存在或已被删除  │\n│                                │\n│     ┌──────────────┐           │\n│     │ 返回首页     │           │\n│     └──────────────┘           │\n│                                │\n└────────────────────────────────┘\n```\n\n### 8.2 错误码映射\n\n**原则**：所有错误都显示用户友好的消息\n\n```typescript\n// errors.ts\nexport const ERROR_MESSAGES: Record<string, ErrorMessage> = {\n  '1001001': {\n    message: 'Provider 不存在',\n    description: '请检查 Provider ID 是否正确',\n    action: '查看 Provider 列表',\n    actionLink: '/settings/providers',\n  },\n  '1001003': {\n    message: 'API Key 无效',\n    description: 'Provider 返回认证错误',\n    action: '重新配置 API Key',\n    actionLink: '/settings/providers/:id/edit',\n  },\n  '1008001': {\n    message: '用户名已存在',\n    description: '请使用其他用户名',\n  },\n  // ...\n};\n\n// 使用\nfunction handleError(error: AppError) {\n  const errorInfo = ERROR_MESSAGES[error.code];\n  \n  if (errorInfo) {\n    toast.error(errorInfo.message, {\n      description: errorInfo.description,\n      action: errorInfo.action ? {\n        label: errorInfo.action,\n        onClick: () => navigate(errorInfo.actionLink),\n      } : undefined,\n    });\n  } else {\n    toast.error('未知错误');\n  }\n}\n```\n\n### 8.3 统一错误处理流程\n\n```\n操作失败\n  ↓\n捕获错误（try-catch）\n  ↓\n解析错误码\n  ↓\n查找错误消息映射\n  ↓\n判断严重程度\n  ├─ 轻微错误 → Toast 通知（3 秒后消失）\n  ├─ 中等错误 → Toast 通知 + 操作建议（5 秒）\n  └─ 严重错误 → Modal 对话框（需要用户确认）\n  ↓\n记录错误日志（错误码、堆栈、上下文）\n  ↓\n（可选）上报错误到监控系统\n```\n\n---\n\n## 9. 强制复用机制\n\n### 9.1 ESLint 规则\n\n**禁止内联样式**：\n```javascript\n// .eslintrc.js\nmodule.exports = {\n  rules: {\n    'react/forbid-dom-props': ['error', {\n      forbid: ['style'], // 禁止使用 style 属性\n    }],\n  },\n};\n```\n\n**禁止硬编码颜色**：\n```javascript\n// stylelint.config.js\nmodule.exports = {\n  rules: {\n    'color-no-hex': true, // 禁止使用 #hex 颜色\n    'function-disallowed-list': ['rgb', 'rgba'], // 禁止 rgb()\n  },\n};\n```\n\n**只允许 CSS 变量**：\n```css\n/* ✅ 正确 */\n.button {\n  background-color: var(--color-primary);\n}\n\n/* ❌ 错误（ESLint 报错） */\n.button {\n  background-color: #3B82F6;\n}\n```\n\n### 9.2 代码审查检查点\n\n**PR 检查清单**：\n- [ ] 是否使用了统一组件库？\n- [ ] 是否使用了 Design Tokens（CSS 变量）？\n- [ ] 是否有硬编码颜色或间距？\n- [ ] 是否响应主题切换？\n- [ ] 是否响应密度缩放？\n- [ ] 是否符合无障碍性标准？\n\n---\n\n## 10. 数据模型\n\n### 10.1 app_config 表\n\n**用途**：存储全局配置（主题、密度等）\n\n```sql\n-- 已在 V1-数据模型.md 中定义\nCREATE TABLE app_config (\n    key TEXT PRIMARY KEY,\n    value TEXT NOT NULL,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\n-- 预设配置\nINSERT INTO app_config (key, value) VALUES ('theme', '\"light\"');\nINSERT INTO app_config (key, value) VALUES ('density', '100');\nINSERT INTO app_config (key, value) VALUES ('font_size', '14');\n```\n\n### 10.2 读写关系\n\n**读操作**：\n- 启动时加载：`SELECT * FROM app_config WHERE key IN ('theme', 'density')`\n- 单个配置：`SELECT value FROM app_config WHERE key = 'theme'`\n\n**写操作**：\n- 更新配置：`UPDATE app_config SET value = ?, updated_at = ? WHERE key = ?`\n\n---\n\n## 11. 验收标准\n\n### 11.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 主题切换生效 | 当前亮色模式 | 切换到暗色 | 所有组件变为暗色 | E2E | `tests/e2e/theme.spec.ts` | `pnpm test:e2e theme` | 规划中 |\n| AC02 | 主题持久化 | 切换到暗色 | 重启应用 | 仍为暗色模式 | E2E | `tests/e2e/theme.spec.ts` | `pnpm test:e2e theme` | 规划中 |\n| AC03 | 密度调整生效 | 标准密度 | 切换到 125% | 字号和间距变大 | E2E | `tests/e2e/density.spec.ts` | `pnpm test:e2e density` | 规划中 |\n| AC04 | 密度持久化 | 切换到 125% | 重启应用 | 仍为 125% | E2E | `tests/e2e/density.spec.ts` | `pnpm test:e2e density` | 规划中 |\n| AC05 | Button 组件渲染 | 无 | 渲染 Button | 正确显示 | 单元测试 | `design-system/tests/Button.test.tsx` | `pnpm test Button` | 规划中 |\n| AC06 | Input 组件渲染 | 无 | 渲染 Input | 正确显示 | 单元测试 | `design-system/tests/Input.test.tsx` | `pnpm test Input` | 规划中 |\n| AC07 | Modal 组件渲染 | 无 | 打开 Modal | 正确显示遮罩和内容 | 单元测试 | `design-system/tests/Modal.test.tsx` | `pnpm test Modal` | 规划中 |\n| AC08 | Toast 通知显示 | 无 | 调用 toast.success | 显示绿色 Toast | E2E | `tests/e2e/toast.spec.ts` | `pnpm test:e2e toast` | 规划中 |\n| AC09 | Toast 自动消失 | Toast 显示 | 等待 3 秒 | Toast 消失 | E2E | `tests/e2e/toast.spec.ts` | `pnpm test:e2e toast` | 规划中 |\n| AC10 | 错误码映射正确 | 错误码 1001001 | 显示错误 | 显示\"Provider 不存在\" | 单元测试 | `utils/tests/errors.test.ts` | `pnpm test errors` | 规划中 |\n| AC11 | 禁止内联样式 | 代码中有 style 属性 | 运行 ESLint | 报错 | 静态检查 | `.eslintrc.js` | `pnpm lint` | 规划中 |\n| AC12 | 禁止硬编码颜色 | CSS 中有 #hex | 运行 Stylelint | 报错 | 静态检查 | `stylelint.config.js` | `pnpm lint:css` | 规划中 |\n\n### 11.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 极小密度 | 切换到 75% | 所有文本可读，不重叠 |\n| 极大密度 | 切换到 175% | 所有内容适配，无溢出 |\n| 主题快速切换 | 连续切换亮色/暗色 10 次 | 无闪烁，响应正常 |\n| 同时显示 10 个 Toast | 调用 toast 10 次 | 只显示 3 个，其他排队 |\n| 长文本 Toast | 消息 > 100 字 | 自动换行，最大 400px 宽 |\n| Modal 嵌套 | 打开 Modal 后再打开一个 | 正确显示，遮罩加深 |\n\n---\n\n## 12. 接口设计\n\n### 12.1 Tauri Commands\n\n#### 获取配置\n\n```rust\n#[tauri::command]\nasync fn get_app_config(key: String) -> Result<String>;\n```\n\n**引用**：V1-FR-005  \n**示例**：\n```typescript\nconst theme = await invoke('get_app_config', { key: 'theme' });\n```\n\n#### 设置配置\n\n```rust\n#[tauri::command]\nasync fn set_app_config(key: String, value: String) -> Result<()>;\n```\n\n**引用**：V1-FR-005  \n**示例**：\n```typescript\nawait invoke('set_app_config', { key: 'theme', value: 'dark' });\n```\n\n---\n\n## 13. 技术设计\n\n### 13.1 主题切换实现\n\n```typescript\n// theme.ts\n\n// B05-01: 主题类型定义\nexport type Theme = 'light' | 'dark' | 'auto';\n\n// B05-02: 当前主题状态\nlet currentTheme: Theme = 'light';\nlet systemTheme: 'light' | 'dark' = 'light';\n\n// B05-03: 初始化主题\nexport async function initTheme() {\n  // 加载用户偏好\n  const savedTheme = await invoke('get_app_config', { key: 'theme' });\n  currentTheme = (savedTheme || 'light') as Theme;\n  \n  // 监听系统主题变化\n  const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');\n  systemTheme = mediaQuery.matches ? 'dark' : 'light';\n  \n  mediaQuery.addEventListener('change', (e) => {\n    systemTheme = e.matches ? 'dark' : 'light';\n    if (currentTheme === 'auto') {\n      applyTheme(systemTheme);\n    }\n  });\n  \n  // 应用主题\n  applyTheme(resolveTheme(currentTheme));\n}\n\n// B05-04: 解析主题（auto → light/dark）\nfunction resolveTheme(theme: Theme): 'light' | 'dark' {\n  if (theme === 'auto') {\n    return systemTheme;\n  }\n  return theme;\n}\n\n// B05-05: 应用主题\nfunction applyTheme(theme: 'light' | 'dark') {\n  document.documentElement.setAttribute('data-theme', theme);\n  document.documentElement.style.colorScheme = theme;\n}\n\n// B05-06: 切换主题\nexport async function updateTheme(theme: Theme) {\n  currentTheme = theme;\n  applyTheme(resolveTheme(theme));\n  \n  // 保存到数据库\n  await invoke('set_app_config', { \n    key: 'theme', \n    value: theme \n  });\n}\n```\n\n### 13.2 密度系统实现\n\n```typescript\n// density.ts\n\n// B05-07: 密度类型定义\nexport type Density = 75 | 100 | 125 | 150 | 175;\n\n// B05-08: 当前密度状态\nlet currentDensity: Density = 100;\n\n// B05-09: 初始化密度\nexport async function initDensity() {\n  const savedDensity = await invoke('get_app_config', { key: 'density' });\n  currentDensity = parseInt(savedDensity || '100') as Density;\n  applyDensity(currentDensity);\n}\n\n// B05-10: 应用密度\nfunction applyDensity(density: Density) {\n  const baseFontSize = 14; // px\n  const scaledFontSize = baseFontSize * (density / 100);\n  \n  document.documentElement.setAttribute('data-density', density.toString());\n  document.documentElement.style.fontSize = `${scaledFontSize}px`;\n}\n\n// B05-11: 更新密度\nexport async function updateDensity(density: Density) {\n  currentDensity = density;\n  applyDensity(density);\n  \n  // 保存到数据库\n  await invoke('set_app_config', { \n    key: 'density', \n    value: density.toString() \n  });\n}\n\n// B05-12: 获取当前密度\nexport function getCurrentDensity(): Density {\n  return currentDensity;\n}\n```\n\n### 13.3 Toast 通知实现\n\n```typescript\n// toast.ts\n\n// B05-13: Toast 类型定义\nexport type ToastType = 'success' | 'error' | 'warning' | 'info';\n\ninterface ToastOptions {\n  description?: string;\n  duration?: number;\n  action?: {\n    label: string;\n    onClick: () => void;\n  };\n}\n\n// B05-14: Toast 队列\nconst toastQueue: Array<{\n  id: string;\n  type: ToastType;\n  message: string;\n  options?: ToastOptions;\n}> = [];\n\nconst MAX_VISIBLE_TOASTS = 3;\nlet visibleToastCount = 0;\n\n// B05-15: 显示 Toast\nfunction showToast(type: ToastType, message: string, options?: ToastOptions) {\n  const id = `toast-${Date.now()}-${Math.random()}`;\n  \n  toastQueue.push({ id, type, message, options });\n  processQueue();\n}\n\n// B05-16: 处理队列\nfunction processQueue() {\n  while (visibleToastCount < MAX_VISIBLE_TOASTS && toastQueue.length > 0) {\n    const toast = toastQueue.shift()!;\n    renderToast(toast);\n  }\n}\n\n// B05-17: 渲染 Toast\nfunction renderToast(toast: { id: string; type: ToastType; message: string; options?: ToastOptions }) {\n  visibleToastCount++;\n  \n  const duration = toast.options?.duration || (toast.type === 'error' ? 5000 : 3000);\n  \n  // 创建 DOM 元素\n  const element = document.createElement('div');\n  element.id = toast.id;\n  element.className = `toast toast-${toast.type}`;\n  element.innerHTML = `\n    <div class=\"toast-icon\">${getIcon(toast.type)}</div>\n    <div class=\"toast-content\">\n      <div class=\"toast-message\">${toast.message}</div>\n      ${toast.options?.description ? `<div class=\"toast-description\">${toast.options.description}</div>` : ''}\n    </div>\n    <button class=\"toast-close\" aria-label=\"关闭\">×</button>\n  `;\n  \n  // 添加到容器\n  const container = getToastContainer();\n  container.appendChild(element);\n  \n  // 动画：滑入\n  setTimeout(() => element.classList.add('toast-visible'), 10);\n  \n  // 关闭按钮\n  element.querySelector('.toast-close')!.addEventListener('click', () => {\n    removeToast(toast.id);\n  });\n  \n  // 自动消失\n  setTimeout(() => {\n    removeToast(toast.id);\n  }, duration);\n}\n\n// B05-18: 移除 Toast\nfunction removeToast(id: string) {\n  const element = document.getElementById(id);\n  if (!element) return;\n  \n  // 动画：淡出\n  element.classList.remove('toast-visible');\n  element.classList.add('toast-hiding');\n  \n  setTimeout(() => {\n    element.remove();\n    visibleToastCount--;\n    processQueue();\n  }, 250);\n}\n\n// B05-19: 获取容器\nfunction getToastContainer(): HTMLElement {\n  let container = document.getElementById('toast-container');\n  if (!container) {\n    container = document.createElement('div');\n    container.id = 'toast-container';\n    document.body.appendChild(container);\n  }\n  return container;\n}\n\n// B05-20: 辅助函数\nfunction getIcon(type: ToastType): string {\n  const icons = {\n    success: '✓',\n    error: '✕',\n    warning: '⚠',\n    info: 'ℹ',\n  };\n  return icons[type];\n}\n\n// B05-21: 导出 API\nexport const toast = {\n  success: (message: string, options?: ToastOptions) => showToast('success', message, options),\n  error: (message: string, options?: ToastOptions) => showToast('error', message, options),\n  warning: (message: string, options?: ToastOptions) => showToast('warning', message, options),\n  info: (message: string, options?: ToastOptions) => showToast('info', message, options),\n};\n```\n\n### 13.4 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B05-01 | 主题类型定义 | AC01 | V1-E2E-05 |\n| B05-02 | 当前主题状态 | AC01 | - |\n| B05-03 | 初始化主题 | AC01, AC02 | V1-E2E-05 |\n| B05-04 | 解析主题 | AC01 | - |\n| B05-05 | 应用主题 | AC01 | - |\n| B05-06 | 切换主题 | AC01, AC02 | V1-E2E-05 |\n| B05-07 | 密度类型定义 | AC03 | - |\n| B05-08 | 当前密度状态 | AC03 | - |\n| B05-09 | 初始化密度 | AC03, AC04 | - |\n| B05-10 | 应用密度 | AC03 | - |\n| B05-11 | 更新密度 | AC03, AC04 | - |\n| B05-12 | 获取当前密度 | AC03 | - |\n| B05-13 | Toast 类型定义 | AC08 | - |\n| B05-14 | Toast 队列 | AC08, AC09 | - |\n| B05-15 | 显示 Toast | AC08 | V1-E2E-05 |\n| B05-16 | 处理队列 | AC08 | - |\n| B05-17 | 渲染 Toast | AC08 | - |\n| B05-18 | 移除 Toast | AC09 | - |\n| B05-19 | 获取容器 | AC08 | - |\n| B05-20 | 辅助函数 | AC08 | - |\n| B05-21 | 导出 API | AC08 | - |\n\n---\n\n## 14. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1005001 | theme_not_found | 主题不存在 | 使用 light/dark/auto |\n| 1005002 | invalid_theme_config | 主题配置无效 | 检查配置格式 |\n| 1005003 | invalid_density | 密度值无效 | 使用 75/100/125/150/175 |\n| 1005004 | component_not_found | 组件不存在 | 检查组件名称 |\n| 1005005 | custom_style_detected | 检测到自定义样式 | 使用统一组件和 Design Tokens |\n\n---\n\n## 15. 非功能需求\n\n### 15.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 主题切换响应 | < 100ms | Performance API |\n| 密度切换响应 | < 100ms | Performance API |\n| Toast 显示延迟 | < 50ms | Performance API |\n| 组件首次渲染 | < 16ms（60fps） | React DevTools Profiler |\n\n### 15.2 无障碍需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| WCAG 2.1 AA 标准 | 色彩对比度 > 4.5:1 |\n| 键盘导航 | 所有交互元素可 Tab 访问 |\n| 屏幕阅读器 | 所有组件有 aria-label |\n| 焦点指示器 | :focus-visible 样式 |\n\n### 15.3 浏览器兼容性\n\n| 浏览器 | 最低版本 |\n| --- | --- |\n| Chrome | 90+ |\n| Safari | 14+ |\n| Firefox | 88+ |\n| Edge | 90+ |\n\n---\n\n## 16. 实现与验证\n\n### 16.1 前端测试\n\n**目标资产**：\n- `design-system/src/components/Button.tsx`\n- `design-system/src/components/Input.tsx`\n- `design-system/src/components/Modal.tsx`\n- `design-system/src/components/Toast.tsx`\n- `design-system/src/theme.ts`\n- `design-system/src/density.ts`\n- `design-system/tests/*.test.tsx`\n\n**测试命令**：\n```bash\npnpm test design-system\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- Button.test.tsx：0/5 通过（待实现）\n- Input.test.tsx：0/4 通过（待实现）\n- Modal.test.tsx：0/3 通过（待实现）\n- Toast.test.tsx：0/4 通过（待实现）\n- theme.t -- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n| 2024-01-XX | 补充 Design Tokens、密度系统、错误通知体系 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n", "doc-022": "# V1-FR-006：AI 工作台\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-006 |\n| 功能名称 | AI 工作台 |\n| 所属版本 | V1 |\n| 所属领域 | 应用模块 |\n| 优先级 | P0（必须） |\n| 风险级别 | 标准（应用层功能，技术成熟） |\n| 依赖功能 | V1-FR-001（Provider）、V1-FR-002（Skills）、V1-FR-003（MCP）、V1-FR-004（模块系统）、V1-FR-005（设计系统） |\n| 被依赖功能 | 无 |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n提供简单易用的 AI 对话界面，支持 Provider 选择、流式响应、多轮对话、历史记录管理，可选启用 Skills/MCP 增强生成能力。\n\n### 2.2 详细说明\n\nAI 工作台是 DGOS 的核心应用模块，让用户可以直接与 AI 对话，完成各种文本生成任务。\n\n**核心价值**：\n- ✅ 简单易用：类似 ChatGPT 的对话界面\n- ✅ 灵活选择：可以选择不同的 Provider 和模型\n- ✅ 工具增强：可选启用 Skills/MCP 增强生成能力\n- ✅ 历史管理：保存所有对话历史，可搜索\n- ✅ 流式体验：实时看到 AI 生成过程\n\n**用户价值**：\n- 最终用户：快速与 AI 对话，完成各种任务\n- 开发者：参考实现，学习如何调用 Provider\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ 对话界面（输入框、消息列表）\n- ✅ Provider 选择（下拉选择、模型选择）\n- ✅ 流式响应（SSE、打字机效果）\n- ✅ 多轮对话（上下文保持）\n- ✅ 历史记录（会话管理、消息保存）\n- ✅ Skills 增强（可选启用）\n- ✅ MCP 增强（可选启用）\n- ✅ 中断生成（停止按钮）\n- ✅ 复制消息（复制按钮）\n- ✅ 重新生成（重试按钮）\n- ✅ Markdown 渲染（代码高亮）\n- ✅ 会话搜索（按内容搜索）\n\n**不包含**（明确说明原因）：\n- ❌ 多模态输入（图片、语音） → V2 画布系统\n- ❌ 代码执行 → V2 画布系统\n- ❌ 插件系统（自定义对话增强） → V3 应用市场\n- ❌ 协同对话（多人同时聊天） → V4 云端协同\n- ❌ 语音输入/输出 → V6 移动端\n\n## 3. 核心流程\n\n### 3.1 首次使用流程\n\n```\n用户首次打开 AI 工作台\n  ↓\n显示引导：\"选择一个 Provider 开始对话\"\n  ↓\n用户点击 Provider 选择器\n  ↓\n显示已配置的 Provider 列表\n  ↓\n用户选择\"我的 OpenAI\"\n  ↓\n显示模型列表（从 Provider 获取）\n  ↓\n用户选择\"gpt-4\"\n  ↓\n创建新会话\n  ↓\n显示输入框：\"请输入消息...\"\n  ↓\n用户输入：\"写一个 Python 函数\"\n  ↓\n点击发送\n  ↓\n显示用户消息\n  ↓\n调用 Provider API（流式）\n  ↓\n逐字显示 AI 响应（打字机效果）\n  ↓\n响应完成，保存消息到数据库\n```\n\n### 3.2 多轮对话流程\n\n```\n用户在现有会话中\n  ↓\n查看历史消息（上下文）\n  ↓\n输入新消息：\"能不能加个单元测试？\"\n  ↓\n系统构造请求：\n  - messages: [\n      {role: \"user\", content: \"写一个 Python 函数\"},\n      {role: \"assistant\", content: \"def add(a, b): ...\"},\n      {role: \"user\", content: \"能不能加个单元测试？\"}\n    ]\n  ↓\n调用 Provider API（带上下文）\n  ↓\nAI 基于上下文生成回复\n  ↓\n显示响应\n  ↓\n保存消息\n```\n\n### 3.3 Skills 增强流程\n\n```\n用户启用 Skills\n  ↓\n选择\"Web Search\" Skill\n  ↓\n输入：\"最新的 Rust 新闻\"\n  ↓\n系统构造 Prompt：\n  \"你可以使用 web_search 工具搜索网页。\n   用户问题：最新的 Rust 新闻\"\n  ↓\n调用 Provider API\n  ↓\nAI 返回：\"让我搜索一下...\"（可能包含工具调用）\n  ↓\n系统检测到工具调用请求\n  ↓\n调用 Skills Manager\n  ↓\n执行 web_search(\"Rust 新闻\")\n  ↓\n将结果注入回 AI\n  ↓\nAI 基于搜索结果生成最终回复\n  ↓\n显示响应\n```\n\n### 3.4 中断生成流程\n\n```\nAI 正在生成响应\n  ↓\n用户点击\"停止生成\"\n  ↓\n中断 SSE 流\n  ↓\n显示已生成的部分\n  ↓\n标记消息为\"已中断\"\n  ↓\n保存已生成部分到数据库\n```\n\n### 3.5 会话管理流程\n\n```\n用户在侧边栏查看会话列表\n  ↓\n显示所有会话（按时间排序）\n  ↓\n用户点击某个会话\n  ↓\n加载该会话的消息历史\n  ↓\n显示在对话区域\n  ↓\n用户可以继续对话\n  ↓\n---\n用户点击\"新建会话\"\n  ↓\n创建新会话\n  ↓\n切换到新会话\n  ↓\n---\n用户删除会话\n  ↓\n确认提示：\"确定删除？\"\n  ↓\n删除会话和所有消息\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**chat_sessions 表**（会话）：\n```sql\nCREATE TABLE chat_sessions (\n    id TEXT PRIMARY KEY,              -- UUID\n    title TEXT,                       -- 会话标题（自动生成或用户修改）\n    provider_id TEXT,                 -- 使用的 Provider\n    model_id TEXT,                    -- 使用的模型\n    system_prompt TEXT,               -- 系统提示词（可选）\n    created_at TIMESTAMP,\n    updated_at TIMESTAMP,\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id),\n    FOREIGN KEY (provider_id) REFERENCES providers(id)\n);\n```\n\n**chat_messages 表**（消息）：\n```sql\nCREATE TABLE chat_messages (\n    id TEXT PRIMARY KEY,              -- UUID\n    session_id TEXT NOT NULL,         -- 所属会话\n    role TEXT NOT NULL,               -- 角色：user, assistant, system\n    content TEXT NOT NULL,            -- 消息内容\n    metadata JSON,                    -- 元数据（token 数、延迟等）\n    interrupted BOOLEAN DEFAULT FALSE,-- 是否中断\n    created_at TIMESTAMP,\n    FOREIGN KEY (session_id) REFERENCES chat_sessions(id) ON DELETE CASCADE\n);\n```\n\n**chat_session_config 表**（会话配置）：\n```sql\nCREATE TABLE chat_session_config (\n    id TEXT PRIMARY KEY,\n    session_id TEXT NOT NULL,\n    enabled_skills JSON,              -- 启用的 Skills 列表\n    enabled_mcp_servers JSON,         -- 启用的 MCP 服务器列表\n    temperature REAL DEFAULT 0.7,     -- 温度参数\n    max_tokens INTEGER,               -- 最大 token 数\n    FOREIGN KEY (session_id) REFERENCES chat_sessions(id) ON DELETE CASCADE,\n    UNIQUE(session_id)\n);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 获取会话列表：`SELECT * FROM chat_sessions WHERE user_id = ? ORDER BY updated_at DESC`\n- 获取会话消息：`SELECT * FROM chat_messages WHERE session_id = ? ORDER BY created_at ASC`\n- 获取会话配置：`SELECT * FROM chat_session_config WHERE session_id = ?`\n- 搜索会话：`SELECT DISTINCT session_id FROM chat_messages WHERE content LIKE ?`\n\n**写操作**：\n- 创建会话：`INSERT INTO chat_sessions`\n- 更新会话标题：`UPDATE chat_sessions SET title = ?, updated_at = ? WHERE id = ?`\n- 删除会话：`DELETE FROM chat_sessions WHERE id = ?`（级联删除消息）\n- 插入消息：`INSERT INTO chat_messages`\n- 更新会话配置：`INSERT OR REPLACE INTO chat_session_config`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 创建会话 | 用户已登录 | 点击\"新建会话\" | 创建成功，显示输入框 | E2E | `tests/e2e/chat_session.spec.ts` | `pnpm test:e2e chat_session` | 规划中 |\n| AC02 | 选择 Provider | 会话已创建 | 选择 Provider 和模型 | 选择成功，可以发送消息 | E2E | `tests/e2e/chat_provider.spec.ts` | `pnpm test:e2e chat_provider` | 规划中 |\n| AC03 | 发送消息 | Provider 已选择 | 输入并发送 | 消息显示，AI 响应 | E2E | `tests/e2e/chat_send.spec.ts` | `pnpm test:e2e chat_send` | 规划中 |\n| AC04 | 流式响应 | 调用流式 API | AI 生成响应 | 逐字显示（打字机效果） | E2E | `tests/e2e/chat_streaming.spec.ts` | `pnpm test:e2e chat_streaming` | 规划中 |\n| AC05 | 多轮对话 | 会话有历史 | 发送新消息 | 带上下文调用 | 后端逻辑 + E2E | `server/crates/chat/tests/context.rs` | `cargo test -p dgos-chat context` | 规划中 |\n| AC06 | 中断生成 | AI 正在生成 | 点击\"停止\" | 生成中断，保存已生成部分 | E2E | `tests/e2e/chat_interrupt.spec.ts` | `pnpm test:e2e chat_interrupt` | 规划中 |\n| AC07 | 历史记录保存 | 对话完成 | 查询数据库 | 消息已保存 | 后端 API | `server/crates/chat/tests/persistence.rs` | `cargo test -p dgos-chat persistence` | 规划中 |\n| AC08 | 会话切换 | 多个会话存在 | 切换会话 | 显示对应消息历史 | E2E | `tests/e2e/chat_session.spec.ts` | `pnpm test:e2e chat_session` | 规划中 |\n| AC09 | 会话删除 | 会话存在 | 删除会话 | 会话和消息都删除 | 后端 API + E2E | `server/crates/chat/tests/deletion.rs` | `cargo test -p dgos-chat deletion` | 规划中 |\n| AC10 | Skills 增强 | 启用 Skills | 发送消息 | Prompt 包含 Skills 信息 | 后端逻辑 | `server/crates/chat/tests/skills_integration.rs` | `cargo test -p dgos-chat skills_integration` | 规划中 |\n| AC11 | MCP 增强 | 启用 MCP | 发送消息 | Prompt 包含 MCP 工具信息 | 后端逻辑 | `server/crates/chat/tests/mcp_integration.rs` | `cargo test -p dgos-chat mcp_integration` | 规划中 |\n| AC12 | 复制消息 | 消息已显示 | 点击\"复制\" | 消息复制到剪贴板 | 前端集成 | `apps/desktop/src/__tests__/chat.test.tsx` | `pnpm test chat` | 规划中 |\n| AC13 | 重新生成 | 消息已显示 | 点击\"重新生成\" | 删除旧响应，重新调用 | E2E | `tests/e2e/chat_regenerate.spec.ts` | `pnpm test:e2e chat_regenerate` | 规划中 |\n| AC14 | Markdown 渲染 | AI 返回代码 | 显示消息 | 代码高亮正确 | 前端集成 | `apps/desktop/src/__tests__/markdown.test.tsx` | `pnpm test markdown` | 规划中 |\n| AC15 | 会话搜索 | 多个会话存在 | 搜索\"Python\" | 返回包含关键词的会话 | 后端 API | `server/crates/chat/tests/search.rs` | `cargo test -p dgos-chat search` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 空消息 | 发送空字符串 | 提示\"消息不能为空\" |\n| 超长消息 | 输入 10,000 字 | 提示\"超过最大长度\" |\n| Provider 未选择 | 直接发送消息 | 提示\"请先选择 Provider\" |\n| 网络断开 | 发送时网络中断 | 显示错误，可重试 |\n| 流式中断 | 网络中断导致流中断 | 保存已接收部分 |\n| 会话数量超多 | 1000+ 会话 | 分页加载，不卡顿 |\n| 消息数量超多 | 单会话 1000+ 消息 | 虚拟滚动，不卡顿 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// 会话管理\n#[tauri::command]\nasync fn create_chat_session(\n    user_id: String,\n    provider_id: String,\n    model_id: String\n) -> Result<ChatSession>;\n\n#[tauri::command]\nasync fn list_chat_sessions(user_id: String) -> Result<Vec<ChatSession>>;\n\n#[tauri::command]\nasync fn get_chat_session(session_id: String) -> Result<ChatSession>;\n\n#[tauri::command]\nasync fn update_chat_session_title(\n    session_id: String,\n    title: String\n) -> Result<()>;\n\n#[tauri::command]\nasync fn delete_chat_session(session_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn search_chat_sessions(\n    user_id: String,\n    query: String\n) -> Result<Vec<ChatSession>>;\n\n// 消息管理\n#[tauri::command]\nasync fn list_chat_messages(session_id: String) -> Result<Vec<ChatMessage>>;\n\n#[tauri::command]\nasync fn send_chat_message(\n    session_id: String,\n    content: String\n) -> Result<ChatMessage>;\n\n#[tauri::command]\nasync fn stream_chat_message(\n    session_id: String,\n    content: String\n) -> Result<Stream<ChatChunk>>;\n\n#[tauri::command]\nasync fn interrupt_chat_stream(session_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn regenerate_chat_message(message_id: String) -> Result<ChatMessage>;\n\n// 会话配置\n#[tauri::command]\nasync fn get_session_config(session_id: String) -> Result<SessionConfig>;\n\n#[tauri::command]\nasync fn update_session_config(\n    session_id: String,\n    config: SessionConfig\n) -> Result<()>;\n```\n\n### 6.2 前端组件接口\n\n```typescript\n// apps/desktop/src/views/AIWorkbench.tsx\n\nexport interface AIWorkbenchProps {\n  // 无 props，独立模块\n}\n\nexport const AIWorkbench: React.FC<AIWorkbenchProps>;\n\n// apps/desktop/src/components/ChatMessage.tsx\n\nexport interface ChatMessageProps {\n  message: ChatMessage;\n  onCopy?: () => void;\n  onRegenerate?: () => void;\n}\n\nexport const ChatMessage: React.FC<ChatMessageProps>;\n\n// apps/desktop/src/components/ChatInput.tsx\n\nexport interface ChatInputProps {\n  onSend: (content: string) => void;\n  disabled?: boolean;\n  loading?: boolean;\n}\n\nexport const ChatInput: React.FC<ChatInputProps>;\n\n// apps/desktop/src/components/SessionList.tsx\n\nexport interface SessionListProps {\n  sessions: ChatSession[];\n  activeSessionId?: string;\n  onSelectSession: (sessionId: string) => void;\n  onDeleteSession: (sessionId: string) => void;\n  onNewSession: () => void;\n}\n\nexport const SessionList: React.FC<SessionListProps>;\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 核心消息处理流程\n\n```rust\n// server/crates/chat/src/service.rs\n\npub struct ChatService {\n    db: DatabasePool,\n    provider_manager: Arc<ProviderManager>,\n    skills_manager: Arc<SkillsManager>,\n    mcp_manager: Arc<MCPManager>,\n}\n\nimpl ChatService {\n    // B06-01: 发送消息（流式）\n    pub async fn stream_message(\n        &self,\n        session_id: &str,\n        content: String\n    ) -> Result<Stream<ChatChunk>> {\n        // B06-02: 获取会话信息\n        let session = self.db.get_chat_session(session_id).await?;\n        \n        // B06-03: 获取历史消息（上下文）\n        let history = self.db.list_chat_messages(session_id).await?;\n        \n        // B06-04: 构造 messages 数组\n        let mut messages = vec![];\n        \n        // 添加系统提示词（如果有）\n        if let Some(system_prompt) = &session.system_prompt {\n            messages.push(ChatMessage {\n                role: \"system\".to_string(),\n                content: system_prompt.clone(),\n            });\n        }\n        \n        // B06-05: 添加历史消息\n        for msg in history {\n            messages.push(ChatMessage {\n                role: msg.role,\n                content: msg.content,\n            });\n        }\n        \n        // B06-06: 添加当前消息\n        messages.push(ChatMessage {\n            role: \"user\".to_string(),\n            content: content.clone(),\n        });\n        \n        // 保存用户消息到数据库\n        self.db.insert_chat_message(session_id, \"user\", &content).await?;\n        \n        // B06-07: 检查是否启用 Skills/MCP\n        let config = self.db.get_session_config(session_id).await?;\n        \n        if let Some(skills) = config.enabled_skills {\n            // B06-08: 注入 Skills 信息到系统提示词\n            let skills_prompt = self.build_skills_prompt(&skills).await?;\n            messages.insert(0, ChatMessage {\n                role: \"system\".to_string(),\n                content: skills_prompt,\n            });\n        }\n        \n        if let Some(mcp_servers) = config.enabled_mcp_servers {\n            // B06-09: 注入 MCP 工具信息\n            let mcp_prompt = self.build_mcp_prompt(&mcp_servers).await?;\n            messages.insert(0, ChatMessage {\n                role: \"system\".to_string(),\n                content: mcp_prompt,\n            });\n        }\n        \n        // B06-10: 调用 Provider（流式）\n        let stream = self.provider_manager\n            .stream_call(&session.provider_id, &session.model_id, messages)\n            .await?;\n        \n        // B06-11: 包装流，保存响应到数据库\n        let db = self.db.clone();\n        let session_id = session_id.to_string();\n        \n        let wrapped_stream = stream.map(move |chunk| {\n            // 累积内容\n            // 流结束时保存到数据库\n            chunk\n        });\n        \n        Ok(wrapped_stream)\n    }\n    \n    // B06-08: 构造 Skills Prompt\n    async fn build_skills_prompt(&self, skill_ids: &[String]) -> Result<String> {\n        let mut prompt = \"你可以使用以下工具：\\n\\n\".to_string();\n        \n        for skill_id in skill_ids {\n            let skill = self.skills_manager.get_skill(skill_id).await?;\n            prompt.push_str(&format!(\n                \"- {}: {}\\n\",\n                skill.name,\n                skill.description\n            ));\n        }\n        \n        prompt.push_str(\"\\n如果需要使用工具，请在回复中说明。\");\n        \n        Ok(prompt)\n    }\n    \n    // B06-09: 构造 MCP Prompt\n    async fn build_mcp_prompt(&self, server_ids: &[String]) -> Result<String> {\n        let mut prompt = \"你可以访问以下 MCP 工具：\\n\\n\".to_string();\n        \n        for server_id in server_ids {\n            let tools = self.mcp_manager.list_tools(server_id).await?;\n            for tool in tools {\n                prompt.push_str(&format!(\n                    \"- {}: {}\\n\",\n                    tool.name,\n                    tool.description\n                ));\n            }\n        }\n        \n        Ok(prompt)\n    }\n    \n    // B06-12: 中断流式生成\n    pub async fn interrupt_stream(&self, session_id: &str) -> Result<()> {\n        // 设置中断标志\n        // 流式处理会检查该标志并停止\n        Ok(())\n    }\n}\n```\n\n### 7.2 前端流式处理\n\n```typescript\n// apps/desktop/src/hooks/useChat.ts\n\nimport { invoke } from '@tauri-apps/api';\nimport { listen } from '@tauri-apps/api/event';\n\nexport const useChat = (sessionId: string) => {\n  const [messages, setMessages] = useState<ChatMessage[]>([]);\n  const [streaming, setStreaming] = useState(false);\n  const [currentChunk, setCurrentChunk] = useState('');\n  \n  // B06-13: 发送消息（流式）\n  const sendMessage = async (content: string) => {\n    setStreaming(true);\n    setCurrentChunk('');\n    \n    // 添加用户消息\n    const userMessage: ChatMessage = {\n      id: generateId(),\n      role: 'user',\n      content,\n      createdAt: new Date(),\n    };\n    setMessages(prev => [...prev, userMessage]);\n    \n    // B06-14: 监听流式事件\n    const unlisten = await listen<ChatChunk>('chat:stream', (event) => {\n      const chunk = event.payload;\n      \n      // B06-15: 累积内容\n      setCurrentChunk(prev => prev + chunk.content);\n    });\n    \n    try {\n      // 调用后端\n      await invoke('stream_chat_message', {\n        sessionId,\n        content,\n      });\n      \n      // B06-16: 流结束，保存 AI 消息\n      const aiMessage: ChatMessage = {\n        id: generateId(),\n        role: 'assistant',\n        content: currentChunk,\n        createdAt: new Date(),\n      };\n      setMessages(prev => [...prev, aiMessage]);\n      setCurrentChunk('');\n    } catch (error) {\n      console.error('发送消息失败', error);\n    } finally {\n      setStreaming(false);\n      unlisten();\n    }\n  };\n  \n  // B06-17: 中断生成\n  const interrupt = async () => {\n    await invoke('interrupt_chat_stream', { sessionId });\n    setStreaming(false);\n  };\n  \n  return {\n    messages,\n    streaming,\n    currentChunk,\n    sendMessage,\n    interrupt,\n  };\n};\n```\n\n### 7.3 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- 度 | 负责人 | 备注 |\n| --- | --- | --- | --- | --- |\n| 会话管理 | 🔴 未开始 | 0% | TBD | - |\n| 消息处理 | 🔴 未开始 | 0% | TBD | - |\n| 流式响应 | 🔴 未开始 | 0% | TBD | - |\n| Skills 集成 | 🔴 未开始 | 0% | TBD | - |\n| MCP 集成 | 🔴 未开始 | 0% | TBD | - |\n| 前端 UI | 🔴 未开始 | 0% | TBD | - |\n| Markdown 渲染 | 🔴 未开始 | 0% | TBD | - |\n| 测试用例 | 🔴 未开始 | 0% | TBD | - |\n\n详见 [V1 实现状态](../../../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n", "doc-023": "# V1-FR-007：系统设置\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-007 |\n| 功能名称 | 系统设置 |\n| 所属版本 | V1 |\n| 所属领域 | 应用模块 |\n| 优先级 | P0（必须） |\n| 风险级别 | 标准（管理界面，技术成熟） |\n| 依赖功能 | V1-FR-001～V1-FR-005（管理所有底层能力） |\n| 被依赖功能 | 无 |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n提供统一的系统设置界面，集中管理 Provider、Skills、MCP、模块、主题和用户偏好，让用户可以方便地配置和管理 DGOS。\n\n### 2.2 详细说明\n\n系统设置是 DGOS 的管理中心，所有配置都集中在这里。\n\n**核心价值**：\n- ✅ 集中管理：所有配置在一个地方\n- ✅ 清晰分类：按功能分 tab（Provider、Skills、MCP、模块、外观、关于）\n- ✅ 易于操作：直观的 CRUD 界面\n- ✅ 实时生效：配置更改立即生效\n\n**用户价值**：\n- 最终用户：方便地管理所有配置\n- 开发者：参考实现，学习如何构建管理界面\n\n### 2.3 功能边界\n\n**包含（6 个主要模块）**：\n\n**1. Provider 管理**：\n- ✅ Provider 列表（显示所有已配置的 Provider）\n- ✅ 添加 Provider（表单输入）\n- ✅ 编辑 Provider（修改配置）\n- ✅ 删除 Provider（确认提示）\n- ✅ 测试连接（验证配置）\n- ✅ 刷新模型列表（手动刷新）\n- ✅ 拖拽排序（调整优先级）\n- ✅ 启用/禁用开关\n\n**2. Skills 管理**：\n- ✅ 浏览 Skills 仓库（分类、搜索）\n- ✅ 安装 Skills（下载、配置）\n- ✅ 已安装 Skills 列表\n- ✅ Skills 配置（API Key 等）\n- ✅ 卸载 Skills\n- ✅ 更新 Skills（检查更新、手动更新）\n- ✅ 启用/禁用开关\n\n**3. MCP 管理**：\n- ✅ MCP 服务器列表\n- ✅ 添加 MCP 服务器（Stdio/HTTP）\n- ✅ 编辑 MCP 服务器\n- ✅ 删除 MCP 服务器\n- ✅ 连接状态显示\n- ✅ 工具列表查看\n- ✅ 连接日志查看\n\n**4. 模块管理**：\n- ✅ 已安装模块列表\n- ✅ 模块详情（名称、版本、权限）\n- ✅ 启用/禁用模块\n- ✅ 卸载模块\n- ✅ 检查模块更新\n- ✅ 更新模块\n- ✅ 查看崩溃日志\n\n**5. 外观设置**：\n- ✅ 主题切换（亮色/暗色）\n- ✅ 字体大小（小/中/大）\n- ✅ 紧凑模式（减少间距）\n- ✅ 主题预览\n\n**6. 关于**：\n- ✅ DGOS 版本信息\n- ✅ 系统信息（OS、架构）\n- ✅ 许可证信息\n- ✅ 检查更新\n\n**不包含**（明确说明原因）：\n- ❌ 高级配置（环境变量、调试模式） → V2 开发者工具\n- ❌ 插件市场 → V3 应用市场\n- ❌ 账号登录 → V4 云端账号\n- ❌ 数据备份/导出 → V2 数据管理\n- ❌ 性能监控 → V2 监控功能\n\n## 3. 核心流程\n\n### 3.1 添加 Provider 流程\n\n```\n用户打开系统设置\n  ↓\n点击\"Provider\"标签\n  ↓\n显示已配置的 Provider 列表\n  ↓\n点击\"添加 Provider\"按钮\n  ↓\n显示表单：\n  - 名称：[我的 OpenAI]\n  - 类型：[OpenAI 兼容] (下拉)\n  - Base URL：[https://api.openai.com/v1]\n  - API Key：[sk-xxx...] (密码输入)\n  ↓\n点击\"测试连接\"\n  ↓\n调用 Provider API 验证\n  ↓\n（如果成功）显示\"连接成功 ✓\"\n  ↓\n点击\"保存\"\n  ↓\nProvider 保存到数据库\n  ↓\n自动获取模型列表\n  ↓\n显示在 Provider 列表中\n```\n\n### 3.2 安装 Skills 流程\n\n```\n用户打开系统设置\n  ↓\n点击\"Skills\"标签\n  ↓\n显示两个子标签：\"浏览仓库\" 和 \"已安装\"\n  ↓\n点击\"浏览仓库\"\n  ↓\n显示官方 Skills 列表（分类）\n  ↓\n搜索或浏览 Skills\n  ↓\n点击某个 Skill\n  ↓\n显示详情：\n  - 名称、描述、作者、版本\n  - 依赖：Python 3.10+\n  - 配置：需要 Google Search API Key\n  ↓\n点击\"安装\"\n  ↓\n检查依赖（Python 版本）\n  ↓\n（如果依赖不满足）提示\"需要 Python 3.10+\"\n  ↓\n（如果满足）下载并安装\n  ↓\n（如果需要配置）显示配置表单\n  ↓\n用户输入 API Key\n  ↓\n保存配置\n  ↓\n安装完成，显示在\"已安装\"列表\n```\n\n### 3.3 主题切换流程\n\n```\n用户打开系统设置\n  ↓\n点击\"外观\"标签\n  ↓\n显示主题选项：\n  ○ 亮色主题\n  ● 暗色主题 (当前选中)\n  ↓\n点击\"亮色主题\"\n  ↓\n立即应用主题\n  ↓\n显示预览效果\n  ↓\n保存用户偏好到数据库\n  ↓\n（可选）显示\"主题已更改\"提示\n```\n\n### 3.4 模块更新流程\n\n```\n用户打开系统设置\n  ↓\n点击\"模块\"标签\n  ↓\n系统自动检查更新\n  ↓\n显示\"AI 工作台有更新\"标记\n  ↓\n点击\"查看更新\"\n  ↓\n显示更新日志：\n  v1.0.1 → v1.0.2\n  - 修复流式输出 bug\n  - 优化性能\n  ↓\n点击\"更新\"\n  ↓\n下载新版本\n  ↓\n显示进度条\n  ↓\n更新完成（热重载，无需重启）\n  ↓\n显示\"更新成功 ✓\"\n```\n\n## 4. 数据模型\n\n系统设置主要是对现有数据的管理界面，不新增数据表。\n\n### 4.1 涉及的现有数据表\n\n- `providers` - Provider 配置\n- `models` - 模型列表缓存\n- `skills` - 已安装的 Skills\n- `mcp_servers` - MCP 服务器配置\n- `installed_modules` - 已安装模块\n- `module_permissions` - 模块权限\n- `user_preferences` - 用户偏好（主题等）\n\n### 4.2 读写关系\n\n所有读写操作通过 Tauri Commands 调用对应的管理器：\n- Provider 管理 → 调用 `V1-FR-001` 的接口\n- Skills 管理 → 调用 `V1-FR-002` 的接口\n- MCP 管理 → 调用 `V1-FR-003` 的接口\n- 模块管理 → 调用 `V1-FR-004` 的接口\n- 主题管理 → 调用 `V1-FR-005` 的接口\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 打开系统设置 | 用户已登录 | 点击\"设置\"菜单 | 系统设置界面打开 | E2E | `tests/e2e/settings.spec.ts` | `pnpm test:e2e settings` | 规划中 |\n| AC02 | Provider 列表显示 | 已配置 Provider | 打开 Provider 标签 | 显示所有 Provider | E2E | `tests/e2e/settings_provider.spec.ts` | `pnpm test:e2e settings_provider` | 规划中 |\n| AC03 | 添加 Provider | 点击添加 | 填写表单并保存 | Provider 添加成功 | E2E | `tests/e2e/settings_provider.spec.ts` | `pnpm test:e2e settings_provider` | 规划中 |\n| AC04 | 测试 Provider 连接 | 填写配置 | 点击\"测试连接\" | 显示连接结果 | E2E | `tests/e2e/settings_provider.spec.ts` | `pnpm test:e2e settings_provider` | 规划中 |\n| AC05 | Skills 仓库浏览 | 打开 Skills 标签 | 浏览仓库 | 显示 Skills 列表 | E2E | `tests/e2e/settings_skills.spec.ts` | `pnpm test:e2e settings_skills` | 规划中 |\n| AC06 | 安装 Skills | 点击安装 | 完成配置 | Skills 安装成功 | E2E | `tests/e2e/settings_skills.spec.ts` | `pnpm test:e2e settings_skills` | 规划中 |\n| AC07 | MCP 服务器添加 | 点击添加 | 填写配置 | MCP 服务器添加成功 | E2E | `tests/e2e/settings_mcp.spec.ts` | `pnpm test:e2e settings_mcp` | 规划中 |\n| AC08 | MCP 连接状态 | MCP 已配置 | 查看列表 | 显示连接状态（绿色/红色） | E2E | `tests/e2e/settings_mcp.spec.ts` | `pnpm test:e2e settings_mcp` | 规划中 |\n| AC09 | 模块列表显示 | 已安装模块 | 打开模块标签 | 显示所有模块 | E2E | `tests/e2e/settings_modules.spec.ts` | `pnpm test:e2e settings_modules` | 规划中 |\n| AC10 | 模块启用/禁用 | 模块已安装 | 切换开关 | 模块状态改变 | E2E | `tests/e2e/settings_modules.spec.ts` | `pnpm test:e2e settings_modules` | 规划中 |\n| AC11 | 模块更新 | 模块有新版本 | 点击更新 | 模块更新成功 | E2E | `tests/e2e/settings_modules.spec.ts` | `pnpm test:e2e settings_modules` | 规划中 |\n| AC12 | 主题切换 | 当前亮色主题 | 切换到暗色 | 主题立即更改 | E2E | `tests/e2e/settings_appearance.spec.ts` | `pnpm test:e2e settings_appearance` | 规划中 |\n| AC13 | 字体大小调整 | 当前中等字号 | 选择大字号 | 全局字体变大 | E2E | `tests/e2e/settings_appearance.spec.ts` | `pnpm test:e2e settings_appearance` | 规划中 |\n| AC14 | 版本信息显示 | 打开关于标签 | 查看信息 | 显示版本、OS 等 | 前端集成 | `apps/desktop/src/__tests__/settings.test.tsx` | `pnpm test settings` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| Provider 配置错误 | API Key 无效 | 测试连接失败，显示错误 |\n| Skills 依赖不满足 | Python 版本低 | 禁止安装，提示升级 |\n| MCP 服务器不可达 | URL 无效 | 显示\"连接失败\" |\n| 模块更新失败 | 网络中断 | 显示错误，可重试 |\n| 主题切换频繁 | 快速切换 10 次 | 不卡顿，样式正确 |\n\n## 6. 接口设计\n\n### 6.1 前端组件结构\n\n```typescript\n// apps/desktop/src/views/Settings.tsx\n\nexport interface SettingsProps {\n  // 无 props，独立模块\n}\n\nexport const Settings: React.FC<SettingsProps>;\n\n// 子组件\n\n// Provider 管理\nexport const ProviderSettings: React.FC;\n\n// Skills 管理\nexport const SkillsSettings: React.FC;\n\n// MCP 管理\nexport const MCPSettings: React.FC;\n\n// 模块管理\nexport const ModulesSettings: React.FC;\n\n// 外观设置\nexport const AppearanceSettings: React.FC;\n\n// 关于\nexport const AboutSettings: React.FC;\n```\n\n### 6.2 Settings 路由\n\n```typescript\n// apps/desktop/src/router.tsx\n\n{\n  path: '/settings',\n  element: <Settings />,\n  children: [\n    { path: 'providers', element: <ProviderSettings /> },\n    { path: 'skills', element: <SkillsSettings /> },\n    { path: 'mcp', element: <MCPSettings /> },\n    { path: 'modules', element: <ModulesSettings /> },\n    { path: 'appearance', element: <AppearanceSettings /> },\n    { path: 'about', element: <AboutSettings /> },\n  ],\n}\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 Settings 主界面\n\n```typescript\n// apps/desktop/src/views/Settings.tsx\n\nimport { Tabs, TabsList, TabsTrigger, TabsContent } from '@dgos/ui';\n\nexport const Settings: React.FC = () => {\n  return (\n    <div className=\"settings-container\">\n      <h1>系统设置</h1>\n      \n      {/* B07-01: 标签导航 */}\n      <Tabs defaultValue=\"providers\">\n        <TabsList>\n          <TabsTrigger value=\"providers\">Provider</TabsTrigger>\n          <TabsTrigger value=\"skills\">Skills</TabsTrigger>\n          <TabsTrigger value=\"mcp\">MCP</TabsTrigger>\n          <TabsTrigger value=\"modules\">模块</TabsTrigger>\n          <TabsTrigger value=\"appearance\">外观</TabsTrigger>\n          <TabsTrigger value=\"about\">关于</TabsTrigger>\n        </TabsList>\n        \n        {/* B07-02: Provider 管理 */}\n        <TabsContent value=\"providers\">\n          <ProviderSettings />\n        </TabsContent>\n        \n        {/* B07-03: Skills 管理 */}\n        <TabsContent value=\"skills\">\n          <SkillsSettings />\n        </TabsContent>\n        \n        {/* B07-04: MCP 管理 */}\n        <TabsContent value=\"mcp\">\n          <MCPSettings />\n        </TabsContent>\n        \n        {/* B07-05: 模块管理 */}\n        <TabsContent value=\"modules\">\n          <ModulesSettings />\n        </TabsContent>\n        \n        {/* B07-06: 外观设置 */}\n        <TabsContent value=\"appearance\">\n          <AppearanceSettings />\n        </TabsContent>\n        \n        {/* B07-07: 关于 */}\n        <TabsContent value=\"about\">\n          <AboutSettings />\n        </TabsContent>\n      </Tabs>\n    </div>\n  );\n};\n```\n\n### 7.2 Provider 管理界面\n\n```typescript\n// apps/desktop/src/views/settings/ProviderSettings.tsx\n\nimport { invoke } from '@tauri-apps/api';\nimport { Button, Modal, Input } from '@dgos/ui';\n\nexport const ProviderSettings: React.FC = () => {\n  const [providers, setProviders] = useState<Provider[]>([]);\n  const [showAddModal, setShowAddModal] = useState(false);\n  \n  // B07-08: 加载 Provider 列表\n  useEffect(() => {\n    loadProviders();\n  }, []);\n  \n  const loadProviders = async () => {\n    const list = await invoke<Provider[]>('list_providers', {\n      userId: getCurrentUserId(),\n    });\n    setProviders(list);\n  };\n  \n  // B07-09: 添加 Provider\n  const handleAddProvider = async (config: ProviderConfig) => {\n    await invoke('create_provider', { config });\n    await loadProviders();\n    setShowAddModal(false);\n  };\n  \n  // B07-10: 测试连接\n  const handleTestConnection = async (config: ProviderConfig) => {\n    try {\n      const result = await invoke<boolean>('test_provider_connection', { config });\n      if (result) {\n        toast({ message: '连接成功 ✓', type: 'success' });\n      }\n    } catch (error) {\n      toast({ message: '连接失败', type: 'error' });\n    }\n  };\n  \n  // B07-11: 删除 Provider\n  const handleDeleteProvider = async (id: string) => {\n    if (confirm('确定删除此 Provider？')) {\n      await invoke('delete_provider', { id });\n      await loadProviders();\n    }\n  };\n  \n  return (\n    <div className=\"provider-settings\">\n      <div className=\"header\">\n        <h2>Provider 管理</h2>\n        <Button onClick={() => setShowAddModal(true)}>添加 Provider</Button>\n      </div>\n      \n      {/* Provider 列表 */}\n      <div className=\"provider-list\">\n        {providers.map(provider => (\n          <ProviderCard\n            key={provider.id}\n            provider={provider}\n            onDelete={() => handleDeleteProvider(provider.id)}\n            onTest={() => handleTestConnection(provider)}\n          />\n        ))}\n      </div>\n      \n      {/* 添加 Provider 模态框 */}\n      <Modal open={showAddModal} onClose={() => setShowAddModal(false)}>\n        <ProviderForm\n          onSubmit={handleAddProvider}\n          onTest={handleTestConnection}\n        />\n      </Modal>\n    </div>\n  );\n};\n```\n\n### 7.3 外观设置界面\n\n```typescript\n// apps/desktop/src/views/settings/AppearanceSettings.tsx\n\nimport { useTheme } from '@dgos/ui';\nimport { invoke } from '@tauri-apps/api';\n\nexport const AppearanceSettings: React.FC = () => {\n  const { theme, setTheme } = useTheme();\n  const [fontSize, setFontSize] = useState<'small' | 'medium' | 'large'>('medium');\n  \n  // B07-12: 切换主题\n  const handleThemeChange = (newTheme: Theme) => {\n    setTheme(newTheme);\n    \n    // 保存到数据库\n    invoke('save_user_theme', { theme: newTheme });\n  };\n  \n  // B07-13: 调整字体大小\n  const handleFontSizeChange = (size: string) => {\n    setFontSize(size as any);\n    \n    // 应用到 DOM\n    document.documentElement.setAttribute('data-font-size', size);\n    \n    // 保存到数据库\n    invoke('save_user_preferences', { fontSize: size });\n  };\n  \n  return (\n    <div className=\"appearance-settings\">\n      <h2>外观设置</h2>\n      \n      {/* 主题选择 */}\n      <section>\n        <h3>主题</h3>\n        <div className=\"theme-options\">\n          <label>\n            <input\n              type=\"radio\"\n              value=\"light\"\n              checked={theme === 'light'}\n              onChange={() => handleThemeChange('light')}\n            />\n            亮色主题\n          </label>\n          <label>\n            <input\n              type=\"radio\"\n              value=\"dark\"\n              checked={theme === 'dark'}\n              onChange={() => handleThemeChange('dark')}\n            />\n            暗色主题\n          </label>\n        </div>\n      </section>\n      \n      {/* 字体大小 */}\n      <section>\n        <h3>字体大小</h3>\n        <select value={fontSize} onChange={(e) => handleFontSizeChange(e.target.value)}>\n          <option value=\"small\">小</option>\n          <option value=\"medium\">中</option>\n          <option value=\"large\">大</option>\n        </select>\n      </section>\n      \n      {/* 主题预览 */}\n      <section>\n        <h3>预览</h3>\n        <div className=\"theme-preview\">\n          <Button variant=\"primary\">主要按钮</Button>\n          <Button variant=\"secondary\">次要按钮</Button>\n          <Input placeholder=\"输入框示例\" />\n        </div>\n      </section>\n    </div>\n  );\n};\n```\n\n### 7.4 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B07-01 | 标签导航 | AC01 | V1-E2E-07 |\n| B07-02 | Provider 管理界面 | AC02 | V1-E2E-07 |\n| B07-03 | Skills 管理界面 | AC05 | V1-E2E-07 |\n| B07-04 | MCP 管理界面 | AC07 | V1-E2E-07 |\n| B07-05 | 模块管理界面 | AC09 | V1-E2E-07 |\n| B07-06 | 外观设置界面 | AC12 | V1-E2E-07 |\n| B07-07 | 关于界面 | AC14 | V1-E2E-07 |\n| B07-08 | 加载 Provider 列表 | AC02 | - |\n| B07-09 | 添加 Provider | AC03 | - |\n| B07-10 | 测试连接 | AC04 | - |\n| B07-11 | 删除 Provider | AC03 | - |\n| B07-12 | 切换主题 | AC12 | - |\n| B07-13 | 调整字体大小 | AC13 | - |\n\n## 8. 错误码设计\n\n系统设置主要是调用其他功能的接口，错误码复用对应功能的错误码。\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1007001 | settings_load_failed | 加载设置失败 | 刷新页面 |\n| 1007002 | settings_save_failed | 保存设置失败 | 重试 |\n\n其他错误码见：\n- Provider 错误：V1-FR-001\n- Skills 错误：V1-FR-002\n- MCP 错误：V1-FR-003\n- 模块错误：V1-FR-004\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 界面加载时间 | < 500ms | Performance API |\n| 标签切换时间 | < 100ms | Performance API |\n| 列表渲染 | 支持 100+ 项不卡顿 | 手动测试 |\n\n### 9.2 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 实时生效 | 配置更改立即生效，无需重启 |\n| 表单验证 | 输入错误实时提示 |\n| 确认提示 | 删除操作需要确认 |\n| 搜索过滤 | 大量配置时支持搜索 |\n\n## 10. 实现与验证\n\n### 10.1 前端集成测试\n\n**目标资产**：\n- `apps/desktop/src/views/Settings.tsx`\n- `apps/desktop/src/views/settings/ProviderSettings.tsx`\n- `apps/desktop/src/views/settings/SkillsSettings.tsx`\n- `apps/desktop/src/views/settings/MCPSettings.tsx`\n- `apps/desktop/src/views/settings/ModulesSettings.tsx`\n- `apps/desktop/src/views/settings/AppearanceSettings.tsx`\n- `apps/desktop/src/views/settings/AboutSettings.tsx`\n- `apps/desktop/src/__tests__/settings.test.tsx`\n\n**测试命令**：\n```bash\ncd apps/desktop && pnpm test settings\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- settings.test.tsx：0/1 通过（待实现）\n\n详细覆盖说明：\n- AC14：待实现\n```\n\n### 10.2 E2E 测试\n\n**E2E 场景**：V1-E2E-07（系统设置各模块操作）\n\n**测试资产**：\n- `tests/e2e/settings.spec.ts`\n- `tests/e2e/settings_provider.spec.ts`\n- `tests/e2e/settings_skills.spec.ts`\n- `tests/e2e/settings_mcp.spec.ts`\n- `tests/e2e/settings_modules.spec.ts`\n- `tests/e2e/settings_appearance.spec.ts`\n\n**测试命令**：\n```bash\npnpm test:e2e settings\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：集成测试环境\n\n结果：\n- settings.spec.ts：0/1 通过（待实现）\n- settings_provider.spec.ts：0/3 通过（待实现）\n- settings_skills.spec.ts：0/2 通过（待实现）\n- settings_mcp.spec.ts：0/2 通过（待实现）\n- settings_modules.spec.ts：0/3 通过（待实现）\n- settings_appearance.spec.ts：0/2 通过（待实现）\n\n详细说明：\n- AC01～AC13：待实现\n```\n\n## 11. 风险与依赖\n\n### 11.1 技术风险 限管理 → V1-FR-009 独立功能\n- ❌ OAuth 登录 → V4 云端账号\n- ❌ 云端同步 → V4 云端账号\n\n## 3. 核心流程\n\n### 3.1 首次启动流程\n\n```\n用户首次启动 DGOS\n  ↓\n检查是否有用户\n  ↓\n（如果没有）显示欢迎页面\n  ↓\n\"欢迎使用 DGOS！请创建一个用户\"\n  ↓\n显示注册表单：\n  - 用户名：[admin]\n  - 密码：[********]\n  - 确认密码：[********]\n  ↓\n点击\"创建用户\"\n  ↓\n验证输入：\n  - 用户名不为空\n  - 密码长度 >= 6\n  - 两次密码一致\n  ↓\n密码加密（bcrypt）\n  ↓\n保存到数据库\n  ↓\n自动登录\n  ↓\n进入主界面\n```\n\n### 3.2 用户登录流程\n\n```\n用户启动 DGOS\n  ↓\n检查是否有用户\n  ↓\n（如果有）显示登录页面\n  ↓\n显示用户列表（头像 + 用户名）\n  ↓\n用户点击自己的账号\n  ↓\n显示密码输入框\n  ↓\n用户输入密码\n  ↓\n点击\"登录\"\n  ↓\n验证密码（bcrypt.verify）\n  ↓\n（如果正确）记录登录状态\n  ↓\n记录为\"上次登录用户\"\n  ↓\n加载用户数据\n  ↓\n进入主界面\n  ↓\n（如果错误）显示\"密码错误\"\n```\n\n### 3.3 用户切换流程\n\n```\n用户在主界面\n  ↓\n点击右上角用户菜单\n  ↓\n点击\"切换用户\"\n  ↓\n保存当前用户状态\n  ↓\n返回登录页面\n  ↓\n显示所有用户列表\n  ↓\n用户选择另一个账号\n  ↓\n输入密码\n  ↓\n验证成功\n  ↓\n切换到新用户\n  ↓\n加载新用户数据\n  ↓\n进入主界面\n```\n\n### 3.4 修改密码流程\n\n```\n用户在系统设置\n  ↓\n点击\"账号\"标签\n  ↓\n点击\"修改密码\"\n  ↓\n显示表单：\n  - 当前密码：[********]\n  - 新密码：[********]\n  - 确认新密码：[********]\n  ↓\n点击\"保存\"\n  ↓\n验证当前密码\n  ↓\n（如果错误）提示\"当前密码错误\"\n  ↓\n（如果正确）验证新密码：\n  - 长度 >= 6\n  - 两次输入一致\n  ↓\n新密码加密\n  ↓\n更新数据库\n  ↓\n显示\"密码已修改\"\n  ↓\n（可选）强制重新登录\n```\n\n### 3.5 删除用户流程\n\n```\n用户在系统设置\n  ↓\n点击\"账号\"标签\n  ↓\n点击\"删除用户\"\n  ↓\n显示确认提示：\n  \"确定删除用户 [admin]？\n   所有数据（配置、历史、模块）将被删除，\n   此操作不可恢复。\"\n  ↓\n用户确认\n  ↓\n输入当前密码验证\n  ↓\n删除用户数据：\n  - 删除 users 表记录\n  - 删除所有关联数据（级联删除）\n  ↓\n（如果是唯一用户）返回欢迎页面\n  ↓\n（如果有其他用户）返回登录页面\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**users 表**（核心表）：\n```sql\nCREATE TABLE users (\n    id TEXT PRIMARY KEY,              -- UUID\n    username TEXT UNIQUE NOT NULL,    -- 用户名（唯一）\n    password_hash TEXT NOT NULL,      -- 密码哈希（bcrypt）\n    display_name TEXT,                -- 显示名称（可选，默认为 username）\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    last_login_at TIMESTAMP,          -- 最后登录时间\n    is_active BOOLEAN DEFAULT TRUE    -- 是否激活\n);\n\nCREATE INDEX idx_users_username ON users(username);\n```\n\n**user_sessions 表**（会话管理）：\n```sql\nCREATE TABLE user_sessions (\n    id TEXT PRIMARY KEY,              -- UUID\n    user_id TEXT NOT NULL,\n    token TEXT UNIQUE NOT NULL,       -- 会话 token\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    expires_at TIMESTAMP,             -- 过期时间（可选）\n    device_info TEXT,                 -- 设备信息（可选）\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\nCREATE INDEX idx_sessions_token ON user_sessions(token);\n```\n\n**app_config 表**（应用配置）：\n```sql\nCREATE TABLE app_config (\n    key TEXT PRIMARY KEY,\n    value TEXT\n);\n\n-- 存储\"上次登录用户\"\nINSERT INTO app_config (key, value) VALUES ('last_login_user_id', '...');\n```\n\n### 4.2 数据隔离策略\n\n**所有用户数据表都包含 user_id 字段**：\n```sql\n-- 示例：Provider 表\nCREATE TABLE providers (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,            -- 关键：用户隔离\n    name TEXT NOT NULL,\n    ...\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\n-- 查询时必须过滤\nSELECT * FROM providers WHERE user_id = ?;\n```\n\n**级联删除**：用户删除时，所有关联数据自动删除（`ON DELETE CASCADE`）。\n\n### 4.3 读写关系\n\n**读操作**：\n- 获取所有用户：`SELECT id, username, display_name, last_login_at FROM users WHERE is_active = TRUE`\n- 查询用户：`SELECT * FROM users WHERE username = ?`\n- 获取上次登录用户：`SELECT value FROM app_config WHERE key = 'last_login_user_id'`\n\n**写操作**：\n- 创建用户：`INSERT INTO users (id, username, password_hash) VALUES (?, ?, ?)`\n- 更新密码：`UPDATE users SET password_hash = ? WHERE id = ?`\n- 删除用户：`DELETE FROM users WHERE id = ?`（级联删除所有关联数据）\n- 记录登录：`UPDATE users SET last_login_at = ? WHERE id = ?`\n- 保存会话：`INSERT INTO user_sessions (id, user_id, token) VALUES (?, ?, ?)`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 首次启动创建用户 | 数据库为空 | 启动应用 | 显示欢迎页面 | E2E | `tests/e2e/user_onboarding.spec.ts` | `pnpm test:e2e user_onboarding` | 规划中 |\n| AC02 | 用户注册成功 | 欢迎页面 | 填写并提交 | 用户创建成功，自动登录 | E2E | `tests/e2e/user_registration.spec.ts` | `pnpm test:e2e user_registration` | 规划中 |\n| AC03 | 密码加密存储 | 用户创建 | 查询数据库 | password_hash 不等于明文密码 | 后端 API | `server/crates/auth/tests/password_hash.rs` | `cargo test -p dgos-auth password_hash` | 规划中 |\n| AC04 | 用户登录成功 | 用户已存在 | 输入正确密码 | 登录成功，进入主界面 | E2E | `tests/e2e/user_login.spec.ts` | `pnpm test:e2e user_login` | 规划中 |\n| AC05 | 密码错误提示 | 用户已存在 | 输入错误密码 | 提示\"密码错误\" | E2E | `tests/e2e/user_login.spec.ts` | `pnpm test:e2e user_login` | 规划中 |\n| AC06 | 用户切换 | 多个用户存在 | 切换到另一个用户 | 切换成功，数据隔离 | E2E | `tests/e2e/user_switch.spec.ts` | `pnpm test:e2e user_switch` | 规划中 |\n| AC07 | 数据隔离 | 用户 A 创建 Provider | 用户 B 登录 | 用户 B 看不到用户 A 的 Provider | 后端 API | `server/crates/auth/tests/data_isolation.rs` | `cargo test -p dgos-auth data_isolation` | 规划中 |\n| AC08 | 修改密码 | 用户已登录 | 修改密码成功 | 新密码生效，旧密码失效 | E2E | `tests/e2e/user_password.spec.ts` | `pnpm test:e2e user_password` | 规划中 |\n| AC09 | 删除用户 | 用户已登录 | 删除用户 | 用户和所有数据删除 | E2E + 后端 | `tests/e2e/user_deletion.spec.ts` | `pnpm test:e2e user_deletion` | 规划中 |\n| AC10 | 级联删除 | 用户有 Provider | 删除用户 | Provider 也被删除 | 后端 API | `server/crates/auth/tests/cascade_delete.rs` | `cargo test -p dgos-auth cascade_delete` | 规划中 |\n| AC11 | 记住上次登录 | 用户 A 登录过 | 重启应用 | 默认选中用户 A | E2E | `tests/e2e/user_persistence.spec.ts` | `pnpm test:e2e user_persistence` | 规划中 |\n| AC12 | 用户名重复检测 | 用户 admin 存在 | 创建用户 admin | 提示\"用户名已存在\" | 后端 API | `server/crates/auth/tests/username_unique.rs` | `cargo test -p dgos-auth username_unique` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 用户名为空 | 提交空用户名 | 提示\"用户名不能为空\" |\n| 用户名过长 | 输入 100 字符 | 提示\"用户名过长（最多 32 字符）\" |\n| 密码过短 | 输入 3 字符 | 提示\"密码至少 6 字符\" |\n| 密码不一致 | 两次输入不同 | 提示\"两次密码不一致\" |\n| 删除唯一用户 | 只有 1 个用户 | 确认后删除，返回欢迎页面 |\n| 数据库损坏 | 无法读取用户 | 显示错误，提供修复选项 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// 用户管理\n#[tauri::command]\nasync fn list_users() -> Result<Vec<User>>;\n\n#[tauri::command]\nasync fn create_user(username: String, password: String) -> Result<User>;\n\n#[tauri::command]\nasync fn delete_user(user_id: String, password: String) -> Result<()>;\n\n// 认证\n#[tauri::command]\nasync fn login(username: String, password: String) -> Result<Session>;\n\n#[tauri::command]\nasync fn logout(session_token: String) -> Result<()>;\n\n#[tauri::command]\nasync fn verify_session(session_token: String) -> Result<User>;\n\n#[tauri::command]\nasync fn change_password(\n    user_id: String,\n    old_password: String,\n    new_password: String\n) -> Result<()>;\n\n// 配置\n#[tauri::command]\nasync fn get_last_login_user() -> Result<Option<String>>;\n\n#[tauri::command]\nasync fn set_last_login_user(user_id: String) -> Result<()>;\n```\n\n### 6.2 数据结构\n\n```rust\n// server/crates/auth/src/types.rs\n\nuse serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct User {\n    pub id: String,\n    pub username: String,\n    pub display_name: Option<String>,\n    pub created_at: String,\n    pub last_login_at: Option<String>,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Session {\n    pub token: String,\n    pub user: User,\n    pub expires_at: Option<String>,\n}\n\n#[derive(Debug, Deserialize)]\npub struct CreateUserRequest {\n    pub username: String,\n    pub password: String,\n}\n\n#[derive(Debug, Deserialize)]\npub struct LoginRequest {\n    pub username: String,\n    pub password: String,\n}\n\n#[derive(Debug, Deserialize)]\npub struct ChangePasswordRequest {\n    pub old_password: String,\n    pub new_password: String,\n}\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 密码加密实现\n\n```rust\n// server/crates/auth/src/password.rs\n\nuse bcrypt::{hash, verify, DEFAULT_COST};\n\n// B08-01: 密码加密\npub fn hash_password(password: &str) -> Result<String> {\n    // 使用 bcrypt，默认 cost = 12\n    let hashed = hash(password, DEFAULT_COST)?;\n    Ok(hashed)\n}\n\n// B08-02: 密码验证\npub fn verify_password(password: &str, hash: &str) -> Result<bool> {\n    let valid = verify(password, hash)?;\n    Ok(valid)\n}\n```\n\n### 7.2 用户注册实现\n\n```rust\n// server/crates/auth/src/service.rs\n\npub struct AuthService {\n    db: DatabasePool,\n}\n\nimpl AuthService {\n    // B08-03: 创建用户\n    pub async fn create_user(\n        &self,\n        username: String,\n        password: String\n    ) -> Result<User> {\n        // B08-04: 验证用户名唯一性\n        if self.db.user_exists(&username).await? {\n            return Err(Error::UserAlreadyExists);\n        }\n        \n        // B08-05: 验证密码强度\n        if password.len() < 6 {\n            return Err(Error::PasswordTooShort);\n        }\n        \n        // B08-06: 密码加密\n        let password_hash = hash_password(&password)?;\n        \n        // B08-07: 保存到数据库\n        let user = User {\n            id: Uuid::new_v4().to_string(),\n            username: username.clone(),\n            display_name: None,\n            created_at: Utc::now().to_rfc3339(),\n            last_login_at: None,\n        };\n        \n        self.db.insert_user(&user, &password_hash).await?;\n        \n        Ok(user)\n    }\n    \n    // B08-08: 用户登录\n    pub async fn login(\n        &self,\n        username: String,\n        password: String\n    ) -> Result<Session> {\n        // B08-09: 查询用户\n        let user = self.db.get_user_by_username(&username).await?\n            .ok_or(Error::UserNotFound)?;\n        \n        // B08-10: 验证密码\n        let password_hash = self.db.get_password_hash(&user.id).await?;\n        if !verify_password(&password, &password_hash)? {\n            return Err(Error::InvalidPassword);\n        }\n        \n        // B08-11: 创建会话\n        let session = Session {\n            token: Uuid::new_v4().to_string(),\n            user: user.clone(),\n            expires_at: None, // V1 不过期，V2 添加\n        };\n        \n        self.db.insert_session(&session).await?;\n        \n        // B08-12: 更新最后登录时间\n        self.db.update_last_login(&user.id).await?;\n        \n        // B08-13: 记录为上次登录用户\n        self.db.set_config(\"last_login_user_id\", &user.id).await?;\n        \n        Ok(session)\n    }\n    \n    // B08-14: 删除用户\n    pub async fn delete_user(\n        &self,\n        user_id: &str,\n        password: String\n    ) -> Result<()> {\n        // B08-15: 验证密码（确认身份）\n        let password_hash = self.db.get_password_hash(user_id).await?;\n        if !verify_password(&password, &password_hash)? {\n            return Err(Error::InvalidPassword);\n        }\n        \n        // B08-16: 删除用户（级联删除所有数据）\n        self.db.delete_user(user_id).await?;\n        \n        Ok(())\n    }\n}\n```\n\n### 7.3 数据隔离中间件\n\n```rust\n// server/crates/auth/src/middleware.rs\n\n// B08-17: 从 session token 提取 user_id\npub async fn extract_user_id(token: &str, db: &DatabasePool) -> Result<String> {\n    let session = db.get_session_by_token(token).await?\n        .ok_or(Error::InvalidSession)?;\n    \n    Ok(session.user_id)\n}\n\n// B08-18: 验证数据访问权限\npub async fn check_data_access(\n    user_id: &str,\n    resource_user_id: &str\n) -> Result<()> {\n    if user_id != resource_user_id {\n        return Err(Error::AccessDenied);\n    }\n    \n    Ok(())\n}\n```\n\n### 7.4 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B08-01 | 密码加密 | AC03 | - |\n| B08-02 | 密码验证 | AC04, AC05 | - |\n| B08-03 | 创建用户 | AC02 | V1-E2E-08 |\n| B08-04 | 用户名唯一性检查 | AC12 | - |\n| B08-05 | 密码强度验证 | AC02 | - |\n| B08-06 | 密码加密保存 | AC03 | - |\n| B08-07 | 保存到数据库 | AC02 | - |\n| B08-08 | 用户登录 | AC04 | V1-E2E-08 |\n| B08-09 | 查询用户 | AC04 | - |\n| B08-10 | 验证密码 | AC04, AC05 | - |\n| B08-11 | 创建会话 | AC04 | - |\n| B08-12 | 更新最后登录时间 | AC04 | - |\n| B08-13 | 记录上次登录用户 | AC11 | - |\n| B08-14 | 删除用户 | AC09 | V1-E2E-08 |\n| B08-15 | 删除前验证密码 | AC09 | - |\n| B08-16 | 级联删除数据 | AC10 | - |\n| B08-17 | 提取用户 ID | AC06, AC07 | - |\n| B08-18 | 验证数据访问权限 | AC07 | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1008001 | user_not_found | 用户不存在 | 检查用户名 |\n| 1008002 | user_already_exists | 用户名已存在 | 使用其他用户名 |\n| 1008003 | invalid_password | 密码错误 | 重新输入 |\n| 1008004 | password_too_short | 密码过短 | 至少 6 字符 |\n| 1008005 | password_mismatch | 两次密码不一致 | 重新输入 |\n| 1008006 | invalid_session | 会话无效 | 重新登录 |\n| 1008007 | access_denied | 访问被拒绝 | 无权访问 |\n| 1008008 | username_empty | 用户名为空 | 输入用户名 |\n| 1008009 | username_too_long | 用户名过长 | 最多 32 字符 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 密码加密 | bcrypt，cost = 12 |\n| 会话管理 | UUID token，存储在内存 |\n| 数据隔离 | 所有查询必须过滤 user_id |\n| 密码复杂度 | 至少 6 字符（V1 简化，V2 增强） |\n\n### 9.2 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 登录响应时间 | < 500ms | Performance API |\n| 密码验证时间 | < 100ms | 单元测试 |\n| 用户列表加载 | < 100ms | Performance API |\n\n### 9.3 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 错误提示清晰 | 具体说明错误原因 |\n| 记住上次登录 | 自动选中上次用户 |\n| 快捷登录 | Enter 键提交 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/auth/src/password.rs`\n- `server/crates/auth/src/service.rs`\n- `server/crates/auth/src/middleware.rs`\n- `server/crates/auth/tests/password_hash.rs`\n- `server/crates/auth/tests/data_isolation.rs`\n- `server/crates/auth/tests/cascade_delete.rs`\n- `server/crates/auth/tests/username_unique.rs`\n\n**测试命令**：\n```bash\ncd server && cargo test -p dgos-auth\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- password_hash.rs：0/2 通过（待实现）\n- data_isolation.rs：0/1 通过（待实现）\n- cascade_delete.rs：0/1 通过（待实现）\n- username_unique.rs：0/1 通过（待实现）\n\n详细覆盖说明：\n- AC03, AC07, AC10, AC12：待实现\n```\n\n### 10.2 E2E 测试\n\n**E2E 场景**：V1-E2E-08（用户注册、登录、切换、删除）\n\n**测试资产**：\n- `tests/e2e/user_onboarding.spec.ts`\n- `tests/e2e/user_registration.spec.ts`\n- `tests/e2e/user_login.spec.ts`\n- `tests/e2e/user_switch.spec.ts`\n- `tests/e2e/user_password.spec.ts`\n- `tests/e2e/user_deletion.spec.ts`\n- `tests/e2e/user_persistence.spec.ts`\n\n**测试命令**：\n```bash\npnpm test:e2e user\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：集成测试环境\n\n结果：\n- user_onboarding.spec.ts：0
