ile content...\"\n  }\n}\n```\n\n**错误码**：\n- `1003007`：MCP 服务器不存在\n- `1003008`：MCP 未连接\n- `1003009`：工具不存在\n- `1003010`：调用失败\n- `1003011`：超时\n\n---\n\n#### 断开 MCP 连接\n\n```rust\n#[tauri::command]\nasync fn disconnect_mcp_server(\n    session_token: String,\n    server_id: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-003  \n**分支**：B03-13\n\n---\n\n#### 删除 MCP 服务器\n\n```rust\n#[tauri::command]\nasync fn delete_mcp_server(\n    session_token: String,\n    server_id: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-003  \n**分支**：B03-14\n\n---\n\n### 3.5 模块系统（V1-FR-004）\n\n#### 加载模块\n\n```rust\n#[tauri::command]\nasync fn load_module(\n    session_token: String,\n    manifest: ModuleManifest,\n) -> Result<LoadedModule>;\n```\n\n**引用**：V1-FR-004（模块系统与热更新）  \n**分支**：B04-01 ~ B04-04\n\n**请求**：\n```json\n{\n  \"module_id\": \"module-canvas\",\n  \"name\": \"Canvas\",\n  \"version\": \"1.0.0\",\n  \"entry_point\": \"http://localhost:3001/remoteEntry.js\",\n  \"permissions\": [\"provider_access\", \"file_read\"]\n}\n```\n\n**错误码**：\n- `1004001`：模块 ID 重复\n- `1004002`：Manifest 无效\n- `1004003`：依赖缺失\n- `1004004`：版本冲突\n- `1004005`：加载失败\n\n---\n\n#### 卸载模块\n\n```rust\n#[tauri::command]\nasync fn unload_module(\n    session_token: String,\n    module_id: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-004  \n**分支**：B04-05 ~ B04-07\n\n---\n\n#### 重载模块\n\n```rust\n#[tauri::command]\nasync fn reload_module(\n    session_token: String,\n    module_id: String,\n) -> Result<LoadedModule>;\n```\n\n**引用**：V1-FR-004  \n**分支**：B04-08 ~ B04-11\n\n---\n\n#### 获取已安装模块列表\n\n```rust\n#[tauri::command]\nasync fn list_installed_modules(\n    session_token: String,\n) -> Result<Vec<InstalledModule>>;\n```\n\n**引用**：V1-FR-004\n\n**响应**：\n```json\n[\n  {\n    \"id\": \"uuid\",\n    \"module_id\": \"module-canvas\",\n    \"name\": \"Canvas\",\n    \"version\": \"1.0.0\",\n    \"enabled\": true,\n    \"installed_at\": \"2024-01-01T00:00:00Z\"\n  }\n]\n```\n\n---\n\n#### 启用/禁用模块\n\n```rust\n#[tauri::command]\nasync fn toggle_module(\n    session_token: String,\n    module_id: String,\n    enabled: bool,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-004\n\n---\n\n#### 获取模块崩溃日志\n\n```rust\n#[tauri::command]\nasync fn list_module_crash_logs(\n    session_token: String,\n    module_id: Option<String>,\n    limit: Option<usize>,\n) -> Result<Vec<CrashLog>>;\n```\n\n**引用**：V1-FR-004\n\n---\n\n### 3.6 权限管理（V1-FR-009）\n\n#### 检查权限\n\n```rust\n#[tauri::command]\nasync fn check_permission(\n    session_token: String,\n    module_id: String,\n    permission_type: String,\n) -> Result<bool>;\n```\n\n**引用**：V1-FR-009（模块权限管理）  \n**分支**：B09-01 ~ B09-04\n\n---\n\n#### 授予权限\n\n```rust\n#[tauri::command]\nasync fn grant_permission(\n    session_token: String,\n    module_id: String,\n    permission_type: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-009  \n**分支**：B09-05 ~ B09-07\n\n**错误码**：\n- `1009001`：模块不存在\n- `1009002`：权限类型无效\n\n---\n\n#### 撤销权限\n\n```rust\n#[tauri::command]\nasync fn revoke_permission(\n    session_token: String,\n    module_id: String,\n    permission_type: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-009  \n**分支**：B09-08 ~ B09-10\n\n---\n\n#### 获取模块权限列表\n\n```rust\n#[tauri::command]\nasync fn list_module_permissions(\n    session_token: String,\n    module_id: String,\n) -> Result<Vec<Permission>>;\n```\n\n**引用**：V1-FR-009\n\n**响应**：\n```json\n[\n  {\n    \"permission_type\": \"provider_access\",\n    \"granted\": true,\n    \"granted_at\": \"2024-01-01T00:00:00Z\"\n  },\n  {\n    \"permission_type\": \"file_write\",\n    \"granted\": false,\n    \"granted_at\": null\n  }\n]\n```\n\n---\n\n#### 获取权限日志\n\n```rust\n#[tauri::command]\nasync fn list_permission_logs(\n    session_token: String,\n    module_id: Option<String>,\n    limit: Option<usize>,\n) -> Result<Vec<PermissionLog>>;\n```\n\n**引用**：V1-FR-009  \n**分支**：B09-11\n\n---\n\n### 3.7 AI 工作台（V1-FR-006）\n\n#### 创建会话\n\n```rust\n#[tauri::command]\nasync fn create_chat_session(\n    session_token: String,\n    title: Option<String>,\n) -> Result<ChatSession>;\n```\n\n**引用**：V1-FR-006（AI 工作台）  \n**分支**：B06-01 ~ B06-03\n\n**响应**：\n```json\n{\n  \"id\": \"uuid\",\n  \"title\": \"New Chat\",\n  \"created_at\": \"2024-01-01T00:00:00Z\"\n}\n```\n\n---\n\n#### 获取会话列表\n\n```rust\n#[tauri::command]\nasync fn list_chat_sessions(\n    session_token: String,\n) -> Result<Vec<ChatSession>>;\n```\n\n**引用**：V1-FR-006\n\n---\n\n#### 获取会话消息\n\n```rust\n#[tauri::command]\nasync fn list_chat_messages(\n    session_token: String,\n    session_id: String,\n    limit: Option<usize>,\n) -> Result<Vec<ChatMessage>>;\n```\n\n**引用**：V1-FR-006\n\n---\n\n#### 发送消息（同步）\n\n```rust\n#[tauri::command]\nasync fn send_chat_message(\n    session_token: String,\n    session_id: String,\n    content: String,\n) -> Result<ChatMessage>;\n```\n\n**引用**：V1-FR-006  \n**分支**：B06-04 ~ B06-06\n\n---\n\n#### 发送消息（流式）\n\n```rust\n#[tauri::command]\nasync fn send_chat_message_stream(\n    session_token: String,\n    session_id: String,\n    content: String,\n) -> Result<String>; // 返回 message_id\n```\n\n**引用**：V1-FR-006  \n**分支**：B06-07 ~ B06-11\n\n**说明**：\n- 返回 `message_id`\n- 前端通过事件监听接收增量响应\n- 事件名：`chat_stream_{message_id}`\n\n---\n\n#### 删除会话\n\n```rust\n#[tauri::command]\nasync fn delete_chat_session(\n    session_token: String,\n    session_id: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-006\n\n---\n\n#### 更新会话配置\n\n```rust\n#[tauri::command]\nasync fn update_chat_session_config(\n    session_token: String,\n    session_id: String,\n    provider_id: Option<String>,\n    enabled_skills: Option<Vec<String>>,\n    enabled_mcp_servers: Option<Vec<String>>,\n    system_prompt: Option<String>,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-006\n\n---\n\n### 3.8 局域网协同（V1-FR-010）\n\n#### 启动局域网服务\n\n```rust\n#[tauri::command]\nasync fn start_lan_server(\n    session_token: String,\n    port: Option<u16>,\n) -> Result<ServerInfo>;\n```\n\n**引用**：V1-FR-010（局域网协同）  \n**分支**：B10-01 ~ B10-06\n\n**响应**：\n```json\n{\n  \"enabled\": true,\n  \"port\": 3000,\n  \"lan_ip\": \"192.168.1.100\",\n  \"access_url\": \"http://192.168.1.100:3000\",\n  \"access_token\": \"uuid\",\n  \"qr_code\": \"data:image/png;base64,...\"\n}\n```\n\n**错误码**：\n- `1010001`：启动失败\n- `1010002`：无可用端口\n- `1010003`：无网络连接\n\n---\n\n#### 停止局域网服务\n\n```rust\n#[tauri::command]\nasync fn stop_lan_server(\n    session_token: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-010\n\n---\n\n#### 获取局域网服务状态\n\n```rust\n#[tauri::command]\nasync fn get_lan_server_status(\n    session_token: String,\n) -> Result<ServerStatus>;\n```\n\n**引用**：V1-FR-010\n\n**响应**：\n```json\n{\n  \"running\": true,\n  \"port\": 3000,\n  \"connected_devices\": 2\n}\n```\n\n---\n\n#### 获取已连接设备\n\n```rust\n#[tauri::command]\nasync fn list_lan_devices(\n    session_token: String,\n) -> Result<Vec<Device>>;\n```\n\n**引用**：V1-FR-010\n\n**响应**：\n```json\n[\n  {\n    \"id\": \"uuid\",\n    \"name\": \"iPhone\",\n    \"ip\": \"192.168.1.101\",\n    \"user_id\": \"uuid\",\n    \"connected_at\": \"2024-01-01T00:00:00Z\",\n    \"last_active_at\": \"2024-01-01T01:00:00Z\"\n  }\n]\n```\n\n---\n\n#### 断开设备\n\n```rust\n#[tauri::command]\nasync fn disconnect_lan_device(\n    session_token: String,\n    device_id: String,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-010\n\n---\n\n#### 获取访问 Token\n\n```rust\n#[tauri::command]\nasync fn get_lan_access_token(\n    session_token: String,\n) -> Result<String>;\n```\n\n**引用**：V1-FR-010\n\n---\n\n#### 重新生成访问 Token\n\n```rust\n#[tauri::command]\nasync fn regenerate_lan_access_token(\n    session_token: String,\n) -> Result<String>;\n```\n\n**引用**：V1-FR-010\n\n---\n\n### 3.9 系统配置\n\n#### 获取配置\n\n```rust\n#[tauri::command]\nasync fn get_app_config(\n    key: String,\n) -> Result<serde_json::Value>;\n```\n\n**引用**：V1-FR-007（系统设置）\n\n---\n\n#### 设置配置\n\n```rust\n#[tauri::command]\nasync fn set_app_config(\n    session_token: String,\n    key: String,\n    value: serde_json::Value,\n) -> Result<()>;\n```\n\n**引用**：V1-FR-007\n\n---\n\n## 4. HTTP API（局域网）\n\n### 4.1 认证\n\n#### 验证访问 Token\n\n```\nPOST /api/v1/auth/verify\n```\n\n**引用**：V1-FR-010  \n**分支**：B10-07 ~ B10-10\n\n**请求**：\n```json\n{\n  \"access_token\": \"uuid\"\n}\n```\n\n**响应**：\n```json\n{\n  \"valid\": true,\n  \"users\": [\n    {\n      \"id\": \"uuid\",\n      \"username\": \"alice\"\n    }\n  ]\n}\n```\n\n---\n\n#### 用户登录\n\n```\nPOST /api/v1/auth/login\n```\n\n**引用**：V1-FR-010\n\n**请求**：\n```json\n{\n  \"username\": \"alice\",\n  \"password\": \"password\"\n}\n```\n\n**响应**：\n```json\n{\n  \"session_token\": \"uuid\",\n  \"user\": {\n    \"id\": \"uuid\",\n    \"username\": \"alice\"\n  }\n}\n```\n\n---\n\n### 4.2 Provider\n\n所有 Provider 相关的 Tauri Commands 都映射为 HTTP API：\n\n```\nGET    /api/v1/providers\nPOST   /api/v1/providers\nGET    /api/v1/providers/:id\nPUT    /api/v1/providers/:id\nDELETE /api/v1/providers/:id\nPOST   /api/v1/providers/:id/test\nGET    /api/v1/providers/:id/models\nPOST   /api/v1/providers/:id/sync-models\nPOST   /api/v1/providers/:id/call\nPOST   /api/v1/providers/:id/call/stream (WebSocket)\n```\n\n---\n\n### 4.3 Skills\n\n```\nGET    /api/v1/skills/registry\nGET    /api/v1/skills/installed\nPOST   /api/v1/skills/install\nDELETE /api/v1/skills/:id\nPUT    /api/v1/skills/:id/toggle\nPOST   /api/v1/skills/:id/call\n```\n\n---\n\n### 4.4 MCP\n\n```\nGET    /api/v1/mcp/servers\nPOST   /api/v1/mcp/servers\nDELETE /api/v1/mcp/servers/:id\nPOST   /api/v1/mcp/servers/:id/connect\nPOST   /api/v1/mcp/servers/:id/disconnect\nGET    /api/v1/mcp/servers/:id/tools\nPOST   /api/v1/mcp/tools/call\n```\n\n---\n\n### 4.5 Chat\n\n```\nGET    /api/v1/chat/sessions\nPOST   /api/v1/chat/sessions\nDELETE /api/v1/chat/sessions/:id\nGET    /api/v1/chat/sessions/:id/messages\nPOST   /api/v1/chat/send\nWS     /api/v1/chat/stream (WebSocket)\n```\n\n**引用**：V1-FR-006  \n**分支**：B10-15 ~ B10-19\n\n---\n\n## 5. 错误响应格式\n\n### 5.1 统一错误格式\n\n所有错误响应遵循统一格式：\n\n```json\n{\n  \"error\": {\n    \"code\": \"1001001\",\n    \"message\": \"Provider 名称重复\",\n    \"details\": {\n      \"field\": \"name\",\n      \"value\": \"OpenAI\"\n    }\n  }\n}\n```\n\n### 5.2 HTTP 状态码映射\n\n| 错误类型 | HTTP 状态码 |\n|---------|-----------|\n| 参数错误 | 400 Bad Request |\n| 未认证 | 401 Unauthorized |\n| 无权限 | 403 Forbidden |\n| 资源不存在 | 404 Not Found |\n| 资源冲突 | 409 Conflict |\n| 上游错误 | 502 Bad Gateway |\n| 超时 | 504 Gateway Timeout |\n| 服务器错误 | 500 Internal Server Error |\n\n---\n\n## 6. 事件系统（Tauri）\n\n### 6.1 流式响应事件\n\n**Provider 流式响应**：\n```rust\n// 事件名\nlet event_name = format!(\"provider_stream_{}\", stream_id);\n\n// 事件数据\n{\n  \"type\": \"chunk\",\n  \"content\": \"累计内容\",\n  \"delta\": \"增量内容\"\n}\n\n{\n  \"type\": \"done\",\n  \"usage\": {...}\n}\n\n{\n  \"type\": \"error\",\n  \"error\": {...}\n}\n```\n\n**Chat 流式响应**：\n```rust\n// 事件名\nlet event_name = format!(\"chat_stream_{}\", message_id);\n\n// 事件数据（同上）\n```\n\n---\n\n### 6.2 系统事件\n\n**模块崩溃**：\n```rust\napp.emit_all(\"module_crashed\", {\n  \"module_id\": \"module-canvas\",\n  \"error\": \"...\"\n});\n```\n\n**MCP 连接状态变化**：\n```rust\napp.emit_all(\"mcp_connection_changed\", {\n  \"server_id\": \"uuid\",\n  \"connected\": false\n});\n```\n\n---\n\n## 7. 接口版本与兼容性\n\n### 7.1 版本策略\n\n**V1 阶段**：\n- 所有接口 URL：`/api/v1/*`\n- 不引入 Breaking Changes\n- 废弃接口标记 `@deprecated`，至少保留一个版本\n\n**V2 阶段**（未来）：\n- 新增 `/api/v2/*`\n- V1 接口继续支持\n\n### 7.2 废弃流程\n\n1. **标记废弃**：在文档中标记 `@deprecated`\n2. **添加警告**：接口返回 `X-Deprecated: true` Header\n3. **通知用户**：前端显示废弃提示\n4. **迁移期**：至少保留一个版本\n5. **删除**：在下一个大版本中删除\n\n---\n\n## 8. 性能要求\n\n### 8.1 响应时间\n\n| 接口类型 | P95 目标 |\n|---------|---------|\n| 查询接口（list/get） | < 100ms |\n| 创建/更新接口 | < 200ms |\n| 删除接口 | < 100ms |\n| 外部调用（Provider/Skills/MCP） | < 5s（上游决定） |\n\n### 8.2 并发支持\n\n| 场景 | 目标 |\n|------|------|\n| 本地桌面端 | 单用户，并发 10+ 请求 |\n| 局域网模式 | 10+ 设备同时使用 |\n\n---\n\n## 9. 安全要求\n\n### 9.1 认证\n\n**Tauri Commands**：\n- 所有需要用户上下文的接口都需要 `session_token`\n- 中间件验证 token，注入 `user_id`\n\n**HTTP API**：\n- 所有接口（除 `/api/v1/auth/verify`）都需要 `Authorization: Bearer {session_token}` Header\n- 中间件验证 token，注入 `user_id`\n\n### 9.2 权限检查\n\n参见\"2.2 权限检查分层\"。\n\n### 9.3 数据隔离\n\n所有业务逻辑层查询都必须加上 `WHERE user_id = ?`，确保用户只能访问自己的数据。\n\n---\n\n## 10. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n|------|---------|--------|\n| 2024-01-XX | 初始版本，定义所有 V1 接口 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成  \n**下次更新**：接口变更时同步更新\n", "doc-033": "# V1 数据模型\n\n## 1. 文档目标\n\n本文档定义 DGOS V1 的完整数据模型，包括所有数据表、字段、约束、关系和迁移策略。\n\n**权威性**：\n- ✅ 数据模型的唯一权威来源\n- ✅ 所有功能规格引用此文档\n- ✅ 开发前必须 Review\n\n**更新原则**：\n- 新增表/字段：先更新此文档，再修改代码\n- 字段修改：记录迁移路径\n- 删除字段：标记为 deprecated，至少保留一个版本\n\n---\n\n## 2. 数据库选型\n\n| 项目 | 选择 | 版本 | 理由 |\n|------|------|------|------|\n| **数据库** | SQLite | 3.45+ | 本地优先、零配置、单文件 |\n| **ORM** | SeaORM | 0.12+ | 类型安全、异步、迁移工具 |\n| **迁移工具** | SeaORM Migration | - | 与 ORM 集成 |\n\n**并发策略**：\n- 事务隔离级别：`SERIALIZABLE`（SQLite 默认）\n- 唯一约束：防止重复数据\n- 乐观锁：关键资源使用 `updated_at` 版本检查\n- 不使用悲观锁：并发量小，不需要\n\n---\n\n## 3. 核心实体\n\n### 3.1 用户管理（V1-FR-008）\n\n#### users（用户）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| username | TEXT | UNIQUE, NOT NULL | 用户名（4-20 字符） |\n| password_hash | TEXT | NOT NULL | bcrypt 哈希（cost=12） |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| last_login_at | TIMESTAMP | NULL | 最后登录时间 |\n\n**索引**：\n```sql\nCREATE UNIQUE INDEX idx_users_username ON users(username);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE users (\n    id TEXT PRIMARY KEY,\n    username TEXT UNIQUE NOT NULL,\n    password_hash TEXT NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    last_login_at TIMESTAMP,\n    CHECK(length(username) >= 4 AND length(username) <= 20)\n);\n```\n\n**并发安全**：\n- 用户名唯一约束防止重复注册\n- 密码哈希在业务层完成（bcrypt）\n\n---\n\n#### sessions（会话）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| session_token | TEXT | UNIQUE, NOT NULL | 会话 token（UUID） |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| expires_at | TIMESTAMP | NOT NULL | 过期时间（7 天后） |\n\n**索引**：\n```sql\nCREATE UNIQUE INDEX idx_sessions_token ON sessions(session_token);\nCREATE INDEX idx_sessions_user ON sessions(user_id);\nCREATE INDEX idx_sessions_expires ON sessions(expires_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE sessions (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    session_token TEXT UNIQUE NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    expires_at TIMESTAMP NOT NULL,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\n**数据隔离**：\n- 所有业务表都有 `user_id` 字段\n- 中间件检查确保用户只能访问自己的数据\n\n---\n\n### 3.2 Provider 管理（V1-FR-001）\n\n#### providers（Provider 配置）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| name | TEXT | NOT NULL | Provider 名称 |\n| provider_type | TEXT | NOT NULL | 类型（openai-compatible） |\n| base_url | TEXT | NOT NULL | API 基础地址 |\n| api_key | TEXT | NOT NULL | API Key（加密存储） |\n| enabled | BOOLEAN | DEFAULT true | 是否启用 |\n| sort_order | INTEGER | DEFAULT 0 | 排序权重（数字越小越靠前） |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_providers_user ON providers(user_id);\nCREATE INDEX idx_providers_enabled ON providers(user_id, enabled);\nCREATE INDEX idx_providers_sort ON providers(user_id, sort_order);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE providers (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    name TEXT NOT NULL,\n    provider_type TEXT NOT NULL,\n    base_url TEXT NOT NULL,\n    api_key TEXT NOT NULL,\n    enabled BOOLEAN DEFAULT true,\n    sort_order INTEGER DEFAULT 0,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(user_id, name)\n);\n```\n\n**并发安全**：\n- 唯一约束：`(user_id, name)` 防止同一用户重复创建\n- 乐观锁：更新前检查 `updated_at`\n\n---\n\n#### models（模型列表）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| provider_id | TEXT | NOT NULL, FK → providers.id | 所属 Provider |\n| model_id | TEXT | NOT NULL | 模型 ID（如 gpt-4） |\n| model_name | TEXT | NOT NULL | 模型显示名称 |\n| capabilities | TEXT | NOT NULL | 能力标签（JSON 数组：[\"text\", \"image\"]） |\n| synced_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 同步时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_models_provider ON models(provider_id);\nCREATE UNIQUE INDEX idx_models_provider_model ON models(provider_id, model_id);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE models (\n    id TEXT PRIMARY KEY,\n    provider_id TEXT NOT NULL,\n    model_id TEXT NOT NULL,\n    model_name TEXT NOT NULL,\n    capabilities TEXT NOT NULL,\n    synced_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE CASCADE,\n    UNIQUE(provider_id, model_id)\n);\n```\n\n---\n\n#### provider_usage_logs（使用记录）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| provider_id | TEXT | NOT NULL, FK → providers.id | Provider ID |\n| model_id | TEXT | NOT NULL | 模型 ID |\n| request_tokens | INTEGER | NULL | 请求 token 数 |\n| response_tokens | INTEGER | NULL | 响应 token 数 |\n| latency_ms | INTEGER | NULL | 延迟（毫秒） |\n| success | BOOLEAN | NOT NULL | 是否成功 |\n| error_code | TEXT | NULL | 错误码 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 调用时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_provider_usage_user ON provider_usage_logs(user_id, created_at);\nCREATE INDEX idx_provider_usage_provider ON provider_usage_logs(provider_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE provider_usage_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    provider_id TEXT NOT NULL,\n    model_id TEXT NOT NULL,\n    request_tokens INTEGER,\n    response_tokens INTEGER,\n    latency_ms INTEGER,\n    success BOOLEAN NOT NULL,\n    error_code TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    FOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE CASCADE\n);\n```\n\n---\n\n### 3.3 Skills 管理（V1-FR-002）\n\n#### skill_registry_cache（Skills 注册表缓存）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| skill_id | TEXT | UNIQUE, NOT NULL | Skill ID（全局唯一） |\n| name | TEXT | NOT NULL | Skill 名称 |\n| version | TEXT | NOT NULL | 版本号 |\n| description | TEXT | NULL | 描述 |\n| category | TEXT | NULL | 分类 |\n| endpoint_type | TEXT | NOT NULL | 类型（http, cli） |\n| cached_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 缓存时间 |\n\n**索引**：\n```sql\nCREATE UNIQUE INDEX idx_skill_registry_skill_id ON skill_registry_cache(skill_id);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE skill_registry_cache (\n    id TEXT PRIMARY KEY,\n    skill_id TEXT UNIQUE NOT NULL,\n    name TEXT NOT NULL,\n    version TEXT NOT NULL,\n    description TEXT,\n    category TEXT,\n    endpoint_type TEXT NOT NULL,\n    cached_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n```\n\n---\n\n#### installed_skills（已安装 Skills）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| skill_id | TEXT | NOT NULL | Skill ID |\n| name | TEXT | NOT NULL | Skill 名称 |\n| version | TEXT | NOT NULL | 版本号 |\n| endpoint_type | TEXT | NOT NULL | 类型（http, cli） |\n| endpoint_config | TEXT | NOT NULL | 端点配置（JSON） |\n| enabled | BOOLEAN | DEFAULT true | 是否启用 |\n| installed_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 安装时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_installed_skills_user ON installed_skills(user_id);\nCREATE UNIQUE INDEX idx_installed_skills_user_skill ON installed_skills(user_id, skill_id);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE installed_skills (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    skill_id TEXT NOT NULL,\n    name TEXT NOT NULL,\n    version TEXT NOT NULL,\n    endpoint_type TEXT NOT NULL,\n    endpoint_config TEXT NOT NULL,\n    enabled BOOLEAN DEFAULT true,\n    installed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(user_id, skill_id)\n);\n```\n\n**并发安全**：\n- 唯一约束：`(user_id, skill_id)` 防止重复安装\n- 乐观锁：更新前检查 `updated_at`\n\n---\n\n#### skill_usage_logs（Skills 使用记录）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| skill_id | TEXT | NOT NULL | Skill ID |\n| latency_ms | INTEGER | NULL | 延迟（毫秒） |\n| success | BOOLEAN | NOT NULL | 是否成功 |\n| error_code | TEXT | NULL | 错误码 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 调用时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_skill_usage_user ON skill_usage_logs(user_id, created_at);\nCREATE INDEX idx_skill_usage_skill ON skill_usage_logs(skill_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE skill_usage_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    skill_id TEXT NOT NULL,\n    latency_ms INTEGER,\n    success BOOLEAN NOT NULL,\n    error_code TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\n---\n\n### 3.4 MCP 管理（V1-FR-003）\n\n#### mcp_servers（MCP 服务器）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| name | TEXT | NOT NULL | 服务器名称 |\n| connection_type | TEXT | NOT NULL | 连接类型（stdio, http） |\n| connection_config | TEXT | NOT NULL | 连接配置（JSON） |\n| connected | BOOLEAN | DEFAULT false | 连接状态 |\n| last_connected_at | TIMESTAMP | NULL | 最后连接时间 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_mcp_servers_user ON mcp_servers(user_id);\nCREATE UNIQUE INDEX idx_mcp_servers_user_name ON mcp_servers(user_id, name);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE mcp_servers (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    name TEXT NOT NULL,\n    connection_type TEXT NOT NULL,\n    connection_config TEXT NOT NULL,\n    connected BOOLEAN DEFAULT false,\n    last_connected_at TIMESTAMP,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(user_id, name)\n);\n```\n\n---\n\n#### mcp_tools（MCP 工具）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| server_id | TEXT | NOT NULL, FK → mcp_servers.id | 所属服务器 |\n| tool_name | TEXT | NOT NULL | 工具名称 |\n| description | TEXT | NULL | 描述 |\n| input_schema | TEXT | NOT NULL | 输入 Schema（JSON） |\n| synced_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 同步时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_mcp_tools_server ON mcp_tools(server_id);\nCREATE UNIQUE INDEX idx_mcp_tools_server_tool ON mcp_tools(server_id, tool_name);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE mcp_tools (\n    id TEXT PRIMARY KEY,\n    server_id TEXT NOT NULL,\n    tool_name TEXT NOT NULL,\n    description TEXT,\n    input_schema TEXT NOT NULL,\n    synced_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id) ON DELETE CASCADE,\n    UNIQUE(server_id, tool_name)\n);\n```\n\n---\n\n#### mcp_connection_logs（连接日志）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| server_id | TEXT | NOT NULL, FK → mcp_servers.id | 服务器 ID |\n| event | TEXT | NOT NULL | 事件（connected, disconnected, error） |\n| message | TEXT | NULL | 消息 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_mcp_connection_logs_user ON mcp_connection_logs(user_id, created_at);\nCREATE INDEX idx_mcp_connection_logs_server ON mcp_connection_logs(server_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE mcp_connection_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    server_id TEXT NOT NULL,\n    event TEXT NOT NULL,\n    message TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id) ON DELETE CASCADE\n);\n```\n\n---\n\n#### mcp_tool_usage_logs（工具使用记录）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| server_id | TEXT | NOT NULL, FK → mcp_servers.id | 服务器 ID |\n| tool_name | TEXT | NOT NULL | 工具名称 |\n| latency_ms | INTEGER | NULL | 延迟（毫秒） |\n| success | BOOLEAN | NOT NULL | 是否成功 |\n| error_code | TEXT | NULL | 错误码 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 调用时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_mcp_tool_usage_user ON mcp_tool_usage_logs(user_id, created_at);\nCREATE INDEX idx_mcp_tool_usage_tool ON mcp_tool_usage_logs(server_id, tool_name, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE mcp_tool_usage_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    server_id TEXT NOT NULL,\n    tool_name TEXT NOT NULL,\n    latency_ms INTEGER,\n    success BOOLEAN NOT NULL,\n    error_code TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id) ON DELETE CASCADE\n);\n```\n\n---\n\n### 3.5 模块系统（V1-FR-004）\n\n#### installed_modules（已安装模块）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| module_id | TEXT | NOT NULL | 模块 ID |\n| name | TEXT | NOT NULL | 模块名称 |\n| version | TEXT | NOT NULL | 版本号 |\n| entry_point | TEXT | NOT NULL | 入口点 URL |\n| manifest | TEXT | NOT NULL | Manifest 配置（JSON） |\n| enabled | BOOLEAN | DEFAULT true | 是否启用 |\n| installed_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 安装时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_installed_modules_user ON installed_modules(user_id);\nCREATE UNIQUE INDEX idx_installed_modules_user_module ON installed_modules(user_id, module_id);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE installed_modules (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    module_id TEXT NOT NULL,\n    name TEXT NOT NULL,\n    version TEXT NOT NULL,\n    entry_point TEXT NOT NULL,\n    manifest TEXT NOT NULL,\n    enabled BOOLEAN DEFAULT true,\n    installed_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(user_id, module_id)\n);\n```\n\n---\n\n#### module_crash_logs（崩溃日志）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| module_id | TEXT | NOT NULL | 模块 ID |\n| error_message | TEXT | NOT NULL | 错误消息 |\n| stack_trace | TEXT | NULL | 堆栈跟踪 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_module_crash_logs_user ON module_crash_logs(user_id, created_at);\nCREATE INDEX idx_module_crash_logs_module ON module_crash_logs(module_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE module_crash_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    module_id TEXT NOT NULL,\n    error_message TEXT NOT NULL,\n    stack_trace TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\n---\n\n#### module_update_history（更新历史）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| module_id | TEXT | NOT NULL | 模块 ID |\n| from_version | TEXT | NOT NULL | 旧版本 |\n| to_version | TEXT | NOT NULL | 新版本 |\n| success | BOOLEAN | NOT NULL | 是否成功 |\n| error_message | TEXT | NULL | 错误消息 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_module_update_history_user ON module_update_history(user_id, updated_at);\nCREATE INDEX idx_module_update_history_module ON module_update_history(module_id, updated_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE module_update_history (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    module_id TEXT NOT NULL,\n    from_version TEXT NOT NULL,\n    to_version TEXT NOT NULL,\n    success BOOLEAN NOT NULL,\n    error_message TEXT,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\n---\n\n### 3.6 权限管理（V1-FR-009）\n\n#### module_permissions（模块权限）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| module_id | TEXT | NOT NULL | 模块 ID |\n| permission_type | TEXT | NOT NULL | 权限类型 |\n| granted | BOOLEAN | DEFAULT false | 是否授予 |\n| granted_at | TIMESTAMP | NULL | 授予时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**权限类型**（V1 粗粒度）：\n- `provider_access`：访问 Provider\n- `skills_access`：访问 Skills\n- `mcp_access`：访问 MCP\n- `file_read`：读取文件系统\n- `file_write`：写入文件系统\n- `network`：访问网络\n\n**索引**：\n```sql\nCREATE INDEX idx_module_permissions_user ON module_permissions(user_id);\nCREATE INDEX idx_module_permissions_module ON module_permissions(module_id);\nCREATE UNIQUE INDEX idx_module_permissions_unique ON module_permissions(user_id, module_id, permission_type);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE module_permissions (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    module_id TEXT NOT NULL,\n    permission_type TEXT NOT NULL,\n    granted BOOLEAN DEFAULT false,\n    granted_at TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(user_id, module_id, permission_type),\n    CHECK(permission_type IN ('provider_access', 'skills_access', 'mcp_access', 'file_read', 'file_write', 'network'))\n);\n```\n\n---\n\n#### permission_logs（权限日志）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| module_id | TEXT | NOT NULL | 模块 ID |\n| permission_type | TEXT | NOT NULL | 权限类型 |\n| action | TEXT | NOT NULL | 动作（granted, revoked, checked, denied） |\n| resource | TEXT | NULL | 资源标识（如 provider_id） |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_permission_logs_user ON permission_logs(user_id, created_at);\nCREATE INDEX idx_permission_logs_module ON permission_logs(module_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE permission_logs (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    module_id TEXT NOT NULL,\n    permission_type TEXT NOT NULL,\n    action TEXT NOT NULL,\n    resource TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    CHECK(action IN ('granted', 'revoked', 'checked', 'denied'))\n);\n```\n\n---\n\n### 3.7 AI 工作台（V1-FR-006）\n\n#### chat_sessions（会话）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| user_id | TEXT | NOT NULL, FK → users.id | 所属用户 |\n| title | TEXT | NOT NULL | 会话标题 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_chat_sessions_user ON chat_sessions(user_id, updated_at DESC);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE chat_sessions (\n    id TEXT PRIMARY KEY,\n    user_id TEXT NOT NULL,\n    title TEXT NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n);\n```\n\n---\n\n#### chat_messages（消息）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| session_id | TEXT | NOT NULL, FK → chat_sessions.id | 所属会话 |\n| role | TEXT | NOT NULL | 角色（user, assistant, system） |\n| content | TEXT | NOT NULL | 消息内容 |\n| provider_id | TEXT | NULL, FK → providers.id | 使用的 Provider |\n| model_id | TEXT | NULL | 使用的模型 |\n| token_count | INTEGER | NULL | Token 数量 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_chat_messages_session ON chat_messages(session_id, created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE chat_messages (\n    id TEXT PRIMARY KEY,\n    session_id TEXT NOT NULL,\n    role TEXT NOT NULL,\n    content TEXT NOT NULL,\n    provider_id TEXT,\n    model_id TEXT,\n    token_count INTEGER,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (session_id) REFERENCES chat_sessions(id) ON DELETE CASCADE,\n    FOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE SET NULL,\n    CHECK(role IN ('user', 'assistant', 'system'))\n);\n```\n\n---\n\n#### chat_session_config（会话配置）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| session_id | TEXT | UNIQUE, NOT NULL, FK → chat_sessions.id | 所属会话 |\n| provider_id | TEXT | NULL, FK → providers.id | 默认 Provider |\n| enabled_skills | TEXT | NULL | 启用的 Skills（JSON 数组） |\n| enabled_mcp_servers | TEXT | NULL | 启用的 MCP 服务器（JSON 数组） |\n| system_prompt | TEXT | NULL | 系统提示词 |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**索引**：\n```sql\nCREATE UNIQUE INDEX idx_chat_session_config_session ON chat_session_config(session_id);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE chat_session_config (\n    id TEXT PRIMARY KEY,\n    session_id TEXT UNIQUE NOT NULL,\n    provider_id TEXT,\n    enabled_skills TEXT,\n    enabled_mcp_servers TEXT,\n    system_prompt TEXT,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (session_id) REFERENCES chat_sessions(id) ON DELETE CASCADE,\n    FOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE SET NULL\n);\n```\n\n---\n\n### 3.8 系统设置（V1-FR-007）\n\n#### app_config（应用配置）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| key | TEXT | PK | 配置键 |\n| value | TEXT | NOT NULL | 配置值（JSON） |\n| updated_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 更新时间 |\n\n**完整定义**：\n```sql\nCREATE TABLE app_config (\n    key TEXT PRIMARY KEY,\n    value TEXT NOT NULL,\n    updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\n-- 预设配置\nINSERT INTO app_config (key, value) VALUES ('theme', '\"light\"');\nINSERT INTO app_config (key, value) VALUES ('font_size', '14');\nINSERT INTO app_config (key, value) VALUES ('last_user', 'null');\n```\n\n---\n\n### 3.9 局域网协同（V1-FR-010）\n\n#### lan_sessions（局域网会话）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| session_token | TEXT | UNIQUE, NOT NULL | 会话 token |\n| device_name | TEXT | NULL | 设备名称 |\n| device_ip | TEXT | NOT NULL | 设备 IP |\n| user_id | TEXT | NULL, FK → users.id | 登录的用户 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n| last_active_at | TIMESTAMP | NULL | 最后活跃时间 |\n| expires_at | TIMESTAMP | NULL | 过期时间 |\n\n**索引**：\n```sql\nCREATE UNIQUE INDEX idx_lan_sessions_token ON lan_sessions(session_token);\nCREATE INDEX idx_lan_sessions_ip ON lan_sessions(device_ip);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE lan_sessions (\n    id TEXT PRIMARY KEY,\n    session_token TEXT UNIQUE NOT NULL,\n    device_name TEXT,\n    device_ip TEXT NOT NULL,\n    user_id TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    last_active_at TIMESTAMP,\n    expires_at TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL\n);\n```\n\n---\n\n#### lan_config（局域网配置）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| key | TEXT | PK | 配置键 |\n| value | TEXT | NOT NULL | 配置值 |\n\n**完整定义**：\n```sql\nCREATE TABLE lan_config (\n    key TEXT PRIMARY KEY,\n    value TEXT NOT NULL\n);\n\n-- 预设配置\nINSERT INTO lan_config (key, value) VALUES ('enabled', 'false');\nINSERT INTO lan_config (key, value) VALUES ('port', '3000');\nINSERT INTO lan_config (key, value) VALUES ('access_token', '');\n```\n\n---\n\n#### lan_activity_logs（活动日志）\n\n| 字段 | 类型 | 约束 | 说明 |\n|------|------|------|------|\n| id | TEXT | PK | UUID |\n| session_id | TEXT | NULL, FK → lan_sessions.id | 会话 ID |\n| device_ip | TEXT | NOT NULL | 设备 IP |\n| action | TEXT | NOT NULL | 动作 |\n| endpoint | TEXT | NULL | 访问的端点 |\n| created_at | TIMESTAMP | DEFAULT CURRENT_TIMESTAMP | 创建时间 |\n\n**索引**：\n```sql\nCREATE INDEX idx_lan_activity_logs_time ON lan_activity_logs(created_at);\n```\n\n**完整定义**：\n```sql\nCREATE TABLE lan_activity_logs (\n    id TEXT PRIMARY KEY,\n    session_id TEXT,\n    device_ip TEXT NOT NULL,\n    action TEXT NOT NULL,\n    endpoint TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (session_id) REFERENCES lan_sessions(id) ON DELETE SET NULL\n);\n```\n\n---\n\n## 4. 实体关系图（ERD）\n\n```mermaid\nerDiagram\n    users ||--o{ sessions : \"has many\"\n    users ||--o{ providers : \"has many\"\n    users ||--o{ installed_skills : \"has many\"\n    users ||--o{ mcp_servers : \"has many\"\n    users ||--o{ installed_modules : \"has many\"\n    users ||--o{ module_permissions : \"has many\"\n    users ||--o{ chat_sessions : \"has many\"\n    \n    providers ||--o{ models : \"has many\"\n    providers ||--o{ provider_usage_logs : \"logs\"\n    \n    installed_skills ||--o{ skill_usage_logs : \"logs\"\n    \n    mcp_servers ||--o{ mcp_tools : \"has many\"\n    mcp_servers ||--o{ mcp_connection_logs : \"logs\"\n    mcp_servers ||--o{ mcp_tool_usage_logs : \"logs\"\n    \n    installed_modules ||--o{ module_crash_logs : \"logs\"\n    installed_modules ||--o{ module_update_history : \"history\"\n    installed_modules ||--o{ module_permissions : \"permissions\"\n    \n    module_permissions ||--o{ permission_logs : \"logs\"\n    \n    chat_sessions ||--o{ chat_messages : \"has many\"\n    chat_sessions ||--|| chat_session_config : \"config\"\n    \n    lan_sessions ||--o{ lan_activity_logs : \"logs\"\n```\n\n---\n\n## 5. 数据隔离策略\n\n### 5.1 多用户隔离\n\n**原则**：所有业务表都有 `user_id` 字段，确保数据隔离。\n\n**表分类**：\n- ✅ **用户数据表**：有 `user_id`，需要隔离\n  - providers, installed_skills, mcp_servers, installed_modules\n  - module_permissions, chat_sessions, chat_messages\n  - 所有 usage_logs, permission_logs\n  \n- ✅ **共享数据表**：无 `user_id`，全局共享\n  - skill_registry_cache（Skills 注册表）\n  - models（模型列表，属于 Provider）\n  - mcp_tools（工具列表，属于 MCP 服务器）\n  - app_config, lan_config（全局配置）\n\n**中间件检查**：\n```rust\n// 每个请求都检查 user_id\npub async fn ensure_user_access(\n    user_id: &str,\n    resource_user_id: &str,\n) -> Result<()> {\n    if user_id != resource_user_id {\n        return Err(Error::Unauthorized);\n    }\n    Ok(())\n}\n```\n\n---\n\n### 5.2 级联删除\n\n**用户删除**：\n```sql\n-- 删除用户时，自动删除所有关联数据\nFOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE\n```\n\n**Provider 删除**：\n```sql\n-- 删除 Provider 时，自动删除模型列表和使用记录\nFOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE CASCADE\n```\n\n**会话删除**：\n```sql\n-- 删除会话时，自动删除所有消息\nFOREIGN KEY (session_id) REFERENCES chat_sessions(id) ON DELETE CASCADE\n```\n\n---\n\n## 6. 迁移策略\n\n### 6.1 迁移文件命名\n\n```\nserver/migration/\n  src/\n    m20240101_000001_create_users.rs\n    m20240101_000002_create_sessions.rs\n    m20240101_000003_create_providers.rs\n    m20240101_000004_create_models.rs\n    m20240101_000005_create_installed_skills.rs\n    m20240101_000006_create_mcp_servers.rs\n    m20240101_000007_create_mcp_tools.rs\n    m20240101_000008_create_installed_modules.rs\n    m20240101_000009_create_module_permissions.rs\n    m20240101_000010_create_chat_sessions.rs\n    m20240101_000011_create_chat_messages.rs\n    m20240101_000012_create_lan_sessions.rs\n    m20240101_000013_create_app_config.rs\n    m20240101_000014_create_logs_tables.rs\n    lib.rs\n```\n\n### 6.2 迁移顺序\n\n1. **基础表**（无依赖）\n   - users\n   - app_config, lan_config\n\n2. **核心资源表**（依赖 users）\n   - sessions\n   - providers\n   - installed_skills\n   - mcp_servers\n   - installed_modules\n   - chat_sessions\n\n3. **关联表**（依赖核心资源）\n   - models（依赖 providers）\n   - mcp_tools（依赖 mcp_servers）\n   - module_permissions（依赖 installed_modules）\n   - chat_messages（依赖 chat_sessions）\n   - chat_session_config（依赖 chat_sessions）\n\n4. **日志表**（依赖所有资源）\n   - 所有 usage_logs\n   - 所有 crash_logs\n   - 所有 connection_logs\n   - permission_logs\n   - lan_activity_logs\n\n### 6.3 迁移命令\n\n```bash\n# 创建新迁移\ncd server\nsea-orm-cli migrate generate create_users\n\n# 运行迁移\ncargo run -- migrate up\n\n# 回滚迁移\ncargo run -- migrate down\n\n# 重置数据库（危险！）\ncargo run -- migrate fresh\n```\n\n---\n\n## 7. 索引策略\n\n### 7.1 索引原则\n\n- ✅ **主键**：所有表都有 `id` 主键\n- ✅ **唯一约束**：防止重复数据（username, provider name, skill_id）\n- ✅ **外键**：加速 JOIN 查询\n- ✅ **复合索引**：高频查询（user_id + created_at）\n- ❌ **过度索引**：避免影响写入性能\n\n### 7.2 索引汇总\n\n| 表 | 索引类型 | 字段 | 理由 |\n|----|---------|------|------|\n| users | UNIQUE | username | 防止重复注册 |\n| sessions | UNIQUE | session_token | 快速验证 token |\n| sessions | INDEX | user_id | 查询用户会话 |\n| providers | UNIQUE | (user_id, name) | 防止重复创建 |\n| providers | INDEX | (user_id, enabled) | 查询可用 Provider |\n| installed_skills | UNIQUE | (user_id, skill_id) | 防止重复安装 |\n| mcp_servers | UNIQUE | (user_id, name) | 防止重复创建 |\n| installed_modules | UNIQUE | (user_id, module_id) | 防止重复安装 |\n| module_permissions | UNIQUE | (user_id, module_id, permission_type) | 防止重复授权 |\n| chat_messages | INDEX | (session_id, created_at) | 加载历史消息 |\n| *_usage_logs | INDEX | (user_id, created_at) | 查询使用记录 |\n\n---\n\n## 8. 性能优化\n\n### 8.1 查询优化\n\n**分页查询**：\n```sql\n-- 使用索引 + LIMIT\nSELECT * FROM chat_messages\nWHERE session_id = ?\nORDER BY created_at DESC\nLIMIT 50;\n```\n\n**避免 N+1 查询**：\n```rust\n// 错误：N+1 查询\nfor provider in providers {\n    let models = get_models(provider.id); // N 次查询\n}\n\n// 正确：JOIN 查询\nSELECT providers.*, models.*\nFROM providers\nLEFT JOIN models ON providers.id = models.provider_id\nWHERE providers.user_id = ?;\n```\n\n### 8.2 数据库大小控制\n\n**日志清理**：\n```sql\n-- 定期清理旧日志（保留 30 天）\nDELETE FROM provider_usage_logs\nWHERE created_at < datetime('now', '-30 days');\n\nDELETE FROM skill_usage_logs\nWHERE created_at < datetime('now', '-30 days');\n\nDELETE FROM mcp_tool_usage_logs\nWHERE created_at < datetime('now', '-30 days');\n\nDELETE FROM permission_logs\nWHERE created_at < datetime('now', '-30 days');\n\nDELETE FROM lan_activity_logs\nWHERE created_at < datetime('now', '-30 days');\n```\n\n**VACUUM**：\n```sql\n-- 定期压缩数据库\nVACUUM;\n```\n\n---\n\n## 9. 并发安全\n\n### 9.1 事务隔离\n\n**SQLite 默认**：`SERIALIZABLE`\n\n**适用场景**：\n- 用户注册（用户 + 会话）\n- Provider 创建（Provider + 模型同步）\n- 模块安装（模块 + 权限）\n\n**示例**：\n```rust\nlet txn = db.begin().await?;\n\n// 创建用户\nlet user = users::ActiveModel {\n    id: Set(uuid::Uuid::new_v4().to_string()),\n    username: Set(username.clone()),\n    password_hash: Set(hash),\n    ..Default::default()\n};\nuser.insert(&txn).await?;\n\n// 创建会话\nlet session = sessions::ActiveModel {\n    id: Set(uuid::Uuid::new_v4().to_string()),\n    user_id: Set(user.id.clone()),\n    session_token: Set(token),\n    ..Default::default()\n};\nsession.insert(&txn).await?;\n\ntxn.commit().await?;\n```\n\n### 9.2 唯一约束\n\n**防止重复创建**：\n```sql\n-- 用户名唯一\nUNIQUE(username)\n\n-- 同一用户不能创建重名 Provider\nUNIQUE(user_id, name)\n\n-- 同一用户不能重复安装同一 Skill\nUNIQUE(user_id, skill_id)\n\n-- 同一模块不能重复授予同一权限\nUNIQUE(user_id, module_id, permission_type)\n```\n\n### 9.3 乐观锁\n\n**适用场景**：\n- Provider 配置更新\n- Skill 配置更新\n- 模块配置更新\n\n**实现**：\n```rust\n// 更新前检查 updated_at\nlet provider = providers::Entity::find_by_id(id).one(&db).await?;\n\nif provider.updated_at != client_updated_at {\n    return Err(Error::Conflict(\"数据已被其他客户端修改\"));\n}\n\n// 更新\nlet mut provider: providers::ActiveModel = provider.into();\nprovider.name = Set(new_name);\nprovider.updated_at = Set(chrono::Utc::now().naive_utc());\nprovider.update(&db).await?;\n```\n\n---\n\n## 10. 备份与恢复\n\n### 10.1 备份策略\n\n**自动备份**：\n```bash\n# 每天备份一次\ncp ~/.dgos/dgos.db ~/.dgos/backups/dgos_$(date +%Y%m%d).db\n\n# 保留最近 7 天\nfind ~/.dgos/backups -name \"dgos_*.db\" -mtime +7 -delete\n```\n\n**手动备份**：\n```bash\n# 备份到指定位置\nsqlite3 ~/.dgos/dgos.db \".backup '/path/to/backup.db'\"\n```\n\n### 10.2 恢复策略\n\n**从备份恢复**：\n```bash\n# 停止应用\n# 恢复数据库\ncp ~/.dgos/backups/dgos_20240101.db ~/.dgos/dgos.db\n# 启动应用\n```\n\n---\n\n## 11. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n|------|---------|--------|\n| 2024-01-XX | 初始版本，创建完整数据模型 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成  \n**下次更新**：Schema 变更时同步更新\n", "doc-034": "# V1 错误码\n\n## 1. 文档目标\n\n本文档汇总 DGOS V1 的所有错误码，确保全局唯一、语义清晰、易于维护。\n\n**权威性**：\n- ✅ 错误码的唯一权威来源\n- ✅ 前端国际化的依据\n- ✅ 日志分析和监控的基础\n\n**更新原则**：\n- 新增错误码：先分配编号，再编码\n- 错误码一旦分配，永不修改、永不复用\n- 废弃错误码：标记 `@deprecated`，保留在文档中\n\n---\n\n## 2. 错误码规范\n\n### 2.1 编码规则\n\n**格式**：7 位数字 `FFMMEEE`\n\n- `FF`（2 位）：功能编号（01-10）\n- `MM`（2 位）：模块编号（00-99）\n- `EEE`（3 位）：错误序号（001-999）\n\n**示例**：\n- `1001001`：Provider 适配框架（01）的第 1 个错误\n- `1008005`：用户管理（08）的第 5 个错误\n\n### 2.2 功能编号映射\n\n| 功能编号 | 功能名称 | 功能 ID |\n|---------|---------|---------|\n| 01 | Provider 适配框架 | V1-FR-001 |\n| 02 | Skills 管理系统 | V1-FR-002 |\n| 03 | MCP 管理系统 | V1-FR-003 |\n| 04 | 模块系统与热更新 | V1-FR-004 |\n| 05 | 统一设计系统 | V1-FR-005 |\n| 06 | AI 工作台 | V1-FR-006 |\n| 07 | 系统设置 | V1-FR-007 |\n| 08 | 本地用户管理 | V1-FR-008 |\n| 09 | 模块权限管理 | V1-FR-009 |\n| 10 | 局域网协同 | V1-FR-010 |\n\n---\n\n## 3. 错误码列表\n\n### 3.1 Provider 适配框架（01）\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 | HTTP 状态码 |\n|--------|---------|------|-------------|-----------|\n| 1001001 | provider_not_found | Provider 不存在 | 检查 Provider ID | 404 |\n| 1001002 | model_not_found | 模型不存在 | 检查模型 ID 或同步模型列表 | 404 |\n| 1001003 | invalid_api_key | API Key 无效 | 检查 API Key 是否正确 | 401 |\n| 1001004 | provider_call_failed | Provider 调用失败 | 检查网络或 Provider 状态 | 502 |\n| 1001005 | provider_timeout | Provider 调用超时 | 稍后重试或更换 Provider | 504 |\n| 1001006 | invalid_provider_type | Provider 类型不支持 | 检查类型是否为 openai-compatible | 400 |\n| 1001007 | duplicate_provider_name | Provider 名称重复 | 使用不同的名称 | 409 |\n| 1001008 | invalid_base_url | base_url 格式错误 | 检查 URL 格式 | 400 |\n| 1001009 | model_sync_failed | 模型同步失败 | 检查 Provider 连接 | 502 |\n| 1001010 | stream_error | 流式响应错误 | 重试或使用同步调用 | 500 |\n| 1001011 | provider_disabled | Provider 已禁用 | 启用 Provider 后重试 | 403 |\n| 1001012 | provider_update_conflict | Provider 更新冲突 | 刷新后重试 | 409 |\n| 1001013 | upstream_rate_limit | 上游速率限制 | 稍后重试 | 429 |\n| 1001014 | upstream_server_error | 上游服务器错误 | 稍后重试或联系 Provider | 502 |\n\n**来源功能**：V1-FR-001（Provider 适配框架）\n\n---\n\n### 3.2 Skills 管理系统（02）\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 | HTTP 状态码 |\n|--------|---------|------|-------------|-----------|\n| 1002001 | skill_not_found | Skill 不存在 | 检查 Skill ID | 404 |\n| 1002002 | skill_not_installed | Skill 未安装 | 先安装 Skill | 404 |\n| 1002003 | skill_already_installed | Skill 已安装 | 直接使用或先卸载 | 409 |\n| 1002004 | skill_disabled | Skill 已禁用 | 启用 Skill 后重试 | 403 |\n| 1002005 | skill_install_failed | Skill 安装失败 | 检查配置或网络 | 500 |\n| 1002006 | skill_call_failed | Skill 调用失败 | 检查 Skill 状态或配置 | 502 |\n| 1002007 | skill_timeout | Skill 调用超时 | 稍后重试 | 504 |\n| 1002008 | invalid_skill_config | Skill 配置无效 | 检查配置格式 | 400 |\n| 1002009 | skill_endpoint_error | Skill 端点错误 | 检查 URL 或命令 | 400 |\n| 1002010 | registry_fetch_failed | 获取 Skills 列表失败 | 检查网络连接 | 502 |\n| 1002011 | duplicate_skill | Skill 重复 | 使用不同的 Skill ID | 409 |\n| 1002012 | skill_uninstall_failed | Skill 卸载失败 | 稍后重试 | 500 |\n| 1002013 | skill_update_failed | Skill 更新失败 | 稍后重试 | 500 |\n| 1002014 | skill_version_conflict | Skill 版本冲突 | 卸载后重新安装 | 409 |\n\n**来源功能**：V1-FR-002（Skills 管理系统）\n\n---\n\n### 3.3 MCP 管理系统（03）\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 | HTTP 状态码 |\n|--------|---------|------|-------------|-----------|\n| 1003001 | mcp_server_not_found | MCP 服务器不存在 | 检查服务器 ID | 404 |\n| 1003002 | mcp_not_connected | MCP 未连接 | 先连接 MCP 服务器 | 503 |\n| 1003003 | mcp_connection_failed | MCP 连接失败 | 检查配置或 MCP 状态 | 502 |\n| 1003004 | mcp_tool_not_found | MCP 工具不存在 | 检查工具名称或同步 | 404 |\n| 1003005 | mcp_tool_call_failed | MCP 工具调用失败 | 检查参数或 MCP 状态 | 502 |\n| 1003006 | mcp_timeout | MCP 调用超时 | 稍后重试 | 504 |\n| 1003007 | invalid_mcp_config | MCP 配置无效 | 检查连接配置 | 400 |\n| 1003008 | duplicate_mcp_server | MCP 服务器名称重复 | 使用不同的名称 | 409 |\n| 1003009 | mcp_connection_type_unsupported | 连接类型不支持 | 使用 stdio 或 http | 400 |\n| 1003010 | mcp_protocol_error | MCP 协议错误 | 检查 MCP 版本兼容性 | 502 |\n| 1003011 | mcp_tool_sync_failed | 工具列表同步失败 | 重新连接 | 502 |\n| 1003012 | mcp_disconnection_failed | MCP 断开失败 | 稍后重试 | 500 |\n| 1003013 | mcp_reconnection_failed | MCP 重连失败 | 检查 MCP 状态 | 502 |\n\n**来源功能**：V1-FR-003（MCP 管理系统）\n\n---\n\n### 3.4 模块系统与热更新（04）\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 | HTTP 状态码 |\n|--------|---------|------|-------------|-----------|\n| 1004001 | module_not_found | 模块不存在 | 检查模块 ID | 404 |\n| 1004002 | module_already_loaded | 模块已加载 | 直接使用或先卸载 | 409 |\n| 1004003 | module_load_failed | 模块加载失败 | 检查 manifest 或入口点 | 500 |\n| 1004004 | invalid_manifest | Manifest 无效 | 检查 manifest 格式 | 400 |\n| 1004005 | module_dependency_missing | 模块依赖缺失 | 安装依赖模块 | 400 |\n| 1004006 | module_version_conflict | 模块版本冲突 | 解决版本冲突 | 409 |\n| 1004007 | module_unload_failed | 模块卸载失败 | 稍后重试 | 500 |\n| 1004008 | module_reload_failed | 模块重载失败 | 稍后重试或重启应用 | 500 |\n| 1004009 | module_disabled | 模块已禁用 | 启用模块后重试 | 403 |\n| 1004010 | module_crashed | 模块崩溃 | 查看崩溃日志或重载 | 500 |\n| 1004011 | module_isolation_violated | 模块隔离冲突 | 检查模块 ID 或命名空间 | 409 |\n| 1004012 | entry_point_not_found | 入口点不存在 | 检查 entry_point 配置 | 404 |\n| 1004013 | module_update_failed | 模块更新失败 | 稍后重试 | 500 |\n| 1004014 | duplicate_module | 模块 ID 重复 | 使用不同的模块 ID | 409 |\n\n**来源功能**：V1-FR-004（模块系统与热更新）\n\n---\n\n### 3.5 统一设计系统（05）\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 | HTTP 状态码 |\n|--------|---------|------|-------------|-----------|\n| 1005001 | theme_not_found | 主题不存在 | 检查主题名称 | 404 |\n| 1005002 | invalid_theme_config | 主题配置无效
