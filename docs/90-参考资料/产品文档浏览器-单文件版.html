  <script>
    // DGOS 文档浏览器数据（完整内嵌版）
    window.DGOS_DOC_BROWSER_DATA = {"doc-001": "# Git 提交信息规范\n\n本文档定义 DGOS 项目的 Git 提交信息规范，遵循 [Conventional Commits](https://www.conventionalcommits.org/) 标准。\n\n---\n\n## 1. 提交信息格式\n\n### 1.1 基本格式\n\n```\n<类型>(<范围>): <简短描述>\n\n[可选的详细描述]\n\n[可选的页脚]\n```\n\n**示例**：\n```\nfeat(providers): add retry mechanism for provider calls\n\nImplement exponential backoff retry for 429 and 5xx errors.\nRetry up to 3 times with delays of 1s, 2s, 4s.\n\nCloses #123\n```\n\n### 1.2 格式说明\n\n| 部分 | 必需 | 说明 |\n|------|------|------|\n| **类型** | ✅ | 提交类型（feat、fix 等） |\n| **范围** | ⚠️ | 影响的模块或功能（可选但推荐） |\n| **简短描述** | ✅ | 一句话说明（不超过 72 字符） |\n| **详细描述** | ❌ | 详细说明（可选） |\n| **页脚** | ❌ | 关联 Issue、破坏性变更（可选） |\n\n---\n\n## 2. 提交类型\n\n### 2.1 标准类型\n\n| 类型 | 说明 | 示例 |\n|------|------|------|\n| **feat** | 新功能 | `feat(skills): add skill installation UI` |\n| **fix** | 修复 Bug | `fix(providers): handle null response from API` |\n| **docs** | 文档更新 | `docs: update README with setup instructions` |\n| **style** | 代码格式（不影响功能） | `style: format code with rustfmt` |\n| **refactor** | 重构（不改变功能） | `refactor(mcp): simplify connection logic` |\n| **perf** | 性能优化 | `perf(providers): cache model list for 24h` |\n| **test** | 测试相关 | `test(modules): add unit tests for loader` |\n| **build** | 构建系统或依赖 | `build: upgrade tauri to 2.1.0` |\n| **ci** | CI/CD 配置 | `ci: add rust clippy check` |\n| **chore** | 其他杂项 | `chore: update dependencies` |\n\n### 2.2 类型选择指南\n\n**新增功能** → `feat`\n- 新增 API 接口\n- 新增 UI 组件\n- 新增配置项\n\n**修复问题** → `fix`\n- 修复崩溃\n- 修复逻辑错误\n- 修复 UI 显示问题\n\n**代码重构** → `refactor`\n- 提取公共函数\n- 简化逻辑\n- 改善代码结构\n\n**性能优化** → `perf`\n- 减少内存占用\n- 加快响应速度\n- 优化数据库查询\n\n**文档更新** → `docs`\n- 更新 README\n- 更新功能规格\n- 更新注释\n\n---\n\n## 3. 范围（Scope）\n\n### 3.1 后端范围\n\n| 范围 | 说明 | 示例 |\n|------|------|------|\n| `providers` | Provider 适配框架 | `feat(providers): add Claude adapter` |\n| `skills` | Skills 管理系统 | `fix(skills): handle skill timeout` |\n| `mcp` | MCP 管理系统 | `feat(mcp): add heartbeat detection` |\n| `modules` | 模块系统 | `refactor(modules): improve loader` |\n| `auth` | 认证与权限 | `fix(auth): validate JWT expiry` |\n| `db` | 数据库相关 | `feat(db): add providers table migration` |\n\n### 3.2 前端范围\n\n| 范围 | 说明 | 示例 |\n|------|------|------|\n| `ui` | 设计系统组件 | `feat(ui): add Button component` |\n| `workbench` | AI 工作台 | `fix(workbench): stream rendering issue` |\n| `settings` | 系统设置 | `feat(settings): add provider management` |\n| `canvas` | 无限画布 | `feat(canvas): add zoom controls` |\n\n### 3.3 通用范围\n\n| 范围 | 说明 | 示例 |\n|------|------|------|\n| `docs` | 文档 | `docs(docs): update architecture diagram` |\n| `build` | 构建配置 | `build(deps): upgrade react to 18.3` |\n| `ci` | CI/CD | `ci: add E2E test workflow` |\n| `test` | 测试 | `test(providers): add integration tests` |\n\n---\n\n## 4. 简短描述\n\n### 4.1 编写规则\n\n- ✅ 使用祈使句（\"add\" 而非 \"added\"）\n- ✅ 首字母小写\n- ✅ 不超过 72 字符\n- ✅ 不以句号结尾\n- ✅ 描述\"做什么\"而非\"怎么做\"\n\n### 4.2 好的示例\n\n```\n✅ feat(providers): add retry mechanism\n✅ fix(skills): handle timeout errors\n✅ docs: update installation guide\n✅ refactor(mcp): simplify connection logic\n✅ perf(db): add index on provider_id\n```\n\n### 4.3 不好的示例\n\n```\n❌ feat(providers): Added retry mechanism.        # 使用了过去式，有句号\n❌ fix(skills): Fix the bug                       # 太模糊\n❌ docs: Updated the documentation for installation  # 太长（>72字符）\n❌ refactor: Changed some code in MCP              # 不清楚改了什么\n❌ I fixed a bug                                   # 没有类型和范围\n```\n\n---\n\n## 5. 详细描述\n\n### 5.1 何时需要详细描述\n\n- 复杂的功能实现\n- 重要的 Bug 修复\n- 破坏性变更\n- 需要解释的设计决策\n\n### 5.2 详细描述格式\n\n```\nfeat(providers): add retry mechanism\n\nImplement exponential backoff retry for provider calls:\n- Retry on 429 (rate limit) and 5xx errors\n- Max 3 retries with delays: 1s, 2s, 4s\n- Do not retry on 4xx errors (except 429)\n\nThis improves reliability when provider APIs are temporarily unavailable.\n\nRefs: #123\n```\n\n### 5.3 编写要点\n\n- 空一行后开始详细描述\n- 说明\"为什么\"要做这个改动\n- 列出关键实现点\n- 提及相关的 Issue 或 PR\n\n---\n\n## 6. 页脚（Footer）\n\n### 6.1 关闭 Issue\n\n```\nCloses #123\nCloses #123, #456\nFixes #789\nResolves #999\n```\n\n### 6.2 关联 Issue\n\n```\nRefs #123\nRelated to #456\nSee also #789\n```\n\n### 6.3 破坏性变更\n\n```\nBREAKING CHANGE: remove deprecated API endpoint /v1/old\n\nThe old endpoint has been removed. Use /v2/new instead.\n\nMigration guide: docs/migrations/v2.md\n```\n\n---\n\n## 7. 完整示例\n\n### 7.1 简单功能\n\n```\nfeat(ui): add dark mode toggle\n```\n\n### 7.2 Bug 修复\n\n```\nfix(providers): handle null response from OpenAI API\n\nWhen the API returns null instead of error object,\nthe app crashes. This fix checks for null before parsing.\n\nFixes #234\n```\n\n### 7.3 重构\n\n```\nrefactor(modules): extract common loader logic\n\nMove duplicate loader code into shared utility function.\nThis reduces code duplication and improves maintainability.\n\nNo functional changes.\n```\n\n### 7.4 破坏性变更\n\n```\nfeat(auth)!: change JWT token expiry to 24h\n\nBREAKING CHANGE: JWT token expiry changed from 7 days to 24h\n\nUsers will need to re-login more frequently for security.\nUpdate your client code to handle token refresh.\n\nCloses #567\n```\n\n---\n\n## 8. 分支命名规范\n\n### 8.1 分支类型\n\n| 类型 | 格式 | 示例 |\n|------|------|------|\n| 功能 | `feature/<name>` | `feature/provider-retry` |\n| 修复 | `fix/<name>` | `fix/skill-timeout` |\n| 重构 | `refactor/<name>` | `refactor/mcp-connection` |\n| 文档 | `docs/<name>` | `docs/update-readme` |\n| 测试 | `test/<name>` | `test/provider-integration` |\n\n### 8.2 命名要点\n\n- 使用小写字母和连字符\n- 简短且描述性\n- 与 Issue 编号关联：`feature/123-provider-retry`\n\n---\n\n## 9. PR 标题规范\n\nPR 标题遵循与提交信息相同的格式：\n\n```\nfeat(providers): add retry mechanism\nfix(skills): handle timeout errors\ndocs: update installation guide\n```\n\n### 9.1 PR 描述模板\n\n```markdown\n## 概述\n简短描述这个 PR 做了什么\n\n## 变更内容\n- 新增了 XXX 功能\n- 修复了 XXX 问题\n- 重构了 XXX 模块\n\n## 测试\n- [ ] 单元测试通过\n- [ ] 集成测试通过\n- [ ] 手动测试通过\n\n## 关联 Issue\nCloses #123\n\n## 截图（如果有 UI 变更）\n![screenshot](url)\n\n## 检查清单\n- [ ] 代码通过 lint 检查\n- [ ] 添加了必要的测试\n- [ ] 更新了相关文档\n- [ ] 通过了 CI 检查\n```\n\n---\n\n## 10. 工具支持\n\n### 10.1 使用 commitizen\n\n安装 commitizen 辅助提交：\n\n```bash\n# 全局安装\nnpm install -g commitizen cz-conventional-changelog\n\n# 在项目根目录初始化\ncommitizen init cz-conventional-changelog --save-dev --save-exact\n\n# 使用 git cz 代替 git commit\ngit add .\ngit cz\n```\n\n### 10.2 使用 commitlint\n\n验证提交信息格式：\n\n```bash\n# 安装\nnpm install --save-dev @commitlint/{config-conventional,cli}\n\n# 配置\necho \"module.exports = {extends: ['@commitlint/config-conventional']}\" > commitlint.config.js\n\n# 添加 Git hook\nnpx husky add .husky/commit-msg 'npx --no -- commitlint --edit \"$1\"'\n```\n\n### 10.3 VS Code 扩展\n\n推荐扩展：\n- **Conventional Commits**: 自动补全提交类型\n- **GitLens**: 查看提交历史\n\n---\n\n## 11. 常见错误\n\n### 11.1 错误示例与修正\n\n| 错误 | 问题 | 正确 |\n|------|------|------|\n| `Added new feature` | 缺少类型和范围 | `feat(providers): add retry mechanism` |\n| `fix: bug fix` | 描述太模糊 | `fix(skills): handle timeout errors` |\n| `feat(providers): Added retry.` | 过去式 + 句号 | `feat(providers): add retry mechanism` |\n| `Update docs` | 缺少类型 | `docs: update installation guide` |\n| `fixed the thing` | 不规范 | `fix(module): describe what was fixed` |\n\n---\n\n## 12. 检查清单\n\n提交前检查：\n\n- [ ] 提交信息包含类型\n- [ ] 简短描述清晰且不超过 72 字符\n- [ ] 使用祈使句，首字母小写\n- [ ] 如果需要，添加了详细描述\n- [ ] 关联了相关 Issue\n- [ ] 破坏性变更标注了 BREAKING CHANGE\n\n---\n\n## 13. 参考资源\n\n- [Conventional Commits 官方规范](https://www.conventionalcommits.org/)\n- [Angular 提交信息规范](https://github.com/angular/angular/blob/main/CONTRIBUTING.md#commit)\n- [commitlint 文档](https://commitlint.js.org/)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：开发团队  \n**适用范围**：所有 DGOS 仓库\n", "doc-002": "# 项目概览导航\n\n- [项目首页与快速启动](../../README.md)\n- [工程与本地环境](工程与本地环境.md)\n- [Git 提交信息规范](Git提交信息规范.md)\n- [总体架构](../04-技术架构/总体架构.md)\n- [服务与领域边界](../04-技术架构/服务与领域边界.md)\n\n当前项目处于规格收敛阶段，底层框架搭建中；进入实现后再补充 Rust、前端和开发调试的详细说明。\n", "doc-003": "# 工程与本地环境\n\n本文档说明 DGOS 项目的环境要求、本地开发环境搭建、项目结构和常用开发命令。\n\n---\n\n## 1. 环境要求\n\n### 1.1 必需环境\n\n| 工具 | 版本要求 | 说明 |\n|------|---------|------|\n| **Rust** | 1.75+ | 后端开发语言 |\n| **Node.js** | 18+ | 前端构建工具 |\n| **pnpm** | 8+ | 前端包管理器 |\n| **操作系统** | macOS 12+ | V1.0 仅支持 macOS |\n\n### 1.2 可选环境\n\n| 工具 | 版本要求 | 用途 |\n|------|---------|------|\n| **Python** | 3.10+ | Skills 开发（可选） |\n| **Docker** | 20+ | 容器化测试（可选） |\n| **Git** | 2.30+ | 版本控制 |\n\n### 1.3 推荐工具\n\n- **IDE**: VS Code + Rust Analyzer\n- **终端**: iTerm2 / Warp\n- **Git 客户端**: GitHub Desktop / Tower\n\n---\n\n## 2. 本地开发环境搭建\n\n### 2.1 安装 Rust\n\n```bash\n# 安装 Rust 工具链\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh\n\n# 验证安装\nrustc --version\ncargo --version\n```\n\n### 2.2 安装 Node.js 和 pnpm\n\n```bash\n# 使用 Homebrew 安装 Node.js\nbrew install node\n\n# 安装 pnpm\nnpm install -g pnpm\n\n# 验证安装\nnode --version\npnpm --version\n```\n\n### 2.3 克隆项目\n\n```bash\n# 克隆仓库\ngit clone https://github.com/your-org/DG-OS.git\ncd DG-OS\n```\n\n### 2.4 安装依赖\n\n```bash\n# 安装后端依赖\ncd server\ncargo build\n\n# 安装前端依赖\ncd ../frontend\npnpm install\n```\n\n### 2.5 初始化数据库\n\n```bash\n# 运行数据库迁移\ncd server\ncargo run --bin migrate\n```\n\n### 2.6 启动开发环境\n\n```bash\n# 启动 Tauri 开发环境（会同时启动前端和后端）\ncd frontend\npnpm tauri dev\n```\n\n应用会自动打开，默认监听：\n- **前端开发服务器**: `http://localhost:5173`\n- **后端 API**: `http://localhost:3000`\n\n---\n\n## 3. 项目结构\n\n```\nDG-OS/\n├── server/                 # Rust 后端\n│   ├── crates/            # 功能模块\n│   │   ├── providers/     # Provider 适配框架\n│   │   ├── skills/        # Skills 管理系统\n│   │   ├── mcp/          # MCP 管理系统\n│   │   ├── modules/      # 模块系统\n│   │   └── auth/         # 认证系统\n│   ├── migrations/        # 数据库迁移\n│   └── Cargo.toml        # Rust 项目配置\n│\n├── frontend/              # React 前端\n│   ├── src/\n│   │   ├── components/   # 通用组件\n│   │   ├── modules/      # 业务模块\n│   │   ├── pages/        # 页面\n│   │   └── ui/           # 设计系统组件\n│   ├── public/           # 静态资源\n│   └── package.json      # Node.js 项目配置\n│\n├── docs/                  # 项目文档\n│   ├── 01-项目概览/\n│   ├── 02-产品与版本/\n│   ├── 03-功能规格/\n│   ├── 04-技术架构/\n│   └── 06-决策记录/\n│\n└── README.md             # 项目入口文档\n```\n\n### 3.1 后端模块说明\n\n| 模块 | 说明 | 主要文件 |\n|------|------|---------|\n| `providers` | Provider 适配框架 | `adapters/openai.rs` |\n| `skills` | Skills 管理系统 | `manager.rs`, `registry.rs` |\n| `mcp` | MCP 管理系统 | `client.rs`, `connection.rs` |\n| `modules` | 模块系统与热更新 | `loader.rs`, `registry.rs` |\n| `auth` | 用户认证与权限 | `jwt.rs`, `permissions.rs` |\n\n### 3.2 前端模块说明\n\n| 目录 | 说明 |\n|------|------|\n| `src/components/` | 通用 UI 组件（Button、Input 等） |\n| `src/modules/` | 业务模块（AI 工作台、系统设置等） |\n| `src/pages/` | 页面路由 |\n| `src/ui/` | 设计系统组件库 |\n\n---\n\n## 4. 常用开发命令\n\n### 4.1 后端开发\n\n```bash\n# 编译\ncd server\ncargo build\n\n# 运行（开发模式）\ncargo run\n\n# 运行测试\ncargo test\n\n# 运行特定包的测试\ncargo test -p dgos-providers\n\n# 代码检查\ncargo clippy\n\n# 格式化代码\ncargo fmt\n\n# 清理构建产物\ncargo clean\n```\n\n### 4.2 前端开发\n\n```bash\ncd frontend\n\n# 启动开发服务器\npnpm dev\n\n# 构建生产版本\npnpm build\n\n# 运行测试\npnpm test\n\n# 运行 E2E 测试\npnpm test:e2e\n\n# 代码检查\npnpm lint\n\n# 格式化代码\npnpm format\n\n# 类型检查\npnpm type-check\n```\n\n### 4.3 Tauri 开发\n\n```bash\ncd frontend\n\n# 启动 Tauri 开发环境\npnpm tauri dev\n\n# 构建桌面应用\npnpm tauri build\n\n# 查看 Tauri 信息\npnpm tauri info\n```\n\n### 4.4 数据库操作\n\n```bash\ncd server\n\n# 创建新迁移\ncargo run --bin migrate create <migration_name>\n\n# 运行所有迁移\ncargo run --bin migrate up\n\n# 回滚最后一次迁移\ncargo run --bin migrate down\n\n# 查看迁移状态\ncargo run --bin migrate status\n```\n\n---\n\n## 5. 开发工作流\n\n### 5.1 功能开发流程\n\n1. **创建分支**\n   ```bash\n   git checkout -b feature/provider-retry\n   ```\n\n2. **开发功能**\n   - 后端：在对应 crate 中开发\n   - 前端：在对应 module 中开发\n   - 测试：编写单元测试和集成测试\n\n3. **运行测试**\n   ```bash\n   # 后端测试\n   cd server && cargo test\n   \n   # 前端测试\n   cd frontend && pnpm test\n   ```\n\n4. **提交代码**\n   ```bash\n   git add .\n   git commit -m \"feat: add provider retry mechanism\"\n   ```\n\n5. **推送并创建 PR**\n   ```bash\n   git push origin feature/provider-retry\n   # 然后在 GitHub 创建 Pull Request\n   ```\n\n### 5.2 调试技巧\n\n#### 后端调试\n\n```bash\n# 启用详细日志\nRUST_LOG=debug cargo run\n\n# 使用 rust-lldb 调试\nrust-lldb target/debug/dgos\n```\n\n#### 前端调试\n\n- 使用 Chrome DevTools\n- React Developer Tools 扩展\n- 查看 Network 面板的 API 请求\n\n#### Tauri 调试\n\n```bash\n# 打开开发者工具\n# macOS: Cmd+Option+I\n# 查看 Tauri 日志：查看终端输出\n```\n\n---\n\n## 6. 常见问题\n\n### 6.1 Rust 编译失败\n\n**问题**：`cargo build` 失败\n\n**解决**：\n```bash\n# 更新 Rust 工具链\nrustup update\n\n# 清理并重新编译\ncargo clean\ncargo build\n```\n\n### 6.2 前端依赖安装失败\n\n**问题**：`pnpm install` 失败\n\n**解决**：\n```bash\n# 清理缓存\nrm -rf node_modules\npnpm store prune\n\n# 重新安装\npnpm install\n```\n\n### 6.3 Tauri 启动失败\n\n**问题**：`pnpm tauri dev` 失败\n\n**解决**：\n```bash\n# 检查 Xcode Command Line Tools\nxcode-select --install\n\n# 检查 Rust 目标\nrustup target add x86_64-apple-darwin\n```\n\n### 6.4 数据库迁移失败\n\n**问题**：迁移运行失败\n\n**解决**：\n```bash\n# 删除数据库文件（仅开发环境）\nrm ~/.dgos/data.db\n\n# 重新运行迁移\ncd server && cargo run --bin migrate up\n```\n\n---\n\n## 7. 性能优化\n\n### 7.1 Rust 编译优化\n\n在 `Cargo.toml` 中配置：\n\n```toml\n[profile.dev]\nopt-level = 1        # 轻度优化，加快编译\n\n[profile.release]\nopt-level = 3        # 完全优化\nlto = true          # 链接时优化\ncodegen-units = 1   # 更好的优化\n```\n\n### 7.2 前端构建优化\n\n```bash\n# 使用生产模式构建\npnpm build\n\n# 分析构建产物\npnpm build --analyze\n```\n\n---\n\n## 8. 开发规范\n\n### 8.1 代码规范\n\n- **Rust**: 遵循 `rustfmt` 和 `clippy` 规则\n- **TypeScript**: 遵循 ESLint 规则\n- **命名**: 使用语义化命名，避免缩写\n\n### 8.2 提交规范\n\n详见 [Git 提交信息规范](Git提交信息规范.md)\n\n### 8.3 文档规范\n\n- 每个功能必须有对应的功能规格文档\n- 重要决策必须记录到冻结决策文档\n- API 变更必须更新 OpenAPI 文档\n\n---\n\n## 9. 资源链接\n\n- [Rust 官方文档](https://doc.rust-lang.org/)\n- [Tauri 官方文档](https://tauri.app/)\n- [React 官方文档](https://react.dev/)\n- [SeaORM 文档](https://www.sea-ql.org/SeaORM/)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：开发团队  \n**反馈渠道**：GitHub Issues\n", "doc-004": "# 产品与版本导航\n\n## 全局规划\n\n- [产品蓝图](产品蓝图.md)\n- [版本路线图](版本路线图.md)\n- [功能演进矩阵](功能演进矩阵.md)\n- [版本进入开发门禁](版本进入开发门禁.md)\n\n## 当前版本\n\n- [V1 版本总览](当前版本/V1-版本总览.md)\n- [V1 产品需求](当前版本/V1-产品需求.md)\n- [V1 实现状态](当前版本/V1-实现状态.md)\n\n## 后续版本\n\n详见[版本路线图](版本路线图.md)和[功能演进矩阵](功能演进矩阵.md)。\n\nV1 完成后，再根据实际情况细化后续版本的详细规格。\n\n---\n\n**说明**：\n\n- **全局规划**：跨版本的产品规划和路线图\n- **当前版本**：V1 的详细规格和实现状态\n- **后续版本**：保持概要描述，避免过早设计\n\nV1 聚焦底层能力框架，无限画布分多版本实现；详细演进路径见版本路线图。\n", "doc-005": "# DGOS 产品需求文档 PRD\n\n## 1. 文档信息\n\n| 项目 | 内容 |\n| --- | --- |\n| 产品名称 | DGOS（Distributed General Operating System for AI） |\n| 产品定位 | 本地优先的 AI 应用开发框架 |\n| 文档类型 | 产品需求文档 PRD |\n| 文档版本 | v1.0 |\n| 编写日期 | 2024-01-XX |\n| 适用范围 | 项目规划、版本管理、研发排期、团队协作 |\n| 目标读者 | 产品、研发、测试、设计、运营、管理者 |\n| 产品形态 | Tauri 桌面应用 + 局域网 Web 端 + 应用模块系统 + 云端增强服务 |\n\n> 文档定位：本文件是跨版本产品蓝图，描述完整产品愿景、使命、核心价值和长期规划，不替代当前 V1 契约。当前 V1 的接口、数据和行为以[当前版本 V1 版本总览](当前版本/V1-版本总览.md)、[V1 接口契约](../04-技术架构/当前版本/V1-接口契约.md)、[V1 数据模型](../04-技术架构/当前版本/V1-数据模型.md)及对应功能主文档为准。\n\n## 2. 产品概述\n\n### 2.1 产品一句话\n\nDGOS 是一个**本地优先的 AI 应用开发框架**，提供统一的 Provider 适配、Skills/MCP 管理和可热更新的模块系统，让开发者能够快速构建可扩展的 AI 应用，让用户数据完全可控。\n\n### 2.2 产品使命\n\n**让每个人都能拥有自己的 AI 应用平台，数据主权完全掌握在自己手中。**\n\n我们相信：\n- AI 应用不应该被云端服务商锁定\n- 用户数据不应该被强制上传到云端\n- 开发者不应该重复造轮子（Provider 适配、模块管理）\n- 应用不应该因为架构问题而无法维护（避免单文件巨石）\n\n### 2.3 产品愿景\n\n**成为 AI 应用开发的标准框架，就像 React 之于 Web 应用、Electron 之于桌面应用。**\n\n**3 年目标（2027）**：\n- 开发者使用量：10,000+ 活跃开发者\n- 应用模块生态：1,000+ 第三方应用模块\n- 用户使用量：100,000+ 活跃用户\n- 成为 AI 应用开发的首选框架\n\n**核心价值主张**：\n1. **本地优先**：默认完全离线可用，云端为可选增强\n2. **强制模块化**：从架构层面避免代码腐化\n3. **开放生态**：应用模块可独立开发、热更新\n4. **数据主权**：用户数据完全可控，不被锁定\n\n### 2.4 我们不是什么\n\n明确边界，避免范围蔓延：\n\n- ❌ **不是操作系统**：不管理进程、文件系统、设备驱动\n- ❌ **不是 AI 模型训练平台**：只调用现有模型，不训练模型\n- ❌ **不是纯云端 SaaS**：本地优先，云端为可选增强\n- ❌ **不是 Low-Code 平台**：专注 AI 应用场景，不是通用开发平台\n- ❌ **不是办公套件**：不提供文档、表格、演示等功能\n- ❌ **不是项目管理工具**：不提供任务、看板、甘特图\n- ❌ **不是代码托管平台**：不提供 Git 服务器\n\n### 2.5 核心差异化\n\n| 对比维度 | DGOS | 云端 AI 平台 | 传统 IDE 插件 |\n| --- | --- | --- | --- |\n| **数据主权** | ✅ 本地优先，数据可控 | ❌ 数据必须上传 | ✅ 本地 |\n| **可扩展性** | ✅ 应用模块热更新 | ❌ 功能由平台控制 | ⚠️ 插件受 IDE 限制 |\n| **Provider 统一** | ✅ 统一适配层 | ⚠️ 各平台自己实现 | ❌ 无统一适配 |\n| **离线可用** | ✅ 完全离线 | ❌ 必须联网 | ✅ 离线 |\n| **跨应用共享** | ✅ Provider/Skills 共享 | ❌ 数据孤岛 | ❌ 仅 IDE 内 |\n| **应用生态** | ✅ 独立应用市场 | ⚠️ 受平台限制 | ⚠️ 受 IDE 限制 |\n\n## 3. 用户角色与场景\n\n### 3.1 核心用户角色\n\n| 角色 | 占比 | 核心需求 | 痛点 | DGOS 解决方案 |\n| --- | --- | --- | --- | --- |\n| **应用开发者** | 40% | 快速开发 AI 应用 | 需要自己对接各种模型 API | 统一 Provider 框架 |\n| **插件开发者** | 20% | 扩展功能模块 | 缺少标准化框架 | 模块系统 + 热更新 |\n| **最终用户** | 30% | 使用 AI 能力 | 工具分散、数据不互通 | 统一平台 + 数据主权 |\n| **企业管理员** | 5% | 统一管理团队资源 | 无法管控成本和权限 | 组织管理（V5） |\n| **集成者** | 5% | 接入新 Provider/Skills | 适配复杂 | 标准接口 + 文档 |\n\n### 3.2 核心用户故事\n\n#### 故事 1：应用开发者快速开发（P0）\n\n```\n作为一个应用开发者\n我想要基于 DGOS 框架快速开发一个 AI 代码审查工具\n这样我就不用自己处理 Provider 适配、模块管理等底层问题\n而可以专注于代码审查的业务逻辑\n\n验收标准：\n- 1 天内搭建起可运行的应用\n- 可调用任意已注册的 Provider\n- 可使用 Skills/MCP 能力\n- 应用可以打包发布到应用市场（V3）\n- 用户可以热更新我的应用\n\n价值：\n- 开发效率提升 10 倍（从 2 周到 1 天）\n- 无需关心底层适配\n- 自动获得所有 Provider 支持\n```\n\n#### 故事 2：最终用户本地使用（P0）\n\n```\n作为一个隐私敏感的用户\n我想要在本地使用 AI 工具，数据不上传云端\n但我也希望可以选择性地使用云端增强功能\n比如官方 Provider、跨设备同步等\n\n验收标准：\n- 默认完全本地运行，无需联网\n- 数据存储在我的电脑上（SQLite）\n- 可选绑定云端账号（V4）\n- 局域网内可以协同工作\n- 数据导出随时可以迁移\n\n价值：\n- 数据完全可控，不被锁定\n- 隐私得到保护\n- 灵活选择云端增强\n```\n\n#### 故事 3：插件开发者开发模块（P0）\n\n```\n作为一个插件开发者\n我想要开发一个新的功能模块（如无限画布）\n这样用户就可以通过应用市场安装我的模块\n而且我的模块可以独立迭代、热更新\n\n验收标准：\n- 模块代码独立仓库管理\n- 模块可以独立测试\n- 模块更新无需重启 DGOS\n- 模块可以声明所需权限\n- 用户可以评分和评论我的模块（V3）\n- 我可以查看下载统计（V3）\n\n价值：\n- 独立开发和发布\n- 快速迭代\n- 建立个人品牌\n- 可能获得收入（V4+）\n```\n\n#### 故事 4：企业管理员统一管理（V5）\n\n```\n作为一个企业管理员\n我想要统一管理团队的 AI 资源\n包括 Provider 配置、成员权限、用量统计\n这样可以控制成本、保证安全\n\n验收标准：\n- 创建组织并邀请成员\n- 配置组织级 Provider（团队共享）\n- 查看组织用量统计和账单\n- 设置成员权限（Owner、Admin、Member）\n- 审计日志（操作记录）\n\n价值：\n- 成本可控（统一配置、用量透明）\n- 安全可控（权限管理、审计日志）\n- 团队协作（共享配置、协同工作）\n```\n\n## 4. 核心功能与边界\n\n### 4.1 产品核心能力\n\n```\nDGOS 核心能力金字塔：\n\n         [应用模块生态]\n         AI 工作台、画布、\n         文件管理、代码助手...\n         ↑\n    [应用框架层]\n    模块加载器、路由、权限、设计系统\n         ↑\n    [底层能力层]\n    Provider 适配、Skills 管理、MCP 管理\n         ↑\n    [运行时层]\n    Tauri + SQLite + HTTP 服务\n```\n\n### 4.2 版本交付范围\n\n| 版本 | 业务目标 | 核心能力 | 预计时间 |\n| --- | --- | --- | --- |\n| **V1** | 打通底层框架闭环 | Provider/Skills/MCP 管理、模块系统、AI 工作台 | 3 个月 |\n| **V2** | 提供核心价值功能 | 无限画布完整版 | 2 个月 |\n| **V3** | 建立应用生态 | 应用市场完整版 | 2 个月 |\n| **V4** | 云端增强与协同 | 账号系统、官方 Provider、实时协同 | 3 个月 |\n| **V5** | 支持企业使用 | 组织管理、成员权限、企业账单 | 3 个月 |\n| **V6** | 扩展到移动端 | iOS/Android 应用 | 3 个月 |\n| **V7** | AI Agent 能力 | 自主任务、多 Agent 协作 | 4 个月 |\n| **V8** | 开发者生态 | 开发者门户、API 市场、SDK | 持续 |\n\n详见 [版本路线图](版本路线图.md)。\n\n### 4.3 永不做\n\n以下功能明确不在 DGOS 范围内，避免范围蔓延：\n\n| 功能 | 原因 |\n| --- | --- |\n| AI 模型训练或微调 | 专注调用现有模型，不做训练 |\n| 图片/视频编辑 | 只做 AI 生成，不做传统编辑 |\n| 文件管理 | 只做 AI 资产管理，不做通用文件管理器 |\n| 即时通讯 | 仅协同必需的实时通信，不做聊天软件 |\n| 办公套件 | 不做文档、表格、演示 |\n| 项目管理 | 不做任务、看板、甘特图 |\n| 代码托管 | 不做 Git 服务器 |\n\n## 5. 核心流程\n\n### 5.1 V1 最小用户旅程\n\n```\n新用户首次使用（10 分钟完成）：\n\n1. 下载 DGOS-v1.0.dmg\n2. 安装到应用程序文件夹\n3. 首次启动，创建本地用户\n4. 系统引导：添加 Provider\n5. 输入 OpenAI API Key\n6. 测试连接成功\n7. 进入 AI 工作台\n8. 输入提示词：\"写一个 Python 函数\"\n9. 查看流式响应结果\n10. 查看历史记录\n\n用户获得价值：\n✅ 可以立即使用 AI 能力\n✅ 数据存储在本地\n✅ 完全离线可用\n```\n\n### 5.2 V2 画布工作流\n\n```\n用户使用画布（V2）：\n\n1. 打开画布编辑器模块\n2. 创建新画布\n3. 添加节点：\n   - ImageNode（上传图片）\n   - PromptNode（输入提示词）\n   - LLMNode（选择 GPT-4）\n   - OutputNode（查看结果）\n4. 连接节点\n5. （可选）在 LLM 节点选择 Skill 增强\n6. 点击执行，实时查看结果\n7. 保存画布\n8. 导出工作流 JSON\n9. 分享给团队成员\n\n用户获得价值：\n✅ 可视化编排工作流\n✅ 复用和分享工作流\n✅ 团队协作更高效\n```\n\n### 5.3 V3 应用市场流程\n\n```\n开发者发布应用（V3）：\n\n1. 开发模块（遵循开发指南）\n2. 本地测试通过\n3. 打包模块（dgos build）\n4. 提交到应用市场\n5. 填写应用信息（名称、描述、截图）\n6. 等待审核\n7. 审核通过，应用上架\n8. 查看下载统计和用户评论\n\n用户安装应用（V3）：\n\n1. 打开应用市场\n2. 搜索\"代码审查助手\"\n3. 查看应用详情（截图、评分、评论）\n4. 点击安装\n5. 应用自动下载并安装\n6. 应用出现在侧边栏\n7. 打开应用使用\n8. 应用有更新时收到通知\n9. 点击更新（热重载，无需重启）\n\n生态价值：\n✅ 开发者可以独立发布应用\n✅ 用户可以方便地发现和安装应用\n✅ 应用可以独立迭代\n```\n\n### 5.4 V4 云端增强流程\n\n```\n用户使用云端功能（V4）：\n\n1. 注册云端账号\n2. 绑定本地用户到云端账号\n3. 选择使用官方 Provider（无需自己配置 API Key）\n4. 查看积分余额\n5. 调用模型（消耗积分）\n6. 充值积分（支付宝/微信支付）\n7. 查看用量统计和账单\n8. 在另一台电脑登录\n9. 自动同步已安装模块和配置\n10. 打开画布，邀请团队成员协同编辑\n11. 实时看到对方的操作和指针\n\n云端价值：\n✅ 无需自己配置 API Key\n✅ 跨设备数据同步\n✅ 实时协同编辑\n✅ 但仍然本地优先（可选功能）\n```\n\n## 6. 产品目标\n\n### 6.1 业务目标\n\n**V1 阶段（第 1 年）**：\n- 验证产品方向和技术架构\n- 建立开发者社区（100+ 活跃开发者）\n- 用户注册量 1,000+\n- 日活用户 50+\n- 至少 3 个官方应用模块\n- 完成 V1-V3 交付\n\n**V2-V4 阶段（第 2 年）**：\n- 建立应用生态（100+ 第三方应用）\n- 开发者数量 1,000+\n- 用户注册量 10,000+\n- 日活用户 500+\n- 付费用户 100+（云端功能）\n- 月营收 10,000 元+\n\n**V5-V8 阶段（第 3 年）**：\n- 成为 AI 应用开发标准框架\n- 开发者数量 10,000+\n- 用户注册量 100,000+\n- 日活用户 5,000+\n- 应用模块 1,000+\n- 企业客户 10+\n- 年营收 1,000,000 元+\n\n### 6.2 产品指标目标\n\n**V1 MVP 阶段**：\n- 用户能够在 10 分钟内完成注册、配置 Provider、发起第一次模型调用\n- 开发者能够在 1 天内开发出可运行的应用模块\n- 应用启动时间 < 2 秒\n- 模块加载时间 < 1 秒\n- Provider 调用成功率 > 95%\n- 核心功能测试覆盖率 > 60%\n\n**V3 应用市场阶段**：\n- 应用市场至少 10 个第三方应用\n- 应用安装成功率 > 99%\n- 应用更新成功率 > 98%\n- 用户 7 日留存率 > 30%\n\n**V4 云端增强阶段**：\n- 云端账号注册率 > 50%（注册用户中）\n- 云端功能使用率 > 20%（活跃用户中）\n- 协同编辑并发 > 100 人\n- 跨设备同步成功率 > 99%\n\n### 6.3 关键成功指标（NSM）\n\n| 指标 | 定义 | 目标 |\n| --- | --- | --- |\n| **开发者留存** | 每周至少使用 1 次的开发者占比 | > 40% |\n| **应用质量** | 应用平均评分 | > 4.0/5.0 |\n| **模块生态** | 第三方应用模块数量 | > 100 (V3) |\n| **用户活跃** | 日活/月活比 | > 10% |\n| **云端转化** | 绑定云端账号的用户占比 | > 50% (V4) |\n\n## 7. 技术架构概要\n\n详见 [技术架构](../04-技术架构/总体架构.md) 和 [V1 冻结决策](../06-决策记录/V1-冻结决策.md)。\n\n### 7.1 技术栈选型\n\n**核心技术**：\n- 桌面容器：Tauri 2（轻量、跨平台）\n- 后端语言：Rust 1.75+（性能、安全、强制模块化）\n- Web 框架：Axum 0.7+（异步、类型安全）\n- 数据库：SQLite 3.45+（零配置、单文件）\n- ORM：SeaORM 0.12+（类型安全、异步）\n- 前端框架：React 18（生态成熟）\n- 前端语言：TypeScript 5.0+（类型安全）\n- 构建工具：Vite 5.0+（快速、HMR）\n- 模块加载：Module Federation（动态加载）\n- 状态管理：Zustand 4.0+（轻量）\n- UI 组件：Shadcn/ui（无依赖、可定制）\n\n**明确不采用**：\n- ❌ QuickJS/Node.js（Skills/MCP 自己运行）\n- ❌ PostgreSQL（本地优先，SQLite 足够）\n- ❌ Redis（单机不需要）\n- ❌ MinIO/S3（文件系统足够）\n\n### 7.2 分层架构\n\n```\n┌─────────────────────────────────────────────┐\n│          应用模块层（可热更新）              │\n│  ┌──────────┬──────────┬──────────┐        │\n│  │AI工作台  │画布编辑器 │文件管理  │ ...    │\n│  │(V1)      │(V2)      │(V3+)     │        │\n│  └──────────┴──────────┴──────────┘        │\n├─────────────────────────────────────────────┤\n│         应用框架层                           │\n│  ┌────────────────────────────────┐        │\n│  │ 模块加载器 │ 权限管理 │ 路由系统 │       │\n│  │ 热更新机制 │ 统一设计系统 │ Store │       │\n│  └────────────────────────────────┘        │\n├─────────────────────────────────────────────┤\n│         底层能力框架                         │\n│  ┌────────────┬──────────┬──────────┐      │\n│  │Provider    │Skills    │MCP       │      │\n│  │适配框架    │管理系统  │管理系统  │      │\n│  └────────────┴──────────┴──────────┘      │\n├─────────────────────────────────────────────┤\n│         运行时 + 存储                        │\n│  ┌────────────────────────────────┐        │\n│  │ Tauri 桌面容器 + SQLite 本地存储 │       │\n│  │ HTTP 服务（局域网）              │        │\n│  └────────────────────────────────┘        │\n└─────────────────────────────────────────────┘\n```\n\n## 8. 商业模式\n\n### 8.1 免费增值模式\n\n**永久免费**：\n- 本地功能 100% 免费\n- 自配置 Provider 免费\n- 局域网协同免费\n- 基础应用市场免费\n- 开源核心框架（MIT 协议）\n\n**付费增值（V4+）**：\n- 官方 Provider（积分制，按量计费）\n- 高级 Skills 订阅（V4+）\n- 跨设备数据同步\n- 团队协作功能（V5，按人数收费）\n- 企业级功能（V5，按人数收费）\n- 私有部署（V7+，年费制）\n\n### 8.2 积分计费（V4）\n\n| 资源类型 | 计费方式 | 示例 |\n| --- | --- | --- |\n| 文本生成 | token 数量 × 倍率 | GPT-4: 1000 tokens = 10 积分 |\n| 图片生成 | 按张数 | DALL-E 3: 1 张 = 50 积分 |\n| 视频生成 | 按秒数 | Sora: 1 秒 = 100 积分 |\n| 音频生成 | 按秒数 | TTS: 1 秒 = 5 积分 |\n\n**充值方式**：\n- 支付宝\n- 微信支付\n- 信用卡（国际用户）\n\n### 8.3 收入预期\n\n**第 1 年（V1-V3）**：\n- 收入来源：无（全部免费）\n- 投入：开发和运营成本\n- 目标：验证产品、建立用户基础\n\n**第 2 年（V4-V5）**：\n- 收入来源：官方 Provider 积分、企业订阅\n- 预期月营收：10,000-50,000 元\n- 预期年营收：100,000-500,000 元\n\n**第 3 年（V6-V8）**：\n- 收入来源：积分、订阅、企业、私有部署\n- 预期月营收：100,000-500,000 元\n- 预期年营收：1,000,000-5,000,000 元\n\n## 9. 风险与挑战\n\n### 9.1 技术风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| Module Federation 不稳定 | 中 | 高 | 早期原型验证，准备降级方案 |\n| Rust 学习曲线陡峭 | 高 | 中 | 提供培训、代码示例、结对编程 |\n| SQLite 性能瓶颈 | 低 | 中 | 优化索引，限制数据量，监控性能 |\n| Skills/MCP 生态不成熟 | 中 | 中 | 先支持主流 Skills，逐步扩展 |\n\n### 9.2 产品风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| 用户不理解产品定位 | 高 | 高 | 清晰的产品宣传、视频教程、示例应用 |\n| 开发者不愿意开发模块 | 中 | 高 | 完善开发文档、提供激励、建立社区 |\n| 应用市场缺少优质应用 | 中 | 中 | 自己开发官方模块、吸引开发者 |\n| 协同功能冲突频繁 | 中 | 中 | 完善冲突解决、用户测试、逐步放量 |\n\n### 9.3 商业风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| 用户不愿付费 | 中 | 高 | 免费功能足够强大，付费提供增值 |\n| 官方 Provider 成本高 | 高 | 高 | 按量计费，控制免费额度，优化成本 |\n| 竞品快速跟进 | 中 | 中 | 快速迭代，建立护城河（生态、社区） |\n| 开源项目盈利困难 | 高 | 高 | 明确免费和付费边界，云端服务收费 |\n\n## 10. 竞争分析\n\n### 10.1 竞品对比\n\n| 产品 | 定位 | 优势 | 劣势 |\n| --- | --- | --- | --- |\n| **DGOS** | 本地优先 AI 应用框架 | 数据主权、可扩展、强制模块化 | 新产品，生态待建立 |\n| **LangChain** | AI 应用开发框架 | 生态成熟、文档完善 | 偏开发库，不是用户产品 |\n| **Flowise** | 低代码 AI 工作流 | 可视化、易用 | 云端为主，数据不可控 |\n| **n8n** | 工作流自动化 | 通用性强 | 非 AI 专用，学习成本高 |\n| **Cursor/Copilot** | AI 代码助手 | IDE 集成 | 仅代码场景，不通用 |\n\n### 10.2 护城河\n\n1. **技术护城河**：\n   - 强制模块化架构（避免代码腐化）\n   - Module Federation 热更新（独特技术方案）\n   - 本地优先 + 云端增强（兼顾隐私和体验）\n\n2. **生态护城河**：\n   - 应用模块市场（V3）\n   - 开发者社区\n   - 第三方应用生态\n\n3. **数据护城河**：\n   - 用户数据和工作流\n   - 跨应用共享的 Provider 配置\n   - 历史记录和使用习惯\n\n## 11. 附录\n\n### 11.1 术语表\n\n| 术语 | 定义 |\n| --- | --- |\n| Provider | AI 模型提供商适配器，统一接口封装 |\n| Skills | 现有 AI 工具标准（LangChain Tools） |\n| MCP | Model Context Protocol（Anthropic） |\n| 应用模块 | 可热更新的独立功能单元 |\n| 统一设计系统 | 所有模块强制复用的主题和组件规范 |\n| 本地优先 | 默认离线可用，云端可选 |\n| 发布门禁 | 版本发布前必须通过的质量检查 |\n\n### 11.2 参考文档\n\n- [版本路线图](版本路线图.md)\n- [功能演进矩阵](功能演进矩阵.md)\n- [V1 版本总览](当前版本/V1-版本总览.md)\n- [V1 冻结决策](../06-决策记录/V1-冻结决策.md)\n- [总体架构](../04-技术架构/总体架构.md)\n- [2024-01-XX 初始讨论完整记录](../90-参考资料/2024-01-XX-初始讨论完整记录.md)\n\n---\n\n**最后更新**：2024-01-XX  \n**更新人**：Kiro  \n**状态**：Active  \n**版本**：v1.0\n", "doc-006": "# DGOS 功能演进矩阵\n\n## 1. 文档职责\n\n本文档以\"能力主线\"为单位，说明同一项产品能力如何从 V1 底座逐步演进到画布系统、应用市场、云端协同、企业化、移动端、AI Agent 和开发者生态。\n\n本文档回答以下问题：\n\n- 一项能力最早在哪个版本出现\n- 后续版本具体增加了什么用户可感知行为\n- 新阶段依赖哪些既有功能和发布门禁\n- 达到什么结果才算完成该阶段\n- 当前内容是现行功能、未来规划、历史迁移还是独立增强\n- 详细需求、当前实现状态和验收证据应到哪里查看\n\n本文档不替代其他权威来源：\n\n- 产品愿景和完整范围以[产品蓝图](产品蓝图.md)为准\n- 版本顺序和边界以[版本路线图](版本路线图.md)为准\n- V1 功能行为以[V1 功能规格](../03-功能规格/V1/README.md)为准\n- 当前实现状态以[V1 实现状态](当前版本/V1-实现状态.md)为准\n\n## 2. 能力主线列表\n\n| 序号 | 能力主线 | V1 | V2 | V3 | V4 | V5 | V6 | V7 | V8 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | Provider 能力 | 基础 | - | - | 官方 | 企业 | - | - | - |\n| 2 | Skills 能力 | 基础 | 画布集成 | - | 云端 | - | - | Agent | - |\n| 3 | MCP 能力 | 基础 | - | - | 云端 | - | - | Agent | - |\n| 4 | 模块系统 | 热更新 | - | 市场 | 云端分发 | - | 移动端 | - | SDK |\n| 5 | 设计系统 | 基础 | 画布组件 | - | - | - | 移动端适配 | - | - |\n| 6 | 身份管理 | 本地用户 | - | - | 云端账号 | 组织成员 | - | - | - |\n| 7 | 数据存储 | SQLite | - | - | 云端同步 | - | 移动端 | - | - |\n| 8 | AI 工作台 | 基础对话 | Skills 增强 | - | 协同对话 | - | 移动端 | Agent | - |\n| 9 | 无限画布 | - | **完整** | - | 协同编辑 | - | 移动端 | Agent 执行 | - |\n| 10 | 权限系统 | 模块权限 | - | - | 数据权限 | 组织权限 | - | - | - |\n| 11 | 局域网协同 | 简单认证 | - | - | 实时协同 | - | - | - | - |\n| 12 | 应用生态 | - | - | **市场** | 付费应用 | - | 移动应用 | - | API 市场 |\n\n## 3. Provider 能力演进\n\n### 3.1 V1 基础适配（必须）\n\n**用户价值**：能够配置和使用 AI 模型\n\n**核心行为**：\n- 配置 Provider（名称、类型、base_url、API Key）\n- Provider 列表管理（增删改查）\n- 获取模型列表\n- 模型分类标签（text-generation、image-generation、video-generation、audio-generation）\n- 调用模型（同步/流式）\n- 使用记录\n- 支持多个同类型 Provider\n- 排序和默认选择机制\n\n**技术边界**：\n- 只实现 OpenAI 兼容适配器\n- 模型分类标签内置维护\n- 支持多个同类型 Provider 配置\n\n**功能编号**：V1-FR-001\n\n**验收标准**：\n- 可配置至少 1 个 Provider\n- 可获取模型列表并正确分类\n- 可成功调用模型并返回结果\n- 流式输出正常工作\n- 多 Provider 排序和选择正确\n\n### 3.2 V4 官方 Provider（云端增强）\n\n**用户价值**：无需配置 API Key，直接使用官方提供的模型\n\n**新增行为**：\n- 登录云端账号\n- 使用官方 Provider（消耗积分）\n- 积分管理（查看余额、充值）\n- 用量统计\n- 多厂商适配器（Claude、通义千问、文心一言）\n\n**技术边界**：\n- 官方 Provider 和自配置 Provider 可并存\n- 官方 Provider 排序优先级可调整\n- 积分按 token/张/秒计费\n- 支持 3+ 主流厂商\n\n**依赖**：V4 账号系统\n\n**验收标准**：\n- 登录账号后可使用官方 Provider\n- 积分实时扣除\n- 用量记录准确\n- 至少支持 3 个主流厂商\n\n### 3.3 V5 企业 Provider（企业化）\n\n**用户价值**：组织统一管理 Provider 配置\n\n**新增行为**：\n- 组织级 Provider 配置\n- 成员共享 Provider\n- 组织用量统计\n- 组织账单\n\n**依赖**：V5 组织管理\n\n## 4. Skills 能力演进\n\n### 4.1 V1 基础管理（必须）\n\n**用户价值**：扩展 AI 能力，使用现有 Skills 生态\n\n**核心行为**：\n- 连接远程 Skills 仓库\n- 浏览 Skills 列表（分类、搜索）\n- 安装 Skills（下载、配置）\n- 卸载 Skills\n- 启用/禁用 Skills\n- Skills 配置管理（API Key 等）\n- 调用 Skills（HTTP/CLI）\n- 使用记录\n\n**技术边界**：\n- 使用现有 Skills 标准（LangChain Tools）\n- DGOS 只管理和调用，不执行\n- Skills 自己运行，返回结果\n\n**功能编号**：V1-FR-002\n\n**验收标准**：\n- 可连接至少 1 个 Skills 仓库\n- 可安装至少 1 个 Skill\n- 可成功调用 Skill 并返回结果\n\n### 4.2 V2 画布集成（画布增强）\n\n**用户价值**：在画布的 LLM 节点中使用 Skills 增强生成能力\n\n**新增行为**：\n- LLM 节点显示可用 Skills\n- 用户可选择 Skills（可选）\n- Skill 处理 Prompt 后再调用 LLM\n- 或 LLM 结果通过 Skill 后处理\n\n**技术边界**：\n- Skills 是可选的，用户可以不选\n- Skills 调用失败不阻塞 LLM 调用\n- 显示 Skills 处理进度\n\n**依赖**：V2 画布系统、V1 Skills 管理\n\n**验收标准**：\n- LLM 节点可选择 Skills\n- Skills 增强生成效果可见\n\n### 4.3 V4 云端 Skills（云端增强）\n\n**用户价值**：使用官方提供的 Skills，无需本地安装\n\n**新增行为**：\n- 云端 Skills 仓库\n- 在线调用 Skills（无需本地安装）\n- Skills 用量统计\n\n**依赖**：V4 账号系统\n\n### 4.4 V7 Agent 集成（AI Agent）\n\n**用户价值**：Agent 自动选择和调用 Skills\n\n**新增行为**：\n- Agent 自动发现可用 Skills\n- Agent 根据任务自动选择 Skills\n- Agent 链式调用多个 Skills\n\n**依赖**：V7 AI Agent 系统\n\n## 5. 模块系统演进\n\n### 5.1 V1 热更新（必须）\n\n**用户价值**：安装和更新模块无需重启应用\n\n**核心行为**：\n- 模块动态加载（Module Federation）\n- 模块卸载\n- 模块热更新（无需重启）\n- 模块权限管理（粗粒度）\n- 模块配置（manifest.json）\n\n**技术边界**：\n- 基于 Module Federation\n- 共享依赖（React、Zustand）\n- 独立构建\n\n**功能编号**：V1-FR-004\n\n**验收标准**：\n- 可加载至少 2 个官方模块\n- 模块更新无需重启\n- 模块权限正确隔离\n\n### 5.2 V3 应用市场（生态）\n\n**用户价值**：从应用市场安装第三方模块\n\n**新增行为**：\n- 应用浏览（分类、搜索）\n- 应用详情（截图、描述、评分）\n- 应用安装（从市场下载）\n- 应用更新（自动推送）\n- 应用卸载\n- 开发者提交\n- 人工审核\n- 版本管理\n\n**技术边界**：\n- 中心化市场\n- 必须登录云端账号\n- 人工审核\n\n**依赖**：V1 模块系统稳定\n\n**验收标准**：\n- 可从市场安装至少 1 个第三方模块\n- 模块更新自动推送\n- 应用评分和评论系统正常\n\n### 5.3 V4 云端分发（云端增强）\n\n**用户价值**：跨设备同步已安装模块\n\n**新增行为**：\n- 已安装模块列表云端同步\n- 新设备自动安装已同步模块\n- 模块配置云端同步\n- 付费应用支持\n\n**依赖**：V4 云端同步、V3 应用市场\n\n### 5.4 V6 移动端模块（移动端）\n\n**用户价值**：移动端也可以使用应用模块\n\n**新增行为**：\n- 移动端模块适配\n- 触摸手势优化\n- 移动端 UI 适配\n\n**依赖**：V6 移动端平台\n\n### 5.5 V8 SDK 和模板（开发者生态）\n\n**用户价值**：开发者更容易开发模块\n\n**新增行为**：\n- 官方 SDK（TypeScript/Rust）\n- 模块开发模板\n- CLI 工具（dgos-cli）\n- 文档和示例\n- 自动化测试工具\n\n**依赖**：V3 应用市场稳定\n\n## 6. 无限画布演进\n\n### 6.1 V2 画布系统（核心价值）\n\n**用户价值**：可视化编辑工作流\n\n**核心行为**：\n- 画布视口（缩放、拖拽、平移）\n- 完整节点类型（10+ 种）：\n  - ImageNode：图片输入\n  - PromptNode：提示词编辑\n  - LLMNode：LLM 调用（可选 Skills）\n  - GeneratorNode：内容生成\n  - LoopNode：循环执行\n  - ConditionalNode：条件分支\n  - TransformNode：数据转换\n  - FunctionNode：自定义函数\n  - OutputNode：结果输出\n  - ConnectionNode：连接点\n- 节点连线系统\n- 实时执行（用户操作立即执行）\n- 执行状态可视化\n- 错误处理和重试\n- 工作流 JSON 格式定义\n- 工作流导入导出\n- 布局算法（自动排版）\n- 工作流模板库\n\n**技术边界**：\n- 画布作为独立模块\n- 节点系统可扩展\n- 每个节点文件 < 200 行\n- 支持循环节点\n- 实时执行，非批量\n\n**功能编号**：V2-FR-001 到 V2-FR-010\n\n**依赖**：V1 模块系统稳定\n\n**验收标准**：\n- 可创建至少 10 种节点\n- 节点可以连线\n- 循环节点正常工作\n- 实时执行响应及时\n- 画布可以保存和加载\n- 工作流可导出为 JSON\n- 导出的工作流可正确导入\n- 至少 3 个内置模板\n- 交互流畅（60fps）\n\n**从老项目学习**：\n- ✅ 保留交互体验（拖拽手感、连线交互）\n- ✅ 保留节点类型设计\n- ✅ 兼容老项目工作流格式（可选）\n- ❌ 不复制单体架构\n- ❌ 不复制耦合设计\n\n### 6.2 V4 协同编辑（实时协同）\n\n**用户价值**：多人实时协作编辑画布\n\n**新增行为**：\n- 实时同步节点移动\n- 显示其他用户指针（带用户标记）\n- 编辑节点时锁定\n- 冲突自动合并（CRDT/OT）\n- 操作历史和撤销\n- 协同光标显示\n\n**技术边界**：\n- WebSocket 实时通信\n- CRDT 或 OT 算法\n- 锁机制防止冲突\n\n**依赖**：V4 云端账号、V2 画布系统稳定\n\n**验收标准**：\n- A 用户移动节点，B 用户实时看到\n- 指针显示正确\n- 冲突自动解决或提示用户\n- 协同编辑并发 > 100 人\n\n### 6.3 V6 移动端画布（移动端）\n\n**用户价值**：移动端也可以编辑画布\n\n**新增行为**：\n- 移动端画布 UI 适配\n- 触摸手势（双指缩放、拖拽）\n- 简化的节点编辑界面\n\n**依赖**：V6 移动端平台、V2 画布稳定\n\n### 6.4 V7 Agent 执行（AI Agent）\n\n**用户价值**：Agent 自动生成和执行工作流\n\n**新增行为**：\n- Agent 根据任务自动生成工作流\n- Agent 自动执行工作流\n- Agent 自动调试和修复工作流\n\n**依赖**：V7 AI Agent 系统、V2 画布稳定\n\n## 7. 身份管理演进\n\n### 7.1 V1 本地用户（必须）\n\n**用户价值**：多用户使用同一台电脑，数据隔离\n\n**核心行为**：\n- 创建本地用户\n- 用户登录（本地验证）\n- 用户切换\n- 用户删除\n\n**技术边界**：\n- 简单用户名/密码\n- SQLite 存储\n- 无需云端验证\n\n**功能编号**：V1-FR-008\n\n**验收标准**：\n- 可创建至少 2 个本地用户\n- 用户数据正确隔离\n\n### 7.2 V4 云端账号（云端增强）\n\n**用户价值**：跨设备使用，数据同步\n\n**新增行为**：\n- 云端注册（邮箱/手机号）\n- 云端登录\n- 个人资料管理\n- 绑定本地用户到云端账号\n- 多设备管理\n\n**技术边界**：\n- 本地用户和云端账号可并存\n- 绑定后可解绑\n- 云端账号可选\n\n**依赖**：V1 本地用户\n\n**验收标准**：\n- 可注册云端账号\n- 可绑定本地用户\n- 多设备显示正确\n- 跨设备数据同步\n\n### 7.3 V5 组织成员（企业化）\n\n**用户价值**：团队协作，统一管理\n\n**新增行为**：\n- 创建组织\n- 邀请成员\n- 角色权限（Owner、Admin、Member）\n- 成员管理（禁用、移除）\n\n**依赖**：V4 云端账号\n\n## 8. 应用生态演进\n\n### 8.1 V3 应用市场（生态启动）\n\n**用户价值**：发现和安装第三方应用\n\n**核心行为**：\n- 应用浏览（分类、搜索、筛选）\n- 应用详情（截图、描述、评分、评论）\n- 应用安装（从市场下载）\n- 应用更新（自动推送、手动确认）\n- 应用卸载\n- 开发者提交（表单、资料、截图）\n- 人工审核流程（审核队列、审核标准）\n- 版本管理（多版本共存、回滚）\n- 评分评论系统\n- 下载统计\n\n**市场模式**：\n- 中心化（官方服务器）\n- 必须登录云端账号\n- 人工审核\n- 全部免费\n\n**功能编号**：V3-FR-001 到 V3-FR-010\n\n**依赖**：V1 模块系统稳定\n\n**验收标准**：\n- 至少 10 个第三方应用\n- 应用安装成功率 > 99%\n- 应用更新成功率 > 98%\n- 审核周期 < 3 天\n\n### 8.2 V4 付费应用（商业化）\n\n**用户价值**：开发者可以通过应用获得收入\n\n**新增行为**：\n- 付费应用支持\n- 应用内购买\n- 开发者收入分成\n- 收入统计和提现\n\n**依赖**：V4 云端账号、V3 应用市场\n\n### 8.3 V6 移动端应用（移动端）\n\n**用户价值**：移动端也有应用市场\n\n**新增行为**：\n- 移动端应用市场\n- 移动端应用适配\n- iOS App Store / Android Play Store 分发（可选）\n\n**依赖**：V6 移动端平台、V3 应用市场\n\n### 8.4 V8 API 市场（开发者生态）\n\n**用户价值**：不仅有应用，还有 API 和组件\n\n**新增行为**：\n- API 市场（开发者发布 API）\n- 组件市场（UI 组件、节点类型）\n- SDK 市场（开发工具）\n- 模板市场（项目模板）\n\n**依赖**：V3 应用市场成熟\n\n## 9. 维护规则\n\n1. 新增或调整跨版本能力时，先修改权威版本规划，再同步本文档的对应能力主线。\n2. V1 功能使用既有编号和链接；不得在本文档复制或重写功能主文档中的详细行为。\n3. V2+ 在通过版本进入开发门禁前只保持\"规划\"，不得提前创建正式功能编号或声明实现状态。\n4. 版本范围迁移必须同时标注原位置、目标位置和历史材料角色，避免两个版本同时宣称同一范围。\n5. 当前完成度只链接实现状态和执行证据，不用路线图、演进矩阵或页面可见性替代验证。\n6. 新增 V1 功能或调整其主责能力时，必须同步[V1 功能规格索引](../03-功能规格/V1/README.md)。\n\n## 10. 能力演进可视化\n\n```\nProvider 能力\nV1 ━━━━━━━━━━━━━━━┓\nV4                 ┣━━━━━━━━━━┓\nV5                 ┃          ┗━━━━━━━━━━>\n\nSkills 能力\nV1 ━━━━━━━━━━┓\nV2           ┣━━━━━━━━━━┓\nV4           ┃          ┣━━━━━━━━━━┓\nV7           ┃          ┃          ┗━━━━━━━━━━>\n\n无限画布\n        V2 ━━━━━━━━━━━━━━━━━━━━━━━┓\n        V4                         ┣━━━━━━━━━━┓\n        V6                         ┃          ┣━━━━━━━━━━┓\n        V7                         ┃          ┃          ┗━━━━━━━━━━>\n\n模块系统\nV1 ━━━━━━━━━━┓\nV3           ┣━━━━━━━━━━┓\nV4           ┃          ┣━━━━━━━━━━┓\nV6           ┃          ┃          ┣━━━━━━━━━━┓\nV8           ┃          ┃          ┃          ┗━━━━━━━━━━>\n\n身份管理\nV1 ━━━━━━━━━━━━━━━┓\nV4                 ┣━━━━━━━━━━┓\nV5                 ┃          ┗━━━━━━━━━━>\n\n应用生态\n        V3 ━━━━━━━━━━━━━━━┓\n        V4                 ┣━━━━━━━━━━┓\n        V6                 ┃          ┣━━━━━━━━━━┓\n        V8                 ┃          ┃          ┗━━━━━━━━━━>\n```\n\n---\n\n**最后更新**：2024-01-XX  \n**更新人**：Kiro  \n**状态**：Active\n", "doc-007": "# V1.0 产品需求\n\n## 1. 文档目标\n\n本文档只定义 DGOS 第一版本（V1.0）功能。\n\n本文档冻结 V1.0 交付范围。若 V1.0 子文档之间出现表述不一致，以 [V1 版本总览](V1-版本总览.md) 的范围口径为准；接口、数据表、架构和验收细节分别见同目录下的专项文档。\n\n## 2. V1.0 定位\n\nV1.0 建立本地优先的 AI 应用开发框架最小闭环：提供 Provider 适配、Skills/MCP 管理和模块系统基础能力，验证框架可扩展性。无限画布等核心价值功能分多版本完成，不阻塞 V1.0 交付。\n\n### 2.1 核心目标\n\n- ✅ 打通底层能力框架最小闭环\n- ✅ 验证架构可扩展性\n- ✅ 建立强制模块化规范\n- ✅ 避免重蹈老项目覆辙\n- ✅ 为后续版本打好底座\n\n### 2.2 非目标\n\n- ❌ 不求功能完整（画布、市场、协同延后）\n- ❌ 不求用户规模（先验证架构正确）\n- ❌ 不求商业变现（V2.0 才考虑）\n- ❌ 不支持 Windows（V1.1 再做）\n\n## 3. V1.0 功能分层\n\nV1.0 建议拆成 7 层开发。每一层完成后都应该能独立验收。\n\n### Layer 1：基础框架层（Week 1-2）\n\n**目标**：让系统能跑起来\n\n**包含**：\n- Tauri 应用骨架\n- Rust 后端骨架（Axum）\n- SQLite 数据库初始化\n- React 前端骨架（Vite）\n- 基础路由系统\n- 简单的本地用户管理\n\n**验收标准**：\n- [x] 应用可启动\n- [x] 创建本地用户成功\n- [x] SQLite 数据库创建成功\n- [x] 前端路由跳转正常\n\n### Layer 2：Provider 框架层（Week 3-4）\n\n**目标**：让用户能调用 AI 模型\n\n**包含**：\n- V1-FR-001 Provider 适配框架\n  - Provider CRUD 接口\n  - OpenAI 适配器实现\n  - 模型列表获取\n  - 模型分类标签（内置维护）\n  - 模型调用接口（同步/流式）\n  - 使用记录\n\n**验收标准**：\n- [x] 可配置至少 1 个 OpenAI Provider\n- [x] 可获取模型列表\n- [x] 模型正确分类（text-generation、image-generation）\n- [x] 可成功调用 GPT-4 并返回结果\n- [x] 流式输出正常工作\n- [x] 使用记录保存正确\n\n### Layer 3：Skills/MCP 管理层（Week 5-6）\n\n**目标**：让系统能扩展 AI 能力\n\n**包含**：\n- V1-FR-002 Skills 管理系统\n  - 远程仓库连接\n  - Skills 列表获取\n  - Skills 安装/卸载\n  - Skills 配置管理\n  - Skills 调用接口（HTTP/CLI）\n  - 使用记录\n- V1-FR-003 MCP 管理系统\n  - MCP 服务器连接\n  - 工具列表获取\n  - MCP 工具调用\n  - 连接状态监控\n\n**验收标准**：\n- [x] 可连接至少 1 个 Skills 仓库\n- [x] 可安装至少 1 个 Skill\n- [x] 可成功调用 Skill 并返回结果\n- [x] 可连接至少 1 个 MCP 服务器\n- [x] 可调用 MCP 工具\n\n### Layer 4：模块系统层（Week 7-8）\n\n**目标**：让应用支持热更新模块\n\n**包含**：\n- V1-FR-004 模块系统与热更新\n  - Module Federation 集成\n  - 模块动态加载\n  - 模块卸载\n  - 模块热重载\n  - 模块权限管理（粗粒度）\n  - 模块配置（manifest.json）\n- V1-FR-005 统一设计系统\n  - 主题系统（亮色/暗色）\n  - 色彩规范\n  - 字体规范\n  - 间距规范\n  - 基础 UI 组件库（10+ 组件）\n\n**验收标准**：\n- [x] 可加载至少 2 个官方模块\n- [x] 模块更新无需重启\n- [x] 模块权限正确隔离\n- [x] 所有模块使用统一设计系统\n- [x] 主题切换全局生效\n\n### Layer 5：基础应用层（Week 9-10）\n\n**目标**：让用户有基础应用可用\n\n**包含**：\n- V1-FR-006 AI 工作台\n  - 简单对话界面\n  - Provider 选择\n  - 历史记录查看\n  - Prompt 输入\n  - 流式响应展示\n  - （可选）Skills 选择\n- V1-FR-007 系统设置\n  - Provider 管理界面\n  - Skills 管理界面\n  - MCP 管理界面\n  - 模块管理界面\n  - 主题切换\n  - 用户管理\n\n**验收标准**：\n- [x] 可在 AI 工作台发起对话\n- [x] 可选择 Provider 和模型\n- [x] 流式响应实时展示\n- [x] 历史记录正确保存\n- [x] 可在系统设置管理所有配置\n\n### Layer 6：系统功能层（Week 11）\n\n**目标**：补齐系统级功能\n\n**包含**：\n- V1-FR-008 本地用户管理\n  - 创建本地用户\n  - 用户登录\n  - 用户切换\n  - 用户删除\n- V1-FR-009 模块权限管理\n  - 权限申请\n  - 权限授予\n  - 权限检查\n  - 权限撤销\n- V1-FR-010 局域网协同\n  - HTTP 服务自动启动\n  - 端口配置\n  - 简单认证（用户名/密码）\n  - 远程设备只读模式\n  - 连接用户显示\n\n**验收标准**：\n- [x] 可创建多个本地用户\n- [x] 用户数据正确隔离\n- [x] 模块权限正确检查\n- [x] HTTP 服务自动启动\n- [x] 远程设备可访问并使用\n\n### Layer 7：测试与优化（Week 12）\n\n**目标**：通过发布门禁\n\n**包含**：\n- 单元测试补齐\n- 集成测试\n- E2E 测试\n- 性能优化\n- 文档完善\n- Bug 修复\n\n**验收标准**：\n- [x] 所有 P0 功能验收通过\n- [x] 应用启动时间 < 2 秒\n- [x] 模块加载时间 < 1 秒\n- [x] API 响应时间（P95）< 200ms\n- [x] 核心功能单元测试覆盖率 > 60%\n- [x] 文档覆盖率 > 80%\n- [x] 零 P0/P1 Bug\n\n## 4. V1.0 功能清单\n\n| 功能 ID | 功能名称 | 领域 | 优先级 | 验收标准 | 引用规格 |\n| --- | --- | --- | --- | --- | --- |\n| V1-FR-001 | Provider 适配框架 | 底层能力 | P0 | 可配置和调用至少 1 个 Provider | [01-Provider适配框架](../../03-功能规格/V1/01-底层能力/01-Provider适配框架.md) |\n| V1-FR-002 | Skills 管理系统 | 底层能力 | P0 | 可安装和调用至少 1 个 Skill | [02-Skills管理系统](../../03-功能规格/V1/01-底层能力/02-Skills管理系统.md) |\n| V1-FR-003 | MCP 管理系统 | 底层能力 | P0 | 可连接和调用至少 1 个 MCP 服务器 | [03-MCP管理系统](../../03-功能规格/V1/01-底层能力/03-MCP管理系统.md) |\n| V1-FR-004 | 模块系统与热更新 | 底层能力 | P0 | 模块可热更新，无需重启 | [04-模块系统与热更新](../../03-功能规格/V1/01-底层能力/04-模块系统与热更新.md) |\n| V1-FR-005 | 统一设计系统 | 底层能力 | P0 | 所有模块使用统一组件 | [05-统一设计系统](../../03-功能规格/V1/01-底层能力/05-统一设计系统.md) |\n| V1-FR-006 | AI 工作台 | 应用模块 | P0 | 可发起对话并查看结果 | [01-AI工作台](../../03-功能规格/V1/02-应用模块/01-AI工作台.md) |\n| V1-FR-007 | 系统设置 | 应用模块 | P0 | 可管理所有配置 | [02-系统设置](../../03-功能规格/V1/02-应用模块/02-系统设置.md) |\n| V1-FR-008 | 本地用户管理 | 系统功能 | P0 | 可创建多个用户，数据隔离 | [01-本地用户管理](../../03-功能规格/V1/03-系统功能/01-本地用户管理.md) |\n| V1-FR-009 | 模块权限管理 | 系统功能 | P0 | 权限检查正确 | [02-模块权限管理](../../03-功能规格/V1/03-系统功能/02-模块权限管理.md) |\n| V1-FR-010 | 局域网协同 | 系统功能 | P0 | 远程设备可访问 | [03-局域网协同](../../03-功能规格/V1/03-系统功能/03-局域网协同.md) |\n\n## 5. V1.0 核心流程\n\n### 5.1 用户首次使用流程\n\n```\n1. 用户下载 DGOS-v1.0.dmg\n2. 拖拽到应用程序文件夹\n3. 双击启动 DGOS\n4. 系统提示创建本地用户\n5. 输入用户名、密码\n6. 创建用户成功，进入主界面\n7. 系统提示配置 Provider\n8. 点击\"去配置\"，跳转到系统设置\n9. 点击\"添加 Provider\"\n10. 选择 OpenAI 兼容类型\n11. 输入名称、base_url、API Key\n12. 点击\"测试连接\"\n13. 测试成功，保存 Provider\n14. 回到主界面，打开 AI 工作台\n15. 输入提示词：\"你好\"\n16. 选择模型：gpt-4\n17. 点击发送\n18. 查看流式响应结果\n19. 查看历史记录\n```\n\n### 5.2 安装 Skill 流程\n\n```\n1. 打开系统设置\n2. 点击\"Skills 管理\"\n3. 点击\"浏览 Skills 仓库\"\n4. 搜索或浏览 Skills 列表\n5. 点击某个 Skill 查看详情\n6. 点击\"安装\"\n7. 输入配置（如 API Key）\n8. 安装完成\n9. Skills 出现在已安装列表\n10. 回到 AI 工作台\n11. 发起对话时，可选择该 Skill\n12. Skill 增强生成效果\n```\n\n### 5.3 局域网协同流程\n\n```\n主机：\n1. DGOS 启动时自动启动 HTTP 服务\n2. 显示局域网地址：http://192.168.1.100:3000\n3. 显示认证密码（随机生成或用户设置）\n\n远程设备：\n1. 打开浏览器\n2. 访问 http://192.168.1.100:3000\n3. 输入用户名、密码\n4. 认证成功，进入 DGOS Web 端\n5. 可以使用主机的 Provider、Skills、MCP\n6. 可以发起对话\n7. 可以查看历史记录\n8. 不能修改 Provider 配置（只读模式）\n\n主机显示：\n1. 实时显示连接用户列表\n2. 显示用户名、IP 地址、连接时间\n3. 可以强制断开某个用户\n```\n\n## 6. V1.0 核心业务规则\n\n### 6.1 决策引用说明\n\n本章节引用的冻结决策详见 [V1 冻结决策](../../06-决策记录/V1-冻结决策.md)。决策编号以 `D` 开头，一旦分配永不改变。\n\n### 6.2 Provider 管理规则\n\n**配置与调用**：\n- 用户可配置多个同类型 Provider（如多个 OpenAI 账号），通过拖拽排序，排序第一的作为默认选择（引用 **D012**）\n- Provider 配置包含：名称、类型、base_url、API Key、重试策略\n- API Key 必须加密存储（SQLCipher 或 AES-256）\n- 调用失败时，可配置重试次数（默认 3 次）和指数退避策略（1s、2s、4s）\n- 可重试错误：429 速率限制、5xx 服务器错误、网络超时；不可重试：401 认证失败、400 参数错误\n\n**模型同步**：\n- Provider 创建成功后，自动获取模型列表并缓存到 `models` 表\n- 模型分类标签内置维护：`text-generation`、`image-generation`、`video-generation`、`audio-generation`\n- 用户可手动刷新模型列表，缓存有效期 24 小时\n\n**流式调用**：\n- 流式调用返回 SSE（Server-Sent Events）格式数据\n- 流中断时，保存已接收部分到数据库，避免用户看到的内容丢失\n- 使用记录必须包含：tokens、latency、success、error_code\n\n**边界约束**：\n- V1 只实现 OpenAI 兼容适配器（引用 **D001** 技术栈决策）\n- 不支持 OAuth 账号自动刷新 token（V2.0）\n- 不支持图片生成（V1.1）\n\n### 6.3 Skills/MCP 管理规则\n\n**标准协议**（引用 **D005**）：\n- Skills 使用 LangChain Tools 标准，MCP 使用 Anthropic Model Context Protocol 标准\n- DGOS 只管理和调用，不执行 Skills/MCP 代码（引用 **D003**：不嵌入 QuickJS/Node.js 运行时）\n- Skills 必须提供 HTTP API 或 CLI 接口\n\n**安装与调用**：\n- Skills 从远程仓库获取元数据（名称、描述、配置项）\n- 安装时保存配置（如 API Key），加密存储\n- 调用时通过 HTTP/CLI 调用远程 Skills，MCP 通过标准协议连接服务器\n\n**可选增强**：\n- Skills 在 AI 工作台中是可选的，用户可以不选择 Skills 直接调用 LLM\n- Skills 调用失败不阻塞 LLM 调用，只记录错误日志\n\n### 6.4 模块系统规则\n\n**模块生命周期**（引用 **D004**）：\n- 使用 Module Federation 实现运行时动态加载，无需重启应用\n- 模块卸载：清理内存和事件监听器\n- 模块热重载：更新后自动加载新版本\n\n**权限模型**（引用 **D006**）：\n- V1 采用粗粒度模块级权限：`providers.call`、`skills.execute`、`mcp.call`、`storage.read`、`storage.write`、`network.local`\n- 授权时机：模块安装时用户一次性授权，官方模块自动授予所有权限\n- 模块更新增加权限时需要用户重新授权\n\n**设计系统强制**（引用 **D008**）：\n- 所有模块必须使用统一设计系统 `@dgos/ui`，禁止 inline styles 或自定义 CSS 覆盖主题变量\n- 主题切换（亮色/暗色）全局生效\n- CI 检查：扫描模块代码，禁止出现 `style={{}}` 或自定义 CSS 变量\n- 模块审核时检查视觉一致性\n\n### 6.5 本地用户管理规则\n\n**用户创建与隔离**：\n- 本地用户无需邮箱，只需用户名和密码\n- 密码使用 bcrypt 或 Argon2 哈希存储\n- 每个用户有独立的数据目录，数据完全隔离，不能跨用户查询\n\n**登录与会话**：\n- 登录成功后生成 JWT Token，有效期 24 小时\n- Token 到期前自动刷新，登出时清除 Token\n\n**边界约束**：\n- V1 不支持云端账号（V2.0）、邮箱验证、OAuth 登录、2FA\n\n### 6.6 局域网协同规则\n\n**服务启动**（引用 **D007**）：\n- 桌面应用启动时自动启动 HTTP 服务，监听 `0.0.0.0:3000`（端口可配置）\n- 只监听局域网，不暴露到公网\n- macOS 首次启动时会弹窗询问防火墙权限\n\n**认证与权限**（引用 **D013**）：\n- 使用简单的用户名/密码认证（HTTP Basic Auth 或 JWT），默认生成随机密码\n- 无认证不能访问任何接口\n- 远程设备只读模式，不能修改 Provider 配置（引用 **D007**）\n- 远程设备可以使用主机的 Provider、Skills、MCP，可以发起对话和查看历史记录\n\n**实时状态**（引用 **D013**）：\n- 使用 WebSocket 连接维持实时通信，心跳检测每 30s\n- 断线重连：客户端自动重连，最多重试 5 次\n- 主机显示实时在线用户列表（用户名、IP、连接时间），可强制断开某个用户\n\n**边界约束**：\n- V1 不支持实时协同编辑（V2.0）、画布协同（画布还未实现）、HTTPS（局域网内认为安全）\n\n### 6.7 画布相关预留设计\n\n虽然无限画布在 V1.2-V1.5 才实现，但 V1 需要预留架构接口（引用 **D009**）：\n\n**从老项目学习**：\n- 保留交互逻辑（拖拽、连线、缩放手感）\n- 重做架构（避免单文件巨石，限制每个节点文件 < 200 行）\n- 节点执行方式：实时执行（用户操作立即执行），非批量执行\n- 支持循环节点（LoopNode）\n\n**预留接口**：\n- 画布数据模型：`projects` 表包含画布 JSON\n- 节点类型注册机制：模块可以注册自定义节点类型\n- 节点执行引擎：支持异步执行和状态管理\n\n**演进路径**详见 [功能演进矩阵](../功能演进矩阵.md) 第 6 节：V1.2（画布核心）→ V1.3（10+ 节点）→ V1.4（实时执行）→ V1.5（工作流导入导出）。\n\n---\n\n## 7. V1.0 状态机与异常处理\n\n### 7.1 Provider 状态机\n\n```\n[创建] → [测试连接]\n         ├─ 成功 → [启用] ← 用户可禁用/启用\n         └─ 失败 → [配置错误]\n\n[启用] → [调用中]\n         ├─ 成功 → [空闲]\n         ├─ 401 错误 → [API Key 无效]（不重试）\n         ├─ 429 错误 → [速率限制] → 重试（1s、2s、4s）\n         ├─ 5xx 错误 → [服务器错误] → 重试（最多 3 次）\n         └─ 网络错误 → [网络异常] → 重试\n```\n\n**重试策略**：\n- 可重试错误：429 速率限制、5xx 服务器错误、网络超时\n- 不可重试错误：401 认证失败、400 参数错误、404 未找到\n- 重试次数：默认 3 次（可配置）\n- 重试间隔：指数退避（1s、2s、4s）\n\n### 7.2 Skills 安装状态机\n\n```\n[浏览仓库] → [查看详情] → [开始安装]\n              → [下载元数据]\n              → [配置参数]（如 API Key）\n              → [保存配置]\n              → [安装完成]\n\n[已安装] ← 可启用/禁用\n         → [调用]\n            ├─ 成功 → [记录使用]\n            └─ 失败 → [记录错误]（不阻塞 LLM 调用）\n```\n\n### 7.3 MCP 连接状态机\n\n```\n[未连接] → [连接中]\n           ├─ 成功 → [已连接] → [获取工具列表]\n           └─ 失败 → [连接失败]\n\n[已连接] → [心跳检测]（每 30s）\n           ├─ 正常 → [已连接]\n           └─ 超时 → [断线] → [自动重连]（最多 5 次）\n```\n\n### 7.4 模块加载状态机\n\n```\n[未加载] → [加载中]\n           → [验证权限]\n           → [加载代码]\n           ├─ 成功 → [运行中]\n           └─ 失败 → [加载失败]（显示错误信息）\n\n[运行中] → [卸载]\n           → [清理资源]\n           → [已卸载]\n\n[运行中] → [热重载]\n           → [卸载旧版本]\n           → [加载新版本]\n           → [运行中]\n```\n\n### 7.5 异常处理原则\n\n**网络超时**：\n- Provider 调用：默认 30s，失败后重试\n- Skills 调用：默认 60s，失败记录日志但不阻塞 LLM\n- MCP 连接：默认 10s，失败后自动重连\n\n**数据完整性**：\n- 使用记录必须保存：即使调用失败也要记录（success=false）\n- 流式输出中断：保存已接收部分到数据库，避免用户看到的内容丢失\n- 模块权限检查：未授权调用返回 403 错误\n\n**用户友好错误**：\n- API Key 无效（401）：提示\"请检查 API Key 是否正确\"\n- 网络错误：提示\"网络连接失败，请检查网络设置\"\n- 速率限制（429）：提示\"请求过于频繁，请稍后重试\"\n- 模块权限不足（403）：提示\"该功能需要授权，请前往设置授权\"\n\n---\n\n## 8. V1.0 数据模型\n\n详见 [V1 数据模型](../../04-技术架构/当前版本/V1-数据模型.md)。\n\n核心表：\n- users（本地用户）\n- providers（Provider 配置）\n- models（模型列表）\n- skills（已安装 Skills）\n- mcp_servers（MCP 服务器）\n- mcp_tools（MCP 工具）\n- installed_modules（已安装模块）\n- module_permissions（模块权限）\n- projects（项目数据）\n\n## 9. V1.0 接口契约\n\n详见 [V1 接口契约](../../04-技术架构/当前版本/V1-接口契约.md)。\n\n### 9.1 Tauri Commands\n\n```rust\n// Provider\nlist_providers() -> Vec<Provider>\nget_provider(id: String) -> Provider\ncreate_provider(config: ProviderConfig) -> Provider\nupdate_provider(id: String, config: ProviderConfig) -> Provider\ndelete_provider(id: String) -> ()\nlist_models(provider_id: String) -> Vec<Model>\ncall_provider(provider_id: String, model_id: String, request: Request) -> Response\nstream_provider(provider_id: String, model_id: String, request: Request) -> Stream<Chunk>\n\n// Skills\nfetch_skills_registry() -> Vec<SkillInfo>\ninstall_skill(config: SkillConfig) -> ()\nuninstall_skill(skill_id: String) -> ()\nlist_installed_skills() -> Vec<Skill>\ncall_skill(skill_id: String, params: Value) -> Value\n\n// MCP\nconnect_mcp(config: MCPConfig) -> ()\ndisconnect_mcp(server_id: String) -> ()\nlist_mcp_servers() -> Vec<MCPServer>\nlist_mcp_tools(server_id: String) -> Vec<MCPTool>\ncall_mcp_tool(server_id: String, tool_name: String, params: Value) -> Value\n\n// Module\nload_module(manifest: Manifest) -> ()\nunload_module(module_id: String) -> ()\nreload_module(module_id: String) -> ()\nlist_installed_modules() -> Vec<Module>\n\n// User\ncreate_user(username: String, password: String) -> User\nlogin(username: String, password: String) -> Session\nlogout() -> ()\nlist_users() -> Vec<User>\n```\n\n### 9.2 HTTP API（局域网）\n\n```\nPOST /api/v1/auth/login          # 认证\nGET  /api/v1/providers           # Provider 列表\nPOST /api/v1/providers/:id/call  # 调用 Provider\nGET  /api/v1/skills              # Skills 列表\nPOST /api/v1/skills/:id/call     # 调用 Skill\nGET  /api/v1/mcp/servers         # MCP 服务器列表\nGET  /api/v1/mcp/tools           # MCP 工具列表\nPOST /api/v1/mcp/call            # 调用 MCP 工具\nGET  /api/v1/modules             # 模块列表\n```\n\n## 10. V1.0 验收标准\n\n### 10.1 功能验收\n\n| 功能 | 验收标准 | 测试方式 | 引用规格 |\n| --- | --- | --- | --- |\n| Provider 框架 | 可配置和调用至少 1 个 Provider | 手动测试 + 单元测试 | V1-FR-001 |\n| Skills 管理 | 可安装和调用至少 1 个 Skill | 手动测试 + 集成测试 | V1-FR-002 |\n| MCP 管理 | 可连接和调用至少 1 个 MCP 服务器 | 手动测试 + 集成测试 | V1-FR-003 |\n| 模块系统 | 模块可热更新，无需重启 | E2E 测试 | V1-FR-004 |\n| 统一设计系统 | 所有模块使用统一组件，主题切换生效 | 视觉测试 + CI 检查 | V1-FR-005 |\n| AI 工作台 | 可发起对话并查看流式响应 | E2E 测试 | V1-FR-006 |\n| 系统设置 | 可管理所有配置 | E2E 测试 | V1-FR-007 |\n| 本地用户 | 可创建多个用户，数据隔离 | 单元测试 + E2E | V1-FR-008 |\n| 模块权限 | 权限检查正确，未授权调用失败 | 单元测试 | V1-FR-009 |\n| 局域网协同 | 远程设备可访问，只读模式正确 | 手动测试 | V1-FR-010 |\n\n### 10.2 性能验收\n\n| 指标 | 目标 | 测试方式 |\n| --- | --- | --- |\n| 应用启动时间 | < 2 秒 | 启动日志分析 |\n| 模块加载时间 | < 1 秒 | 加载日志分析 |\n| API 响应时间（P95） | < 200ms | APM 监控 |\n| UI 交互帧率 | > 60fps | Chrome DevTools |\n| SQLite 数据库大小 | < 100MB（初始） | 文件大小检查 |\n| 内存占用（空闲） | < 200MB | 任务管理器 |\n\n### 10.3 质量验收\n\n| 指标 | 目标 | 测试方式 |\n| --- | --- | --- |\n| 核心功能单元测试覆盖率 | > 60% | 代码覆盖率工具 |\n| API 集成测试覆盖率 | > 80% | 测试报告 |\n| 文档覆盖率 | > 80% | 文档检查清单 |\n| P0/P1 Bug 数量 | 0 | Bug 跟踪系统 |\n| 代码规范检查 | 0 警告 | CI Lint |\n| 单文件行数 | < 1000 行 | CI 检查 |\n\n## 11. V1.0 发布门禁\n\nV1.0 功能完成后，正式发布前必须通过发布门禁：\n\n### 11.1 必须完成\n\n- [ ] 所有 P0 功能验收通过\n- [ ] 所有性能指标达标\n- [ ] 所有质量指标达标\n- [ ] 用户文档完成度 > 80%\n- [ ] 开发者文档完成度 > 80%\n- [ ] 安装包构建成功（macOS）\n- [ ] 安装测试通过（全新环境）\n- [ ] 升级测试通过（从 alpha 版本升级）\n\n### 11.2 可延后但需记录\n\n- [ ] Windows 支持（V1.1）\n- [ ] Linux 支持（V1.2）\n- [ ] 性能监控系统（V1.2）\n- [ ] 崩溃报告系统（V1.2）\n- [ ] 自动更新系统（V1.2）\n\n## 12. V1.0 已知限制\n\n以下是 V1.0 的已知限制，将在后续版本中改进：\n\n| 限制 | 影响 | 计划版本 |\n| --- | --- | --- |\n| 只支持 macOS | Windows/Linux 用户无法使用 | V1.1/V1.2 |\n| 只有 OpenAI 适配器 | 其他厂商模型无法使用 | V1.1 |\n| 没有无限画布 | 核心价值功能缺失 | V1.2-V1.5 |\n| 没有应用市场 | 第三方模块无法分发 | V1.5 |\n| 没有云端账号 | 无法跨设备同步 | V2.0 |\n| 没有实时协同编辑 | 团队协作受限 | V2.0 |\n| 权限模型粗粒度 | 无法细粒度控制 | V2.0 |\n\n## 13. V1.0 后续计划\n\nV1.0 发布后，立即启动 V1.1 开发：\n\n**V1.1 Windows 支持 + 更多适配器（+1 个月）**：\n- Windows 平台支持\n- Claude 适配器\n- Gemini 适配器\n- 通义千问适配器\n\n**V1.2-V1.5 画布系统（+4 个月）**：\n- V1.2：画布核心（视口、缩放、拖拽）+ 5 种基础节点\n- V1.3：10+ 种节点类型、节点连线系统\n- V1.4：实时执行、循环节点\n- V1.5：工作流导入导出、布局算法优化、应用市场\n\n详见 [版本路线图](../版本路线图.md)。\n\n---\n\n**最后更新**：2026-10-26  \n**更新人**：Kiro + spec-docs-pro  \n**状态**：Active  \n**符合 spec-docs-pro 标准**：✅ 已补齐业务规则和状态机章节\n", "doc-008": "# V1.0 产品需求\n\n## 1. 文档目标\n\n本文档只定义 DGOS 第一版本（V1.0）功能。\n\n本文档冻结 V1.0 交付范围。若 V1.0 子文档之间出现表述不一致，以 [V1 版本总览](V1-版本总览.md) 的范围口径为准；接口、数据表、架构和验收细节分别见同目录下的专项文档。\n\n## 2. V1.0 定位\n\nV1.0 建立本地优先的 AI 应用开发框架最小闭环：提供 Provider 适配、Skills/MCP 管理和模块系统基础能力，验证框架可扩展性。无限画布等核心价值功能分多版本完成，不阻塞 V1.0 交付。\n\n### 2.1 核心目标\n\n- ✅ 打通底层能力框架最小闭环\n- ✅ 验证架构可扩展性\n- ✅ 建立强制模块化规范\n- ✅ 避免重蹈老项目覆辙\n- ✅ 为后续版本打好底座\n\n### 2.2 非目标\n\n- ❌ 不求功能完整（画布、市场、协同延后）\n- ❌ 不求用户规模（先验证架构正确）\n- ❌ 不求商业变现（V2.0 才考虑）\n- ❌ 不支持 Windows（V1.1 再做）\n\n## 3. V1.0 功能分层\n\nV1.0 建议拆成 7 层开发。每一层完成后都应该能独立验收。\n\n### Layer 1：基础框架层（Week 1-2）\n\n**目标**：让系统能跑起来\n\n**包含**：\n- Tauri 应用骨架\n- Rust 后端骨架（Axum）\n- SQLite 数据库初始化\n- React 前端骨架（Vite）\n- 基础路由系统\n- 简单的本地用户管理\n\n**验收标准**：\n- [x] 应用可启动\n- [x] 创建本地用户成功\n- [x] SQLite 数据库创建成功\n- [x] 前端路由跳转正常\n\n### Layer 2：Provider 框架层（Week 3-4）\n\n**目标**：让用户能调用 AI 模型\n\n**包含**：\n- V1-FR-001 Provider 适配框架\n  - Provider CRUD 接口\n  - OpenAI 适配器实现\n  - 模型列表获取\n  - 模型分类标签（内置维护）\n  - 模型调用接口（同步/流式）\n  - 使用记录\n\n**验收标准**：\n- [x] 可配置至少 1 个 OpenAI Provider\n- [x] 可获取模型列表\n- [x] 模型正确分类（text-generation、image-generation）\n- [x] 可成功调用 GPT-4 并返回结果\n- [x] 流式输出正常工作\n- [x] 使用记录保存正确\n\n### Layer 3：Skills/MCP 管理层（Week 5-6）\n\n**目标**：让系统能扩展 AI 能力\n\n**包含**：\n- V1-FR-002 Skills 管理系统\n  - 远程仓库连接\n  - Skills 列表获取\n  - Skills 安装/卸载\n  - Skills 配置管理\n  - Skills 调用接口（HTTP/CLI）\n  - 使用记录\n- V1-FR-003 MCP 管理系统\n  - MCP 服务器连接\n  - 工具列表获取\n  - MCP 工具调用\n  - 连接状态监控\n\n**验收标准**：\n- [x] 可连接至少 1 个 Skills 仓库\n- [x] 可安装至少 1 个 Skill\n- [x] 可成功调用 Skill 并返回结果\n- [x] 可连接至少 1 个 MCP 服务器\n- [x] 可调用 MCP 工具\n\n### Layer 4：模块系统层（Week 7-8）\n\n**目标**：让应用支持热更新模块\n\n**包含**：\n- V1-FR-004 模块系统与热更新\n  - Module Federation 集成\n  - 模块动态加载\n  - 模块卸载\n  - 模块热重载\n  - 模块权限管理（粗粒度）\n  - 模块配置（manifest.json）\n- V1-FR-005 统一设计系统\n  - 主题系统（亮色/暗色）\n  - 色彩规范\n  - 字体规范\n  - 间距规范\n  - 基础 UI 组件库（10+ 组件）\n\n**验收标准**：\n- [x] 可加载至少 2 个官方模块\n- [x] 模块更新无需重启\n- [x] 模块权限正确隔离\n- [x] 所有模块使用统一设计系统\n- [x] 主题切换全局生效\n\n### Layer 5：基础应用层（Week 9-10）\n\n**目标**：让用户有基础应用可用\n\n**包含**：\n- V1-FR-006 AI 工作台\n  - 简单对话界面\n  - Provider 选择\n  - 历史记录查看\n  - Prompt 输入\n  - 流式响应展示\n  - （可选）Skills 选择\n- V1-FR-007 系统设置\n  - Provider 管理界面\n  - Skills 管理界面\n  - MCP 管理界面\n  - 模块管理界面\n  - 主题切换\n  - 用户管理\n\n**验收标准**：\n- [x] 可在 AI 工作台发起对话\n- [x] 可选择 Provider 和模型\n- [x] 流式响应实时展示\n- [x] 历史记录正确保存\n- [x] 可在系统设置管理所有配置\n\n### Layer 6：系统功能层（Week 11）\n\n**目标**：补齐系统级功能\n\n**包含**：\n- V1-FR-008 本地用户管理\n  - 创建本地用户\n  - 用户登录\n  - 用户切换\n  - 用户删除\n- V1-FR-009 模块权限管理\n  - 权限申请\n  - 权限授予\n  - 权限检查\n  - 权限撤销\n- V1-FR-010 局域网协同\n  - HTTP 服务自动启动\n  - 端口配置\n  - 简单认证（用户名/密码）\n  - 远程设备只读模式\n  - 连接用户显示\n\n**验收标准**：\n- [x] 可创建多个本地用户\n- [x] 用户数据正确隔离\n- [x] 模块权限正确检查\n- [x] HTTP 服务自动启动\n- [x] 远程设备可访问并使用\n\n### Layer 7：测试与优化（Week 12）\n\n**目标**：通过发布门禁\n\n**包含**：\n- 单元测试补齐\n- 集成测试\n- E2E 测试\n- 性能优化\n- 文档完善\n- Bug 修复\n\n**验收标准**：\n- [x] 所有 P0 功能验收通过\n- [x] 应用启动时间 < 2 秒\n- [x] 模块加载时间 < 1 秒\n- [x] API 响应时间（P95）< 200ms\n- [x] 核心功能单元测试覆盖率 > 60%\n- [x] 文档覆盖率 > 80%\n- [x] 零 P0/P1 Bug\n\n## 4. V1.0 功能清单\n\n| 功能 ID | 功能名称 | 领域 | 优先级 | 验收标准 | 引用规格 |\n| --- | --- | --- | --- | --- | --- |\n| V1-FR-001 | Provider 适配框架 | 底层能力 | P0 | 可配置和调用至少 1 个 Provider | [01-Provider适配框架](../../03-功能规格/V1/01-底层能力/01-Provider适配框架.md) |\n| V1-FR-002 | Skills 管理系统 | 底层能力 | P0 | 可安装和调用至少 1 个 Skill | [02-Skills管理系统](../../03-功能规格/V1/01-底层能力/02-Skills管理系统.md) |\n| V1-FR-003 | MCP 管理系统 | 底层能力 | P0 | 可连接和调用至少 1 个 MCP 服务器 | [03-MCP管理系统](../../03-功能规格/V1/01-底层能力/03-MCP管理系统.md) |\n| V1-FR-004 | 模块系统与热更新 | 底层能力 | P0 | 模块可热更新，无需重启 | [04-模块系统与热更新](../../03-功能规格/V1/01-底层能力/04-模块系统与热更新.md) |\n| V1-FR-005 | 统一设计系统 | 底层能力 | P0 | 所有模块使用统一组件 | [05-统一设计系统](../../03-功能规格/V1/01-底层能力/05-统一设计系统.md) |\n| V1-FR-006 | AI 工作台 | 应用模块 | P0 | 可发起对话并查看结果 | [01-AI工作台](../../03-功能规格/V1/02-应用模块/01-AI工作台.md) |\n| V1-FR-007 | 系统设置 | 应用模块 | P0 | 可管理所有配置 | [02-系统设置](../../03-功能规格/V1/02-应用模块/02-系统设置.md) |\n| V1-FR-008 | 本地用户管理 | 系统功能 | P0 | 可创建多个用户，数据隔离 | [01-本地用户管理](../../03-功能规格/V1/03-系统功能/01-本地用户管理.md) |\n| V1-FR-009 | 模块权限管理 | 系统功能 | P0 | 权限检查正确 | [02-模块权限管理](../../03-功能规格/V1/03-系统功能/02-模块权限管理.md) |\n| V1-FR-010 | 局域网协同 | 系统功能 | P0 | 远程设备可访问 | [03-局域网协同](../../03-功能规格/V1/03-系统功能/03-局域网协同.md) |\n\n## 5. V1.0 核心流程\n\n### 5.1 用户首次使用流程\n\n```\n1. 用户下载 DGOS-v1.0.dmg\n2. 拖拽到应用程序文件夹\n3. 双击启动 DGOS\n4. 系统提示创建本地用户\n5. 输入用户名、密码\n6. 创建用户成功，进入主界面\n7. 系统提示配置 Provider\n8. 点击\"去配置\"，跳转到系统设置\n9. 点击\"添加 Provider\"\n10. 选择 OpenAI 兼容类型\n11. 输入名称、base_url、API Key\n12. 点击\"测试连接\"\n13. 测试成功，保存 Provider\n14. 回到主界面，打开 AI 工作台\n15. 输入提示词：\"你好\"\n16. 选择模型：gpt-4\n17. 点击发送\n18. 查看流式响应结果\n19. 查看历史记录\n```\n\n### 5.2 安装 Skill 流程\n\n```\n1. 打开系统设置\n2. 点击\"Skills 管理\"\n3. 点击\"浏览 Skills 仓库\"\n4. 搜索或浏览 Skills 列表\n5. 点击某个 Skill 查看详情\n6. 点击\"安装\"\n7. 输入配置（如 API Key）\n8. 安装完成\n9. Skills 出现在已安装列表\n10. 回到 AI 工作台\n11. 发起对话时，可选择该 Skill\n12. Skill 增强生成效果\n```\n\n### 5.3 局域网协同流程\n\n```\n主机：\n1. DGOS 启动时自动启动 HTTP 服务\n2. 显示局域网地址：http://192.168.1.100:3000\n3. 显示认证密码（随机生成或用户设置）\n\n远程设备：\n1. 打开浏览器\n2. 访问 http://192.168.1.100:3000\n3. 输入用户名、密码\n4. 认证成功，进入 DGOS Web 端\n5. 可以使用主机的 Provider、Skills、MCP\n6. 可以发起对话\n7. 可以查看历史记录\n8. 不能修改 Provider 配置（只读模式）\n\n主机显示：\n1. 实时显示连接用户列表\n2. 显示用户名、IP 地址、连接时间\n3. 可以强制断开某个用户\n```\n\n## 6. V1.0 核心业务规则\n\n### 6.1 决策引用说明\n\n本章节引用的冻结决策详见 [V1 冻结决策](../../06-决策记录/V1-冻结决策.md)。决策编号以 `D` 开头，一旦分配永不改变。\n\n### 6.2 Provider 管理规则\n\n**配置与调用**：\n- 用户可配置多个同类型 Provider（如多个 OpenAI 账号），通过拖拽排序，排序第一的作为默认选择（引用 **D012**）\n- Provider 配置包含：名称、类型、base_url、API Key、重试策略\n- API Key 必须加密存储（SQLCipher 或 AES-256）\n- 调用失败时，可配置重试次数（默认 3 次）和指数退避策略（1s、2s、4s）\n- 可重试错误：429 速率限制、5xx 服务器错误、网络超时；不可重试：401 认证失败、400 参数错误\n\n**模型同步**：\n- Provider 创建成功后，自动获取模型列表并缓存到 `models` 表\n- 模型分类标签内置维护：`text-generation`、`image-generation`、`video-generation`、`audio-generation`\n- 用户可手动刷新模型列表，缓存有效期 24 小时\n\n**流式调用**：\n- 流式调用返回 SSE（Server-Sent Events）格式数据\n- 流中断时，保存已接收部分到数据库，避免用户看到的内容丢失\n- 使用记录必须包含：tokens、latency、success、error_code\n\n**边界约束**：\n- V1 只实现 OpenAI 兼容适配器（引用 **D001** 技术栈决策）\n- 不支持 OAuth 账号自动刷新 token（V2.0）\n- 不支持图片生成（V1.1）\n\n### 6.3 Skills/MCP 管理规则\n\n**标准协议**（引用 **D005**）：\n- Skills 使用 LangChain Tools 标准，MCP 使用 Anthropic Model Context Protocol 标准\n- DGOS 只管理和调用，不执行 Skills/MCP 代码（引用 **D003**：不嵌入 QuickJS/Node.js 运行时）\n- Skills 必须提供 HTTP API 或 CLI 接口\n\n**安装与调用**：\n- Skills 从远程仓库获取元数据（名称、描述、配置项）\n- 安装时保存配置（如 API Key），加密存储\n- 调用时通过 HTTP/CLI 调用远程 Skills，MCP 通过标准协议连接服务器\n\n**可选增强**：\n- Skills 在 AI 工作台中是可选的，用户可以不选择 Skills 直接调用 LLM\n- Skills 调用失败不阻塞 LLM 调用，只记录错误日志\n\n### 6.4 模块系统规则\n\n**模块生命周期**（引用 **D004**）：\n- 使用 Module Federation 实现运行时动态加载，无需重启应用\n- 模块卸载：清理内存和事件监听器\n- 模块热重载：更新后自动加载新版本\n\n**权限模型**（引用 **D006**）：\n- V1 采用粗粒度模块级权限：`providers.call`、`skills.execute`、`mcp.call`、`storage.read`、`storage.write`、`network.local`\n- 授权时机：模块安装时用户一次性授权，官方模块自动授予所有权限\n- 模块更新增加权限时需要用户重新授权\n\n**设计系统强制**（引用 **D008**）：\n- 所有模块必须使用统一设计系统 `@dgos/ui`，禁止 inline styles 或自定义 CSS 覆盖主题变量\n- 主题切换（亮色/暗色）全局生效\n- CI 检查：扫描模块代码，禁止出现 `style={{}}` 或自定义 CSS 变量\n- 模块审核时检查视觉一致性\n\n### 6.5 本地用户管理规则\n\n**用户创建与隔离**：\n- 本地用户无需邮箱，只需用户名和密码\n- 密码使用 bcrypt 或 Argon2 哈希存储\n- 每个用户有独立的数据目录，数据完全隔离，不能跨用户查询\n\n**登录与会话**：\n- 登录成功后生成 JWT Token，有效期 24 小时\n- Token 到期前自动刷新，登出时清除 Token\n\n**边界约束**：\n- V1 不支持云端账号（V2.0）、邮箱验证、OAuth 登录、2FA\n\n### 6.6 局域网协同规则\n\n**服务启动**（引用 **D007**）：\n- 桌面应用启动时自动启动 HTTP 服务，监听 `0.0.0.0:3000`（端口可配置）\n- 只监听局域网，不暴露到公网\n- macOS 首次启动时会弹窗询问防火墙权限\n\n**认证与权限**（引用 **D013**）：\n- 使用简单的用户名/密码认证（HTTP Basic Auth 或 JWT），默认生成随机密码\n- 无认证不能访问任何接口\n- 远程设备只读模式，不能修改 Provider 配置（引用 **D007**）\n- 远程设备可以使用主机的 Provider、Skills、MCP，可以发起对话和查看历史记录\n\n**实时状态**（引用 **D013**）：\n- 使用 WebSocket 连接维持实时通信，心跳检测每 30s\n- 断线重连：客户端自动重连，最多重试 5 次\n- 主机显示实时在线用户列表（用户名、IP、连接时间），可强制断开某个用户\n\n**边界约束**：\n- V1 不支持实时协同编辑（V2.0）、画布协同（画布还未实现）、HTTPS（局域网内认为安全）\n\n### 6.7 画布相关预留设计\n\n虽然无限画布在 V1.2-V1.5 才实现，但 V1 需要预留架构接口（引用 **D009**）：\n\n**从老项目学习**：\n- 保留交互逻辑（拖拽、连线、缩放手感）\n- 重做架构（避免单文件巨石，限制每个节点文件 < 200 行）\n- 节点执行方式：实时执行（用户操作立即执行），非批量执行\n- 支持循环节点（LoopNode）\n\n**预留接口**：\n- 画布数据模型：`projects` 表包含画布 JSON\n- 节点类型注册机制：模块可以注册自定义节点类型\n- 节点执行引擎：支持异步执行和状态管理\n\n**演进路径**详见 [功能演进矩阵](../功能演进矩阵.md) 第 6 节：V1.2（画布核心）→ V1.3（10+ 节点）→ V1.4（实时执行）→ V1.5（工作流导入导出）。\n\n---\n\n## 7. V1.0 状态机与异常处理\n\n### 7.1 Provider 状态机\n\n```\n[创建] → [测试连接]\n         ├─ 成功 → [启用] ← 用户可禁用/启用\n         └─ 失败 → [配置错误]\n\n[启用] → [调用中]\n         ├─ 成功 → [空闲]\n         ├─ 401 错误 → [API Key 无效]（不重试）\n         ├─ 429 错误 → [速率限制] → 重试（1s、2s、4s）\n         ├─ 5xx 错误 → [服务器错误] → 重试（最多 3 次）\n         └─ 网络错误 → [网络异常] → 重试\n```\n\n**重试策略**：\n- 可重试错误：429 速率限制、5xx 服务器错误、网络超时\n- 不可重试错误：401 认证失败、400 参数错误、404 未找到\n- 重试次数：默认 3 次（可配置）\n- 重试间隔：指数退避（1s、2s、4s）\n\n### 7.2 Skills 安装状态机\n\n```\n[浏览仓库] → [查看详情] → [开始安装]\n              → [下载元数据]\n              → [配置参数]（如 API Key）\n              → [保存配置]\n              → [安装完成]\n\n[已安装] ← 可启用/禁用\n         → [调用]\n            ├─ 成功 → [记录使用]\n            └─ 失败 → [记录错误]（不阻塞 LLM 调用）\n```\n\n### 7.3 MCP 连接状态机\n\n```\n[未连接] → [连接中]\n           ├─ 成功 → [已连接] → [获取工具列表]\n           └─ 失败 → [连接失败]\n\n[已连接] → [心跳检测]（每 30s）\n           ├─ 正常 → [已连接]\n           └─ 超时 → [断线] → [自动重连]（最多 5 次）\n```\n\n### 7.4 模块加载状态机\n\n```\n[未加载] → [加载中]\n           → [验证权限]\n           → [加载代码]\n           ├─ 成功 → [运行中]\n           └─ 失败 → [加载失败]（显示错误信息）\n\n[运行中] → [卸载]\n           → [清理资源]\n           → [已卸载]\n\n[运行中] → [热重载]\n           → [卸载旧版本]\n           → [加载新版本]\n           → [运行中]\n```\n\n### 7.5 异常处理原则\n\n**网络超时**：\n- Provider 调用：默认 30s，失败后重试\n- Skills 调用：默认 60s，失败记录日志但不阻塞 LLM\n- MCP 连接：默认 10s，失败后自动重连\n\n**数据完整性**：\n- 使用记录必须保存：即使调用失败也要记录（success=false）\n- 流式输出中断：保存已接收部分到数据库，避免用户看到的内容丢失\n- 模块权限检查：未授权调用返回 403 错误\n\n**用户友好错误**：\n- API Key 无效（401）：提示\"请检查 API Key 是否正确\"\n- 网络错误：提示\"网络连接失败，请检查网络设置\"\n- 速率限制（429）：提示\"请求过于频繁，请稍后重试\"\n- 模块权限不足（403）：提示\"该功能需要授权，请前往设置授权\"\n\n---\n\n## 8. V1.0 数据模型\n\n详见 [V1 数据模型](../../04-技术架构/当前版本/V1-数据模型.md)。\n\n核心表：\n- users（本地用户）\n- providers（Provider 配置）\n- models（模型列表）\n- skills（已安装 Skills）\n- mcp_servers（MCP 服务器）\n- mcp_tools（MCP 工具）\n- installed_modules（已安装模块）\n- module_permissions（模块权限）\n- projects（项目数据）\n\n## 9. V1.0 接口契约\n\n详见 [V1 接口契约](../../04-技术架构/当前版本/V1-接口契约.md)。\n\n### 9.1 Tauri Commands\n\n```rust\n// Provider\nlist_providers() -> Vec<Provider>\nget_provider(id: String) -> Provider\ncreate_provider(config: ProviderConfig) -> Provider\nupdate_provider(id: String, config: ProviderConfig) -> Provider\ndelete_provider(id: String) -> ()\nlist_models(provider_id: String) -> Vec<Model>\ncall_provider(provider_id: String, model_id: String, request: Request) -> Response\nstream_provider(provider_id: String, model_id: String, request: Request) -> Stream<Chunk>\n\n// Skills\nfetch_skills_registry() -> Vec<SkillInfo>\ninstall_skill(config: SkillConfig) -> ()\nuninstall_skill(skill_id: String) -> ()\nlist_installed_skills() -> Vec<Skill>\ncall_skill(skill_id: String, params: Value) -> Value\n\n// MCP\nconnect_mcp(config: MCPConfig) -> ()\ndisconnect_mcp(server_id: String) -> ()\nlist_mcp_servers() -> Vec<MCPServer>\nlist_mcp_tools(server_id: String) -> Vec<MCPTool>\ncall_mcp_tool(server_id: String, tool_name: String, params: Value) -> Value\n\n// Module\nload_module(manifest: Manifest) -> ()\nunload_module(module_id: String) -> ()\nreload_module(module_id: String) -> ()\nlist_installed_modules() -> Vec<Module>\n\n// User\ncreate_user(username: String, password: String) -> User\nlogin(username: String, password: String) -> Session\nlogout() -> ()\nlist_users() -> Vec<User>\n```\n\n### 9.2 HTTP API（局域网）\n\n```\nPOST /api/v1/auth/login          # 认证\nGET  /api/v1/providers           # Provider 列表\nPOST /api/v1/providers/:id/call  # 调用 Provider\nGET  /api/v1/skills              # Skills 列表\nPOST /api/v1/skills/:id/call     # 调用 Skill\nGET  /api/v1/mcp/servers         # MCP 服务器列表\nGET  /api/v1/mcp/tools           # MCP 工具列表\nPOST /api/v1/mcp/call            # 调用 MCP 工具\nGET  /api/v1/modules             # 模块列表\n```\n\n## 10. V1.0 验收标准\n\n### 10.1 功能验收\n\n| 功能 | 验收标准 | 测试方式 | 引用规格 |\n| --- | --- | --- | --- |\n| Provider 框架 | 可配置和调用至少 1 个 Provider | 手动测试 + 单元测试 | V1-FR-001 |\n| Skills 管理 | 可安装和调用至少 1 个 Skill | 手动测试 + 集成测试 | V1-FR-002 |\n| MCP 管理 | 可连接和调用至少 1 个 MCP 服务器 | 手动测试 + 集成测试 | V1-FR-003 |\n| 模块系统 | 模块可热更新，无需重启 | E2E 测试 | V1-FR-004 |\n| 统一设计系统 | 所有模块使用统一组件，主题切换生效 | 视觉测试 + CI 检查 | V1-FR-005 |\n| AI 工作台 | 可发起对话并查看流式响应 | E2E 测试 | V1-FR-006 |\n| 系统设置 | 可管理所有配置 | E2E 测试 | V1-FR-007 |\n| 本地用户 | 可创建多个用户，数据隔离 | 单元测试 + E2E | V1-FR-008 |\n| 模块权限 | 权限检查正确，未授权调用失败 | 单元测试 | V1-FR-009 |\n| 局域网协同 | 远程设备可访问，只读模式正确 | 手动测试 | V1-FR-010 |\n\n### 10.2 性能验收\n\n| 指标 | 目标 | 测试方式 |\n| --- | --- | --- |\n| 应用启动时间 | < 2 秒 | 启动日志分析 |\n| 模块加载时间 | < 1 秒 | 加载日志分析 |\n| API 响应时间（P95） | < 200ms | APM 监控 |\n| UI 交互帧率 | > 60fps | Chrome DevTools |\n| SQLite 数据库大小 | < 100MB（初始） | 文件大小检查 |\n| 内存占用（空闲） | < 200MB | 任务管理器 |\n\n### 10.3 质量验收\n\n| 指标 | 目标 | 测试方式 |\n| --- | --- | --- |\n| 核心功能单元测试覆盖率 | > 60% | 代码覆盖率工具 |\n| API 集成测试覆盖率 | > 80% | 测试报告 |\n| 文档覆盖率 | > 80% | 文档检查清单 |\n| P0/P1 Bug 数量 | 0 | Bug 跟踪系统 |\n| 代码规范检查 | 0 警告 | CI Lint |\n| 单文件行数 | < 1000 行 | CI 检查 |\n\n## 11. V1.0 发布门禁\n\nV1.0 功能完成后，正式发布前必须通过发布门禁：\n\n### 11.1 必须完成\n\n- [ ] 所有 P0 功能验收通过\n- [ ] 所有性能指标达标\n- [ ] 所有质量指标达标\n- [ ] 用户文档完成度 > 80%\n- [ ] 开发者文档完成度 > 80%\n- [ ] 安装包构建成功（macOS）\n- [ ] 安装测试通过（全新环境）\n- [ ] 升级测试通过（从 alpha 版本升级）\n\n### 11.2 可延后但需记录\n\n- [ ] Windows 支持（V1.1）\n- [ ] Linux 支持（V1.2）\n- [ ] 性能监控系统（V1.2）\n- [ ] 崩溃报告系统（V1.2）\n- [ ] 自动更新系统（V1.2）\n\n## 12. V1.0 已知限制\n\n以下是 V1.0 的已知限制，将在后续版本中改进：\n\n| 限制 | 影响 | 计划版本 |\n| --- | --- | --- |\n| 只支持 macOS | Windows/Linux 用户无法使用 | V1.1/V1.2 |\n| 只有 OpenAI 适配器 | 其他厂商模型无法使用 | V1.1 |\n| 没有无限画布 | 核心价值功能缺失 | V1.2-V1.5 |\n| 没有应用市场 | 第三方模块无法分发 | V1.5 |\n| 没有云端账号 | 无法跨设备同步 | V2.0 |\n| 没有实时协同编辑 | 团队协作受限 | V2.0 |\n| 权限模型粗粒度 | 无法细粒度控制 | V2.0 |\n\n## 13. V1.0 后续计划\n\nV1.0 发布后，立即启动 V1.1 开发：\n\n**V1.1 Windows 支持 + 更多适配器（+1 个月）**：\n- Windows 平台支持\n- Claude 适配器\n- Gemini 适配器\n- 通义千问适配器\n\n**V1.2-V1.5 画布系统（+4 个月）**：\n- V1.2：画布核心（视口、缩放、拖拽）+ 5 种基础节点\n- V1.3：10+ 种节点类型、节点连线系统\n- V1.4：实时执行、循环节点\n- V1.5：工作流导入导出、布局算法优化、应用市场\n\n详见 [版本路线图](../版本路线图.md)。\n\n---\n\n**最后更新**：2026-10-26  \n**更新人**：Kiro + spec-docs-pro  \n**状态**：Active  \n**符合 spec-docs-pro 标准**：✅ 已补齐业务规则和状态机章节\n", "doc-009": "# V1.
