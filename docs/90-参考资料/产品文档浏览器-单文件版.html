体到某个 Provider、某个文件路径\n\n### 2.3 功能边界\n\n**V1 权限类型（6 种）**：\n\n1. **provider_access**：访问 Provider（调用 AI 模型）\n2. **skills_access**：访问 Skills（调用 Skills 工具）\n3. **mcp_access**：访问 MCP（调用 MCP 工具）\n4. **file_read**：读取文件系统\n5. **file_write**：写入文件系统\n6. **network**：访问网络（HTTP 请求）\n\n**包含**：\n- ✅ 权限定义和存储\n- ✅ 模块安装时权限申请（manifest.json）\n- ✅ 用户授权界面（安装时显示权限列表）\n- ✅ 运行时权限检查（拦截器）\n- ✅ 权限授予/撤销\n- ✅ 权限日志记录\n- ✅ 权限查询（查看模块有哪些权限）\n- ✅ 权限拒绝错误处理\n\n**不包含**（明确说明原因）：\n- ❌ 细粒度权限（具体 Provider、文件路径） → V2 实现\n- ❌ 角色权限（RBAC） → V2 实现\n- ❌ 动态权限申请（运行时申请） → V2 实现\n- ❌ 权限组（权限集合） → V2 实现\n- ❌ 临时权限（时间限制） → V2 实现\n\n## 3. 核心流程\n\n### 3.1 模块安装时权限申请流程\n\n```\n用户安装模块（AI 工作台）\n  ↓\n系统读取 manifest.json：\n  \"permissions\": {\n    \"provider_access\": true,\n    \"skills_access\": true,\n    \"file_read\": true\n  }\n  ↓\n显示权限确认对话框：\n  \"AI 工作台请求以下权限：\n   - 访问 Provider（调用 AI 模型）\n   - 访问 Skills（使用工具）\n   - 读取文件\n   \n   是否授予这些权限？\"\n  ↓\n用户点击\"授予\"\n  ↓\n保存权限到数据库：\n  INSERT INTO module_permissions (module_id, permission_type, granted)\n  VALUES ('ai-workbench', 'provider_access', TRUE)\n  ↓\n模块安装成功\n```\n\n### 3.2 运行时权限检查流程\n\n```\nAI 工作台调用 Provider\n  ↓\n前端调用：invoke('call_provider', { providerId, ... })\n  ↓\nTauri Command 接收请求\n  ↓\n权限拦截器介入\n  ↓\n提取 module_id（从调用上下文）\n  ↓\n查询数据库：\n  SELECT granted FROM module_permissions\n  WHERE module_id = 'ai-workbench'\n    AND permission_type = 'provider_access'\n  ↓\n（如果 granted = TRUE）放行，继续调用\n  ↓\n（如果 granted = FALSE 或不存在）拒绝\n  ↓\n记录权限拒绝日志\n  ↓\n返回错误：PermissionDenied\n  ↓\n前端显示：\"AI 工作台无权访问 Provider\"\n```\n\n### 3.3 用户撤销权限流程\n\n```\n用户打开系统设置\n  ↓\n点击\"模块\"标签\n  ↓\n选择\"AI 工作台\"\n  ↓\n查看模块详情\n  ↓\n显示权限列表：\n  ✓ 访问 Provider\n  ✓ 访问 Skills\n  ✓ 读取文件\n  ↓\n用户点击\"撤销 Provider 访问\"\n  ↓\n确认提示：\"撤销后，模块将无法调用 AI 模型\"\n  ↓\n用户确认\n  ↓\n更新数据库：\n  UPDATE module_permissions\n  SET granted = FALSE\n  WHERE module_id = 'ai-workbench'\n    AND permission_type = 'provider_access'\n  ↓\n记录权限撤销日志\n  ↓\n显示\"权限已撤销\"\n  ↓\n（下次模块调用 Provider 时会被拒绝）\n```\n\n### 3.4 模块更新时权限变更流程\n\n```\n模块有新版本\n  ↓\n用户点击\"更新\"\n  ↓\n系统读取新版本 manifest.json\n  ↓\n对比权限变更：\n  旧版本：provider_access, skills_access\n  新版本：provider_access, skills_access, file_write (新增)\n  ↓\n显示权限变更提示：\n  \"新版本请求额外权限：\n   - 写入文件\n   \n   是否授予并更新？\"\n  ↓\n用户确认\n  ↓\n保存新权限到数据库\n  ↓\n更新模块\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**module_permissions 表**（模块权限，已在 V1-FR-004 定义）：\n```sql\nCREATE TABLE module_permissions (\n    id TEXT PRIMARY KEY,\n    module_id TEXT NOT NULL,          -- 模块标识\n    permission_type TEXT NOT NULL,    -- 权限类型\n    resource_id TEXT,                 -- 资源 ID（V1 为空，V2 使用）\n    granted BOOLEAN DEFAULT FALSE,    -- 是否授予\n    granted_at TIMESTAMP,             -- 授予时间\n    granted_by TEXT,                  -- 授予人（user_id）\n    revoked_at TIMESTAMP,             -- 撤销时间（如果撤销）\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\n    UNIQUE(module_id, permission_type, user_id)\n);\n\nCREATE INDEX idx_permissions_module ON module_permissions(module_id, permission_type);\n```\n\n**permission_logs 表**（权限日志，新增）：\n```sql\nCREATE TABLE permission_logs (\n    id TEXT PRIMARY KEY,\n    module_id TEXT NOT NULL,\n    permission_type TEXT NOT NULL,\n    action TEXT NOT NULL,             -- 动作：granted, revoked, denied\n    resource_id TEXT,                 -- 尝试访问的资源 ID（如 provider_id）\n    user_id TEXT,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n\nCREATE INDEX idx_permission_logs_module ON permission_logs(module_id);\nCREATE INDEX idx_permission_logs_time ON permission_logs(created_at);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 检查权限：`SELECT granted FROM module_permissions WHERE module_id = ? AND permission_type = ? AND user_id = ?`\n- 查询模块权限：`SELECT * FROM module_permissions WHERE module_id = ? AND user_id = ?`\n- 查询权限日志：`SELECT * FROM permission_logs WHERE module_id = ? ORDER BY created_at DESC`\n\n**写操作**：\n- 授予权限：`INSERT INTO module_permissions ... ON CONFLICT UPDATE SET granted = TRUE, granted_at = ?`\n- 撤销权限：`UPDATE module_permissions SET granted = FALSE, revoked_at = ? WHERE ...`\n- 记录日志：`INSERT INTO permission_logs (module_id, permission_type, action, ...) VALUES (...)`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 安装时显示权限 | 模块需要权限 | 安装模块 | 显示权限列表 | E2E | `tests/e2e/permission_grant.spec.ts` | `pnpm test:e2e permission_grant` | 规划中 |\n| AC02 | 用户授予权限 | 权限列表显示 | 点击\"授予\" | 权限保存到数据库 | 后端 API + E2E | `server/crates/permissions/tests/grant.rs` | `cargo test -p dgos-permissions grant` | 规划中 |\n| AC03 | 权限检查通过 | 模块有权限 | 调用受保护资源 | 调用成功 | 后端逻辑 | `server/crates/permissions/tests/check.rs` | `cargo test -p dgos-permissions check_granted` | 规划中 |\n| AC04 | 权限检查拒绝 | 模块无权限 | 调用受保护资源 | 返回 PermissionDenied | 后端逻辑 | `server/crates/permissions/tests/check.rs` | `cargo test -p dgos-permissions check_denied` | 规划中 |\n| AC05 | 权限拒绝日志 | 权限被拒绝 | 查询日志 | 记录了拒绝事件 | 后端 API | `server/crates/permissions/tests/logging.rs` | `cargo test -p dgos-permissions logging` | 规划中 |\n| AC06 | 撤销权限 | 模块有权限 | 用户撤销 | 权限撤销成功 | E2E | `tests/e2e/permission_revoke.spec.ts` | `pnpm test:e2e permission_revoke` | 规划中 |\n| AC07 | 撤销后拒绝调用 | 权限已撤销 | 模块调用 | 调用被拒绝 | 后端逻辑 | `server/crates/permissions/tests/revoke.rs` | `cargo test -p dgos-permissions revoke_effect` | 规划中 |\n| AC08 | 查询模块权限 | 模块已安装 | 查询权限列表 | 返回所有权限状态 | 后端 API | `server/crates/permissions/tests/query.rs` | `cargo test -p dgos-permissions query` | 规划中 |\n| AC09 | 更新时权限变更 | 新版本新增权限 | 更新模块 | 提示新权限 | E2E | `tests/e2e/permission_update.spec.ts` | `pnpm test:e2e permission_update` | 规划中 |\n| AC10 | 拒绝安装（不授权） | 用户拒绝授权 | 点击\"拒绝\" | 模块不安装 | E2E | `tests/e2e/permission_grant.spec.ts` | `pnpm test:e2e permission_grant` | 规划中 |\n| AC11 | Provider 权限检查 | 模块调用 Provider | 权限拦截器检查 | 有权限则放行 | 后端集成 | `server/crates/permissions/tests/interceptor.rs` | `cargo test -p dgos-permissions interceptor_provider` | 规划中 |\n| AC12 | 文件权限检查 | 模块读取文件 | 权限拦截器检查 | 无权限则拒绝 | 后端集成 | `server/crates/permissions/tests/interceptor.rs` | `cargo test -p dgos-permissions interceptor_file` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 模块未申请权限 | manifest 没有 permissions | 模块无任何权限 |\n| 权限类型未知 | manifest 包含未知权限 | 忽略未知权限，安装成功 |\n| 重复授权 | 多次授予同一权限 | 幂等操作，不报错 |\n| 撤销不存在的权限 | 撤销未授予的权限 | 幂等操作，不报错 |\n| 并发权限检查 | 100 个并发调用 | 所有检查都正确 |\n| 权限日志过多 | 10,000+ 条日志 | 分页查询，不影响性能 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// 权限查询\n#[tauri::command]\nasync fn get_module_permissions(\n    module_id: String,\n    user_id: String\n) -> Result<Vec<Permission>>;\n\n#[tauri::command]\nasync fn list_all_permissions(user_id: String) -> Result<Vec<ModulePermissions>>;\n\n// 权限授予/撤销\n#[tauri::command]\nasync fn grant_permission(\n    module_id: String,\n    permission_type: String,\n    user_id: String\n) -> Result<()>;\n\n#[tauri::command]\nasync fn revoke_permission(\n    module_id: String,\n    permission_type: String,\n    user_id: String\n) -> Result<()>;\n\n#[tauri::command]\nasync fn grant_all_permissions(\n    module_id: String,\n    permissions: Vec<String>,\n    user_id: String\n) -> Result<()>;\n\n// 权限检查（内部使用）\n#[tauri::command]\nasync fn check_permission(\n    module_id: String,\n    permission_type: String,\n    user_id: String\n) -> Result<bool>;\n\n// 权限日志\n#[tauri::command]\nasync fn list_permission_logs(\n    module_id: Option<String>,\n    limit: Option<usize>\n) -> Result<Vec<PermissionLog>>;\n```\n\n### 6.2 数据结构\n\n```rust\n// server/crates/permissions/src/types.rs\n\nuse serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Permission {\n    pub id: String,\n    pub module_id: String,\n    pub permission_type: PermissionType,\n    pub granted: bool,\n    pub granted_at: Option<String>,\n    pub revoked_at: Option<String>,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\npub enum PermissionType {\n    ProviderAccess,\n    SkillsAccess,\n    McpAccess,\n    FileRead,\n    FileWrite,\n    Network,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct PermissionLog {\n    pub id: String,\n    pub module_id: String,\n    pub permission_type: PermissionType,\n    pub action: PermissionAction,\n    pub resource_id: Option<String>,\n    pub created_at: String,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(rename_all = \"lowercase\")]\npub enum PermissionAction {\n    Granted,\n    Revoked,\n    Denied,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ModulePermissions {\n    pub module_id: String,\n    pub module_name: String,\n    pub permissions: Vec<Permission>,\n}\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 权限检查服务\n\n```rust\n// server/crates/permissions/src/service.rs\n\npub struct PermissionService {\n    db: DatabasePool,\n}\n\nimpl PermissionService {\n    // B09-01: 检查权限\n    pub async fn check_permission(\n        &self,\n        module_id: &str,\n        permission_type: PermissionType,\n        user_id: &str\n    ) -> Result<bool> {\n        // B09-02: 查询数据库\n        let permission = self.db\n            .get_permission(module_id, &permission_type.to_string(), user_id)\n            .await?;\n        \n        // B09-03: 判断是否授予\n        let granted = permission\n            .map(|p| p.granted)\n            .unwrap_or(false);\n        \n        if !granted {\n            // B09-04: 记录拒绝日志\n            self.log_permission(\n                module_id,\n                permission_type,\n                PermissionAction::Denied,\n                None,\n                user_id\n            ).await?;\n        }\n        \n        Ok(granted)\n    }\n    \n    // B09-05: 授予权限\n    pub async fn grant_permission(\n        &self,\n        module_id: &str,\n        permission_type: PermissionType,\n        user_id: &str\n    ) -> Result<()> {\n        // B09-06: 插入或更新\n        self.db.upsert_permission(\n            module_id,\n            &permission_type.to_string(),\n            true,\n            user_id\n        ).await?;\n        \n        // B09-07: 记录授予日志\n        self.log_permission(\n            module_id,\n            permission_type,\n            PermissionAction::Granted,\n            None,\n            user_id\n        ).await?;\n        \n        Ok(())\n    }\n    \n    // B09-08: 撤销权限\n    pub async fn revoke_permission(\n        &self,\n        module_id: &str,\n        permission_type: PermissionType,\n        user_id: &str\n    ) -> Result<()> {\n        // B09-09: 更新为不授予\n        self.db.update_permission_granted(\n            module_id,\n            &permission_type.to_string(),\n            false,\n            user_id\n        ).await?;\n        \n        // B09-10: 记录撤销日志\n        self.log_permission(\n            module_id,\n            permission_type,\n            PermissionAction::Revoked,\n            None,\n            user_id\n        ).await?;\n        \n        Ok(())\n    }\n    \n    // B09-11: 记录权限日志\n    async fn log_permission(\n        &self,\n        module_id: &str,\n        permission_type: PermissionType,\n        action: PermissionAction,\n        resource_id: Option<&str>,\n        user_id: &str\n    ) -> Result<()> {\n        let log = PermissionLog {\n            id: Uuid::new_v4().to_string(),\n            module_id: module_id.to_string(),\n            permission_type,\n            action,\n            resource_id: resource_id.map(|s| s.to_string()),\n            created_at: Utc::now().to_rfc3339(),\n        };\n        \n        self.db.insert_permission_log(&log, user_id).await?;\n        \n        Ok(())\n    }\n}\n```\n\n### 7.2 权限拦截器（Provider 示例）\n\n```rust\n// server/crates/permissions/src/interceptor.rs\n\nuse crate::service::PermissionService;\nuse crate::types::PermissionType;\n\npub struct PermissionInterceptor {\n    permission_service: Arc<PermissionService>,\n}\n\nimpl PermissionInterceptor {\n    // B09-12: 拦截 Provider 调用\n    pub async fn intercept_provider_call(\n        &self,\n        module_id: &str,\n        provider_id: &str,\n        user_id: &str\n    ) -> Result<()> {\n        // B09-13: 检查权限\n        let has_permission = self.permission_service\n            .check_permission(\n                module_id,\n                PermissionType::ProviderAccess,\n                user_id\n            )\n            .await?;\n        \n        if !has_permission {\n            // B09-14: 权限拒绝\n            return Err(Error::PermissionDenied {\n                module_id: module_id.to_string(),\n                permission: \"provider_access\".to_string(),\n            });\n        }\n        \n        // B09-15: 放行\n        Ok(())\n    }\n    \n    // B09-16: 拦截文件读取\n    pub async fn intercept_file_read(\n        &self,\n        module_id: &str,\n        file_path: &str,\n        user_id: &str\n    ) -> Result<()> {\n        let has_permission = self.permission_service\n            .check_permission(\n                module_id,\n                PermissionType::FileRead,\n                user_id\n            )\n            .await?;\n        \n        if !has_permission {\n            return Err(Error::PermissionDenied {\n                module_id: module_id.to_string(),\n                permission: \"file_read\".to_string(),\n            });\n        }\n        \n        Ok(())\n    }\n    \n    // B09-17: 拦截文件写入\n    pub async fn intercept_file_write(\n        &self,\n        module_id: &str,\n        file_path: &str,\n        user_id: &str\n    ) -> Result<()> {\n        let has_permission = self.permission_service\n            .check_permission(\n                module_id,\n                PermissionType::FileWrite,\n                user_id\n            )\n            .await?;\n        \n        if !has_permission {\n            return Err(Error::PermissionDenied {\n                module_id: module_id.to_string(),\n                permission: \"file_write\".to_string(),\n            });\n        }\n        \n        Ok(())\n    }\n    \n    // B09-18: 拦截网络请求\n    pub async fn intercept_network(\n        &self,\n        module_id: &str,\n        url: &str,\n        user_id: &str\n    ) -> Result<()> {\n        let has_permission = self.permission_service\n            .check_permission(\n                module_id,\n                PermissionType::Network,\n                user_id\n            )\n            .await?;\n        \n        if !has_permission {\n            return Err(Error::PermissionDenied {\n                module_id: module_id.to_string(),\n                permission: \"network\".to_string(),\n            });\n        }\n        \n        Ok(())\n    }\n}\n```\n\n### 7.3 Tauri Command 集成拦截器\n\n```rust\n// server/src-tauri/src/commands/provider.rs\n\nuse permissions::interceptor::PermissionInterceptor;\n\n#[tauri::command]\npub async fn call_provider(\n    module_id: String,\n    provider_id: String,\n    request: ChatRequest,\n    state: State<'_, AppState>\n) -> Result<ChatResponse> {\n    let user_id = get_current_user_id(&state)?;\n    \n    // B09-19: 权限检查\n    state.permission_interceptor\n        .intercept_provider_call(&module_id, &provider_id, &user_id)\n        .await?;\n    \n    // B09-20: 权限通过，继续调用\n    let response = state.provider_manager\n        .call(&provider_id, request)\n        .await?;\n    \n    Ok(response)\n}\n```\n\n### 7.4 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B09-01 | 检查权限 | AC03, AC04 | - |\n| B09-02 | 查询数据库 | AC03, AC04 | - |\n| B09-03 | 判断是否授予 | AC03, AC04 | - |\n| B09-04 | 记录拒绝日志 | AC05 | - |\n| B09-05 | 授予权限 | AC02 | V1-E2E-09 |\n| B09-06 | 插入或更新数据库 | AC02 | - |\n| B09-07 | 记录授予日志 | AC05 | - |\n| B09-08 | 撤销权限 | AC06 | V1-E2E-09 |\n| B09-09 | 更新为不授予 | AC06 | - |\n| B09-10 | 记录撤销日志 | AC05 | - |\n| B09-11 | 记录权限日志 | AC05 | - |\n| B09-12 | 拦截 Provider 调用 | AC11 | - |\n| B09-13 | 检查 Provider 权限 | AC11 | - |\n| B09-14 | 权限拒绝 | AC04 | - |\n| B09-15 | 放行调用 | AC03 | - |\n| B09-16 | 拦截文件读取 | AC12 | - |\n| B09-17 | 拦截文件写入 | AC12 | - |\n| B09-18 | 拦截网络请求 | AC12 | - |\n| B09-19 | Tauri Command 权限检查 | AC11 | V1-E2E-09 |\n| B09-20 | 权限通过继续调用 | AC03 | V1-E2E-09 |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1009001 | permission_denied | 权限被拒绝 | 授予模块权限 |\n| 1009002 | permission_not_found | 权限记录不存在 | 检查模块和权限类型 |\n| 1009003 | invalid_permission_type | 无效的权限类型 | 检查权限类型 |\n| 1009004 | permission_already_granted | 权限已授予 | 无需重复授予 |\n| 1009005 | permission_already_revoked | 权限已撤销 | 无需重复撤销 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 权限最小化 | 模块只申请必要权限 |\n| 用户知情 | 安装时明确显示权限 |\n| 可撤销 | 用户随时撤销权限 |\n| 审计日志 | 所有权限操作都记录 |\n| 拒绝默认 | 未授予的权限默认拒绝 |\n\n### 9.2 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 权限检查时间 | < 10ms | 单元测试 |\n| 并发检查 | > 1000 QPS | 压力测试 |\n| 日志查询 | < 500ms（1000 条） | 性能测试 |\n\n### 9.3 可审计性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 所有授予操作记录 | 写入 permission_logs |\n| 所有撤销操作记录 | 写入 permission_logs |\n| 所有拒绝操作记录 | 写入 permission_logs |\n| 日志不可篡改 | 只能插入，不能修改/删除 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/permissions/src/service.rs`\n- `server/crates/permissions/src/interceptor.rs`\n- `server/crates/permissions/tests/grant.rs`\n- `server/crates/permissions/tests/check.rs`\n- `server/crates/permissions/tests/revoke.rs`\n- `server/crates/permissions/tests/logging.rs`\n- `server/crates/permissions/tests/interceptor.rs`\n- `server/crates/permissions/tests/query.rs`\n\n**测试命令**：\n```bash\ncd server && cargo test -p dgos-permissions\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- grant.rs：0/1 通过（待实现）\n- check.rs：0/2 通过（待实现）\n- revoke.rs：0/1 通过（待实现）\n- logging.rs：0/1 通过（待实现）\n- interceptor.rs：0/4 通过（待实现）\n- query.rs：0/1 通过（待实现）\n\n详细覆盖说明：\n- AC02～AC05, AC07, AC08, AC11, AC12：待实现\n```\n\n### 10.2 E2E 测试\n\n**E2E 场景**：V1-E2E-09（权限授予、检查、撤销）\n\n**测试资产**：\n- 沙发上用手机聊天\n- ✅ 统一数据：所有设备共享同一份数据\n\n**用户价值**：\n- 个人用户：在家里任何设备都能用\n- 团队用户：共享局域网内的 DGOS 实例\n- 移动场景：不在电脑前也能使用\n\n**V1 vs V4 云端**：\n- V1 局域网：只能局域网访问，无需注册\n- V4 云端：公网访问，云端同步\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ HTTP Server 启动/停止\n- ✅ 自动选择端口（默认 3000，占用时自动递增）\n- ✅ 局域网 IP 自动获取和显示\n- ✅ 简单认证（token 或密码）\n- ✅ 已连接设备列表\n- ✅ 设备管理（踢出设备）\n- ✅ HTTP API（所有 Tauri Commands 映射为 HTTP API）\n- ✅ 前端应用服务（Vite 构建的 SPA）\n- ✅ WebSocket 支持（流式响应）\n- ✅ 安全限制（只允许局域网 IP）\n- ✅ 二维码分享（扫码连接）\n\n**不包含**（明确说明原因）：\n- ❌ HTTPS（自签名证书） → V2 安全增强\n- ❌ 公网访问（端口转发） → V4 云端协同\n- ❌ 细粒度权限（按设备） → V2 权限增强\n- ❌ 设备同步（离线变更合并） → V4 云端协同\n- ❌ 多实例集群 → 不在 V1 范围\n\n## 3. 核心流程\n\n### 3.1 启动 HTTP 服务流程\n\n```\n用户在系统设置\n  ↓\n点击\"局域网协同\"标签\n  ↓\n显示当前状态：\"未启动\"\n  ↓\n点击\"启动服务\"\n  ↓\n系统选择端口（默认 3000）\n  ↓\n（如果端口占用）尝试 3001、3002...\n  ↓\n启动 HTTP Server\n  ↓\n获取局域网 IP（192.168.1.100）\n  ↓\n生成访问 token（随机 UUID）\n  ↓\n显示访问信息：\n  \"服务已启动\n   访问地址：http://192.168.1.100:3000\n   Token：abc123-def456-...\"\n  ↓\n生成二维码（包含地址 + token）\n  ↓\n用户可以分享给其他设备\n```\n\n### 3.2 远程设备连接流程\n\n```\n用户在手机上\n  ↓\n打开浏览器\n  ↓\n输入地址：http://192.168.1.100:3000\n  ↓\n（或扫描二维码）\n  ↓\n打开 DGOS 登录页面\n  ↓\n输入 token（或自动填充）\n  ↓\n点击\"连接\"\n  ↓\n前端验证 token（调用 /api/auth/verify）\n  ↓\n服务端验证 token\n  ↓\n（如果有效）返回 session token\n  ↓\n保存 session token 到 localStorage\n  ↓\n显示用户选择页面\n  ↓\n选择用户（如果有多个）\n  ↓\n输入用户密码\n  ↓\n验证成功，进入主界面\n  ↓\n在桌面端显示：\"iPhone 已连接\"\n```\n\n### 3.3 远程设备使用流程\n\n```\n手机上的 DGOS\n  ↓\n打开 AI 工作台\n  ↓\n输入 Prompt 并发送\n  ↓\n前端调用：POST /api/chat/send\n  ↓\n携带 session token（Authorization: Bearer xxx）\n  ↓\n服务端验证 token\n  ↓\n验证通过，调用后端逻辑\n  ↓\n（如果是流式）通过 WebSocket 返回\n  ↓\n前端逐字显示\n  ↓\n完成\n  ↓\n桌面端实时看到：\"iPhone 发送了消息\"\n```\n\n### 3.4 踢出设备流程\n\n```\n用户在桌面端\n  ↓\n打开系统设置 → 局域网协同\n  ↓\n查看已连接设备列表：\n  - iPhone (192.168.1.101) - 活跃\n  - iPad (192.168.1.102) - 30分钟前\n  ↓\n点击 iPhone 的\"断开\"按钮\n  ↓\n确认提示：\"确定断开 iPhone？\"\n  ↓\n用户确认\n  ↓\n服务端删除该设备的 session\n  ↓\niPhone 上的 DGOS 自动退出登录\n  ↓\n显示：\"已被断开连接\"\n```\n\n### 3.5 停止服务流程\n\n```\n用户在系统设置\n  ↓\n点击\"停止服务\"\n  ↓\n确认提示：\"停止后，所有设备将断开连接\"\n  ↓\n用户确认\n  ↓\n断开所有设备连接\n  ↓\n停止 HTTP Server\n  ↓\n显示状态：\"未启动\"\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**lan_sessions 表**（局域网会话）：\n```sql\nCREATE TABLE lan_sessions (\n    id TEXT PRIMARY KEY,              -- UUID\n    session_token TEXT UNIQUE NOT NULL, -- 会话 token\n    device_name TEXT,                 -- 设备名称（从 User-Agent 提取）\n    device_ip TEXT NOT NULL,          -- 设备 IP\n    user_id TEXT,                     -- 登录的用户（可选）\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    last_active_at TIMESTAMP,         -- 最后活跃时间\n    expires_at TIMESTAMP,             -- 过期时间（可选）\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n\nCREATE INDEX idx_lan_sessions_token ON lan_sessions(session_token);\nCREATE INDEX idx_lan_sessions_ip ON lan_sessions(device_ip);\n```\n\n**lan_config 表**（局域网配置）：\n```sql\nCREATE TABLE lan_config (\n    key TEXT PRIMARY KEY,\n    value TEXT\n);\n\n-- 存储配置\nINSERT INTO lan_config (key, value) VALUES ('enabled', 'false');\nINSERT INTO lan_config (key, value) VALUES ('port', '3000');\nINSERT INTO lan_config (key, value) VALUES ('access_token', 'xxx');\n```\n\n**lan_activity_logs 表**（活动日志）：\n```sql\nCREATE TABLE lan_activity_logs (\n    id TEXT PRIMARY KEY,\n    session_id TEXT,\n    device_ip TEXT,\n    action TEXT,                      -- 动作：connected, disconnected, request\n    endpoint TEXT,                    -- 访问的端点（如 /api/chat/send）\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n    FOREIGN KEY (session_id) REFERENCES lan_sessions(id)\n);\n\nCREATE INDEX idx_lan_logs_time ON lan_activity_logs(created_at);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 验证 token：`SELECT * FROM lan_sessions WHERE session_token = ?`\n- 获取已连接设备：`SELECT * FROM lan_sessions ORDER BY last_active_at DESC`\n- 查询活动日志：`SELECT * FROM lan_activity_logs ORDER BY created_at DESC LIMIT 100`\n\n**写操作**：\n- 创建会话：`INSERT INTO lan_sessions (id, session_token, device_ip, ...) VALUES (...)`\n- 更新活跃时间：`UPDATE lan_sessions SET last_active_at = ? WHERE id = ?`\n- 删除会话：`DELETE FROM lan_sessions WHERE id = ?`\n- 记录日志：`INSERT INTO lan_activity_logs (...) VALUES (...)`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 启动 HTTP 服务 | 服务未启动 | 点击\"启动\" | 服务启动成功，显示地址 | E2E | `tests/e2e/lan_server.spec.ts` | `pnpm test:e2e lan_server` | 规划中 |\n| AC02 | 自动选择端口 | 3000 端口占用 | 启动服务 | 自动使用 3001 | 后端逻辑 | `server/crates/lan/tests/port_selection.rs` | `cargo test -p dgos-lan port_selection` | 规划中 |\n| AC03 | 获取局域网 IP | 服务已启动 | 查看地址 | 显示正确的局域网 IP | 后端逻辑 | `server/crates/lan/tests/ip_detection.rs` | `cargo test -p dgos-lan ip_detection` | 规划中 |\n| AC04 | 远程连接成功 | 服务已启动 | 浏览器访问 | 显示登录页面 | E2E | `tests/e2e/lan_connect.spec.ts` | `pnpm test:e2e lan_connect` | 规划中 |\n| AC05 | Token 验证 | 输入正确 token | 点击连接 | 验证成功，显示用户列表 | 后端 API | `server/crates/lan/tests/auth.rs` | `cargo test -p dgos-lan auth` | 规划中 |\n| AC06 | Token 错误拒绝 | 输入错误 token | 点击连接 | 提示\"Token 无效\" | 后端 API | `server/crates/lan/tests/auth.rs` | `cargo test -p dgos-lan auth` | 规划中 |\n| AC07 | 设备列表显示 | 多个设备连接 | 查看设备列表 | 显示所有设备 | E2E | `tests/e2e/lan_devices.spec.ts` | `pnpm test:e2e lan_devices` | 规划中 |\n| AC08 | 踢出设备 | 设备已连接 | 点击\"断开\" | 设备被断开 | E2E | `tests/e2e/lan_devices.spec.ts` | `pnpm test:e2e lan_devices` | 规划中 |\n| AC09 | HTTP API 调用 | 设备已登录 | 调用 /api/chat/send | 调用成功，返回结果 | 后端 API | `server/crates/lan/tests/api.rs` | `cargo test -p dgos-lan api` | 规划中 |\n| AC10 | WebSocket 连接 | 设备已登录 | 连接 WebSocket | 连接成功，可接收消息 | 后端集成 | `server/crates/lan/tests/websocket.rs` | `cargo test -p dgos-lan websocket` | 规划中 |\n| AC11 | 局域网 IP 限制 | 公网 IP 访问 | 尝试连接 | 拒绝连接 | 后端逻辑 | `server/crates/lan/tests/ip_restriction.rs` | `cargo test -p dgos-lan ip_restriction` | 规划中 |\n| AC12 | 停止服务 | 服务已启动 | 点击\"停止\" | 服务停止，设备断开 | E2E | `tests/e2e/lan_server.spec.ts` | `pnpm test:e2e lan_server` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 端口全部占用 | 3000-3100 都占用 | 提示\"无可用端口\" |\n| 无局域网连接 | 电脑未连接网络 | 提示\"无网络连接\" |\n| Token 过期 | 7 天后访问 | 提示\"Token 已过期\" |\n| 设备超时 | 30 分钟无活动 | 自动断开连接 |\n| 并发连接 | 10+ 设备同时连接 | 所有设备都能正常使用 |\n| 大文件传输 | 上传 100MB 文件 | 正常处理，不卡顿 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// 服务管理\n#[tauri::command]\nasync fn start_lan_server(port: Option<u16>) -> Result<ServerInfo>;\n\n#[tauri::command]\nasync fn stop_lan_server() -> Result<()>;\n\n#[tauri::command]\nasync fn get_lan_server_status() -> Result<ServerStatus>;\n\n#[tauri::command]\nasync fn get_lan_ip() -> Result<String>;\n\n// 设备管理\n#[tauri::command]\nasync fn list_lan_devices() -> Result<Vec<Device>>;\n\n#[tauri::command]\nasync fn disconnect_lan_device(session_id: String) -> Result<()>;\n\n// Token 管理\n#[tauri::command]\nasync fn get_lan_access_token() -> Result<String>;\n\n#[tauri::command]\nasync fn regenerate_lan_access_token() -> Result<String>;\n\n// 活动日志\n#[tauri::command]\nasync fn list_lan_activity_logs(limit: Option<usize>) -> Result<Vec<ActivityLog>>;\n```\n\n### 6.2 HTTP API（局域网访问）\n\n```\n# 认证\nPOST /api/auth/verify           # 验证 access token\nPOST /api/auth/login            # 用户登录（用户名 + 密码）\nPOST /api/auth/logout           # 登出\n\n# 用户\nGET  /api/users                 # 获取用户列表\n\n# Provider\nGET  /api/providers             # 获取 Provider 列表\nPOST /api/providers             # 创建 Provider\n... (所有 Tauri Commands 映射为 HTTP API)\n\n# Chat\nGET  /api/chat/sessions         # 获取会话列表\nPOST /api/chat/send             # 发送消息（同步）\nWS   /api/chat/stream           # 流式消息（WebSocket）\n\n# 静态文件\nGET  /*                         # 前端应用（SPA）\n```\n\n### 6.3 数据结构\n\n```rust\n// server/crates/lan/src/types.rs\n\nuse serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ServerInfo {\n    pub enabled: bool,\n    pub port: u16,\n    pub lan_ip: String,\n    pub access_url: String,         // http://192.168.1.100:3000\n    pub access_token: String,\n    pub qr_code: String,            // Base64 QR code\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ServerStatus {\n    pub running: bool,\n    pub port: Option<u16>,\n    pub connected_devices: usize,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Device {\n    pub id: String,\n    pub name: String,\n    pub ip: String,\n    pub user_id: Option<String>,\n    pub connected_at: String,\n    pub last_active_at: String,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ActivityLog {\n    pub id: String,\n    pub device_name: String,\n    pub action: String,\n    pub endpoint: Option<String>,\n    pub created_at: String,\n}\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 HTTP Server 实现\n\n```rust\n// server/crates/lan/src/server.rs\n\nuse axum::{Router, routing::get, routing::post};\nuse tower_http::cors::CorsLayer;\nuse std::net::SocketAddr;\n\npub struct LANServer {\n    router: Router,\n    addr: SocketAddr,\n}\n\nimpl LANServer {\n    // B10-01: 启动服务\n    pub async fn start(port: Option<u16>) -> Result<Self> {\n        // B10-02: 选择端口\n        let port = Self::select_available_port(port.unwrap_or(3000))?;\n        \n        // B10-03: 获取局域网 IP\n        let lan_ip = Self::get_lan_ip()?;\n        \n        let addr = SocketAddr::from(([0, 0, 0, 0], port));\n        \n        // B10-04: 构建路由\n        let router = Router::new()\n            // 认证\n            .route(\"/api/auth/verify\", post(handlers::auth::verify))\n            .route(\"/api/auth/login\", post(handlers::auth::login))\n            .route(\"/api/auth/logout\", post(handlers::auth::logout))\n            \n            // Provider\n            .route(\"/api/providers\", get(handlers::provider::list))\n            .route(\"/api/providers\", post(handlers::provider::create))\n            \n            // Chat\n            .route(\"/api/chat/sessions\", get(handlers::chat::list_sessions))\n            .route(\"/api/chat/send\", post(handlers::chat::send))\n            \n            // WebSocket\n            .route(\"/api/chat/stream\", get(handlers::chat::stream_ws))\n            \n            // 静态文件（前端应用）\n            .nest_service(\"/\", ServeDir::new(\"frontend/dist\"))\n            \n            // B10-05: 添加中间件\n            .layer(CorsLayer::permissive())\n            .layer(LANAuthMiddleware::new())\n            .layer(IPRestrictionMiddleware::new());\n        \n        // B10-06: 启动服务器\n        tokio::spawn(async move {\n            axum::Server::bind(&addr)\n                .serve(router.into_make_service())\n                .await\n                .unwrap();\n        });\n        \n        Ok(Self { router, addr })\n    }\n    \n    // B10-02: 选择可用端口\n    fn select_available_port(start_port: u16) -> Result<u16> {\n        for port in start_port..start_port + 100 {\n            if Self::is_port_available(port) {\n                return Ok(port);\n            }\n        }\n        \n        Err(Error::NoAvailablePort)\n    }\n    \n    fn is_port_available(port: u16) -> bool {\n        std::net::TcpListener::bind((\"0.0.0.0\", port)).is_ok()\n    }\n    \n    // B10-03: 获取局域网 IP\n    fn get_lan_ip() -> Result<String> {\n        use local_ip_address::local_ip;\n        \n        let ip = local_ip()?;\n        Ok(ip.to_string())\n    }\n}\n```\n\n### 7.2 认证中间件\n\n```rust\n// server/crates/lan/src/middleware/auth.rs\n\nuse axum::{\n    extract::Request,\n    middleware::Next,\n    response::Response,\n};\n\n// B10-07: 认证中间件\npub async fn lan_auth_middleware(\n    request: Request,\n    next: Next\n) -> Result<Response, StatusCode> {\n    let path = request.uri().path();\n    \n    // B10-08: 公开路径（不需要认证）\n    if path.starts_with(\"/api/auth/verify\") || path == \"/\" {\n        return Ok(next.run(request).await);\n    }\n    \n    // B10-09: 提取 session token\n    let session_token = request\n        .headers()\n        .get(\"Authorization\")\n        .and_then(|h| h.to_str().ok())\n        .and_then(|s| s.strip_prefix(\"Bearer \"));\n    \n    let Some(token) = session_token else {\n        return Err(StatusCode::UNAUTHORIZED);\n    };\n    \n    // B10-10: 验证 session token\n    let db = request.extensions().get::<DatabasePool>().unwrap();\n    let session = db.get_lan_session_by_token(token).await\n        .map_err(|_| StatusCode::UNAUTHORIZED)?;\n    \n    // B10-11: 更新活跃时间\n    db.update_session_active(&session.id).await\n        .map_err(|_| StatusCode::INTERNAL_SERVER_ERROR)?;\n    \n    // B10-12: 将 user_id 注入到请求中\n    request.extensions_mut().insert(session.user_id);\n    \n    Ok(next.run(request).await)\n}\n```\n\n### 7.3 IP 限制中间件\n\n```rust\n// server/crates/lan/src/middleware/ip_restriction.rs\n\nuse axum::{\n    extract::ConnectInfo,\n    middleware::Next,\n    response::Response,\n};\nuse std::net::SocketAddr;\n\n// B10-13: IP 限制中间件\npub async fn ip_restriction_middleware(\n    ConnectInfo(addr): ConnectInfo<SocketAddr>,\n    request: Request,\n    next: Next\n) -> Result<Response, StatusCode> {\n    let client_ip = addr.ip();\n    \n    // B10-14: 检查是否为局域网 IP\n    if !is_lan_ip(&client_ip) {\n        tracing::warn!(\"拒绝公网 IP 访问：{}\", client_ip);\n        return Err(StatusCode::FORBIDDEN);\n    }\n    \n    Ok(next.run(request).await)\n}\n\n// B10-14: 判断是否为局域网 IP\nfn is_lan_ip(ip: &std::net::IpAddr) -> bool {\n    use std::net::IpAddr;\n    \n    match ip {\n        IpAddr::V4(ipv4) => {\n            let octets = ipv4.octets();\n            \n            // 10.0.0.0/8\n            octets[0] == 10\n            // 172.16.0.0/12\n            || (octets[0] == 172 && octets[1] >= 16 && octets[1] <= 31)\n            // 192.168.0.0/16\n            || (octets[0] == 192 && octets[1] == 168)\n            // 127.0.0.1 (localhost)\n            || octets[0] == 127\n        }\n        IpAddr::V6(_) => {\n            // 简化处理，允许 IPv6\n            true\n        }\n    }\n}\n```\n\n### 7.4 WebSocket 流式处理\n\n```rust\n// server/crates/lan/src/handlers/chat.rs\n\nuse axum::{\n    extract::ws::{WebSocket, WebSocketUpgrade},\n    response::Response,\n};\n\n// B10-15: WebSocket 流式消息\npub async fn stream_ws(\n    ws: WebSocketUpgrade,\n    Extension(db): Extension<DatabasePool>,\n) -> Response {\n    ws.on_upgrade(|socket| handle_socket(socket, db))\n}\n\nasync fn handle_socket(mut socket: WebSocket, db: DatabasePool) {\n    // B10-16: 接收消息请求\n    while let Some(msg) = socket.recv().await {\n        let Ok(msg) = msg else { break };\n        \n        let text = msg.to_text().unwrap();\n        let request: ChatRequest = serde_json::from_str(text).unwrap();\n        \n        // B10-17: 调用 Provider（流式）\n        let stream = provider_manager\n            .stream_call(&request.provider_id, request)\n            .await\n            .unwrap();\n        \n        // B10-18: 逐块发送\n        while let Some(chunk) = stream.next().await {\n            let json = serde_json::to_string(&chunk).unwrap();\n            socket.send(Message::Text(json)).await.unwrap();\n        }\n        \n        // B10-19: 发送结束标记\n        socket.send(Message::Text(\"[DONE]\".to_string())).await.unwrap();\n    }\n}\n```\n\n### 7.5 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B10-01 | 启动服务 | AC01 | V1-E2E-10 |\n| B10-02 | 选择可用端口 | AC02 | - |\n| B10-03 | 获取局域网 IP | AC03 | - |\n| B10-04 | 构建路由 | AC01 | - |\n| B10-05 | 添加中间件 | AC05, AC11 | - |\n| B10-06 | 启动服务器 | AC01 | - |\n| B10-07 | 认证中间件 | AC05, AC06 | - |\n| B10-08 | 公开路径 | AC04 | - |\n| B10-09 | 提取 session token | AC05 | - |\n| B10-10 | 验证 session token | AC05, AC06 | - |\n| B10-11 | 更新活跃时间 | AC07 | - |\n| B10-12 | 注入 user_id | AC09 | - |\n| B10-13 | IP 限制中间件 | AC11 | - |\n| B10-14 | 判断局域网 IP | AC11 | - |\n| B10-15 | WebSocket 流式 | AC10 | V1-E2E-10 |\n| B10-16 | 接收消息请求 | AC10 | - |\n| B10-17 | 调用 Provider 流式 | AC10 | - |\n| B10-18 | 逐块发送 | AC10 | - |\n| B10-19 | 发送结束标记 | AC10 | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1010001 | server_start_failed | 服务启动失败 | 检查端口占用 |\n| 1010002 | no_available_port | 无可用端口 | 释放端口或手动指定 |\n| 1010003 | no_network_connection | 无网络连接 | 连接局域网 |\n| 1010004 | invalid_access_token | Token 无效 | 检查 Token |\n| 1010005 | token_expired | Token 已过期 | 重新获取 Token |\n| 1010006 | session_not_found | 会话不存在 | 重新登录 |\n| 1010007 | ip_not_allowed | IP 不在局域网 | 只能局域网访问 |\n| 1010008 | device_not_found | 设备不存在 | 检查设备 ID |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 服务启动时间 | < 2 秒 | Performance API |\n| HTTP API 响应 | < 200ms（P95） | 压力测试 |\n| WebSocket 延迟 | < 50ms | 性能测试 |\n| 并发连接 | > 10 设备 | 压力测试 |\n\n### 9.2 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| Token 认证 | 随机生成，存储在数据库 |\n| Session 管理 | 独立 session 表，可撤销 |\n| IP 限制 | 只允许局域网 IP |\n| CORS 配置 | 允许局域网跨域 |\n\n### 9.3 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 自动重连 | 前端检测断开，自动重连 |\n| 设备超时 | 30 分钟无活动自动断开 |\n| 错误提示 | 清晰的错误信息 |\n| 二维码分享 | 方便移动设备连接 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/lan/src/server.rs`\n- `server/crates/lan/src/middleware/auth.rs`\n- `server/crates/lan/src/middleware/ip_restriction.rs`\n- `server/crates/lan/src/handlers/chat.rs`\n- `server/crates/lan/tests/port_selection.rs`\n- `server/crates/lan/tests/ip_detection.rs`\n- `server/crates/lan/tests/auth.rs`\n- `server/crates/lan/tests/api.rs`\n- `server/crates/lan/tests/websocket.rs`\n- `server/crates/lan/tests/ip_restriction.rs`\n\n**测试命令**：\n```bash\ncd server && cargo test -p dgos-lan\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- port_selection.rs：0/1 通过（待实现）\n- ip_detection.rs：0/1 通过（待实现）\n- auth.rs：0/2 通过（待实现）\n- api.rs：0/1 通过（待实现）\n- websocket.rs：0/1 通过（待实现）\n- ip_restriction.rs：0/1 通过（待实现）\n\n详细覆盖说明：\n- AC02, AC03, AC05, AC06, AC09, AC10, AC11：待实现\n```\n\n### 10.2 E2E 测试\n\n**E2E 场景**：V1-E2E-10（启动服务、远程连接、设备管理）\n\n**测试资产**：\n- `tests/e2e/lan_server.spec.ts`\n- `tests/e2e/lan_connect.spec.ts`\n- `tests/e2e/lan_devices.spec.ts`\n\n**测试命令**：\n```bash\npnpm test:e2e lan\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：集成测试环境\n\n结果：\n- lan_server.spec.ts：0/2 通过（待实现）\n- lan_connect.spec.ts：0/1 通过（待实现）\n- lan_devices.spec.ts：0/2 通过（待实现）\n\n详细说明：\n- AC01, AC04, AC07, AC08, AC12：待实现\n```\n\n## 11. 风险与依赖\n\n### 11.1 技术风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| 端口冲突 | 中 | 低 | 自动选择可用端口 |\n| 网络不稳定 | 中 | 中 | 自动重连机制 |\n| WebSocket 断开 | 中 | 中 | 前端自动重连 |\n| IP 检测失败 | 低 | 中 | 提供手动输入选项 |\n\n### 11.2 外部依赖\n\n| 依赖 | 类型 | 风险 | 应对 |\n| --- | --- | --- | --- |\n| axum | Rust Web 框架 | 版本兼容 | 锁定版本 |\n| tower-http | HTTP 中间件 | 版本兼容 | 锁定版本 |\n| tokio | 异步运行时 | 版本兼容 | 锁定版本 |\n\n### 11.3 功能依赖\n\n| 依赖功能 | 状态 | 影响 |\n| --- | --- | --- |\n| 所有功能（V1-FR-001～009） | 规划中 | 需要先实现所有功能 |\n\n## 12. 实现状态\n\n| 模块 | 状态 | 进度 | 负责人 | 备注 |\n| --- | --- | --- | --- | --- |\n| HTTP Server | 🔴 未开始 | 0% | TBD | axum 框架 |\n| 认证中间件 | 🔴 未开始 | 0% | TBD | - |\n| IP 限制中间件 | 🔴 未开始 | 0% | TBD | - |\n| WebSocket 支持 | 🔴 未开始 | 0% | TBD | - |\n| 设备管理 | 🔴 未开始 | 0% | TBD | - |\n| 前端 UI（局域网设置） | 🔴 未开始 | 0% | TBD | - |\n| 二维码生成 | 🔴 未开始 | 0% | TBD | - |\n| 测试用例 | 🔴 未开始 | 0% | TBD | - |\n\n详见 [V1 实现状态](../../../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n", "doc-027": "# V1 功能规格索引\n\nV1 登记 15 个可独立规划和验收的功能。首发交付按底层能力、应用模块和系统功能管理；核心系统另有技术设计；实现状态统一查看[V1 实现状态](../../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 首发范围分层\n\n| 层级 | 功能 |\n| --- | --- |\n| V1 底层能力框架 | `V1-FR-001`、`V1-FR-002`、`V1-FR-003`、`V1-FR-004`、`V1-FR-005` |\n| V1 基础应用模块 | `V1-FR-006`、`V1-FR-007` |\n| V1 系统功能 | `V1-FR-008`、`V1-FR-009`、`V1-FR-010` |\n\n## 功能清单\n\n### 底层能力框架\n\n| 功能 ID | 功能主文档 | 领域 | 状态 |\n| --- | --- | --- | --- |\n| `V1-FR-001` | [Provider 适配框架](01-底层能力/01-Provider适配框架.md) | 底层能力 | 规划中 |\n| `V1-FR-002` | [Skills 管理系统](01-底层能力/02-Skills管理系统.md) | 底层能力 | 规划中 |\n| `V1-FR-003` | [MCP 管理系统](01-底层能力/03-MCP管理系统.md) | 底层能力 | 规划中 |\n| `V1-FR-004` | [模块系统与热更新](01-底层能力/04-模块系统与热更新.md) | 底层能力 | 规划中 |\n| `V1-FR-005` | [统一设计系统](01-底层能力/05-统一设计系统.md) | 底层能力 | 规划中 |\n\n### 应用模块\n\n| 功能 ID | 功能主文档 | 领域 | 状态 |\n| --- | --- | --- | --- |\n| `V1-FR-006` | [AI 工作台](02-应用模块/01-AI工作台.md) | 应用模块 | 规划中 |\n| `V1-FR-007` | [系统设置](02-应用模块/02-系统设置.md) | 应用模块 | 规划中 |\n\n### 系统功能\n\n| 功能 ID | 功能主文档 | 领域 | 状态 |\n| --- | --- | --- | --- |\n| `V1-FR-008` | [本地用户管理](03-系统功能/01-本地用户管理.md) | 身份与权限 | 规划中 |\n| `V1-FR-009` | [模块权限管理](03-系统功能/02-模块权限管理.md) | 身份与权限 | 规划中 |\n| `V1-FR-010` | [局域网协同](03-系统功能/03-局域网协同.md) | 协同功能 | 规划中 |\n\n### 后续版本功能（不包含在 V1）\n\n| 功能 ID | 功能主文档 | 版本 | 状态 |\n| --- | --- | --- | --- |\n| `V1-FR-011` | [无限画布核心](04-画布编辑/01-无限画布核心.md) | V1.2 | 设计中 |\n| `V1-FR-012` | [画布节点系统](04-画布编辑/02-画布节点系统.md) | V1.3 | 设计中 |\n| `V1-FR-013` | [工作流执行引擎](04-画布编辑/03-工作流执行引擎.md) | V1.4 | 规划中 |\n| `V1-FR-014` | [应用市场](05-生态系统/01-应用市场.md) | V1.5 | 规划中 |\n| `V1-FR-015` | [云端账号与同步](05-生态系统/02-云端账号与同步.md) | V2.0 | 规划中 |\n\n## 依赖主链路\n\n```text\n核心能力链路：\nFR-001 Provider 框架 -> FR-006 AI 工作台\nFR-002 Skills 管理   -> FR-006 AI 工作台（可选增强）\nFR-003 MCP 管理      -> FR-006 AI 工作台（可选增强）\nFR-004 模块系统      -> FR-006, FR-007（模块加载）\nFR-005 设计系统      -> FR-006, FR-007（UI 组件）\n\n系统功能链路：\nFR-008 本地用户 -> FR-009 权限管理 -> FR-010 局域网协同\n\n画布演进链路（后续版本）：\nV1.2: FR-011 画布核心\nV1.3: FR-011 + FR-012 节点系统\nV1.4: FR-011 + FR-012 + FR-013 执行引擎\n```\n\n## 支撑文档\n\n- [需求编号](00-V1需求编号.md)\n- [需求追踪矩阵](00-V1需求追踪矩阵.md)\n- [功能开发流程](../功能开发流程.md)\n- [功能文档规范](../功能文档规范.md)\n\n## 查找功能\n\n- 按编号查找：直接查看本索引或使用 `rg \"V1-FR-001\" docs`\n- 按领域查找：查看上方分类表格\n- 按关键词查找：`rg \"Provider\" docs/03-功能规格`\n", "doc-028": "# 功能开发流程\n\n本文档定义 DGOS 项目从需求到交付的完整功能开发流程，遵循 spec-docs-pro 规格驱动开发方法。\n\n---\n\n## 1. 流程概览\n\n```\n需求提出 → 功能规格 → 技术设计 → 开发实现 → 测试验证 → 验收交付\n   ↓          ↓          ↓          ↓          ↓          ↓\n  PRD      V1-FR-XXX   伪代码     编码+测试   验证记录    上线\n```\n\n---\n\n## 2. 阶段 1：需求提出\n\n### 2.1 需求来源\n\n- 产品规划（版本路线图）\n- 用户反馈\n- 技术债务\n- Bug 修复\n\n### 2.2 需求评审\n\n**输入**：需求描述\n\n**输出**：\n- 需求是否进入 V1？\n- 优先级：P0/P1/P2\n- 预估工作量\n\n**检查清单**：\n- [ ] 需求清晰，目标明确\n- [ ] 有明确的用户价值\n- [ ] 技术可行\n- [ ] 不与现有功能冲突\n\n---\n\n## 3. 阶段 2：创建功能规格\n\n### 3.1 分配功能编号\n\n格式：`V1-FR-XXX`\n\n**示例**：\n- V1-FR-001：Provider 适配框架\n- V1-FR-002：Skills 管理系统\n- V1-FR-011：新功能（下一个编号）\n\n**规则**：\n- 编号一旦分配，永不改变\n- 即使功能取消，编号也不复用\n- 记录在 [00-V1需求编号.md](V1/00-V1需求编号.md)\n\n### 3.2 创建功能规格文档\n\n使用模板创建文档：\n\n```bash\ncp docs/03-功能规格/V1/templates/feature-main.md \\\n   docs/03-功能规格/V1/01-底层能力/XX-新功能.md\n```\n\n**文档位置**：根据功能所属领域选择目录\n- `01-底层能力/`：框架级功能\n- `02-应用模块/`：用户界面功能\n- `03-系统功能/`：系统级功能\n\n### 3.3 填写功能规格\n\n按照 [功能文档规范](功能文档规范.md) 填写：\n\n1. **功能元信息**（必须）\n   - 功能编号、名称、版本\n   - 优先级、风险级别\n   - 依赖关系\n\n2. **功能概述**（必须）\n   - 一句话描述\n   - 详细说明\n   - 功能边界（包含 + 不包含）\n\n3. **核心流程**（必须）\n   - 用户操作流程\n   - 系统处理流程\n   - 异常处理流程\n\n4. **数据模型**（必须）\n   - 涉及的数据表\n   - 读写关系\n\n5. **验收标准**（必须）\n   - AC 逐项测试设计表\n   - Given/When/Then 格式\n   - 测试层级和目标命令\n\n6. **接口设计**（必须）\n   - Tauri Commands\n   - HTTP API（如有）\n\n7. **技术设计**（如需要）\n   - 伪代码\n   - 分支追踪 ID（B01-01、B01-02 等）\n   - 分支到测试追踪表\n\n8. **实现与验证**（开发时填写）\n   - 验证记录\n   - 通过情况\n\n### 3.4 评审功能规格\n\n**评审人**：技术负责人 + 相关开发者\n\n**检查清单**：\n- [ ] AC 表完整，每个 AC 有明确的测试方式\n- [ ] 功能边界清晰\n- [ ] 依赖关系明确\n- [ ] 接口设计合理\n- [ ] 如有技术设计，分支追踪完整\n\n**输出**：\n- 评审通过 → 进入开发\n- 需要修改 → 修改后重新评审\n\n---\n\n## 4. 阶段 3：技术设计（如需要）\n\n### 4.1 何时需要技术设计\n\n**必须创建技术设计**：\n- 涉及金钱、权限、加密\n- 复杂并发场景\n- 外部系统回调\n- 复杂状态机\n\n**可以省略技术设计**：\n- 简单 CRUD\n- 纯 UI 变更\n- 配置项调整\n\n### 4.2 技术设计内容\n\n在功能规格的\"第 7 章 技术设计\"中添加：\n\n1. **核心设计**\n   - 架构图\n   - 关键类/模块设计\n\n2. **伪代码**\n   - 标注分支 ID（`// B01-01`）\n   - 关键分支都要标注\n\n3. **分支到测试追踪表**\n   ```markdown\n   | 分支编号 | 分支描述 | AC 映射 | E2E 映射 | 风险级别 |\n   |---------|---------|---------|---------|---------|\n   | B01-01  | 查询配置 | AC01    | V1-E2E-01 | 低 |\n   | B01-04  | 重试逻辑 | AC09    | -       | 🔴 高 |\n   ```\n\n4. **并发场景说明**（如需要）\n   - 冲突点\n   - 控制方式\n   - 预期行为\n   - 失败策略\n\n### 4.3 决策记录\n\n**如果遇到冲突或需要做重要决策**：\n\n1. 创建冻结决策记录\n   ```markdown\n   # 在 docs/06-决策记录/V1-冻结决策.md 中添加\n\n   ## D0XX <决策标题>\n\n   - 状态：已冻结\n   - 日期：YYYY-MM-DD\n   - 背景：为什么需要这个决策\n   - 决策：选择了什么方案\n   - 理由：为什么选择这个方案\n   - 后果：影响和约束\n   ```\n\n2. 在功能规格中引用决策\n   ```markdown\n   Provider 排序机制（引用 **D012**）：\n   - 用户可通过拖拽排序\n   - 排序第一的作为默认选择\n   ```\n\n**符合 spec-docs-pro 规则 4**：冲突先决策后编码\n\n---\n\n## 5. 阶段 4：开发实现\n\n### 5.1 创建开发分支\n\n```bash\ngit checkout -b feature/v1-fr-011-new-feature\n```\n\n**分支命名规则**：\n- `feature/<feature-id>-<description>`\n- 全部小写，使用连字符\n\n### 5.2 TDD 开发（推荐）\n\n1. **先写测试**\n   ```rust\n   #[cfg(test)]\n   mod tests {\n       #[test]\n       fn test_provider_retry() {\n           // Given\n           let provider = create_test_provider();\n           \n           // When\n           let result = provider.call_with_retry();\n           \n           // Then\n           assert!(result.is_ok());\n       }\n   }\n   ```\n\n2. **再写实现**\n   ```rust\n   pub async fn call_with_retry(&self) -> Result<Response> {\n       let mut attempts = 0;\n       // 实现重试逻辑\n   }\n   ```\n\n3. **运行测试**\n   ```bash\n   cargo test -p dgos-providers\n   ```\n\n### 5.3 开发过程\n\n**后端**：\n```bash\ncd server\ncargo build\ncargo test\ncargo clippy\n```\n\n**前端**：\n```bash\ncd frontend\npnpm dev\npnpm test\npnpm lint\n```\n\n### 5.4 提交规范\n\n遵循 [Git 提交信息规范](../01-项目概览/Git提交信息规范.md)：\n\n```bash\ngit add .\ngit commit -m \"feat(providers): add retry mechanism\n\nImplement exponential backoff retry for 429 and 5xx errors.\n\nRefs: V1-FR-001\"\n```\n\n---\n\n## 6. 阶段 5：测试验证\n\n### 6.1 单元测试\n\n**后端**：\n```bash\ncd server\ncargo test -p dgos-providers --lib\n```\n\n**前端**：\n```bash\ncd frontend\npnpm test -- providers\n```\n\n**要求**：\n- 核心功能单元测试覆盖率 > 60%\n- 所有 AC 都有对应的测试\n\n### 6.2 集成测试\n\n```bash\ncd server\ncargo test -p dgos-providers --test integration\n```\n\n**要求**：\n- API 集成测试覆盖率 > 80%\n- 测试真实场景，不只是 mock\n\n### 6.3 E2E 测试\n\n```bash\ncd frontend\npnpm test:e2e -- provider_management\n```\n\n**要求**：\n- 关键用户流程有 E2E 覆盖\n- 测试完整的用户操作路径\n\n### 6.4 填写验证记录\n\n在功能规格的\"第 10 章 实现与验证\"中填写：\n\n```markdown\n#### 2026-10-26 后端单元测试\n\n\\`\\`\\`bash\ncd server && DATABASE_URL=sqlite::memory: cargo test -p dgos-providers --lib\n\\`\\`\\`\n\n**状态**：🟢 通过\n\n**通过情况**：14/14 通过\n\n**详细覆盖说明**：\n- ✅ AC01: Provider 正常创建（包含数据库保存、模型列表自动获取）\n- ✅ AC02: API Key 无效检测（401 错误处理）\n- ✅ AC09: 429 错误重试（指数退避 1s、2s、4s）\n- ...\n\n**遗留工作**：无\n```\n\n**符合 spec-docs-pro 规则 6**：AC 必须可执行且可追踪\n\n---\n\n## 7. 阶段 6：验收交付\n\n### 7.1 冒烟测试\n\n**在真实环境中验证**：\n\n```bash\n# 启动应用\npnpm tauri dev\n\n# 执行完整用户流程\n# 1. 配置 Provider\n# 2. 测试连接\n# 3. 调用 API\n# 4. 查看使用记录\n```\n\n**要求**：\n- 功能正常工作\n- 无明显 Bug\n- 性能可接受\n\n### 7.2 代码审查\n\n**创建 Pull Request**：\n```bash\ngit push origin feature/v1-fr-011-new-feature\n# 在 GitHub 创建 PR\n```\n\n**PR 检查清单**：\n- [ ] 代码通过 CI 检查\n- [ ] 所有测试通过\n- [ ] 代码符合规范\n- [ ] 添加了必要的注释\n- [ ] 更新了相关文档\n\n**审查要点**：\n- 代码质量\n- 测试覆盖\n- 文档完整性\n- 安全性\n\n### 7.3 合并到主分支\n\n审查通过后合并：\n\n```bash\n# Squash merge（推荐）\ngit checkout main\ngit merge --squash feature/v1-fr-011-new-feature\ngit commit -m \"feat(module): add new feature (V1-FR-011)\"\ngit push origin main\n```\n\n### 7.4 更新实现状态\n\n在 [V1 实现状态](../02-产品与版本/当前版本/V1-实现状态.md) 中更新：\n\n```markdown\n| V1-FR-011 | 新功能 | 🟢 已完成 | 100% | @developer | - |\n```\n\n**符合 spec-docs-pro 规则 8**：状态只在实现状态维护\n\n---\n\n## 8. 特殊情况处理\n\n### 8.1 功能取消\n\n如果功能在开发过程中被取消：\n\n1. 停止开发\n2. 关闭相关分支\n3. 在功能规格文档顶部标注：\n   ```markdown\n   > ⚠️ **已取消**：此功能已取消，原因：XXX\n   ```\n4. 移动文档到 `99-历史归档/`\n5. 编号不复用\n\n**符合 spec-docs-pro 规则 10**：归档不删除\n\n### 8.2 功能变更\n\n如果功能需求发生重大变更：\n\n1. 创建新的冻结决策记录变更原因\n2. 更新功能规格文档\n3. 在文档中添加变更记录：\n   ```markdown\n   ## 变更记录\n   \n   | 日期 | 变更内容 | 变更人 |\n   |------|---------|--------|\n   | 2026-10-26 | 修改重试次数从 5 次改为 3 次（引用 D0XX） | @developer |\n   ```\n\n### 8.3 紧急 Bug 修复\n\n如果是紧急 Bug：\n\n1. 创建 hotfix 分支\n   ```bash\n   git checkout -b hotfix/provider-crash\n   ```\n\n2. 快速修复并测试\n\n3. 创建 PR，标注为 hotfix\n\n4. 审查通过后立即合并\n\n5. 后续补充功能规格和测试\n\n---\n\n## 9. 质量标准\n\n### 9.1 代码质量\n\n- ✅ 通过 lint 检查（clippy、eslint）\n- ✅ 通过格式检查（rustfmt、prettier）\n- ✅ 无编译警告\n- ✅ 单文件 < 1000 行\n\n### 9.2 测试质量\n\n- ✅ 核心功能单元测试覆盖率 > 60%\n- ✅ API 集成测试覆盖率 > 80%\n- ✅ 关键流程有 E2E 覆盖\n- ✅ 所有 AC 都有对应测试\n\n### 9.3 文档质量\n\n- ✅ 功能规格完整\n- ✅ AC 表完整\n- ✅ 验证记录已填写\n- ✅ 代码注释清晰\n\n---\n\n## 10. 工具与自动化\n\n### 10.1 CI/CD 流程\n\n每次 Push 或 PR 自动运行：\n\n```yaml\n# .github/workflows/ci.yml\nname: CI\n\non: [push, pull_request]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v3\n      - name: Run tests\n        run: |\n          cd server && cargo test\n          cd frontend && pnpm test\n      - name: Run lint\n        run: |\n          cargo clippy\n          pnpm lint\n```\n\n### 10.2 自动化检查\n\n- ✅ 代码格式检查\n- ✅ 单元测试\n- ✅ 集成测试\n- ✅ 构建检查\n- ✅ 依赖安全检查\n\n---\n\n## 11. 常见问题\n\n### Q1: 什么时候创建功能规格？\n\n**A**: 在开发开始之前。功能规格是开发的输入，不是事后补充。\n\n### Q2: 技术设计可以省略吗？\n\n**A**: 简单功能可以省略，但涉及金钱、权限、并发的必须有技术设计。\n\n### Q3: 验证记录什么时候填写？\n\n**A**: 开发完成、测试通过后立即填写，不要等到最后。\n\n### Q4: 功能规格可以修改吗？\n\n**A**: 可以修改，但要记录变更历史，并通过冻结决策记录重大变更。\n\n---\n\n## 12. 参考资源\n\n- [功能文档规范](功能文档规范.md)\n- [00-V1需求编号](V1/00-V1需求编号.md)\n- [V1 冻结决策](../06-决策记录/V1-冻结决策.md)\n- [V1 实现状态](../02-产品与版本/当前版本/V1-实现状态.md)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：开发团队  \n**适用范围**：所有 DGOS 功能开发\n", "doc-029": "# 功能文档规范\n\n本文档定义 DGOS 项目功能规格文档的标准格式和编写规范，确保所有功能文档的一致性和完整性。\n\n---\n\n## 1. 文档模板\n\n功能规格文档必须包含以下章节：\n\n```markdown\n# V1-FR-XXX：<功能名称>\n\n## 1. 功能元信息\n## 2. 功能概述\n## 3. 核心流程\n## 4. 数据模型\n## 5. 验收标准\n## 6. 接口设计\n## 7. 技术设计（可选）\n## 8. 错误码设计\n## 9. 非功能需求\n## 10. 实现与验证\n## 11. 依赖与影响\n## 12. 实现状态\n## 13. 变更记录\n```\n\n---\n\n## 2. 第 1 章：功能元信息\n\n### 2.1 必需字段\n\n```markdown\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-XXX |\n| 功能名称 | <简短名称> |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 / 应用模块 / 系统功能 |\n| 优先级 | P0（必须）/ P1（重要）/ P2（可选） |\n| 风险级别 | 低 / 标准 / 🔴 高 |\n| 依赖功能 | V1-FR-XXX, V1-FR-YYY |\n| 被依赖功能 | V1-FR-ZZZ |\n| 负责人 | @username / TBD |\n| 当前状态 | 规划中 / 开发中 / 已完成 |\n```\n\n### 2.2 字段说明\n\n| 字段 | 说明 | 示例 |\n|------|------|------|\n| **功能编号** | V1-FR-XXX 格式，永不改变 | V1-FR-001 |\n| **功能名称** | 简短、描述性 | Provider 适配框架 |\n| **所属版本** | V1 / V2 / V3 | V1 |\n| **所属领域** | 按目录划分 | 底层能力 |\n| **优先级** | P0 必须做，P1 重要，P2 可选 | P0 |\n| **风险级别** | 涉及金钱/权限/并发标为🔴高 | 标准 |\n| **依赖功能** | 此功能依赖哪些功能 | V1-FR-001 |\n| **被依赖功能** | 哪些功能依赖此功能 | V1-FR-006 |\n| **负责人** | GitHub 用户名 | @developer |\n| **当前状态** | 开发状态 | 开发中 |\n\n---\n\n## 3. 第 2 章：功能概述\n\n### 3.1 一句话描述\n\n**格式**：动词 + 对象 + 目的\n\n```markdown\n### 2.1 一句话描述\n\n连接官方 Skills 仓库，提供 Skills 浏览、安装、配置、调用和更新能力，扩展 AI 应用的工具能力。\n```\n\n### 3.2 详细说明\n\n**内容**：\n- 功能的背景和目标\n- 核心价值\n- 与其他功能的关系\n\n**长度**：3-5 段\n\n### 3.3 功能边界\n\n**必须明确**：包含什么 + 不包含什么\n\n```markdown\n### 2.3 功能边界\n\n**包含**：\n- ✅ Skills 列表浏览\n- ✅ Skills 安装和卸载\n- ✅ HTTP 和 CLI 两种调用方式\n\n**不包含**：\n- ❌ Skills 市场（V1.5 实现）\n- ❌ 自定义 Skills 开发（用户自行开发）\n- ❌ Skills 沙箱运行时（引用 D003）\n```\n\n---\n\n## 4. 第 3 章：核心流程\n\n### 4.1 用文本描述流程\n\n```markdown\n### 3.1 浏览和安装 Skills 流程\n\n\\`\\`\\`\n用户打开系统设置\n  ↓\n点击\"Skills 管理\"\n  ↓\n点击\"浏览 Skills 仓库\"\n  ↓\n系统从官方仓库获取 Skills 列表\n  ↓\n显示 Skills 列表（分类：搜索、计算、文件、数据等）\n  ↓\n用户搜索或浏览\n  ↓\n点击某个 Skill 查看详情\n  ↓\n点击\"安装\"\n  ↓\n安装完成，显示在已安装列表\n\\`\\`\\`\n```\n\n### 4.2 要点\n\n- 使用箭头表示流程\n- 包含用户操作和系统响应\n- 包含正常流程和异常流程\n- 分支用缩进表示\n\n---\n\n## 5. 第 4 章：数据模型\n\n### 5.1 涉及的数据表\n\n```markdown\n### 4.1 涉及的数据表\n\n**skills 表**（已安装的 Skills）：\n\\`\\`\\`sql\nCREATE TABLE skills (\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n    version TEXT NOT NULL,\n    enabled BOOLEAN DEFAULT TRUE,\n    config JSON,\n    created_at TIMESTAMP,\n    user_id TEXT,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n\\`\\`\\`\n```\n\n### 5.2 读写关系\n\n```markdown\n### 4.2 读写关系\n\n**读操作**：\n- 获取 Skills 列表：`SELECT * FROM skills WHERE user_id = ?`\n- 获取 Skill 配置：`SELECT config FROM skills WHERE id = ?`\n\n**写操作**：\n- 安装 Skill：`INSERT INTO skills`\n- 更新配置：`UPDATE skills SET config = ? WHERE id = ?`\n- 卸载 Skill：`DELETE FROM skills WHERE id = ?`\n```\n\n---\n\n## 6. 第 5 章：验收标准\n\n### 6.1 AC 逐项测试设计表\n\n**这是最重要的章节！**\n\n```markdown\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 连接官方仓库 | 网络正常 | 打开 Skills 浏览 | 成功获取 Skills 列表 | 后端 API + 外部集成 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills registry_fetch` | 规划中 |\n| AC02 | 浏览 Skills 列表 | 仓库已缓存 | 查看 Skills 列表 | 显示所有 Skills，支持分类和搜索 | 后端 API + 前端 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills skills_list` | 规划中 |\n```\n\n### 6.2 字段说明\n\n| 字段 | 说明 | 示例 |\n|------|------|------|\n| **AC** | 验收标准编号 | AC01 |\n| **验收重点** | 这个 AC 测试什么 | 连接官方仓库 |\n| **Given** | 前置条件 | 网络正常 |\n| **When** | 触发动作 | 打开 Skills 浏览 |\n| **Then** | 预期结果 | 成功获取列表 |\n| **测试层级** | 单元/集成/E2E | 后端 API |\n| **目标资产** | 测试文件路径 | `tests/registry.rs` |\n| **目标命令** | 运行测试的命令 | `cargo test ...` |\n| **初始资产状态** | 规划中/开发中/完成 | 规划中 |\n\n### 6.3 编写要点\n\n- ✅ 每个功能至少 5-10 个 AC\n- ✅ AC 编号连续（AC01、AC02...）\n- ✅ Given/When/Then 必须清晰\n- ✅ 目标命令必须可执行\n- ✅ 覆盖正常流程和异常流程\n\n---\n\n## 7. 第 6 章：接口设计\n\n### 7.1 Tauri Commands\n\n```markdown\n### 6.1 Tauri Commands（桌面端）\n\n\\`\\`\\`rust\n// Skills 浏览\n#[tauri::command]\nasync fn fetch_skills_registry() -> Result<Vec<SkillInfo>>;\n\n#[tauri::command]\nasync fn get_skill_detail(skill_id: String) -> Result<SkillDetail>;\n\n// Skills 安装管理\n#[tauri::command]\nasync fn install_skill(skill_id: String) -> Result<Skill>;\n\\`\\`\\`\n```\n\n### 7.2 HTTP API（如有局域网功能）\n\n```markdown\n### 6.2 HTTP API（局域网）\n\n\\`\\`\\`\nGET  /api/v1/skills              # Skills 列表\nPOST /api/v1/skills/:id/install  # 安装 Skill\nPOST /api/v1/skills/:id/call     # 调用 Skill\n\\`\\`\\`\n```\n\n---\n\n## 8. 第 7 章：技术设计（可选）\n\n### 8.1 何时需要\n\n- 涉及金钱、权限、加密\n- 复杂并发场景\n- 外部系统回调\n- 复杂状态机\n\n### 8.2 内容\n\n```markdown\n## 7. 技术设计\n\n### 7.1 核心设计\n\n架构图或类图\n\n### 7.2 核心流程伪代码\n\n\\`\\`\\`rust\n// B01-01: 获取 Skill 配置\nFUNCTION install_skill(skill_id: String) -> Result<Skill>:\n    // B01-02: 检查是否已安装\n    IF skill_exists(skill_id):\n        RETURN Err(AlreadyInstalled)\n    \n    // B01-03: 下载元数据\n    metadata = fetch_metadata(skill_id)?\n    \n    // B01-04: 保存到数据库\n    db.insert_skill(metadata)?\n    \n    RETURN Ok(skill)\n\\`\\`\\`\n\n### 7.3 分支到测试追踪表\n\n| 分支编号 | 分支描述 | AC 映射 | E2E 映射 | NFR 映射 | 风险级别 |\n|---------|---------|---------|---------|---------|---------|\n| B01-01  | 获取配置 | AC01    | V1-E2E-01 | - | 低 |\n| B01-02  | 检查已安装 | AC03    | - | - | 低 |\n| B01-04  | 保存数据库 | AC03    | - | - | 🔴 高 |\n```\n\n### 8.3 分支追踪规则\n\n- ✅ 每个关键分支都要标注 ID\n- ✅ 格式：`// BXX-YY`（XX=主流程，YY=子步骤）\n- ✅ 高风险分支必须标注 🔴\n- ✅ 必须有分支到测试追踪表\n\n---\n\n## 9. 第 8 章：错误码设计\n\n```markdown\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1002001 | skill_not_found | Skill 不存在 | 检查 Skill ID |\n| 1002002 | skill_already_installed | Skill 已安装 | 询问是否重新安装 |\n| 1002003 | dependency_not_satisfied | 依赖不满足 | 安装依赖（Python/Node.js） |\n```\n\n**错误码规则**：\n- 格式：`10XXYYZ`\n  - `10`：固定前缀\n  - `XX`：模块编号（02=Skills）\n  - `YY`：错误类型\n  - `Z`：序号\n\n---\n\n## 10. 第 9 章：非功能需求\n\n```markdown\n## 9. 非功能需求\n\n### 9.1 性能要求\n\n- Skills 列表加载时间 < 2s\n- Skill 安装时间 < 10s\n- Skill 调用响应时间 < 5s\n\n### 9.2 并发场景\n\n**场景 1：多个用户同时调用同一 HTTP Skill**\n- 冲突点：Skills 服务端负载\n- 控制方式：无锁设计，Skills 服务自行处理并发\n- 预期行为：所有请求转发到 Skills 服务\n- 失败策略：Skills 超时或失败时记录错误\n\n### 9.3 安全要求\n\n- API Key 必须加密存储\n- Skills 配置敏感信息加密\n- Skills 调用需要权限检查\n```\n\n---\n\n## 11. 第 10 章：实现与验证\n\n### 11.1 验证记录格式\n\n```markdown\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n#### 2026-10-26 后端单元测试\n\n\\`\\`\\`bash\ncd server && DATABASE_URL=sqlite::memory: cargo test -p dgos-skills --lib\n\\`\\`\\`\n\n**状态**：🟢 通过 / 🟡 部分通过 / 🔴 未开始\n\n**通过情况**：14/14 通过\n\n**详细覆盖说明**：\n- ✅ AC01: 连接官方仓库（网络正常 + 缓存处理）\n- ✅ AC02: 浏览 Skills 列表（分类、搜索、排序）\n- ✅ AC03: 安装 Skill（下载、解压、保存）\n- ⚠️ AC05: Skills 调用超时（需要 mock HTTP 服务，延后实现）\n- ❌ AC06: 并发调用测试（待实现）\n\n**遗留工作**：\n- AC05, AC06 需要集成测试环境\n```\n\n### 11.2 状态标识\n\n- 🟢 通过：所有测试通过\n- 🟡 部分通过：部分测试通过，有遗留\n- 🔴 未开始：尚未开始测试\n\n### 11.3 覆盖说明\n\n- ✅ 已通过\n- ⚠️ 部分通过（说明原因）\n- ❌ 未通过（说明原因）\n\n---\n\n## 12. 第 11 章：依赖与影响\n\n```markdown\n## 11. 依赖与影响\n\n### 11.1 上游依赖\n\n| 依赖功能 | 依赖内容 | 影响 |\n| --- | --- | --- |\n| V1-FR-001 | Provider 框架 | Skills 可能调用 AI |\n| V1-FR-008 | 用户管理 | Skills 按用户隔离 |\n\n### 11.2 下游影响\n\n| 被依赖功能 | 影响内容 | 影响程度 |\n| --- | --- | --- |\n| V1-FR-006 | AI 工作台 | 可选 Skills 增强 |\n| V2 画布系统 | 节点可使用 Skills | 高 |\n```\n\n---\n\n## 13. 第 12 章：实现状态\n\n```markdown\n## 12. 实现状态\n\n| 模块 | 状态 | 进度 | 负责人 | 备注 |\n| --- | --- | --- | --- | --- |\n| Skills Registry | 🔴 未开始 | 0% | TBD | - |\n| Skills Manager | 🔴 未开始 | 0% | TBD | - |\n| HTTP 调用 | 🔴 未开始 | 0% | TBD | - |\n| CLI 调用 | 🔴 未开始 | 0% | TBD | - |\n| 前端 UI | 🔴 未开始 | 0% | TBD | - |\n| 测试用例 | 🔴 未开始 | 0% | TBD | - |\n\n详见 [V1 实现状态](../../02-产品与版本/当前版本/V1-实现状态.md)。\n```\n\n---\n\n## 14. 第 13 章：变更记录\n\n```markdown\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2026-10-26 | 初始版本，基于 spec-docs-pro 创建 | @developer |\n| 2026-11-01 | 修改重试次数从 5 次改为 3 次（引用 D0XX） | @developer |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n```\n\n---\n\n## 15. 文档检查清单\n\n提交功能规格前检查：\n\n### 15.1 必需章节\n\n- [ ] 功能元信息完整\n- [ ] 功能概述清晰\n- [ ] 核心流程完整\n- [ ] 数据模型明确\n- [ ] AC 表完整（至少 5 个）\n- [ ] 接口设计明确\n\n### 15.2 质量检查\n\n- [ ] AC 表格式正确，字段完整\n- [ ] Given/When/Then 清晰\n- [ ] 目标命令可执行\n- [ ] 功能边界明确\n- [ ] 依赖关系清晰\n\n### 15.3 可选章节（按需）\n\n- [ ] 技术设计（如涉及高风险）\n- [ ] 分支追踪 ID（如有技术设计）\n- [ ] 并发场景说明（如有并发）\n\n---\n\n## 16. 常见错误\n\n### 16.1 AC 表常见错误\n\n❌ **错误**：\n```\n| AC01 | 测试功能 | - | - | - | 测试 | - | - | - |\n```\n\n✅ **正确**：\n```\n| AC01 | 连接官方仓库 | 网络正常 | 打开 Skills 浏览 | 成功获取 Skills 列表 | 后端 API + 外部集成 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills registry_fetch` | 规划中 |\n```\n\n### 16.2 验证记录常见错误\n\n❌ **错误**：\n```\n测试通过了\n```\n\n✅ **正确**：\n```\n#### 2026-10-26 后端单元测试\n\n\\`\\`\\`bash\ncd server && cargo test -p dgos-skills --lib\n\\`\\`\\`\n\n**状态**：🟢 通过\n**通过情况**：14/14 通过\n**详细覆盖说明**：...\n```\n\n---\n\n## 17. 参考资源\n\n- [功能开发流程](功能开发流程.md)\n- [00-V1需求编号](V1/00-V1需求编号.md)\n- [V1 冻结决策](../06-决策记录/V1-冻结决策.md)\n- [spec-docs-pro 质量检查清单](/.omp/agent/skills/spec-docs-pro/templates/quality-checklist.md)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：开发团队  \n**适用范围**：所有 DGOS 功能规格文档\n", "doc-030": "# 技术架构导航\n\n## 系统级\n\n- [总体架构](总体架构.md)\n- [服务与领域边界](服务与领域边界.md)\n- [技术栈选型](技术栈选型.md)\n\n## V1 当前架构\n\n- [V1 总体架构](当前版本/V1-总体架构.md)\n- [V1 接口契约](当前版本/V1-接口契约.md)\n- [V1 OpenAPI](当前版本/V1-openapi.yaml)\n- [V1 数据模型](当前版本/V1-数据模型.md)\n- [V1 统一设计系统](当前版本/V1-统一设计系统.md)\n- [V1 模块系统设计](当前版本/V1-模块系统设计.md)\n\n## 系统设计\n\n> 💡 **说明**：系统设计文档已整合到功能规格中（第 7 章技术设计），避免重复维护。\n\n以下设计文档位于功能规格：\n\n- [Provider 适配框架设计](../03-功能规格/V1/01-底层能力/01-Provider适配框架.md#7-技术设计) - V1-FR-001 第 7 章\n- [Skills 管理系统设计](../03-功能规格/V1/01-底层能力/02-Skills管理系统.md#7-技术设计) - V1-FR-002 第 7 章\n- [MCP 管理系统设计](../03-功能规格/V1/01-底层能力/03-MCP管理系统.md#7-技术设计) - V1-FR-003 第 7 章\n- [模块加载与热更新设计](../03-功能规格/V1/01-底层能力/04-模块系统与热更新.md#7-技术设计) - V1-FR-004 第 7 章\n- [权限系统设计](../03-功能规格/V1/03-系统功能/02-模块权限管理.md#7-技术设计) - V1-FR-009 第 7 章\n- [局域网协同设计](../03-功能规格/V1/03-系统功能/03-局域网协同.md#7-技术设计) - V1-FR-010 第 7 章\n## 权威边界\n\n- HTTP 字段级权威只有 OpenAPI；Markdown 契约负责公共语义（鉴权、错误包体），功能文档引用 operationId 并记录业务语义，不复制 schema。\n- 数据物理事实以 migration 为准；数据模型文档负责解释约束、状态与演进。\n- 设计系统规范为所有模块强制遵守，不得自定义样式覆盖。\n", "doc-031": "# V1 总体架构\n\n本文档描述 DGOS V1.0 的总体架构设计，包括系统分层、模块组织、数据流和技术选型。\n\n---\n\n## 1. 架构概览\n\nDGOS V1.0 采用**模块化单体架构**（Modular Monolith）+ **微前端架构**（Module Federation）：\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                          用户界面                                │\n│                     (Tauri Desktop App)                         │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                        前端层 (React SPA)                        │\n├─────────────────────────────────────────────────────────────────┤\n│  ┌───────────────┬───────────────┬──────────────────────────┐  │\n│  │  AI 工作台    │   系统设置    │   第三方模块（动态加载）  │  │\n│  └───────────────┴───────────────┴──────────────────────────┘  │\n│                    Module Federation 层                         │\n│           (运行时模块加载 + 共享依赖 + 版本管理)                │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                      Tauri IPC 通信层                            │\n│              (Command-based RPC + Event System)                 │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                    后端层 (Rust + Axum)                          │\n├─────────────────────────────────────────────────────────────────┤\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │              应用服务层 (Application Services)            │  │\n│  │  ┌──────────┬──────────┬──────────┬──────────────────┐  │  │\n│  │  │Workbench │ Settings │  Canvas  │   第三方模块...   │  │  │\n│  │  └──────────┴──────────┴──────────┴──────────────────┘  │  │\n│  └──────────────────────────────────────────────────────────┘  │\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │               领域服务层 (Domain Services)                │  │\n│  │  ┌──────────┬──────────┬──────────┬──────────┬───────┐  │  │\n│  │  │Providers │ Skills   │   MCP    │ Modules  │ Auth  │  │  │\n│  │  └──────────┴──────────┴──────────┴──────────┴───────┘  │  │\n│  └──────────────────────────────────────────────────────────┘  │\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │             基础设施层 (Infrastructure)                    │  │\n│  │  ┌──────────┬──────────┬──────────┬──────────────────┐  │  │\n│  │  │ Storage  │ Network  │  HTTP    │   Logging...     │  │  │\n│  │  └──────────┴──────────┴──────────┴──────────────────┘  │  │\n│  └──────────────────────────────────────────────────────────┘  │\n└─────────────────────────────────────────────────────────────────┘\n                              ↓\n┌─────────────────────────────────────────────────────────────────┐\n│                     数据层 (SQLite)                              │\n│  ┌──────────────────────────────────────────────────────────┐  │\n│  │  users | providers | models | skills | mcp_servers ...   │  │\n│  └──────────────────────────────────────────────────────────┘  │\n└─────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 2. 分层设计\n\n### 2.1 前端层（React + Vite + Module Federation）\n\n**职责**：\n- 用户交互界面\n- 业务逻辑展示\n- 模块动态加载\n\n**核心模块**：\n- **AI 工作台**：对话界面、流式响应、历史记录\n- **系统设置**：Provider/Skills/MCP/模块管理\n- **统一设计系统**：`@dgos/ui` 组件库\n\n**技术特点**：\n- Module Federation 实现微前端\n- 模块运行时动态加载\n- 共享 React、Zustand 等依赖\n\n### 2.2 Tauri IPC 层\n\n**职责**：\n- 前后端通信桥梁\n- 类型安全的 RPC\n- 事件系统\n\n**通信模式**：\n```rust\n// 前端调用后端\nconst result = await invoke('call_provider', { \n    providerId, modelId, request \n});\n\n// 后端推送事件\n#[tauri::command]\nasync fn stream_response(...) {\n    app_handle.emit(\"chat_chunk\", chunk)?;\n}\n```\n\n### 2.3 应用服务层（Rust）\n\n**职责**：\n- 处理前端请求\n- 协调多个领域服务\n- 业务流程编排\n\n**示例**：\n```rust\n// Workbench 服务\npub struct WorkbenchService {\n    providers: Arc<ProvidersManager>,\n    skills: Arc<SkillsManager>,\n}\n\nimpl WorkbenchService {\n    pub async fn send_message(&self, request: ChatRequest) -> Result<Response> {\n        // 1. 调用 Provider\n        let response = self.providers.call(request).await?;\n        \n        // 2. 可选 Skills 增强\n        if let Some(skill_id) = request.skill_id {\n            let enhanced = self.skills.enhance(response).await?;\n            return Ok(enhanced);\n        }\n        \n        Ok(response)\n    }\n}\n```\n\n### 2.4 领域服务层（Rust）\n\n**职责**：\n- 实现核心业务逻辑\n- 领域模型封装\n- 对外提供统一接口\n\n**核心服务**：\n- **ProvidersManager**：Provider 适配和调用\n- **SkillsManager**：Skills 管理和调用\n- **MCPClient**：MCP 连接和工具调用\n- **ModuleLoader**：模块加载和权限管理\n- **AuthService**：认证和权限检查\n\n### 2.5 基础设施层（Rust）\n\n**职责**：\n- 提供技术基础设施\n- 不涉及业务逻辑\n\n**核心组件**：\n- **Storage**：SQLite 数据访问\n- **Network**：HTTP 服务器（局域网）\n- **Logger**：日志记录\n- **Config**：配置管理\n\n### 2.6 数据层（SQLite）\n\n**职责**：\n- 持久化存储\n- 数据隔离\n- 事务支持\n\n**核心表**：\n- `users`：用户账号\n- `providers`：Provider 配置\n- `models`：模型列表\n- `skills`：已安装 Skills\n- `mcp_servers`：MCP 服务器\n- `installed_modules`：已安装模块\n- `conversations`：对话历史\n\n---\n\n## 3. 核心流程\n\n### 3.1 用户发起对话\n\n```\n用户输入 \"你好\"\n   ↓\n前端：Workbench 组件\n   ↓\nTauri IPC：invoke('send_message', { text: '你好' })\n   ↓\n后端：WorkbenchService.send_message()\n   ↓\nProvidersManager.call(provider_id, request)\n   ↓\nOpenAI API（外部）\n   ↓\n流式返回：SSE chunks\n   ↓\n后端：app_handle.emit(\"chat_chunk\", chunk)\n   ↓\n前端：监听事件，实时渲染\n   ↓\n用户看到流式响应\n```\n\n### 3.2 动态加载模块\n\n```\n用户点击\"加载模块\"\n   ↓\n前端：Settings 组件\n   ↓\nTauri IPC：invoke('load_module', { manifest })\n   ↓\n后端：ModuleLoader.load_module()\n   ↓\n验证 manifest.json\n   ↓\n检查权限要求\n   ↓\n前端：显示权限授权对话框\n   ↓\n用户授权\n   ↓\n后端：注册模块，返回加载地址\n   ↓\n前端：动态 import 模块代码\n   ↓\nModule Federation 加载\n   ↓\n模块渲染到界面\n```\n\n### 3.3 Skills 调用（可选增强）\n\n```\n用户发起对话，选择 Skill\n   ↓\nWorkbenchService.send_message()\n   ↓\n1. ProvidersManager.call() → LLM 响应\n   ↓\n2. SkillsManager.call_skill(skill_id, response)\n   ↓\nHTTP 请求到 Skill 服务\n   ↓\nSkill 处理（如格式化、增强）\n   ↓\n返回增强后的结果\n   ↓\n合并展示给用户\n```\n\n---\n\n## 4. 数据流\n\n### 4.1 用户数据隔离\n\n```\n用户 A 登录\n   ↓\nJWT Token（包含 user_id）\n   ↓\n所有请求携带 Token\n   ↓\n后端验证 Token，提取 user_id\n   ↓\n所有数据库查询自动过滤：WHERE user_id = ?\n   ↓\n用户 A 只能看到自己的数据\n```\n\n### 4.2 模块权限检查\n\n```\n模块调用 Provider\n   ↓\nModuleLoader.check_permission(module_id, \"providers.call\")\n   ↓\n查询 module_permissions 表\n   ↓\n有权限 → 允许调用\n无权限 → 返回 403 错误\n```\n\n---\n\n## 5. 技术特性\n\n### 5.1 模块热更新\n\n**实现**：Module Federation + Vite\n\n```javascript\n// 模块定义\nexport default {\n  name: 'my-module',\n  filename: 'remoteEntry.js',\n  exposes: {\n    './App': './src/App',\n  },\n  shared: ['react', 'react-dom'],\n};\n\n// 动态加载\nconst module = await import('http://localhost:3001/remoteEntry.js');\n```\n\n### 5.2 流式响应\n\n**实现**：SSE (Server-Sent Events) + Tauri Events\n\n```rust\n// 后端\npub async fn stream_provider(&self, request: Request) -> Result<()> {\n    let mut stream = self.provider.stream(request).await?;\n    \n    while let Some(chunk) = stream.next().await {\n        self.app_handle.emit(\"chat_chunk\", chunk)?;\n    }\n    \n    Ok(())\n}\n```\n\n```typescript\n// 前端\nlisten('chat_chunk', (event) => {\n    const chunk = event.payload;\n    appendToMessage(chunk);\n});\n```\n\n### 5.3 数据库迁移\n\n**实现**：SeaORM Migrations\n\n```rust\n// migrations/m20240101_000001_create_providers.rs\npub struct Migration;\n\nimpl MigrationTrait for Migration {\n    async fn up(&self, manager: &SchemaManager) -> Result<(), DbErr> {\n        manager\n            .create_table(\n                Table::create()\n                    .table(Providers::Table)\n                    .col(ColumnDef::new(Providers::Id).text().primary_key())\n                    .col(ColumnDef::new(Providers::Name).text().not_null())\n                    .to_owned(),\n            )\n            .await\n    }\n}\n```\n\n---\n\n## 6. 非功能特性\n\n### 6.1 性能\n\n| 指标 | 目标 | 实现方式 |\n|------|------|---------|\n| 启动时间 | < 2s | Rust 编译优化 + 懒加载 |\n| 模块加载 | < 1s | Module Federation + 代码分割 |\n| API 响应 | P95 < 200ms | 异步 I/O + 本地 SQLite |\n| UI 帧率 | > 60fps | React 18 Concurrent Mode |\n| 内存占用 | < 200MB | Rust 无 GC + 按需加载 |\n\n### 6.2 安全\n\n| 层次 | 措施 |\n|------|------|\n| **后端** | Rust 内存安全 + 参数化查询 |\n| **认证** | JWT + bcrypt 密码哈希 |\n| **权限** | 模块级粗粒度权限检查 |\n| **数据** | API Key 加密存储（AES-256） |\n| **前端** | Tauri CSP + XSS 防护 |\n\n### 6.3 可维护性\n\n| 措施 | 说明 |\n|------|------|\n| **强制模块化** | Rust 编译期保证，单文件 < 1000 行 |\n| **类型安全** | Rust + TypeScript 端到端类型安全 |\n| **文档驱动** | spec-docs-pro 规格驱动开发 |\n| **自动化测试** | 单元测试 + 集成测试 + E2E |\n| **CI/CD** | GitHub Actions 自动检查 |\n\n---\n\n## 7. 部署架构\n\n### 7.1 本地部署（V1.0）\n\n```\n用户机器\n├── DGOS.app (macOS)\n│   ├── Rust 后端（嵌入）\n│   ├── React 前端（嵌入）\n│   └── SQLite 数据库\n└── ~/.dgos/\n    ├── users/\n    │   └── {user_id}/\n    │       └── data.db\n    ├── modules/\n    │   └── {module_id}/\n    └── skills/\n        └── {skill_id}/\n```\n\n### 7.2 局域网协同（V1.0）\n\n```\n主机（192.168.1.100）\n├── DGOS.app\n└── HTTP 服务 :3000\n\n远程设备\n└── 浏览器 → http://192.168.1.100:3000\n    ├── 认证（用户名/密码）\n    ├── 只读模式\n    └── 使用主机的 Provider/Skills/MCP\n```\n\n### 7.3 云端同步（V2.0）\n\n```\n用户机器\n├── DGOS.app\n└── 可选同步到云端\n\n云端服务器\n├── PostgreSQL\n└── S3 存储\n```\n\n---\n\n## 8. 技术栈总结\n\n| 层次 | 技术 | 版本 |\n|------|------|------|\n| **桌面** | Tauri | 2.0+ |\n| **后端** | Rust + Axum + SeaORM | 1.75+ / 0.7+ / 0.12+ |\n| **前端** | React + TypeScript + Vite | 18.2+ / 5.3+ / 5.0+ |\n| **数据库** | SQLite | 3.40+ |\n| **模块化** | Module Federation | 2.0+ |\n\n详见 [技术栈选型](技术栈选型.md)\n\n---\n\n## 9. 架构决策\n\n所有架构决策记录在 [V1 冻结决策](../../06-决策记录/V1-冻结决策.md)：\n\n- **D001**：Rust + Tauri 而非 Python + Electron\n- **D002**：SQLite 而非 PostgreSQL\n- **D003**：不嵌入 JavaScript 运行时\n- **D004**：Module Federation 实现模块热更新\n- **D005**：使用现有标准协议（LangChain、MCP）\n- **D006**：粗粒度模块级权限\n- **D007**：局域网服务始终开启\n- **D008**：统一设计系统强制复用\n- **D009**：无限画布分多版本实现\n\n---\n\n## 10. 相关文档\n\n- [服务与领域边界](../服务与领域边界.md)\n- [技术栈选型](../技术栈选型.md)\n- [V1 接口契约](V1-接口契约.md)\n- [V1 数据模型](V1-数据模型.md)\n- [V1 冻结决策](../../06-决策记录/V1-冻结决策.md)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：架构团队  \n**审核状态**：已通过\n", "doc-032": "# V1 接口契约\n\n## 1. 文档目标\n\n本文档定义 DGOS V1 的所有接口，包括 Tauri Commands（桌面端）和 HTTP API（局域网）。\n\n**权威性**：\n- ✅ 接口的唯一权威来源\n- ✅ 前后端开发的契约\n- ✅ API 文档自动生成的基础\n\n**更新原则**：\n- 新增接口：先更新此文档，再编码\n- 修改接口：记录版本和兼容性\n- 废弃接口：标记 `@deprecated`，至少保留一个版本\n\n---\n\n## 2. 接口分层\n\n### 2.1 接口层级\n\n```\n┌─────────────────────────────────┐\n│   前端（React + Tauri）          │\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   Tauri Commands（桌面端入口）   │ ← ✅ 第一道权限检查\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   业务逻辑层（Rust）             │ ← ✅ 核心权限检查\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   数据访问层（SeaORM）           │\n└─────────────────────────────────┘\n```\n\n```\n┌─────────────────────────────────┐\n│   远程设备（浏览器）             │\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   HTTP API（局域网入口）         │ ← ✅ 第一道权限检查\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   业务逻辑层（Rust）             │ ← ✅ 核心权限检查\n└─────────────────────────────────┘\n           ↓\n┌─────────────────────────────────┐\n│   数据访问层（SeaORM）           │\n└─────────────────────────────────┘\n```\n\n### 2.2 权限检查分层\n\n根据 spec-docs-pro 的建议：\n\n**Tauri Command 层**：\n```rust\n#[tauri::command]\nasync fn list_providers(\n    state: State<'_, AppState>,\n    session_token: String, // 从前端传入\n) -> Result<Vec<Provider>> {\n    // 1. 验证 session\n    let user_id = state.auth.verify_session(&session_token).await?;\n    \n    // 2. 调用业务逻辑（再次检查权限）\n    state.provider_service.list_providers(&user_id).await\n}\n```\n\n**HTTP API 层**：\n```rust\nasync fn list_providers(\n    Extension(db): Extension<DatabasePool>,\n    Extension(user_id): Extension<String>, // 从中间件注入\n) -> Result<Json<Vec<Provider>>> {\n    // 1. user_id 已由中间件验证\n    \n    // 2. 调用业务逻辑（再次检查权限）\n    let providers = provider_service.list_providers(&user_id).await?;\n    Ok(Json(providers))\n}\n```\n\n**业务逻辑层**：\n```rust\nimpl ProviderService {\n    pub async fn list_providers(&self, user_id: &str) -> Result<Vec<Provider>> {\n        // 最终防线：确保数据隔离\n        self.db.find_by_user(user_id).await\n    }\n}\n```\n\n---\n\n## 3. Tauri Commands（桌面端）\n\n### 3.1 用户管理（V1-FR-008）\n\n#### 用户注册\n\n```rust\n#[tauri::command]\nasync fn register_user(\n    username: String,\n    password: String,\n) -> Result<User>;\n```\n\n**引用**：V1-FR-008（本地用户管理）  \n**分支**：B08-03 ~ B08-07\n\n**请求**：\n- `username`：用户名（4-20 字符）\n- `password`：密码（至少 6 字符）\n\n**响应**：\n```json\n{\n  \"id\": \"uuid\",\n  \"username\": \"alice\",\n  \"created_at\": \"2024-01-01T00:00:00Z\"\n}\n```\n\n**错误码**：\n- `1008001`：用户名已存在\n- `1008002`：密码强度不足\n- `1008003`：用户名格式错误\n\n---\n\n#### 用户登录\n\n```rust\n#[tauri::command]\nasync fn login_user(\n    username: String,\n    password: String,\n) -> Result<Session>;\n```\n\n**引用**：V1-FR-008  \n**分支**：B08-08 ~ B08-13\n\n**响应**：\n```json\n{\n  \"user\": {\n    \"id\": \"uuid\",\n    \"username\": \"alice\"\n  },\n  \"session_token\": \"uuid\",\n  \"expires_at\": \"2024-01-08T00:00:00Z\"\n}\n```\n\n**错误码**：\n- `1008004`：用户不存在\n- `1008005`：密码错误\n\n---\n\n#### 获取用户列表\n\n```rust\n#[tauri::command]\nasync fn list_users() -> Result<Vec<User>>;\n```\n\n**引用**：V1-FR-008\n\n**响应**：\n```json\n[\n  {\n    \"id\": \"uuid\",\n    \"username\": \"alice\",\n    \"last_login_at\": \"2024-01-01T00:00:00Z\"\n  }\n]\n```\n\n---\n\n#### 删除用户\n\n```rust\n#[tauri::command]\nasync fn delete_user(\n    user_id: String,\n    password: String, // 二次确认\n) -> Result<()>;\n```\n\n**引用**：V1-FR-008  \n**分支**：B08-14 ~ B08-16\n\n**错误码**：\n- `1008006`：用户不存在\n- `1008007`：密码错误\n\n---\n\n### 3.2 Provider 管理（V1-FR-001）\n\n#### 获取 Provider 列表\n\n```rust\n#[tauri::command]\nasync fn list_providers(\n    session_token: String,\n) -> Result<Vec<Provider>>;\n```\n\n**引用**：V1-FR-001（Provider 适配框架）  \n**分支**：B01-03\n\n**响应**：\n```json\n[\n  {\n    \"id\": \"uuid\",\n    \"name\": \"OpenAI\",\n    \"provider_type\": \"openai-compatible\",\n    \"base_url\": \"https://api.openai.com/v1\",\n    \"enabled\": true,\n    \"sort_order\": 0,\n    \"model_count\": 5\n  }\n]\n```\n\n---\n\n#### 创建 Provider\n\n```rust\n#[tauri::command]\nasync fn create_provider(\n    session_token: String,\n    name: String,\n    provider_type: String,\n    base_url: String,\n    api_key: String,\n) -> Result<Provider>;\n```\n\n**引用**：V1-FR-001  \n**分支**：B01-01 ~ B01-02\n\n**错误码**：\n- `1001001`：Provider 名称重复\n- `1001002`：Provider 类型不支持\n- `1001003`：base_url 格式错误\n\n---\n\n#### 更新 Provider\n\n```rust\n#[tauri::command]\nasync fn update_provider(\n    session_token: Str
