 401 Unauthorized | 1001003, 1008005, 1010004 |\n| 无权限 | 403 Forbidden | 1001011, 1002004, 1009001 |\n| 资源不存在 | 404 Not Found | 1001001, 1002001, 1003001 |\n| 资源冲突 | 409 Conflict | 1001007, 1002003, 1004006 |\n| 速率限制 | 429 Too Many Requests | 1001013 |\n| 上游错误 | 502 Bad Gateway | 1001004, 1002006, 1003005 |\n| 服务不可用 | 503 Service Unavailable | 1003002, 1010003 |\n| 超时 | 504 Gateway Timeout | 1001005, 1002007, 1003006 |\n| 服务器错误 | 500 Internal Server Error | 1004010, 1006003, 1008008 |\n\n---\n\n## 6. 错误码检查\n\n### 6.1 检查重复\n\n```bash\n# 检查重复错误码\ncd docs/03-功能规格/V1\ngrep -h \"| [0-9]\\{7\\} |\" *//*.md | \\\n  awk '{print $2}' | \\\n  sort | \\\n  uniq -d\n```\n\n**结果**：无重复（预期输出为空）\n\n### 6.2 检查范围\n\n```bash\n# 检查错误码是否在正确范围\ncd docs/03-功能规格/V1\ngrep -h \"| [0-9]\\{7\\} |\" *//*.md | \\\n  awk '{print $2}' | \\\n  sort | \\\n  while read code; do\n    prefix=${code:0:2}\n    if [ $prefix -lt 10 ] || [ $prefix -gt 10 ]; then\n      echo \"Error: $code 不在正确范围\"\n    fi\n  done\n```\n\n---\n\n## 7. 前端使用示例\n\n### 7.1 错误处理\n\n```typescript\n// 错误码映射\nconst ERROR_MESSAGES: Record<string, string> = {\n  '1001001': 'Provider 不存在',\n  '1001002': '模型不存在',\n  '1001003': 'API Key 无效',\n  // ...\n};\n\n// 错误处理\ntry {\n  const result = await invoke('call_provider', { ... });\n} catch (error) {\n  const errorCode = error.code;\n  const message = ERROR_MESSAGES[errorCode] || '未知错误';\n  \n  // 显示错误提示\n  toast.error(message);\n  \n  // 根据错误码处理\n  if (errorCode === '1001003') {\n    // 跳转到 Provider 配置页面\n    navigate('/settings/providers');\n  }\n}\n```\n\n### 7.2 国际化\n\n```typescript\n// i18n/zh-CN.ts\nexport default {\n  errors: {\n    '1001001': 'Provider 不存在',\n    '1001002': '模型不存在',\n    '1001003': 'API Key 无效',\n    // ...\n  }\n};\n\n// i18n/en-US.ts\nexport default {\n  errors: {\n    '1001001': 'Provider not found',\n    '1001002': 'Model not found',\n    '1001003': 'Invalid API key',\n    // ...\n  }\n};\n```\n\n---\n\n## 8. 后端使用示例\n\n### 8.1 定义错误码\n\n```rust\n// server/crates/core/src/error.rs\n\n#[derive(Debug, thiserror::Error)]\npub enum AppError {\n    #[error(\"Provider not found\")]\n    ProviderNotFound, // 1001001\n    \n    #[error(\"Model not found\")]\n    ModelNotFound, // 1001002\n    \n    #[error(\"Invalid API key\")]\n    InvalidApiKey, // 1001003\n    \n    // ...\n}\n\nimpl AppError {\n    pub fn code(&self) -> String {\n        match self {\n            AppError::ProviderNotFound => \"1001001\".to_string(),\n            AppError::ModelNotFound => \"1001002\".to_string(),\n            AppError::InvalidApiKey => \"1001003\".to_string(),\n            // ...\n        }\n    }\n    \n    pub fn http_status(&self) -> StatusCode {\n        match self {\n            AppError::ProviderNotFound => StatusCode::NOT_FOUND,\n            AppError::ModelNotFound => StatusCode::NOT_FOUND,\n            AppError::InvalidApiKey => StatusCode::UNAUTHORIZED,\n            // ...\n        }\n    }\n}\n```\n\n### 8.2 返回错误\n\n```rust\n// Tauri Command\n#[tauri::command]\nasync fn call_provider(\n    provider_id: String,\n    model_id: String,\n) -> Result<Response, AppError> {\n    let provider = provider_repo.find_by_id(&provider_id).await\n        .ok_or(AppError::ProviderNotFound)?;\n    \n    // ...\n}\n\n// HTTP API\nasync fn call_provider_http(\n    Extension(db): Extension<DatabasePool>,\n    Json(request): Json<Request>,\n) -> Result<Json<Response>, AppError> {\n    let provider = provider_repo.find_by_id(&request.provider_id).await\n        .ok_or(AppError::ProviderNotFound)?;\n    \n    // ...\n}\n```\n\n---\n\n## 9. 日志与监控\n\n### 9.1 结构化日志\n\n```rust\ntracing::error!(\n    error_code = \"1001001\",\n    provider_id = %provider_id,\n    user_id = %user_id,\n    \"Provider not found\"\n);\n```\n\n### 9.2 错误码统计\n\n```sql\n-- 统计错误码分布\nSELECT \n    error_code,\n    COUNT(*) as count,\n    MIN(created_at) as first_seen,\n    MAX(created_at) as last_seen\nFROM error_logs\nWHERE created_at > NOW() - INTERVAL '7 days'\nGROUP BY error_code\nORDER BY count DESC\nLIMIT 10;\n```\n\n---\n\n## 10. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n|------|---------|--------|\n| 2024-01-XX | 初始版本，定义 99 个错误码 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成  \n**错误码总数**：99  \n**下次更新**：新增功能或错误码变更时同步更新\n", "doc-035": "# DGOS 总体架构\n\n## 1. 架构定位\n\nDGOS 是本地优先的 AI 应用开发框架。它提供统一的 Provider 适配、Skills/MCP 管理和模块系统基础能力；桌面端与局域网 Web 端共用同一套前端应用包、设计系统和版本化 API。本地数据存储在 SQLite，云端服务为可选增强。\n\n跨版本保持以下边界稳定：应用模块通过统一接口调用底层能力；模块之间不直接访问彼此私有状态；跨模块通信通过系统 API 完成。\n\n## 2. 核心原则\n\n- **本地优先**：SQLite 单文件数据库，完全离线可用，云端为可选增强\n- **强制模块化**：单文件不超过 1000 行，按领域拆分 crate，CI 自动检查\n- **标准协议**：使用现有 Skills/MCP 标准，不重新发明轮子\n- **热更新**：应用模块独立构建、动态加载，无需重启主程序\n- **统一设计**：所有模块强制使用统一 Design System，禁止自定义样式\n\n## 3. 分层架构\n\n```\n┌─────────────────────────────────────────────┐\n│          应用模块层（可热更新）              │\n│  ┌──────────┬──────────┬──────────┐        │\n│  │AI工作台  │画布编辑器 │文件管理  │ ...    │\n│  │(V1)      │(V1.2+)   │(V2.0)    │        │\n│  └──────────┴──────────┴──────────┘        │\n├─────────────────────────────────────────────┤\n│         应用框架层                           │\n│  ┌────────────────────────────────┐        │\n│  │ 模块加载器 │ 权限管理 │ 路由系统 │       │\n│  │ 热更新机制 │ 统一设计系统 │ Store │       │\n│  └────────────────────────────────┘        │\n├─────────────────────────────────────────────┤\n│         底层能力框架                         │\n│  ┌────────────┬──────────┬──────────┐      │\n│  │Provider    │Skills    │MCP       │      │\n│  │适配框架    │管理系统  │管理系统  │      │\n│  └────────────┴──────────┴──────────┘      │\n│  ┌────────────────────────────────┐        │\n│  │ 统一调用接口 │ 模型分类 │ 权限验证 │     │\n│  └────────────────────────────────┘        │\n├─────────────────────────────────────────────┤\n│         运行时 + 存储                        │\n│  ┌────────────────────────────────┐        │\n│  │ Tauri 桌面容器                  │        │\n│  │ SQLite 本地存储                 │        │\n│  │ HTTP 服务（局域网）              │        │\n│  └────────────────────────────────┘        │\n└─────────────────────────────────────────────┘\n```\n\n## 4. 数据流\n\n### 4.1 Provider 调用流\n\n```\n应用模块（AI工作台）\n    ↓ 选择模型\n应用框架（权限检查）\n    ↓ 授权通过\nProvider 适配框架\n    ↓ 路由到具体适配器\nOpenAI Adapter\n    ↓ HTTP 请求\nOpenAI API\n    ↓ 返回结果\n流式响应 → 应用模块\n```\n\n### 4.2 Skills 调用流\n\n```\n应用模块（画布 LLM 节点）\n    ↓ 用户选择 Skill（可选）\nSkills 管理器\n    ↓ 查找已安装 Skill\nSkill Caller（HTTP/CLI）\n    ↓ 调用外部 Skill\nSkill 自己运行\n    ↓ 返回结果\n应用模块展示结果\n```\n\n### 4.3 模块加载流\n\n```\n应用启动\n    ↓\n读取已安装模块列表（SQLite）\n    ↓\nModule Federation 动态加载\n    ↓ 并行加载多个模块\n权限检查与授予\n    ↓\n模块注册到系统\n    ↓\n模块可用\n```\n\n## 5. 核心组件\n\n### 5.1 Provider 适配框架\n\n```rust\n// 统一接口\ntrait ProviderAdapter {\n    async fn list_models(&self) -> Result<Vec<Model>>;\n    async fn call_model(&self, request: Request) -> Result<Response>;\n    async fn stream_model(&self, request: Request) -> Stream<Chunk>;\n}\n\n// 模型分类\nenum Capability {\n    TextGeneration,\n    ImageGeneration,\n    VideoGeneration,\n    AudioGeneration,\n}\n\n// 具体适配器\nOpenAIAdapter implements ProviderAdapter\nClaudeAdapter implements ProviderAdapter\nCustomAdapter implements ProviderAdapter\n```\n\n**职责**：\n- 适配各厂商 API\n- 统一接口封装\n- 模型列表管理\n- 模型分类标签\n- 调用路由\n\n### 5.2 Skills 管理系统\n\n```rust\n// Skills 管理器\nstruct SkillsManager {\n    installed: Vec<Skill>,\n    registry_client: RegistryClient,\n}\n\nimpl SkillsManager {\n    async fn fetch_registry(&self) -> Vec<SkillInfo>;\n    async fn install(&mut self, config: SkillConfig);\n    async fn call(&self, id: &str, params: Value) -> Result<Value>;\n}\n\n// Skills 调用器\nenum SkillCaller {\n    Http(HttpCaller),\n    Cli(CliCaller),\n}\n```\n\n**职责**：\n- 连接远程仓库\n- 安装/卸载 Skills\n- 配置管理\n- 调用接口封装\n- 使用记录\n\n**不做**：\n- ❌ 执行 Skills 代码\n- ❌ 实现 Skills 协议\n- ❌ Skills 沙箱隔离\n\n### 5.3 MCP 管理系统\n\n```rust\n// MCP 管理器\nstruct MCPManager {\n    servers: HashMap<String, MCPClient>,\n}\n\nimpl MCPManager {\n    async fn connect(&mut self, config: MCPConfig);\n    async fn list_tools(&self, server_id: &str) -> Vec<Tool>;\n    async fn call_tool(&self, server_id: &str, tool: &str, params: Value);\n}\n\n// MCP 客户端\nstruct MCPClient {\n    transport: Transport, // HTTP/Stdio/WebSocket\n}\n```\n\n**职责**：\n- 连接 MCP 服务器\n- 工具列表管理\n- 调用桥接\n- 连接状态监控\n\n**不做**：\n- ❌ 实现 MCP 协议（使用现有库）\n- ❌ MCP 服务器端\n\n### 5.4 模块系统\n\n```typescript\n// 模块加载器\nclass ModuleLoader {\n    async loadModule(manifest: Manifest): Promise<Module>;\n    async reloadModule(id: string): Promise<void>;\n    async unloadModule(id: string): Promise<void>;\n}\n\n// 模块清单\ninterface Manifest {\n    id: string;\n    version: string;\n    entryPoint: string;\n    permissions: Permission[];\n}\n```\n\n**职责**：\n- 动态加载模块\n- 模块热更新\n- 权限管理\n- 模块隔离\n\n**技术**：\n- Module Federation（Webpack/Vite）\n- 共享依赖（React、Zustand）\n- 独立构建\n\n### 5.5 统一设计系统\n\n```typescript\n// 主题配置\ninterface Theme {\n    colors: ColorPalette;\n    typography: Typography;\n    spacing: Spacing;\n    radius: Radius;\n}\n\n// UI 组件库\n@dgos/ui\n├── Button\n├── Input\n├── Select\n├── Dialog\n├── Card\n└── ...\n```\n\n**职责**：\n- 主题管理（亮色/暗色）\n- 色彩规范\n- 字体规范\n- 间距规范\n- 基础组件库\n\n**强制**：\n- 所有模块必须使用\n- 禁止自定义样式\n- CI 检查合规性\n\n## 6. 技术栈\n\n### 6.1 核心技术\n\n| 层级 | 技术 | 版本 | 作用 |\n|------|------|------|------|\n| 桌面容器 | Tauri 2 | 2.0+ | 跨平台桌面应用 |\n| 后端语言 | Rust | 1.75+ | 核心逻辑 |\n| Web 框架 | Axum | 0.7+ | HTTP API |\n| 数据库 | SQLite | 3.45+ | 本地存储 |\n| ORM | SeaORM | 0.12+ | 数据库操作 |\n| 前端框架 | React 18 | 18.3+ | UI 渲染 |\n| 前端语言 | TypeScript | 5.0+ | 类型安全 |\n| 构建工具 | Vite | 5.0+ | 开发服务器 + 打包 |\n| 模块加载 | Module Federation | - | 热更新 |\n| 状态管理 | Zustand | 4.0+ | 全局状态 |\n| UI 组件 | Shadcn/ui | - | 基础组件 |\n\n### 6.2 明确不采用\n\n| 技术 | 理由 |\n|------|------|\n| QuickJS/Node.js | Skills/MCP 自己运行 |\n| PostgreSQL | 本地优先，SQLite 足够 |\n| Redis | 单机不需要缓存 |\n| MinIO/S3 | 文件系统足够 |\n\n## 7. 运行模式\n\n### 7.1 单机模式（默认）\n\n```\n用户电脑\n┌─────────────────┐\n│   DGOS 应用     │\n│                 │\n│ ┌─────────────┐ │\n│ │ Tauri       │ │\n│ │ + React     │ │\n│ └─────────────┘ │\n│       ↕         │\n│ ┌─────────────┐ │\n│ │ Rust 后端   │ │\n│ │ + SQLite    │ │\n│ └─────────────┘ │\n└─────────────────┘\n```\n\n**特点**：\n- 完全本地运行\n- 无需网络\n- SQLite 单文件数据库\n- 本地用户管理\n\n### 7.2 局域网模式\n\n```\n主机（运行 DGOS）\n┌─────────────────┐\n│   DGOS 应用     │\n│                 │\n│ HTTP 服务       │\n│ 0.0.0.0:3000    │\n└────────┬────────┘\n         │ 局域网\n    ┌────┴────┬────────┐\n    ▼         ▼        ▼\n  设备A      设备B    设备C\n(浏览器)   (浏览器) (浏览器)\n```\n\n**特点**：\n- 主机启动 HTTP 服务\n- 端口可配置\n- 简单认证（用户名/密码）\n- 远程设备只读模式\n- 实时显示连接用户\n\n### 7.3 云端增强模式（V2.0）\n\n```\n本地 DGOS\n    ↕\n官方云端\n├── 账号系统\n├── 官方 Provider（积分）\n├── 应用市场\n└── 数据同步\n```\n\n**特点**：\n- 可选功能\n- 需要登录云端账号\n- 使用官方 Provider\n- 跨设备同步\n- 在线协同\n\n## 8. 拆分条件\n\nV1 在单一 Tauri 应用内保持逻辑边界和契约隔离。只有出现以下信号时才拆分物理服务：\n\n- 安全边界不同，需要独立沙箱或网络出口\n- 资源曲线影响主应用稳定性\n- 某领域需要独立水平扩展或版本发布\n- 跨进程调用已有稳定 API、幂等、超时和重试语义\n- 监控数据证明合并部署已成为瓶颈\n\n未满足这些条件时，不为\"看起来像微服务\"而拆分；先在同一应用内保持单一契约和可测试边界。\n\n## 9. 权威边界\n\n- **产品范围**：版本总览 > 功能主文档 > 实现状态\n- **接口字段**：OpenAPI > 接口契约文档\n- **数据物理**：migration 文件 > 数据模型文档\n- **架构决策**：冻结决策 > ADR > 设计文档\n\n## 10. 后续演进\n\n### V1.0 → V1.2（无限画布）\n- 新增画布编辑器模块\n- 扩展节点类型\n- 不改变底层框架\n\n### V1.5 → V2.0（云端与协同）\n- 新增云端服务连接\n- 新增实时协同机制\n- 扩展数据同步功能\n- 保持本地优先原则\n\n详见 [版本路线图](../02-产品与版本/版本路线图.md)。\n", "doc-036": "# 技术栈选型\n\n本文档说明 DGOS 项目的技术栈选择及其决策依据，遵循 [V1 冻结决策](../06-决策记录/V1-冻结决策.md) 中的相关决策。\n\n---\n\n## 1. 技术栈总览\n\n| 层次 | 技术选型 | 版本 | 决策引用 |\n|------|---------|------|---------|\n| **后端语言** | Rust | 1.75+ | D001 |\n| **后端框架** | Axum | 0.7+ | D001 |\n| **ORM** | SeaORM | 0.12+ | D001 |\n| **桌面框架** | Tauri | 2.0+ | D001 |\n| **前端框架** | React | 18.2+ | D001 |\n| **构建工具** | Vite | 5.0+ | D001 |\n| **包管理器** | pnpm | 8.0+ | D001 |\n| **数据库** | SQLite | 3.40+ | D002 |\n| **模块系统** | Module Federation | 2.0+ | D004 |\n| **协议标准** | LangChain Tools, MCP | - | D005 |\n\n---\n\n## 2. 后端技术栈\n\n### 2.1 Rust（引用 **D001**）\n\n**选择理由**：\n- ✅ **编译期强制模块化**：不可能写出单文件 19,038 行的巨石代码\n- ✅ **零成本抽象**：性能优于 Python/Node.js\n- ✅ **内存安全**：所有权系统防止内存泄漏\n- ✅ **类型安全**：编译期捕获大部分错误\n- ✅ **并发安全**：防止数据竞争\n\n**替代方案对比**：\n\n| 方案 | 优点 | 缺点 | 为什么不选 |\n|------|------|------|-----------|\n| **Python** | 开发速度快 | 性能差，无类型安全，容易写巨石 | 老项目教训 |\n| **Node.js** | 生态丰富 | 单线程，内存占用高 | 性能不足 |\n| **Go** | 简单，并发好 | GC 延迟，生态不如 Rust | 性能要求高 |\n| **Java** | 成熟稳定 | 笨重，内存占用大 | 不适合桌面应用 |\n\n**从老项目学习**：\n- ❌ 老项目：Python + FastAPI，单文件 19,038 行\n- ✅ 新项目：Rust 强制模块化，每个文件 < 1000 行\n\n### 2.2 Axum\n\n**选择理由**：\n- ✅ 基于 Tokio 异步运行时\n- ✅ 类型安全的路由\n- ✅ Tower 中间件生态\n- ✅ 性能优异\n\n**替代方案**：\n- Actix-web：性能更好，但 API 复杂\n- Rocket：简单，但异步支持不完善\n\n### 2.3 SeaORM\n\n**选择理由**：\n- ✅ 异步 ORM，支持 Tokio\n- ✅ 类型安全的查询\n- ✅ 迁移管理\n- ✅ 支持 SQLite\n\n**替代方案**：\n- Diesel：成熟，但同步 API\n- sqlx：轻量，但需要手写 SQL\n\n---\n\n## 3. 桌面技术栈\n\n### 3.1 Tauri 2（引用 **D001**）\n\n**选择理由**：\n- ✅ **轻量级**：安装包 < 10MB（Electron >100MB）\n- ✅ **安全性**：Rust 后端 + 权限系统\n- ✅ **跨平台**：macOS/Windows/Linux\n- ✅ **原生性能**：系统 WebView，无 Chromium 包袱\n\n**对比 Electron**：\n\n| 指标 | Tauri | Electron | 差距 |\n|------|-------|----------|------|\n| 安装包大小 | ~5-10MB | ~100-150MB | **10-15x** |\n| 内存占用 | ~50-100MB | ~200-400MB | **2-4x** |\n| 启动时间 | ~0.5-1s | ~2-3s | **2-3x** |\n| 安全性 | 高（Rust） | 中（Node.js） | - |\n\n**从老项目学习**：\n- 如果用 Electron，安装包会超过 100MB\n- Tauri 更适合本地优先应用\n\n---\n\n## 4. 前端技术栈\n\n### 4.1 React 18（引用 **D001**）\n\n**选择理由**：\n- ✅ 成熟稳定，生态丰富\n- ✅ Hooks + Concurrent Mode\n- ✅ 社区活跃\n- ✅ Module Federation 支持好\n\n**替代方案**：\n- Vue 3：简单，但生态不如 React\n- Svelte：性能好，但生态小\n- Solid.js：性能最好，但太新\n\n### 4.2 TypeScript\n\n**选择理由**：\n- ✅ 类型安全\n- ✅ IDE 支持好\n- ✅ 重构友好\n\n### 4.3 Vite\n\n**选择理由**：\n- ✅ 快速的开发服务器（ESM）\n- ✅ 快速的生产构建（Rollup）\n- ✅ 开箱即用\n- ✅ 支持 Module Federation\n\n**替代方案**：\n- Webpack：成熟，但慢\n- Turbopack：太新，不稳定\n\n### 4.4 pnpm\n\n**选择理由**：\n- ✅ 节省磁盘空间（硬链接）\n- ✅ 安装速度快\n- ✅ 严格的依赖管理\n\n**替代方案**：\n- npm：慢，占空间\n- yarn：好，但 pnpm 更快\n\n---\n\n## 5. 数据库技术栈\n\n### 5.1 SQLite（引用 **D002**）\n\n**选择理由**：\n- ✅ **本地优先**：零配置，单文件\n- ✅ **数据隔离**：每个用户独立数据库\n- ✅ **轻量级**：无需服务器进程\n- ✅ **事务支持**：ACID 保证\n- ✅ **跨平台**：所有系统支持\n\n**对比 PostgreSQL**：\n\n| 指标 | SQLite | PostgreSQL |\n|------|--------|-----------|\n| 配置复杂度 | 零配置 | 需要安装和配置 |\n| 用户隔离 | 每用户一个文件 | 需要数据库设计 |\n| 性能 | 本地读写快 | 网络延迟 |\n| 并发 | 读并发好，写串行 | 并发写好 |\n| 适用场景 | 本地优先 | 云端多用户 |\n\n**V1 不需要 PostgreSQL**：\n- 本地单用户场景\n- SQLite 完全满足需求\n- 简化部署和维护\n\n**未来扩展**：\n- V2.0 云端同步：可选 PostgreSQL\n- V1.0：只用 SQLite\n\n---\n\n## 6. 模块化技术栈\n\n### 6.1 Module Federation（引用 **D004**）\n\n**选择理由**：\n- ✅ **运行时加载**：无需重启应用\n- ✅ **独立构建**：模块可单独开发和部署\n- ✅ **共享依赖**：React、Zustand 只加载一次\n- ✅ **成熟方案**：Webpack/Vite 都支持\n\n**对比其他方案**：\n\n| 方案 | 优点 | 缺点 |\n|------|------|------|\n| **iframe** | 完全隔离 | 通信复杂，性能差 |\n| **Web Components** | 标准化 | 生态不成熟，React 支持差 |\n| **动态 import** | 简单 | 无法共享依赖，包体积大 |\n\n### 6.2 设计系统（引用 **D008**）\n\n**技术栈**：\n- **组件库**：自研 `@dgos/ui`（基于 Radix UI）\n- **样式方案**：CSS Variables + Tailwind\n- **主题系统**：亮色/暗色主题切换\n\n**为什么自研**：\n- 强制视觉一致性\n- 禁止模块自定义样式\n- 主题切换全局生效\n\n---\n\n## 7. 协议标准\n\n### 7.1 Skills 协议（引用 **D005**）\n\n**选择**：LangChain Tools 标准\n\n**理由**：\n- ✅ 成熟生态\n- ✅ 广泛使用\n- ✅ 标准化接口\n\n### 7.2 MCP 协议（引用 **D005**）\n\n**选择**：Anthropic Model Context Protocol\n\n**理由**：\n- ✅ Anthropic 主导\n- ✅ 标准化协议\n- ✅ 社区支持\n\n### 7.3 为什么不自定义协议\n\n- ❌ 重复造轮子\n- ❌ 生态割裂\n- ❌ 维护成本高\n\n---\n\n## 8. 测试技术栈\n\n### 8.1 后端测试\n\n| 层次 | 工具 | 用途 |\n|------|------|------|\n| **单元测试** | Rust 内置 | `cargo test` |\n| **集成测试** | Rust 内置 | `tests/` 目录 |\n| **Mock** | mockall | 模拟外部依赖 |\n\n### 8.2 前端测试\n\n| 层次 | 工具 | 用途 |\n|------|------|------|\n| **单元测试** | Vitest | 快速的单元测试 |\n| **组件测试** | Testing Library | React 组件测试 |\n| **E2E 测试** | Playwright | 端到端测试 |\n\n---\n\n## 9. 开发工具\n\n### 9.1 IDE 和编辑器\n\n**推荐**：VS Code + 扩展\n- Rust Analyzer\n- ESLint\n- Prettier\n- Tauri\n\n### 9.2 版本控制\n\n- **Git**：版本控制\n- **GitHub**：代码托管\n- **Conventional Commits**：提交规范\n\n### 9.3 CI/CD\n\n- **GitHub Actions**：自动化测试和构建\n- **cargo test**：后端测试\n- **pnpm test**：前端测试\n\n---\n\n## 10. 依赖管理\n\n### 10.1 后端依赖（Cargo.toml）\n\n```toml\n[dependencies]\ntokio = { version = \"1.35\", features = [\"full\"] }\naxum = \"0.7\"\nsea-orm = { version = \"0.12\", features = [\"sqlx-sqlite\"] }\nserde = { version = \"1.0\", features = [\"derive\"] }\nserde_json = \"1.0\"\ntauri = { version = \"2.0\" }\n```\n\n### 10.2 前端依赖（package.json）\n\n```json\n{\n  \"dependencies\": {\n    \"react\": \"^18.2.0\",\n    \"react-dom\": \"^18.2.0\",\n    \"@tauri-apps/api\": \"^2.0.0\",\n    \"zustand\": \"^4.4.0\"\n  },\n  \"devDependencies\": {\n    \"vite\": \"^5.0.0\",\n    \"typescript\": \"^5.3.0\",\n    \"@vitejs/plugin-react\": \"^4.2.0\"\n  }\n}\n```\n\n---\n\n## 11. 性能考虑\n\n### 11.1 后端性能\n\n- Rust 零成本抽象\n- 异步 I/O（Tokio）\n- SQLite 本地访问\n- 无 GC 暂停\n\n**预期性能**：\n- API 响应时间 P95 < 200ms\n- 内存占用 < 200MB（空闲）\n\n### 11.2 前端性能\n\n- Module Federation 按需加载\n- React 18 Concurrent Mode\n- Vite 快速构建\n- 代码分割\n\n**预期性能**：\n- 应用启动时间 < 2s\n- 模块加载时间 < 1s\n- UI 交互帧率 > 60fps\n\n---\n\n## 12. 安全考虑\n\n### 12.1 后端安全\n\n- Rust 内存安全\n- SQLite 参数化查询\n- API Key 加密存储\n- JWT 认证\n\n### 12.2 前端安全\n\n- Tauri 权限系统\n- CSP（Content Security Policy）\n- 输入验证\n- XSS 防护\n\n---\n\n## 13. 技术债务管理\n\n### 13.1 已知限制\n\n| 限制 | 影响 | 计划 |\n|------|------|------|\n| 只支持 macOS | Windows/Linux 用户无法使用 | V1.1/V1.2 |\n| 只有 OpenAI 适配器 | 其他模型无法使用 | V1.1 |\n| SQLite 写串行 | 高并发写入受限 | V2.0 可选 PostgreSQL |\n\n### 13.2 技术演进计划\n\n- **V1.0**：验证技术栈可行性\n- **V1.1-V1.5**：完善功能，优化性能\n- **V2.0**：云端同步，可选 PostgreSQL\n\n---\n\n## 14. 参考资源\n\n- [Rust 官方文档](https://doc.rust-lang.org/)\n- [Tauri 官方文档](https://tauri.app/)\n- [Axum 文档](https://docs.rs/axum/)\n- [SeaORM 文档](https://www.sea-ql.org/SeaORM/)\n- [React 官方文档](https://react.dev/)\n- [Module Federation 文档](https://module-federation.io/)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：架构团队  \n**审核状态**：已通过（引用 D001-D005 决策）\n", "doc-037": "# 服务与领域边界\n\n本文档定义 DGOS 的服务架构和领域边界，明确各模块的职责和交互关系。\n\n---\n\n## 1. 总体架构\n\nDGOS 采用**模块化单体架构**（Modular Monolith）：\n- 单一应用进程\n- 内部按领域划分模块\n- 模块间通过明确的接口通信\n- 前端模块可独立加载和卸载\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                        Tauri Desktop                        │\n├─────────────────────────────────────────────────────────────┤\n│                    React Frontend (SPA)                     │\n│  ┌───────────┬───────────┬───────────┬──────────────────┐  │\n│  │ AI工作台  │ 系统设置  │ 画布编辑  │  第三方模块...    │  │\n│  └───────────┴───────────┴───────────┴──────────────────┘  │\n│                    Module Federation                        │\n├─────────────────────────────────────────────────────────────┤\n│                      Tauri IPC Layer                        │\n├─────────────────────────────────────────────────────────────┤\n│                     Rust Backend (Axum)                     │\n│  ┌──────────┬──────────┬──────────┬──────────┬─────────┐  │\n│  │Providers │ Skills   │   MCP    │ Modules  │  Auth   │  │\n│  └──────────┴──────────┴──────────┴──────────┴─────────┘  │\n├─────────────────────────────────────────────────────────────┤\n│                        SQLite Database                      │\n└─────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 2. 领域划分\n\n### 2.1 底层能力领域\n\n**职责**：提供框架级能力，不涉及具体业务逻辑\n\n| 领域 | 说明 | 核心功能 |\n|------|------|---------|\n| **Providers** | Provider 适配框架 | 统一接口调用各类 AI 模型 |\n| **Skills** | Skills 管理系统 | 安装、配置、调用 Skills |\n| **MCP** | MCP 管理系统 | 连接、管理、调用 MCP 工具 |\n| **Modules** | 模块系统 | 模块加载、卸载、热更新 |\n| **UI** | 统一设计系统 | 主题、组件、样式规范 |\n\n### 2.2 应用模块领域\n\n**职责**：面向用户的业务功能\n\n| 领域 | 说明 | 核心功能 |\n|------|------|---------|\n| **Workbench** | AI 工作台 | 对话、流式响应、历史记录 |\n| **Settings** | 系统设置 | Provider/Skills/MCP 管理界面 |\n| **Canvas** | 无限画布（V1.2+） | 节点、连线、工作流 |\n\n### 2.3 系统功能领域\n\n**职责**：系统级支撑功能\n\n| 领域 | 说明 | 核心功能 |\n|------|------|---------|\n| **Auth** | 认证与权限 | 用户登录、JWT、权限检查 |\n| **Storage** | 数据存储 | SQLite 操作、数据隔离 |\n| **Network** | 网络服务 | HTTP 服务、局域网协同 |\n\n---\n\n## 3. 模块职责\n\n### 3.1 Providers（Provider 适配框架）\n\n**职责**：\n- 统一 AI Provider 调用接口\n- 适配不同 Provider 协议（OpenAI、Claude 等）\n- 处理重试、超时、流式响应\n\n**对外接口**：\n```rust\npub trait Provider {\n    async fn call(&self, request: ChatRequest) -> Result<ChatResponse>;\n    async fn stream(&self, request: ChatRequest) -> Result<Stream<ChatChunk>>;\n    async fn list_models(&self) -> Result<Vec<Model>>;\n}\n```\n\n**依赖**：\n- Storage（保存 Provider 配置）\n- Auth（用户隔离）\n\n**被依赖**：\n- Skills（Skills 可能调用 AI）\n- Workbench（用户发起对话）\n\n### 3.2 Skills（Skills 管理系统）\n\n**职责**：\n- 连接 Skills 仓库\n- 安装、配置、卸载 Skills\n- 调用 Skills（HTTP/CLI）\n\n**对外接口**：\n```rust\npub struct SkillsManager {\n    pub async fn install_skill(&self, skill_id: String) -> Result<Skill>;\n    pub async fn call_skill(&self, skill_id: String, params: Value) -> Result<Value>;\n}\n```\n\n**依赖**：\n- Storage（保存 Skills 配置）\n- Auth（权限检查）\n\n**被依赖**：\n- Workbench（可选 Skills 增强）\n\n### 3.3 MCP（MCP 管理系统）\n\n**职责**：\n- 连接 MCP 服务器\n- 管理 MCP 工具列表\n- 调用 MCP 工具\n\n**对外接口**：\n```rust\npub struct MCPClient {\n    pub async fn connect(&self, config: MCPConfig) -> Result<()>;\n    pub async fn call_tool(&self, tool_name: String, params: Value) -> Result<Value>;\n}\n```\n\n**依赖**：\n- Storage（保存 MCP 配置）\n- Auth（权限检查）\n\n**被依赖**：\n- Workbench（AI 可调用 MCP 工具）\n\n### 3.4 Modules（模块系统）\n\n**职责**：\n- 模块注册和发现\n- 模块动态加载和卸载\n- 模块热更新\n- 模块权限管理\n\n**对外接口**：\n```rust\npub struct ModuleLoader {\n    pub async fn load_module(&self, manifest: Manifest) -> Result<()>;\n    pub async fn reload_module(&self, module_id: String) -> Result<()>;\n    pub fn check_permission(&self, module_id: String, permission: Permission) -> bool;\n}\n```\n\n**依赖**：\n- Storage（保存模块配置）\n- Auth（权限检查）\n\n**被依赖**：\n- 所有前端模块\n\n### 3.5 Auth（认证与权限）\n\n**职责**：\n- 用户认证（登录、JWT）\n- 会话管理\n- 权限检查\n\n**对外接口**：\n```rust\npub struct AuthService {\n    pub async fn login(&self, username: String, password: String) -> Result<Session>;\n    pub fn verify_token(&self, token: String) -> Result<User>;\n    pub fn check_permission(&self, user_id: String, permission: Permission) -> bool;\n}\n```\n\n**依赖**：\n- Storage（用户数据）\n\n**被依赖**：\n- 所有需要认证的模块\n\n---\n\n## 4. 模块间通信\n\n### 4.1 前端到后端\n\n**通信方式**：Tauri IPC（Command）\n\n```rust\n#[tauri::command]\nasync fn call_provider(\n    provider_id: String,\n    model_id: String,\n    request: Request\n) -> Result<Response> {\n    // 调用 Providers 模块\n}\n```\n\n### 4.2 后端模块间\n\n**通信方式**：直接函数调用\n\n```rust\n// Workbench 调用 Providers\nlet response = providers_manager.call(provider_id, request).await?;\n\n// Workbench 调用 Skills（可选）\nif let Some(skill_id) = skill_id {\n    let enhanced = skills_manager.call_skill(skill_id, params).await?;\n}\n```\n\n### 4.3 前端模块间\n\n**通信方式**：\n- 共享状态（Zustand/Redux）\n- 事件总线（EventEmitter）\n- Module Federation 共享依赖\n\n---\n\n## 5. 数据流\n\n### 5.1 用户发起对话流程\n\n```\n用户输入 → Workbench（前端）\n           ↓\n        Tauri IPC\n           ↓\n     Workbench Handler（后端）\n           ↓\n    ┌──────┴──────┐\n    ↓             ↓\n Providers     Skills（可选）\n    ↓             ↓\n  OpenAI       HTTP/CLI\n    ↓             ↓\n Response      Result\n    ↓             ↓\n    └──────┬──────┘\n           ↓\n      合并结果\n           ↓\n       流式返回\n           ↓\n    Workbench（前端）\n           ↓\n       用户查看\n```\n\n### 5.2 模块加载流程\n\n```\n用户打开设置 → Settings（前端）\n                 ↓\n              点击\"加载模块\"\n                 ↓\n              Tauri IPC\n                 ↓\n          ModuleLoader（后端）\n                 ↓\n           验证 manifest.json\n                 ↓\n           检查权限要求\n                 ↓\n           用户授权（前端）\n                 ↓\n           动态加载代码\n                 ↓\n           注册到系统\n                 ↓\n           通知前端\n                 ↓\n        Settings 显示新模块\n```\n\n---\n\n## 6. 边界规则\n\n### 6.1 依赖方向\n\n**规则**：依赖只能自上而下，不能反向\n\n```\n应用模块（Workbench、Settings）\n     ↓ 可以依赖\n底层能力（Providers、Skills、MCP）\n     ↓ 可以依赖\n系统功能（Auth、Storage、Network）\n```\n\n**禁止**：\n- ❌ 底层能力依赖应用模块\n- ❌ 系统功能依赖底层能力\n\n### 6.2 数据隔离\n\n**规则**：每个用户的数据完全隔离\n\n- 所有查询必须带 `user_id`\n- 不允许跨用户查询\n- SQLite 行级安全策略\n\n### 6.3 权限边界\n\n**规则**：模块只能访问已授权的资源\n\n| 权限 | 说明 | 示例 |\n|------|------|------|\n| `providers.call` | 调用 Provider | AI 工作台 |\n| `skills.execute` | 执行 Skills | AI 工作台 |\n| `mcp.call` | 调用 MCP 工具 | AI 工作台 |\n| `storage.read` | 读取存储 | 所有模块 |\n| `storage.write` | 写入存储 | 系统设置 |\n| `network.local` | 访问局域网 | 局域网协同 |\n\n---\n\n## 7. 扩展点\n\n### 7.1 Provider 扩展\n\n**如何添加新的 Provider**：\n1. 实现 `Provider` trait\n2. 注册到 `ProviderRegistry`\n3. 前端添加配置表单\n\n### 7.2 Skills 扩展\n\n**如何添加新的 Skill**：\n1. 发布到 Skills 仓库\n2. 用户通过界面安装\n3. 无需修改代码\n\n### 7.3 模块扩展\n\n**如何添加新的前端模块**：\n1. 开发 React 模块\n2. 使用 Module Federation 打包\n3. 创建 manifest.json\n4. 用户通过界面加载\n\n---\n\n## 8. 未来演进\n\n### 8.1 V1.x：单体架构\n\n- 所有功能在一个进程\n- 前端模块可独立加载\n- 后端模块编译时静态链接\n\n### 8.2 V2.x：微前端架构\n\n- 前端模块完全独立\n- 应用市场分发\n- 运行时动态加载\n\n### 8.3 V3.x：混合架构（可能）\n\n- 后端保持单体\n- 前端微前端\n- 可选云端服务\n\n---\n\n## 9. 相关文档\n\n- [总体架构](总体架构.md)\n- [技术栈选型](技术栈选型.md)\n- [V1 接口契约](当前版本/V1-接口契约.md)\n- [V1 数据模型](当前版本/V1-数据模型.md)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：架构团队  \n**审核状态**：待评审\n", "doc-038": "# 决策记录导航\n\n- [V1 冻结决策](V1-冻结决策.md)：当前版本的跨功能产品和工程决策。\n- [V1 文档变更记录](V1-文档变更记录.md)：影响实现输入和验收口径的文档变化。\n- [架构决策记录索引](ADR/README.md)：具有长期架构影响的选择、备选方案和后果。\n\n普通实现状态不写入本目录，应更新[当前版本实现状态](../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 决策类型说明\n\n- **冻结决策**：影响多个功能或模块的产品和技术决策，一旦冻结需要通过变更流程修改\n- **架构决策记录（ADR）**：具有长期影响的架构选择，采用 ADR 格式记录\n- **文档变更记录**：追踪文档的重大变更，便于理解需求演进\n\n## 查找决策\n\n- 按编号查找：[V1 冻结决策](V1-冻结决策.md) 中的 D001-D015\n- 按主题查找：使用 `rg \"关键词\" docs/06-决策记录`\n- 按时间查找：查看 [V1 文档变更记录](V1-文档变更记录.md)\n", "doc-039": "# V1 冻结决策\n\n本表记录影响范围、协议和架构的一致性决策；新证据到达后追加新编号，不改写历史结论。\n\n## D001 使用 Rust + Tauri 而非 Node.js + Electron\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：老项目 infinite-canvas-ccnuzw 使用 Python + FastAPI，单文件 19,038 行，无法维护。需要选择能强制模块化、性能好的技术栈。\n- 决策：采用 Rust + Tauri 2 作为核心技术栈\n  - 后端：Rust + Axum + SeaORM\n  - 桌面：Tauri 2\n  - 前端：React + TypeScript + Vite\n- 理由：\n  - Rust 编译期强制模块化，不可能写单文件巨石\n  - Tauri 轻量（<10MB），Electron 过重（>100MB）\n  - Rust 所有权系统防止内存泄漏\n  - 零成本抽象，性能优于 Node.js\n  - 类型安全，编译期捕获大部分错误\n- 后果：\n  - 学习曲线较陡，但有强制模块化保证\n  - Rust 生态成熟度低于 Node.js，但核心需求已满足\n  - 团队需要学习 Rust，但可避免重蹈老项目覆辙\n- 替代方案：\n  - Node.js + Electron：生态好但无法强制模块化，容易重复老项目错误\n  - Go：性能好但缺少桌面框架支持\n\n## D002 使用 SQLite 而非 PostgreSQL\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：项目定位为本地优先工具，需要零配置、易备份的数据库。\n- 决策：采用 SQLite 作为唯一数据库\n- 理由：\n  - 本地优先：单文件数据库，无需独立进程\n  - 零配置：无需安装和配置数据库服务\n  - 易备份：复制单个文件即可\n  - 性能足够：读取速度接近 PostgreSQL，写入对单用户足够\n  - 体积小：整个库只有几百 KB\n- 后果：\n  - 不支持多进程并发写入，但单机模式不需要\n  - 无内置用户权限系统，但通过应用层控制\n  - 局域网协同时只有主机有写权限\n- 替代方案：\n  - PostgreSQL：功能强大但需要独立进程，违背本地优先原则\n  - 嵌入式 PostgreSQL（libpq）：仍然过重\n\n## D003 不使用 QuickJS/Node.js 作为 Skills/MCP 运行时\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：初期误以为需要实现 Skills/MCP 执行引擎，考虑嵌入 QuickJS 或 Node.js。\n- 决策：不嵌入任何 JavaScript 运行时，Skills/MCP 自己运行\n- 理由：\n  - Skills 和 MCP 是现有标准，有自己的运行环境\n  - DGOS 只需要管理（安装/配置）和调用（HTTP/CLI），不需要执行\n  - 类比：Chrome 管理扩展但不实现扩展引擎\n  - 避免增加 50MB+ 的运行时体积\n  - 简化架构，减少维护负担\n- 后果：\n  - Skills 必须提供 HTTP API 或 CLI 接口\n  - 无法在沙箱中执行不可信 JavaScript 代码\n  - 需要依赖外部 Skills/MCP 服务的稳定性\n- 替代方案：\n  - 嵌入 QuickJS：轻量但需要实现完整的 Skills 执行引擎，过度设计\n  - 嵌入 Node.js：生态好但体积大，违背轻量化原则\n\n## D004 使用 Module Federation 实现模块热更新\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：应用模块需要独立开发、独立版本管理、热更新（无需重启）。\n- 决策：使用 Webpack Module Federation（或 Vite 版本）实现模块系统\n- 理由：\n  - 成熟方案：已在生产环境大规模使用\n  - 真正的运行时加载：不是预打包，而是动态 import\n  - 共享依赖：React、Zustand 等只加载一次\n  - 独立构建：每个模块可以独立开发和发布\n  - 版本管理：支持多版本共存\n- 后果：\n  - 需要配置 Webpack/Vite 插件\n  - 模块必须暴露标准入口点\n  - 共享依赖版本需要协调\n  - 打包体积略大于单体应用\n- 替代方案：\n  - iframe 隔离：隔离性好但通信复杂，性能差\n  - Web Components：标准但生态不成熟\n  - 动态 import：简单但无法共享依赖\n\n## D005 Skills 和 MCP 使用现有标准协议\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：需要让 DGOS 能够使用 AI 工具和能力扩展。\n- 决策：直接使用现有 Skills（LangChain Tools）和 MCP（Model Context Protocol）标准，不自定义协议\n- 理由：\n  - Skills 已有成熟生态（LangChain、LlamaIndex 等）\n  - MCP 是 Anthropic 主导的标准协议\n  - 不重复造轮子，复用现有生态\n  - 降低学习成本，开发者熟悉标准\n  - 自动兼容未来协议演进\n- 后果：\n  - Skills 调用方式：可选增强，非必选\n  - MCP 工具调用：通过标准协议桥接\n  - 需要维护 Skills/MCP 远程仓库连接\n  - 受标准协议限制，无法自定义特殊能力\n- 边界说明：\n  - Skills：AI 增强工具（文本生成、图像处理等）\n  - MCP：系统集成工具（文件操作、搜索、外部 API 等）\n  - 在 LLM 节点中，Skills 是可选的，用户可以直接调用 Provider\n\n## D006 权限模型采用粗粒度模块级权限\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：模块需要申请权限才能调用系统能力（Provider、Skills、MCP、存储等）。\n- 决策：V1 采用粗粒度权限，后续版本细化\n  - 权限类型：`providers.call`、`skills.execute`、`mcp.call`、`storage.read`、`storage.write`、`network.local`\n  - 授予对象：整个模块，不区分模块内的具体功能\n  - 授权时机：模块安装时用户一次性授权\n- 理由：\n  - V1 简化实现，快速交付\n  - 模块通常需要完整的能力集合，细粒度意义不大\n  - 官方模块自动授予所有权限\n  - 避免频繁的权限请求打断用户\n- 后果：\n  - 模块获得权限后可以调用所有 Provider（不能限制特定 Provider）\n  - 模块更新增加权限时需要用户重新授权\n  - 无法实现细粒度审计（例如模块 A 调用了哪个具体 Provider）\n- 后续细化：\n  - V2.0 可以细化为 `providers.call:openai`、`storage.read:projects/own` 等\n\n## D007 局域网 HTTP 服务始终开启\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：用户希望一台电脑启动 DGOS 后，局域网内其他设备可以访问使用。\n- 决策：桌面应用启动时自动启动 HTTP 服务，监听 `0.0.0.0:3000`（可配置端口）\n- 理由：\n  - 简化用户配置，无需手动开启\"共享模式\"\n  - 端口可配置，避免冲突\n  - 只监听局域网，不暴露到公网\n  - 提供简单认证（用户名/密码）\n- 后果：\n  - 占用一个端口\n  - 需要防火墙配置（macOS 会弹窗询问）\n  - 需要简单认证机制防止未授权访问\n  - 远程设备只读模式，不能修改 Provider 配置\n- 安全措施：\n  - 默认生成随机密码\n  - 强制认证，无认证不能访问\n  - 远程设备权限受限（只能使用，不能配置）\n  - 可在设置中关闭服务\n\n## D008 所有模块强制使用统一设计系统\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：用户明确要求\"系统的整体样式管理和组件管理需要统一化，不能每个应用一个主题\"。\n- 决策：建立统一 Design System，所有模块必须复用，禁止自定义样式\n  - 主题系统：亮色/暗色主题，全局切换\n  - 色彩规范：主色、辅助色、语义色（固定）\n  - 字体规范：字体家族、字号、字重（固定）\n  - 间距规范：4px 基准，固定间距档位\n  - UI 组件库：基于 Shadcn/ui，封装为 `@dgos/ui`\n- 理由：\n  - 保持视觉一致性\n  - 降低开发成本（不需要重复实现组件）\n  - 主题切换全局生效\n  - 避免混乱的用户体验\n- 后果：\n  - 模块开发者必须使用 `@dgos/ui` 组件库\n  - 禁止使用 inline styles 或自定义 CSS 覆盖主题变量\n  - 模块审核时检查样式合规性\n  - 需要维护完整的组件文档和示例\n- 强制机制：\n  - CI 检查：扫描模块代码，禁止出现 `style={{}}` 或自定义 CSS 变量\n  - 审核阶段：人工检查视觉一致性\n  - 模块示例：提供模板项目，强制使用正确方式\n\n## D009 无限画布分多版本实现，不阻塞 V1\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：无限画布是核心价值功能，但复杂度高。用户要求\"重点是搭建底层能力和底层框架\"。\n- 决策：无限画布功能拆分到 V1.2-V1.5 分步实现，V1 聚焦底层框架\n  - V1.0：底层能力（Provider/Skills/MCP/模块系统）+ 基础应用（AI 工作台、系统设置）\n  - V1.2：画布核心（视口、缩放、拖拽）+ 5 种基础节点\n  - V1.3：10+ 种节点类型，节点连线系统\n  - V1.4：实时执行，循环节点\n  - V1.5：工作流导入导出，布局算法优化\n- 理由：\n  - 底层框架搭好，后续快速迭代\n  - 避免 V1 范围过大，延期风险高\n  - 可以先验证框架可扩展性\n  - 画布功能独立性强，不阻塞其他模块\n- 后果：\n  - V1 无法展示核心价值（画布），但可以展示框架能力\n  - 需要在 V1.2 前保持用户兴趣\n  - 画布模块需要提前设计接口，避免 V1 架构不兼容\n- 从老项目学习：\n  - 保留交互逻辑（拖拽、连线、缩放手感）\n  - 重做架构（避免单文件巨石）\n  - 节点执行方式：实时执行（用户操作立即执行）\n  - 支持循环节点（LoopNode）\n\n## D010 应用市场采用中心化模式，人工审核\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：需要应用市场让开发者发布模块，用户下载安装。\n- 决策：应用市场中心化设计，V1.5+ 实现\n  - 中心化：官方服务器托管，不支持第三方源\n  - 审核方式：人工审核（V1.5），自动化检查（V2.0+）\n  - 下载权限：必须登录云端账号\n  - 收费模式：V1 全部免费，V2.0+ 支持付费应用\n- 理由：\n  - 中心化保证应用质量和安全性\n  - 人工审核初期质量高，后续自动化\n  - 避免三方源带来的安全风险\n  - 与云端账号系统集成\n- 后果：\n  - 开发者必须提交到官方市场\n  - 审核周期可能较长（初期）\n  - 无法安装未审核的应用（除非开发者模式）\n  - 需要维护审核团队和流程\n- 审核标准（V1.5）：\n  - 代码安全性检查（无恶意代码）\n  - 权限合理性检查（申请的权限必须有使用场景）\n  - 视觉一致性检查（使用统一设计系统）\n  - 功能完整性检查（不能是空壳应用）\n  - 文档完整性检查（必须有使用说明）\n\n## D011 官方 Provider 采用积分制，按类型计费\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：云端账号需要提供官方 Provider 能力，使用积分消耗。\n- 决策：积分计费模式（V2.0 实现）\n  - 文本生成：按 token 数量 * 倍率计算积分\n  - 图片生成：按张数计算积分\n  - 视频生成：按秒数计算积分\n  - 音频生成：按秒数计算积分\n- 理由：\n  - 透明计费，用户可预期成本\n  - 不同类型资源成本不同，分别计费合理\n  - 倍率可根据模型质量调整\n- 后果：\n  - 需要维护模型价格表\n  - 需要实时计算和扣除积分\n  - 需要积分充值系统\n  - 需要用量统计和账单\n- 自配置 Provider：\n  - 用户自己配置的 Provider（自己的 API Key）无需积分\n  - 云端账号和自配置 Provider 可并存\n  - 默认优先使用自配置 Provider（排序第一）\n\n## D012 Provider 支持同类型多配置和排序机制\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：用户可能有多个 OpenAI 账号，或同时使用官方 Provider 和自配置 Provider。\n- 决策：支持配置多个同类型 Provider，通过排序和默认选择机制使用\n  - 同类型多个：可配置多个 OpenAI、Claude 等\n  - 排序机制：用户可拖拽调整 Provider 顺序\n  - 默认选择：没有明确指定时，使用排序第一的 Provider\n  - 手动选择：在需要选择模型的地方，用户可以明确选择 Provider\n- 理由：\n  - 灵活性：用户可以根据需要切换账号\n  - 容错性：一个 Provider 失败可以切换到备用\n  - 成本优化：可以配置免费额度的多个账号轮换使用\n- 后果：\n  - Provider 列表需要显示排序序号\n  - 调用时需要明确使用哪个 Provider\n  - 错误重试时可以尝试同类型其他 Provider\n- UI 行为：\n  - 系统功能（无选择界面）：使用默认排序第一个\n  - 用户界面（有选择控件）：用户可以选择或使用默认\n\n## D013 局域网协同需要简单认证和实时状态显示\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：局域网协同时需要识别用户身份，并实时显示在线状态。\n- 决策：实现简单的用户名/密码认证\n  - 认证方式：HTTP Basic Auth 或 JWT\n  - 用户管理：主机创建临时账号或使用主机本地用户\n  - 实时显示：WebSocket 连接，显示在线用户列表\n  - 权限控制：远程用户只读模式，不能修改配置\n- 理由：\n  - 简单认证足够局域网场景\n  - 无需复杂的 OAuth 或 SAML\n  - 实时状态提升协同体验\n- 后果：\n  - 需要维护 WebSocket 连接\n  - 需要心跳检测断线重连\n  - 认证信息不加密（局域网内认为安全）\n- 协同细节（V2.0）：\n  - 画布协同：A 用户移动节点，B 用户实时看到\n  - 指针显示：显示其他用户的鼠标指针和标记\n  - 锁机制：编辑节点时锁定，其他用户只读\n  - 冲突解决：CRDT 或 OT 算法（待设计）\n\n## D014 模型分类标签内置维护，不自动提取\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：需要给模型打标签（文本/图片/视频/音频），供不同场景使用。\n- 决策：模型分类标签由 Provider 适配器内置维护\n  - 标签类型：`text-generation`、`image-generation`、`video-generation`、`audio-generation`、`text-to-image` 等\n  - 维护方式：在 Provider 适配器代码中硬编码\n  - 不自动提取：不从 Provider API 的 metadata 自动提取（大多数 Provider 没有统一格式）\n- 理由：\n  - 各 Provider 的模型能力描述格式不统一\n  - 自动提取容易出错，需要人工校准\n  - 内置维护保证准确性\n  - 模型能力相对稳定，不需要频繁更新\n- 后果：\n  - 新模型发布后需要更新适配器代码\n  - Provider 适配器需要维护模型能力映射表\n  - 用户无法自定义模型标签（V2.0 可支持）\n- 示例：\n  ```rust\n  // OpenAI 适配器中维护\n  match model_id {\n      \"gpt-4\" | \"gpt-3.5-turbo\" => vec![Capability::TextGeneration],\n      \"dall-e-3\" => vec![Capability::ImageGeneration],\n      \"whisper-1\" => vec![Capability::AudioToText],\n      _ => vec![],\n  }\n  ```\n\n## D015 模块更新自动推送，图标显示版本提示\n\n- 状态：已冻结\n- 日期：2024-01-XX\n- 背景：应用市场上的模块更新后，需要通知用户。\n- 决策：自动检测更新并推送通知\n  - 检测频率：每次启动 + 每天一次后台检测\n  - 通知方式：图标小红点 + 版本号显示\n  - 更新方式：用户手动点击更新（不自动静默更新）\n  - 更新提示：显示更新日志（Changelog）\n- 理由：\n  - 自动推送让用户及时获得新功能\n  - 手动更新给用户控制权\n  - 避免静默更新带来的兼容性问题\n- 后果：\n  - 需要维护模块版本比对逻辑\n  - 需要显示 Changelog 的 UI\n  - 需要处理更新失败的回滚\n- 更新流程：\n  1. 后台检测到新版本\n  2. 图标显示小红点，版本号变化\n  3. 用户点击查看更新日志\n  4. 用户确认更新\n  5. 下载新版本模块\n  6. 热重载模块（无需重启）\n\n## 后续决策编号预留\n\n- D016: TBD\n- D017: TBD\n- ...\n\n## 决策变更流程\n\n1. 提出变更：在 GitHub Issue 中讨论\n2. 评审变更：技术评审和产品评审\n3. 更新决策：在本文档追加新编号，说明变更原因\n4. 废弃旧决策：在旧决策标题后标注\"（已被 DXXX 取代）\"\n5. 更新相关文档：同步更新架构、接口、功能文档\n\n## 决策记录规范\n\n每个决策必须包含：\n- 状态：已冻结 / 提议中 / 已废弃\n- 日期：决策冻结日期\n- 背景：为什么需要做这个决策\n- 决策：具体决定是什么\n- 理由：为什么选择这个方案\n- 后果：这个决策带来的影响（正面和负面）\n- 替代方案：考虑过但没选的方案（可选）\n", "doc-040": "# 2024-01-XX DGOS 初始讨论完整记录\n\n本文档记录 DGOS 项目从概念到架构设计的完整对话过程，是所有后续文档的原始来源。\n\n## 对话日期\n\n2024-01-XX\n\n## 参与者\n\n- 用户（产品负责人）\n- Kiro（AI 技术助手）\n\n## 对话主题\n\nDGOS（一个本地优先的 AI 应用开发框架）的产品定位、技术架构、功能范围和文档体系设计。\n\n---\n\n## 第一部分：项目背景与老项目教训\n\n### 老项目问题\n\n**infinite-canvas-ccnuzw 项目失败原因**：\n\n```python\n# 问题：单文件 19,038 行\nmain.py (19,038 lines)\n├── 167 个 API 路由\n├── 684 个函数和类\n├── WebSocket 管理\n├── Canvas 逻辑\n├── Provider 适配\n├── ComfyUI 连接\n├── 文件管理\n├── 素材管理\n└── ... 所有功能\n\n# HTML 也是巨石\nstatic/*.html (10,543 lines total)\n├── canvas.html (359 lines + 大量内联 JS)\n├── index.html (120.7KB)\n└── ...\n```\n\n**教训**：\n1. 没有好好规划\n2. 文件太大，无法维护\n3. 没有解耦\n4. 没有设计好\n\n**核心价值**：\n- 无限画布是核心功能\n- 需要保留交互逻辑\n- 但必须重新设计架构\n\n### 新项目目标\n\n**DGOS 定位**：\n- 本地优先的 AI 应用开发框架\n- 强制模块化（避免老项目问题）\n- 可扩展的应用模块系统\n- Provider/Skills/MCP 作为底层能力\n\n---\n\n## 第二部分：产品定位演进\n\n### 初始理解（错误）\n\n用户最开始的描述：\n> \"我要做的是本地端软件，它也能拉起服务来供本地局域网协同，同时有一些资产和工作流是可以保存在云端的，帐号系统作为官方后台暂时只用于积分管理用于 provider 的内置推荐提供\"\n\n我的初始理解：\n- 这是一个\"操作系统\"级别的产品\n- 需要完整的桌面/窗口壳层\n- 需要应用商店、manifest、运行时\n\n### 纠正过程\n\n用户澄清：\n> \"我只需要你管理标准的 Skills，能从远程仓库拉取并安装，并且能在项目中进行管理\"\n\n**关键纠正**：\n1. Skills/MCP 是**现有标准**，不需要重新实现\n2. DGOS 只需要**管理和调用**，不需要**执行引擎**\n3. 就像 Chrome 管理扩展，不是实现扩展引擎\n\n### 最终定位\n\n**DGOS = 本地优先的 AI 应用开发框架**\n\n```\n核心能力：\n├── Provider 适配（统一接口，多厂商）\n├── Skills 管理（安装、调用）\n├── MCP 管理（连接、桥接）\n└── 模块系统（热更新、权限管理）\n\n应用模块：\n├── AI 工作台\n├── 无限画布（分多版本）\n├── 系统设置\n└── 第三方模块...\n\n运行模式：\n├── 单机模式（默认，完全本地）\n├── 局域网模式（一台做服务器）\n└── 云端模式（可选增强）\n```\n\n---\n\n## 第三部分：技术栈决策过程\n\n### 数据库选择\n\n**问题**：PostgreSQL vs SQLite？\n\n**初始建议**：PostgreSQL（因为老文档用了）\n\n**用户澄清**：\n> \"数据库可以用 SQLite，并且我不需要复杂我租户系统\"\n\n**最终决策**：SQLite\n- 理由：本地优先、零配置、单文件\n- 记录：D002\n\n### QuickJS 的误解\n\n**我的错误理解**：\n- 需要 QuickJS 运行 Skills/MCP\n- 需要实现 JavaScript 沙箱\n- 需要执行引擎\n\n**用户纠正**：\n> \"Skills 和 MCP 就是标准的，不需要你再创建什么，你只需要让本地的项目能管理/导入/安装\"\n\n**最终决策**：不需要 QuickJS/Node.js\n- 理由：Skills/MCP 自己运行，我们只调用\n- 记录：D003\n\n### Rust vs Node.js\n\n**问题**：后端用什么语言？\n\n**我的分析**：\n```\nRust 优势：\n✅ 强制模块化（编译期检查）\n✅ 性能好\n✅ 内存安全\n✅ 避免单文件问题\n\nNode.js 优势：\n✅ 生态成熟\n✅ 开发快速\n✅ Skills/MCP 生态\n```\n\n**用户选择**：Rust\n\n**最终决策**：Rust + Tauri\n- 理由：强制模块化，避免老项目错误\n- 记录：D001\n\n### 模块热更新\n\n**方案对比**：\n- QuickJS：过度设计\n- iframe：性能差\n- Module Federation：成熟方案 ✅\n\n**最终决策**：Module Federation\n- 记录：D004\n\n---\n\n## 第四部分：核心概念澄清\n\n### Provider/Skills/MCP 的关系\n\n**初始混淆**：\n- 以为都需要我们实现\n- 以为需要执行引擎\n- 以为是插件系统\n\n**最终理解**：\n\n```\nProvider（我们要开发）：\n├── 适配各厂商 API（OpenAI、Claude 等）\n├── 统一接口封装\n├── 获取模型列表\n├── 给模型打标签（文本/图片/视频/音频）\n└── 提供调用接口\n\nSkills（现有标准）：\n├── 远程仓库列表\n├── 我们提供：管理界面\n├── 我们提供：安装/卸载\n├── 我们提供：调用接口（HTTP/CLI）\n└── Skills 自己运行，返回结果\n\nMCP（现有标准）：\n├── Anthropic 的 Model Context Protocol\n├── 我们提供：连接管理\n├── 我们提供：工具列表展示\n├── 我们提供：调用桥接\n└── MCP 服务器自己运行\n```\n\n**使用场景**：\n- Provider：必须（调用模型）\n- Skills：可选增强（在 LLM 节点中可选择）\n- MCP：可选增强（系统工具）\n\n**记录**：D005\n\n### 应用模块 vs 功能模块\n\n**澄清**：\n- 两者是同一概念\n- 可以叫\"应用模块\"（因为独立开发、版本管理）\n- 也可以叫\"功能模块\"（因为提供特定功能）\n- 本质：可热更新的独立单元\n\n**特性**：\n```\n应用模块：\n├── 独立开发（独立仓库）\n├── 独立版本管理\n├── 热更新（无需重启）\n├── 权限隔离\n├── 可从应用市场安装\n└── 官方模块 + 第三方模块\n```\n\n---\n\n## 第五部分：关键功能设计\n\n### 无限画布策略\n\n**用户明确**：\n> \"无线发布不必在 1.0 模块完成，可以延后或分多个版本进行。因为当前重点是搭建底层能力和底层框架。\"\n\n**分步计划**：\n```\nV1.0: 不包含画布（框架优先）\nV1.2: 画布核心（视口、缩放、拖拽）\nV1.3: 10+ 节点类型、连线系统\nV1.4: 实时执行、循环节点\nV1.5: 工作流导入导出\n```\n\n**节点执行**：\n- 实时执行（用户操作立即执行）\n- 支持循环节点（LoopNode）\n\n**从老项目学习**：\n- 保留交互逻辑（手感好）\n- 重做架构（避免单文件）\n\n**记录**：D009\n\n### Provider 多配置和排序\n\n**用户需求**：\n> \"可以配置多个同类的 provider，是可以的\"\n\n**设计**：\n```\n用户可以配置：\n├── OpenAI 账号 1（个人）\n├── OpenAI 账号 2（工作）\n├── 官方 Provider（积分）\n└── ...\n\n排序机制：\n├── 用户拖拽调整顺序\n├── 默认使用排序第一个\n└── 有选择界面时可以手动选择\n```\n\n**记录**：D012\n\n### 模型分类标签\n\n**问题**：如何给模型打标签？\n\n**决策**：内置维护，手动编码\n```rust\n// Provider 适配器中维护\nmatch model_id {\n    \"gpt-4\" => vec![Capability::TextGeneration],\n    \"dall-e-3\" => vec![Capability::ImageGeneration],\n    \"sora\" => vec![Capability::VideoGeneration],\n}\n```\n\n**标签类型**：\n- 文本生成（text-generation）\n- 图片生成（image-generation）\n- 视频生成（video-generation）\n- 音频生成（audio-generation）\n\n**记录**：D014\n\n### 权限模型\n\n**用户明确**：\n> \"权限模型不需要做得这么细\"\n\n**设计**：粗粒度模块级权限\n```typescript\npermissions: [\n    \"providers.call\",      // 调用所有 Provider\n    \"skills.execute\",      // 执行所有 Skills\n    \"mcp.call\",           // 调用所有 MCP\n    \"storage.read\",       // 读取存储\n    \"storage.write\",      // 写入存储\n    \"network.local\"       // 局域网访问\n]\n```\n\n**记录**：D006\n\n### 局域网协同\n\n**用户需求详细说明**：\n\n**开启方式**：\n> \"局域网模式始终开启\"\n\n**认证**：\n> \"远程设备登录需认证，请在此处设置简单认证\"\n\n**权限**：\n> \"远程设备不可修改 Provider 码，仅支持只读和使用\"\n\n**协同细节**：\n> \"多个设备可同时编辑同一画布，需注意协同细节：当 A 用户移动鼠标或节点时，B 用户的界面需实时显示。双方互动及指针均可见，指针上带有标记以区分不同用户。此外，还需设计锁等机制。\"\n\n**设计**：\n```\n主机：\n├── 自动启动 HTTP 服务（0.0.0.0:3000）\n├── 端口可配置（避免冲突）\n├── 生成随机密码或用户设置\n└── 管理连接用户列表\n\n远程设备：\n├── 访问 http://主机IP:端口\n├── 简单认证（用户名/密码）\n├── 只读模式（不能修改配置）\n└── 实时显示指针和操作\n\n协同编辑（V2.0）：\n├── 实时同步节点移动\n├── 显示其他用户指针（带标记）\n├── 锁机制（编辑时锁定）\n└── CRDT/OT 冲突解决\n```\n\n**记录**：D007、D013\n\n### 统一设计系统\n\n**用户强调**：\n> \"系统的整体样式管理和组件管理需要统一化。因为将来还会开发更多的功能模块，也就是应用。所以关于整个系统的样式框架，包括字体大小、主题等，都要进行标准化和规范化。\"\n\n> \"后期开发的应用都要复用这些主题，不能每个应用一个主题，主题色、主题大小、主题配色、主题字体肯定是不行的。\"\n\n**设计**：\n```\n统一 Design System：\n├── 主题系统（亮色/暗色）\n├── 色彩规范（固定主色、辅助色）\n├── 字体规范（字体家族、字号、字重）\n├── 间距规范（4px 基准）\n├── UI 组件库（基于 Shadcn/ui）\n└── 所有模块强制复用\n\n禁止事项：\n❌ 自定义样式覆盖\n❌ inline styles\n❌ 自定义 CSS 变量\n❌ 每个模块不同主题\n```\n\n**强制机制**：\n- CI 检查（扫描代码）\n- 审核阶段（人工检查）\n- 模块模板（强制使用）\n\n**记录**：D008\n\n---\n\n## 第六部分：应用市场与生态\n\n### 应用市场模式\n\n**问题**：应用市场如何设计？\n\n**用户明确**：\n> \"应用市场必须登录云端账号才能下载，这是对的，匿名是不行的。\"\n\n> \"应用市场是中心化的，对接官方服务器，不能添加第三方源，这是不允许的。\"\n\n> \"审核流程为人工审核。审核系统不需要在 V1.0 里面完成，可以在后面完成。\"\n\n**设计**：\n```\n应用市场（V1.5+）：\n├── 中心化（官方服务器）\n├── 必须登录云端账号\n├── 人工审核（初期）\n├── 自动化检查（V2.0+）\n└── 不支持第三方源\n\n审核标准：\n├── 代码安全性\n├── 权限合理性\n├── 视觉一致性（设计系统）\n├── 功能完整性\n└── 文档完整性\n```\n\n**记录**：D010\n\n### 模块更新\n\n**用户需求**：\n> \"模块的更新是自动推送的。应用市场的图标如果有更新，会有版本号显示，图标上也可以加小红点，这都是可以的。\"\n\n**设计**：\n```\n更新流程：\n1. 后台检测新版本\n2. 图标显示小红点 + 版本号\n3. 用户查看更新日志\n4. 用户确认更新\n5. 下载新版本\n6. 热重载（无需重启）\n```\n\n**记录**：D015\n\n### 官方 Provider 积分\n\n**问题**：如何计费？\n\n**用户说明**：\n> \"官方的 provider 积分计算这个到后面再说吧。这个里面主要是图片按张计算，API 的话，有些是按照倍率，有些是按 token 数量积分的，一般图片按张，视频按秒。\"\n\n**设计**：\n```\n积分计费（V2.0）：\n├── 文本生成：token 数量 * 倍率\n├── 图片生成：按张\n├── 视频生成：按秒\n└── 音频生成：按秒\n```\n\n**记录**：D011\n\n---\n\n## 第七部分：版本规划策略\n\n### 版本边界讨论\n\n**我的初始规划**：\n- V1.0 包含所有功能\n- 详细的功能列表\n- 完整的验收标准\n\n**用户纠正**：\n> \"内容是由浅入深：V1.0 版本只需实现简单的核心功能，后续在 V2 至 V6 版本中逐步完善。因此，可以设计多轮迭代，不必急于在 V1.0 中完成所有功能。\"\n\n> \"我希望提供一个良好的开发框架，以便后续快速迭代和开发。所以，设计时应注重快速推进，而非将所有功能堆砌在 V1.0 中。\"\n\n**最终策略**：\n```\nV1.0（3个月）：底层框架优先\n├── Provider 框架\n├── Skills/MCP 管理\n├── 模块系统\n├── AI 工作台\n└── 系统设置\n\nV1.2-V1.5：核心价值（无限画布）\n├── 分步实现\n├── 不阻塞 V1.0\n└── 验证框架可扩展性\n\nV2.0+：生态系统\n├── 应用市场\n├── 云端同步\n├── 协同编辑\n└── 移动端\n```\n\n---\n\n## 第八部分：文档策略演进\n\n### 初始规划（过度设计）\n\n**我的第一版规划**：\n- 50+ 个文档文件\n- 47,300 字\n- 4 周才能写完\n\n**问题**：\n- 陷入\"文档驱动\"陷阱\n- 过度设计，追求完美\n- 文档成了目的\n\n### 用户纠正\n\n**第一次纠正**：\n> \"边做边补文档也不行！我现在跟你说了这么多，还是想把文档做得更完善一些。在开发过程中，可能还会再补充一些文档，进行版本管理和迭代。\"\n\n> \"我今天聊了这么多，就是为了让你把所有内容都用文档记录下来。所以千万不要让我边写文档边开发，因为明天我可能就忘记了，但你是能记住的，文档也必须得记住。\"\n\n**第二次纠正（样例文档）**：\n> \"你是否能完全的模仿我之前的一个项目的文档结构和样式要求来完善我们之前聊的这些内容\"\n\n> 样例路径：`/Users/apple/Progame/tuziagent/docs-old-all`\n\n### 最终策略\n\n**文档目标**：\n1. 完整记录今天的对话（原始来源）\n2. 按样例格式组织文档\n3. 标准化存储，便于查找\n4. 成为项目\"宪法\"\n\n**文档结构**（模仿样例）：\n```\ndocs/\n├── README.md（文档中心首页）\n├── 01-项目概览/\n├── 02-产品与版本/\n│   ├── 当前版本/（V1）\n│   └── 后续版本/（V2+）\n├── 03-功能规格/\n│   └── V1/（按领域分组）\n├── 04-技术架构/\n│   ├── 当前版本/（V1 架构）\n│   └── system-design/（系统设计）\n├── 05-测试与发布/\n├── 06-决策记录/\n│   ├── V1-冻结决策.md\n│   └── ADR/\n├── 90-参考资料/\n└── 99-历史归档/\n```\n\n---\n\n## 第九部分：关键决策总结\n\n| 编号 | 决策 | 原因 |\n|------|------|------|\n| D001 | Rust + Tauri | 强制模块化，避免老项目单文件问题 |\n| D002 | SQLite | 本地优先、零配置 |\n| D003 | 不用 QuickJS | Skills/MCP 自己运行 |\n| D004 | Module Federation | 成熟的热更新方案 |\n| D005 | 使用现有 Skills/MCP 标准 | 不重复造轮子 |\n| D006 | 粗粒度权限 | V1 简化实现 |\n| D007 | 局域网始终开启 | 简化配置 |\n| D008 | 统一设计系统 | 视觉一致性 |\n| D009 | 画布分多版本 | 框架优先，不阻塞 V1 |\n| D010 | 应用市场中心化 | 保证质量和安全 |\n| D011 | 积分制计费 | 透明、可预期 |\n| D012 | Provider 多配置 | 灵活性、容错 |\n| D013 | 局域网简单认证 | 识别用户、实时状态 |\n| D014 | 模型标签内置 | 准确性 |\n| D015 | 自动推送更新 | 及时获得新功能 |\n\n---\n\n## 第十部分：待解决问题\n\n### 技术细节待确认\n\n1. Module Federation 具体配置\n2. SQLite Schema 设计细节\n3. Skills/MCP 远程仓库 URL\n4. 协同编辑的 CRDT/OT 算法选择\n\n### 功能细节待设计\n\n1. 无限画布的节点类型详细设计\n2. 工作流导入导出格式\n3. 应用市场的具体审核流程\n4. 云端同步的冲突解决策略\n\n### 开发流程待确定\n\n1. Git 分支策略\n2. 代码审查流程\n3. CI/CD 配置\n4. 版本发布流程\n\n---\n\n## 附录：对话关键节点\n\n### 理解纠正节点\n\n1. **Skills/MCP 理解纠正**：从\"需要实现\"到\"只需要管理\"\n2. **技术栈纠正**：确认 Rust 而非 Node.js\n3. **画布策略纠正**：从 V1.0 必须到分多版本\n4. **文档策略纠正**：从边做边写到完整记录\n\n### 重要澄清节点\n\n1. Provider 可以配置多个同类型\n2. Skills 是可选增强，非必选\n3. 权限模型粗粒度即可\n4. 局域网始终开启，简单认证\n5. 统一设计系统强制复用\n\n### 关键决策节点\n\n1. 使用 SQLite 而非 PostgreSQL\n2. 不使用 QuickJS/Node.js\n3. 无限画布分多版本实现\n4. 应用市场中心化、人工审核\n5. 所有模块强制使用统一设计系统\n\n---\n\n## 结论\n\n本次对话确立了 DGOS 项目的：\n1. **产品定位**：本地优先的 AI 应用开发框架\n2. **技术架构**：Rust + Tauri + SQLite + Module Federation\n3. **核心能力**：Provider 适配、Skills/MCP 管理、模块系统\n4. **版本策略**：框架优先，功能渐进\n5. **文档体系**：标准化格式，完整记录\n\n所有后续文档均基于本对话记录生成，是项目的原始需求来源和设计依据。\n", "doc-041": "# 参考资料索引\n\n本目录存放外部参考、调研材料、对话记录和辅助文档。\n\n## 对话记录\n\n- [2024-01-XX 初始讨论完整记录](2024-01-XX-初始讨论完整记录.md)：DGOS 项目从概念到架构设计的完整对话\n- [对话总结与待办事项](对话总结与待办事项.md)：提炼的关键共识、决策和行动计划\n\n## 老项目分析\n\n- [infinite-canvas-ccnuzw 项目教训](老项目教训分析.md)：19,038 行单文件问题分析，为什么需要重做\n\n## 技术调研\n\n- [Rust vs Node.js 对比分析](技术选型/Rust-vs-NodeJS.md)\n- [SQLite vs PostgreSQL 对比分析](技术选型/SQLite-vs-PostgreSQL.md)\n- [Module Federation 技术调研](技术选型/Module-Federation调研.md)\n- [Skills 标准协议研究](技术选型/Skills标准协议.md)\n- [MCP 协议研究](技术选型/MCP协议研究.md)\n\n## 外部参考\n\n- [LangChain Tools 文档](https://python.langchain.com/docs/modules/tools/)\n- [Anthropic MCP 协议](https://modelcontextprotocol.io/)\n- [Tauri 官方文档](https://tauri.app/)\n- [Module Federation 文档](https://module-federation.github.io/)\n\n## 使用说明\n\n- 参考资料不是权威文档，仅供查阅和参考\n- 决策依据见 [V1 冻结决策](../06-决策记录/V1-冻结决策.md)\n- 技术方案见 [技术架构](../04-技术架构/README.md)\n", "doc-042": "# 历史归档索引\n\n本目录存放已迁移或不再作为当前依据的历史材料。\n\n## 归档原则\n\n- 已被新文档替代的旧版本\n- 已废弃的技术方案或设计\n- 历史讨论记录（但不影响当前实现）\n- 实验性的探索文档（未采纳）\n\n## 归档文档\n\n当前无归档文档。随着项目演进，废弃的设计和决策将移入本目录。\n\n## 查找历史\n\n- 使用 Git 历史查看文档变更：`git log -- docs/`\n- 查看决策变更：[V1 文档变更记录](../06-决策记录/V1-文档变更记录.md)\n", "doc-043": "# DGOS 文档中心\n\n这里是 DGOS 项目的统一文档入口。日常查找从本页开始，不需要记忆文件名或版本目录。\n\n## 按任务查找\n\n| 我想做什么 | 从哪里开始 |\n| --- | --- |\n| 第一次了解项目和本地启动 | [项目 README](../README.md) · [工程与本地环境](01-项目概览/工程与本地环境.md) |\n| 提交代码或编写提交信息 | [Git 提交信息规范](01-项目概览/Git提交信息规范.md) |\n| 了解当前版本做什么 | [V1 版本总览](02-产品与版本/当前版本/V1-版本总览.md) · [V1 产品需求](02-产品与版本/当前版本/V1-产品需求.md) |\n| 查看哪些能力已经实现 | [V1 实现状态](02-产品与版本/当前版本/V1-实现状态.md) |\n| 开发或修改一个功能 | [V1 功能规格索引](03-功能规格/V1/README.md) · [功能开发流程](03-功能规格/功能开发流程.md) |\n| 查接口、数据库或错误码 | [V1 接口契约](04-技术架构/当前版本/V1-接口契约.md) · [V1 数据模型](04-技术架构/当前版本/V1-数据模型.md) |\n| 理解整体架构或领域边界 | [总体架构](04-技术架构/总体架构.md) · [服务与领域边界](04-技术架构/服务与领域边界.md) |\n| 查找某个架构或产品决策的原因 | [V1 冻结决策](06-决策记录/V1-冻结决策.md) · [ADR 索引](06-决策记录/ADR/README.md) |\n| 查看版本路线图或功能演进 | [版本路线图](02-产品与版本/版本路线图.md) · [功能演进矩阵](02-产品与版本/功能演进矩阵.md) |\n| 参考老项目或外部资料 | [参考资料索引](90-参考资料/README.md) |\n\n## 目录结构\n\n```\ndocs/\n  README.md               本文档中心首页\n  01-项目概览/             环境、Git 规范与团队工作流\n  02-产品与版本/           产品蓝图、路线图与版本规格\n    当前版本/             V1 版本需求、范围与实现状态\n    后续版本/             V2+ 规划\n  03-功能规格/            功能主文档与验收标准\n    V1/                  V1 功能规格（按领域分组）\n  04-技术架构/            总体架构、服务边界与技术设计\n    当前版本/             V1 架构、接口、数据模型与设计\n    系统设计/              核心系统设计文档（链接到功能规格）\n  05-测试与发布/          测试策略、验收与发布门禁\n    端到端验收/           E2E 测试用例与报告\n    安全与性能/           安全基线与性能测试\n  06-决策记录/            冻结决策与架构决策记录\n    ADR/                 架构决策记录（ADR）\n  90-参考资料/            外部参考、调研与辅助材料\n  99-历史归档/            已迁移或不再作为当前依据的材料\n```\n\n## 命名规则\n\n- 人工阅读的文档使用\"编号 + 中文主题\"，例如 `01-Provider适配框架.md`。\n- `README.md`、API 路径、数据库字段和代码标识保留行业约定名称。\n- 功能编号、需求编号和 ADR 编号必须保持稳定；移动文档不能改变这些追踪 ID。\n- 尚未进入开发的版本只维护一份版本规划，进入开发门禁后才拆成功能规格。\n- 历史材料必须放入 `99-历史归档`，不得与当前权威文档并列。\n\n## 快速搜索\n\n在仓库根目录执行：\n\n```sh\nrg \"Provider\" docs\nrg \"V1-FR-001\" docs\nrg \"module_system\" docs\n```\n\n## 文档权威性\n\n- **产品范围**：[版本总览](02-产品与版本/当前版本/V1-版本总览.md) > 功能主文档 > 实现状态\n- **接口字段**：[OpenAPI](04-技术架构/当前版本/V1-openapi.yaml) > 接口契约文档\n- **数据物理**：migration 文件 > 数据模型文档\n- **架构决策**：[冻结决策](06-决策记录/V1-冻结决策.md) > ADR > 设计文档\n\n当文档之间出现不一致时，优先采信权威级别更高的文档。发现冲突时应提出修订，而非自行判断。\n"};

    async function init() {

        if (state.features.length !== 36) throw new Error(`具体功能数据应为 36 个，当前 ${state.features.length} 个`);

        renderDocList();
        setView(state.view);
      } catch (error) {
        els.loadStatus.textContent = "加载失败";

            </div>
          </section>
        `;
      }

    async function loadDoc(doc) {
      let content = window.DGOS_DOC_BROWSER_DATA?.[doc.id];
      if (location.protocol !== "file:") {
        try {
          const response = await fetch(encodeURI(doc.file), { cache: "no-store" });
          if (!response.ok) throw new Error(`${doc.file}: ${response.status}`);
          content = await response.text();
        } catch (error) {
          if (typeof content !== "string") throw error;
        }
      }
      if (typeof content !== "string") {
        throw new Error(`缺少离线文档数据: ${doc.id}`);
      }
      const headings = extractHeadings(content);
      return {
        ...doc,
        content,
        headings,
        lines: content.split(/\r?\n/).length,
        words: content.replace(/\s+/g, "").length
      };
    }

    function bindEvents() {
      els.tabs.forEach(button => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });

      els.searchInput.addEventListener("input", debounce(() => {
        state.query = els.searchInput.value.trim();
        els.clearSearch.style.display = state.query ? "block" : "none";
        renderSearch();
      }, 150));

      els.clearSearch.addEventListener("click", () => {
        els.searchInput.value = "";
        state.query = "";
        els.clearSearch.style.display = "none";
        els.searchResults.classList.remove("open");
      });

      document.addEventListener("keydown", event => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault();
          els.searchInput.focus();
        }
        if (event.key === "Escape") {
          els.searchResults.classList.remove("open");
        }
      });

      els.mainScroll.addEventListener("scroll", () => {
        updateProgress();
        updateActiveOutline();
      });
    }

    function renderDocList() {
      els.docList.innerHTML = state.docs.map(doc => `
        <button class="doc-item ${doc.id === state.activeDocId ? "active" : ""}" data-doc="${doc.id}" style="--accent:${doc.accent};--accent-soft:${doc.soft}">
          <span class="doc-badge">${doc.version}</span>
          <span class="doc-name">
            <strong>${escapeHtml(doc.title)}</strong>
            <span>${escapeHtml(doc.phase)} · ${doc.lines} 行</span>
          </span>
        </button>
      `).join("");

      els.docList.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          openDoc(button.dataset.doc);
        });
      });
    }

    function setView(view) {
      if (view === "matrix") view = "evolution";
      if (!["overview", "reader", "map", "evolution", "feature-timeline"].includes(view)) view = "overview";
      state.view = view;
      localStorage.setItem("prd.view", view);
      els.tabs.forEach(tab => tab.classList.toggle("active", tab.dataset.view === view));

      if (view === "overview") renderOverview();
      if (view === "reader") renderReader();
      if (view === "map") renderMap();

    function filterFeatures(query) {
      const normalized = query.trim().toLowerCase();

    function updateFeatureOptions(select, query, activeId) {

    }

    function selectFeature(featureId, filterQuery = "") {

    function extractEvolutionStages(trackId) {
      const doc = state.docs.find(item => item.id === "evolution");
      const track = FEATURE_TRACKS[trackId];
      if (!doc || !track) return [];
      const lines = doc.content.replace(/\r\n/g, "\n").split("\n");
      const sectionStart = lines.findIndex(line => /^##\s+/.test(line) && line.includes(track.title));
      if (sectionStart < 0) return [];
      const sectionEnd = lines.findIndex((line, index) => index > sectionStart && /^##\s+/.test(line));
      const end = sectionEnd < 0 ? lines.length : sectionEnd;
      const tableStart = lines.findIndex((line, index) => index > sectionStart && index < end && isTableStart(lines, index));
      if (tableStart < 0) return [];

      const rows = [];
      for (let index = tableStart + 2; index < end && /^\s*\|.*\|\s*$/.test(lines[index]); index += 1) {
        const cells = lines[index].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
        if (cells.length >= 5) {
          rows.push({ stage: cells[0], change: cells[1], dependencies: cells[2], completion: cells[3], source: cells[4], sourceFile: doc.file });
        }
      }

      const overviewStart = lines.findIndex(line => /^\|\s*能力主线\s*\|/.test(line));
      if (overviewStart >= 0) {
        let index = overviewStart + 2;
        while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
          const cells = lines[index].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
          if (cells[0] === track.overview) {
            const columns = [
              ["v2", "V2", 2], ["v4", "V4", 4], ["v5", "V5", 5], ["v6", "V6", 6],
              ["v7", "V7", 7], ["v8", "V8", 8], ["future", "后续", 9]
            ];
            columns.forEach(([versionId, label, cellIndex]) => {
              const version = FEATURE_TIMELINE_VERSIONS.find(item => item.id === versionId);
              if (!cells[cellIndex] || stagesForVersion(rows, version).length) return;
              rows.push({
                stage: label === "后续" ? "后续独立增强" : `${label} 总览关联`,
                change: cells[cellIndex],
                dependencies: "对应能力详表尚未单独展开；版本进入条件以第 12 节为准",
                completion: "该版本进入开发门禁后补充正式功能编号、完成判定和验收证据",
                source: "[跨版本总览](功能演进矩阵.md#3-跨版本总览)",
                sourceFile: doc.file,
                overview: true
              });
            });
            break;
          }
          index += 1;
        }
      }
      return rows;
    }

    function stagesForVersion(stages, version) {
      if (version.id === "gate") return stages.filter(stage => /^V1\s+发布门禁/.test(stage.stage));
      if (version.id === "future") return stages.filter(stage => /^后续/.test(stage.stage));
      if (/^v[2-8]$/.test(version.id)) {
        const label = version.label;
        return stages.filter(stage => stage.stage === label || stage.stage.startsWith(`${label} `));
      }
      return [];
    }

    function renderFeatureMilestone(feature, version, stages) {

                <div class="milestone-fact"><span>前端</span><strong>${escapeHtml(implementation.frontend)}</strong></div>

              </div>
              <div class="milestone-detail"><strong>当前主要差距</strong><span>${escapeHtml(implementation.gap)}</span></div>
              <div class="milestone-detail"><strong>上游依赖</strong><span>${escapeHtml(feature.dependencies || "以功能主文档为准")}</span></div>
              <div class="milestone-source"><a href="${escapeHtml(resolveDocHref(feature.file, ""))}" target="_blank" rel="noopener">${escapeHtml(feature.id)} 功能主文档</a></div>
              <div class="milestone-source">状态更新：${escapeHtml(implementation.updatedAt)} · <a href="${escapeHtml(resolveDocHref("../02-产品与版本/当前版本/V1-实现状态.md", ""))}" target="_blank" rel="noopener">查看实现状态依据</a></div>
            </div>
          </article>
        `;
      }

      if (version.id === "v3") {
        return `
          <article class="feature-milestone history">
            <div class="milestone-axis">
              <span class="milestone-dot" aria-hidden="true"></span>
              <strong>V3</strong>
              <small>历史迁移</small>
            </div>
            <div class="milestone-card">
              <div class="milestone-state-line">
                <div class="milestone-mobile-meta"><strong>V3</strong><span>历史迁移</span></div>
                <span class="milestone-state history">历史范围</span>
              </div>
              <h4>不参与当前规划</h4>
              <p>原 V3 多协议范围已经迁入 V1-P1～P3。当前 V3 没有可继承的正式功能范围。</p>
              <div class="milestone-detail"><strong>进入条件</strong>若未来重新规划 V3，必须重新定义目标、范围、依赖和成功标准。</div>
            </div>
          </article>
        `;
      }

      const matches = stagesForVersion(stages, version);
      if (!matches.length) {
        return `
          <article class="feature-milestone empty">
            <div class="milestone-axis">
              <span class="milestone-dot" aria-hidden="true"></span>
              <strong>${escapeHtml(version.label)}</strong>
              <small>无单独规划</small>
            </div>
            <div class="milestone-card">
              <div class="milestone-state-line">
                <div class="milestone-mobile-meta"><strong>${escapeHtml(version.label)}</strong><span>无单独规划</span></div>
                <span class="milestone-state empty">当前未分配</span>
              </div>
              <h4>当前未分配阶段</h4>
              <p>${version.id === "gate" ? "该主责能力没有单独列出 V1 发布门禁。" : "该主责能力在此版本没有明确的阶段变化。"}</p>
              <div class="milestone-detail"><strong>说明</strong>空白不代表取消；后续调整应先更新权威版本规划和功能演进矩阵。</div>
            </div>
          </article>
        `;
      }

      const match = matches[0];
      const milestoneStatus = version.kind === "gate" ? "发布门禁" : match.overview ? "总览关联" : "关联能力规划";
      return `

              <div class="milestone-mobile-meta"><strong>${escapeHtml(version.label)}</strong><span>${milestoneStatus}</span></div>
              <span class="milestone-state ${version.kind === "gate" ? "gate" : "planned"}">${version.kind === "gate" ? "当前门禁" : "未来规划"}</span>
              <span>${milestoneStatus}</span>
            </div>
            <h4>${escapeHtml(match.stage)}</h4>
            <p>${inline(match.change, match.sourceFile)}</p>
            <div class="milestone-detail"><strong>依赖与边界</strong>${inline(match.dependencies, match.sourceFile)}</div>
            <div class="milestone-detail"><strong>完成判定</strong>${inline(match.completion, match.sourceFile)}</div>
            <div class="milestone-source">${inline(match.source, match.sourceFile)}</div>
            ${matches.length > 1 ? `<div class="milestone-source">同版本另有 ${matches.length - 1} 个关联阶段，详见功能演进矩阵。</div>` : ""}
          </div>
        </article>
      `;
    }

    function renderSearch() {
      if (!state.query) {
        els.searchResults.classList.remove("open");
        els.searchResults.innerHTML = "";
        return;
      }

      const query = state.query.toLowerCase();
      const results = [];
      const featureResults = filterFeatures(state.query).slice(0, 20);

      state.docs.forEach(doc => {
        doc.content.split(/\r?\n/).forEach((line, index) => {
          if (line.toLowerCase().includes(query)) {
            results.push({
              doc,
              line: line.trim() || "(空行)",
              lineNo: index + 1
            });
          }
        });
      });

      const limited = results.slice(0, Math.max(0, 80 - featureResults.length));
      els.searchResults.innerHTML = featureResults.length || limited.length
        ? `${featureResults.map(feature => `
            <button class="result-item" data-feature="${escapeHtml(feature.id)}">
              <span class="result-top">
                <span>${escapeHtml(feature.id)} · 具体功能时间线</span>
                <span>${escapeHtml(feature.trackName)}</span>
              </span>
              <span class="result-line">${highlight(`${feature.title} · ${feature.goal}`, state.query)}</span>
            </button>
          `).join("")}${limited.map(result => `
            <button class="result-item" data-doc="${result.doc.id}">
              <span class="result-top">
                <span>${escapeHtml(result.doc.version)} · ${escapeHtml(result.doc.title)}</span>
                <span>Line ${result.lineNo}</span>
              </span>
              <span class="result-line">${highlight(result.line, state.query)}</span>
            </button>
          `).join("")}`
        : `<div class="empty">没有匹配项</div>`;

      els.searchResults.classList.add("open");
      els.searchResults.querySelectorAll("[data-doc]").forEach(button => {
        button.addEventListener("click", () => openDoc(button.dataset.doc));
      });
      els.searchResults.querySelectorAll("[data-feature]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeFeatureId = button.dataset.feature;
          localStorage.setItem("prd.activeFeature", state.activeFeatureId);
          els.searchResults.classList.remove("open");
          setView("feature-timeline");
        });
      });
    }

    function renderMarkdown(source, sourceFile = "") {
      const lines = source.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      const outline = [];
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];

        if (/^```/.test(line)) {
          const lang = line.replace(/^```/, "").trim();
          const code = [];
          index += 1;
          while (index < lines.length && !/^```/.test(lines[index])) {
            code.push(lines[index]);
            index += 1;
          }
          index += 1;
          html.push(`<pre><code data-lang="${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }

        const heading = /^(#{1,4})\s+(.+)$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = makeHeadingId(text, outline.length);
          outline.push({ id, text, level });
          html.push(`<h${level} id="${id}">${inline(text, sourceFile)}</h${level}>`);
          index += 1;
          continue;
        }

        if (isTableStart(lines, index)) {
          const block = [];
          while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
            block.push(lines[index]);
            index += 1;
          }
          html.push(renderTable(block, sourceFile));
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*[-*]\s+/, ""));
            index += 1;
          }
          html.push(`<ul>${items.map(item => `<li>${inline(item, sourceFile)}</li>`).join("")}</ul>`);
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+\.\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*\d+\.\s+/, ""));
            index += 1;
          }
          html.push(`<ol>${items.map(item => `<li>${inline(item, sourceFile)}</li>`).join("")}</ol>`);
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^\s*>\s?/.test(lines[index])) {
            quote.push(lines[index].replace(/^\s*>\s?/, ""));
            index += 1;
          }
          html.push(`<blockquote>${quote.map(item => inline(item, sourceFile)).join("<br>")}</blockquote>`);
          continue;
        }

        const standaloneImage = /^!\[([^\]]*)\]\(([^)]+)\)\s*$/.exec(line.trim());
        if (standaloneImage) {
          html.push(renderDocFigure(standaloneImage[1], standaloneImage[2], sourceFile));
          index += 1;
          continue;
        }

        if (line.trim() === "") {
          index += 1;
          continue;
        }

        const paragraph = [line];
        index += 1;
        while (
          index < lines.length &&
          lines[index].trim() !== "" &&
          !/^(#{1,4})\s+/.test(lines[index]) &&
          !/^```/.test(lines[index]) &&
          !/^!\[[^\]]*\]\([^)]+\)\s*$/.test(lines[index].trim()) &&
          !/^\s*[-*]\s+/.test(lines[index]) &&
          !/^\s*\d+\.\s+/.test(lines[index]) &&
          !isTableStart(lines, index)
        ) {
          paragraph.push(lines[index]);
          index += 1;
        }
        html.push(`<p>${inline(paragraph.join(" "), sourceFile)}</p>`);
      }

      return { html: html.join("\n"), outline };
    }

    function renderDocFigure(alt, href, sourceFile) {
      const decodedHref = decodeMarkdownHref(href);
      const resolvedHref = resolveDocHref(decodedHref, sourceFile);
      const safeAlt = escapeHtml(alt || "文档图表");
      return `
        <figure class="doc-figure">
          <a href="${escapeHtml(resolvedHref)}" target="_blank" rel="noopener">
            <img src="${escapeHtml(resolvedHref)}" alt="${safeAlt}" loading="lazy" decoding="async">
          </a>
          <figcaption>${safeAlt} · 点击查看原图</figcaption>
        </figure>
      `;
    }

    function isTableStart(lines, index) {
      return (
        index + 1 < lines.length &&
        /^\s*\|.*\|\s*$/.test(lines[index]) &&
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1])
      );
    }

    function renderTable(block, sourceFile = "") {
      const rows = block
        .filter((_, index) => index !== 1)
        .map(line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim()));

      if (!rows.length) return "";
      const head = rows[0];
      const body = rows.slice(1);
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${head.map(cell => `<th>${inline(cell, sourceFile)}</th>`).join("")}</tr></thead>
            <tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inline(cell, sourceFile)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      `;
    }

    function extractHeadings(content) {
      return content
        .split(/\r?\n/)
        .filter(line => /^(#{1,4})\s+/.test(line))
        .map(line => line.replace(/^(#{1,4})\s+/, "").trim());
    }

    function inline(value, sourceFile = "") {
      let output = escapeHtml(value);
      output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
      output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
        const decodedHref = decodeMarkdownHref(href);
        return `<a href="${escapeHtml(resolveDocHref(decodedHref, sourceFile))}">${label}</a>`;
      });
      return output;
    }

    function decodeMarkdownHref(href) {
      return href.replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#039;/g, "'");
    }

    function resolveDocHref(href, sourceFile) {
      if (!sourceFile || /^(?:[a-z][a-z\d+.-]*:|#|\/)/i.test(href)) return href;
      try {
        const sourceUrl = new URL(encodeURI(sourceFile), window.location.href);
        return new URL(encodeURI(href), sourceUrl).href;
      } catch {
        return href;
      }
    }

    function statBlock(label, value, caption) {
      return `
        <div class="stat">
          <span>${escapeHtml(label)}</span>
          <strong>${value}</strong>
          <span>${escapeHtml(caption)}</span>
        </div>
      `;
    }

    function getActiveDoc() {
      return state.docs.find(doc => doc.id === state.activeDocId) || state.docs[0];
    }

    function makeHeadingId(text, index) {
      const base = text
        .toLowerCase()
        .replace(/`/g, "")
        .replace(/[^\p{Letter}\p{Number}]+/gu, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 64);
      return `h-${index}-${base || "section"}`;
    }

    function updateProgress() {
      const max = els.mainScroll.scrollHeight - els.mainScroll.clientHeight;
      const value = max > 0 ? Math.min(100, Math.max(0, (els.mainScroll.scrollTop / max) * 100)) : 0;
      els.readProgress.style.width = `${value}%`;
    }

    function updateActiveOutline() {
      const article = document.getElementById("article");
      if (!article) return;

      const headings = [...article.querySelectorAll("h1,h2,h3,h4")];
      let active = "";
      for (const heading of headings) {
        if (heading.getBoundingClientRect().top < 110) active = heading.id;
      }
      els.outline.querySelectorAll("a").forEach(link => {
        link.classList.toggle("active", link.dataset.target === active);
      });
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("zh-CN").format(value);
    }

    function highlight(line, query) {
      const escaped = escapeHtml(line);
      const pattern = new RegExp(escapeRegExp(query), "gi");
      return escaped.replace(pattern, match => `<mark>${match}</mark>`);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function debounce(fn, delay) {
      let timer = null;
      return (...args) => {
        window.clearTimeout(timer);
        timer = window.setTimeout(() => fn(...args), delay);
      };
    }
  </script>
