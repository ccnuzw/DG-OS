依赖、可定制 |\n\n明确不采用：QuickJS/Node.js（Skills/MCP 自己运行）、PostgreSQL（本地优先）、Redis（单机不需要）、MinIO/S3（文件系统足够）。\n\n## 2. V1 交付范围\n\n### 2.1 底层能力框架（核心）\n\n**V1-CAP-001 Provider 适配框架**\n- 统一 Provider 接口定义（Rust trait）\n- 模型列表获取与缓存\n- 模型分类标签（文本/图片/视频/音频）\n- OpenAI 兼容适配器实现\n- 支持配置多个同类型 Provider\n- Provider 排序与默认选择机制\n\n**V1-CAP-002 Skills 管理系统**\n- 从远程仓库获取 Skills 列表\n- Skills 安装/卸载/启用/禁用\n- Skills 配置管理（API Key 等）\n- Skills 调用接口（HTTP/CLI）\n- Skills 使用记录\n\n**V1-CAP-003 MCP 管理系统**\n- MCP 服务器连接管理\n- 工具列表获取与缓存\n- MCP 工具调用接口\n- 连接状态监控\n\n**V1-CAP-004 模块系统**\n- 模块动态加载/卸载\n- 模块热更新机制\n- 模块权限管理（粗粒度）\n- Module Federation 集成\n\n**V1-CAP-005 统一设计系统**\n- 主题系统（亮色/暗色）\n- 色彩规范\n- 字体规范\n- 间距规范\n- 基础 UI 组件库（10+ 组件）\n- 所有模块强制复用\n\n### 2.2 基础应用模块\n\n**V1-APP-001 AI 工作台**\n- 简单对话界面\n- Provider 选择\n- 历史记录查看\n- Prompt 输入与提交\n- 流式响应展示\n\n**V1-APP-002 系统设置**\n- Provider 管理界面\n- Skills 管理界面\n- MCP 管理界面\n- 模块管理界面\n- 主题切换\n- 用户管理（本地用户）\n\n### 2.3 运行模式\n\n**单机模式（必须）**\n- SQLite 本地存储\n- 完全离线可用\n- 简单用户隔离\n- 本地 Provider 配置\n\n**局域网模式（必须）**\n- HTTP API 服务（始终开启）\n- 端口可配置（避免冲突）\n- 简单认证机制\n- 远程设备只读使用\n- 实时连接状态显示\n\n**云端增强模式（V2.0）**\n- 账号系统登录\n- 官方 Provider 调用（积分）\n- 应用市场下载\n- 跨设备数据同步\n\n### 2.4 明确不包含（后续版本）\n\n| 功能 | 计划版本 | 原因 |\n|------|---------|------|\n| 无限画布完整版 | V1.2-V1.5 | 核心价值但复杂，分步实现 |\n| 协同编辑（实时同步） | V2.0 | 需要 CRDT/OT，复杂度高 |\n| 应用市场审核系统 | V1.5+ | 人工审核，后续完善 |\n| 云端数据同步 | V2.0 | V1 本地优先 |\n| Windows 支持 | V1.1 | 先保证 macOS 稳定 |\n| 移动端应用 | V3.0+ | 焦点在桌面端 |\n\n## 3. 核心流程\n\n### 3.1 Provider 调用流程\n\n```\n用户发起调用\n  ↓\n选择 Provider（或使用默认排序第一个）\n  ↓\n权限检查（模块权限）\n  ↓\nProvider Adapter 调用\n  ↓\n返回结果 / 流式输出\n  ↓\n记录使用日志\n```\n\n### 3.2 Skills 使用流程\n\n```\n用户在应用模块中选择 Skills（可选）\n  ↓\nSkills Manager 查找已安装 Skills\n  ↓\n调用 Skills API（HTTP/CLI）\n  ↓\nSkills 自己运行并返回结果\n  ↓\n应用模块接收并展示结果\n```\n\n### 3.3 模块加载流程\n\n```\n应用启动\n  ↓\n读取已安装模块列表（SQLite）\n  ↓\n验证模块签名（V2.0）\n  ↓\nModule Federation 动态加载\n  ↓\n检查并授予权限\n  ↓\n模块注册到系统\n  ↓\n模块可用\n```\n\n### 3.4 局域网协同流程\n\n```\n主机启动 DGOS\n  ↓\n自动启动 HTTP 服务（可配置端口）\n  ↓\n远程设备访问 http://主机IP:端口\n  ↓\n简单认证（用户名/密码）\n  ↓\n远程设备使用主机的 Provider/Skills\n  ↓\n实时显示连接用户\n```\n\n## 4. 数据模型概要\n\n### 4.1 核心实体\n\n```\n用户（users）\n  ├── 本地用户（无需云端账号）\n  ├── 可选绑定云端账号\n  └── 创建时间、最后登录\n\nProvider（providers）\n  ├── 配置信息（名称、类型、base_url）\n  ├── API Key（加密存储）\n  ├── 启用状态\n  └── 排序权重\n\n模型（models）\n  ├── 所属 Provider\n  ├── 模型 ID\n  ├── 能力标签（文本/图片/视频/音频）\n  └── 同步时间\n\nSkills（skills）\n  ├── 名称、版本、类型\n  ├── 端点配置\n  ├── 分类标签\n  └── 启用状态\n\nMCP 服务器（mcp_servers）\n  ├── 连接配置\n  ├── 工具列表\n  └── 连接状态\n\n已安装模块（installed_modules）\n  ├── 模块 ID、版本\n  ├── 入口点\n  ├── manifest 配置\n  └── 启用状态\n\n模块权限（module_permissions）\n  ├── 模块 ID\n  ├── 权限类型\n  └── 授予状态\n\n项目数据（projects）\n  ├── 项目名称、类型\n  ├── 数据（JSON）\n  └── 所有者\n```\n\n详细 Schema 见 [V1 数据模型](../../04-技术架构/当前版本/V1-数据模型.md)。\n\n## 5. 接口概要\n\n### 5.1 Tauri Commands（桌面端）\n\n```rust\n// Provider\nlist_providers() -> Vec<Provider>\ncall_provider(id, model_id, request) -> Response\n\n// Skills\nfetch_skills_registry() -> Vec<SkillInfo>\ninstall_skill(config) -> Result<()>\ncall_skill(skill_id, params) -> Result<Value>\n\n// MCP\nconnect_mcp(config) -> Result<()>\ncall_mcp_tool(server_id, tool_name, params) -> Result<Value>\n\n// 模块\nload_module(manifest) -> Result<()>\nreload_module(module_id) -> Result<()>\n```\n\n### 5.2 HTTP API（局域网）\n\n```\nPOST /api/v1/auth/login          # 认证\nGET  /api/v1/providers           # Provider 列表\nPOST /api/v1/providers/:id/call  # 调用 Provider\nGET  /api/v1/skills              # Skills 列表\nPOST /api/v1/skills/:id/call     # 调用 Skill\nGET  /api/v1/mcp/tools           # MCP 工具列表\nPOST /api/v1/mcp/call            # 调用 MCP 工具\n```\n\n详细 API 见 [V1 接口契约](../../04-技术架构/当前版本/V1-接口契约.md) 和 [V1 OpenAPI](../../04-技术架构/当前版本/V1-openapi.yaml)。\n\n## 6. 关键决策\n\n| 决策编号 | 决策内容 | 依据 |\n|---------|---------|------|\n| D001 | 使用 Rust 而非 Node.js | 强制模块化、性能、避免老项目单文件问题 |\n| D002 | 使用 SQLite 而非 PostgreSQL | 本地优先、零配置、单文件 |\n| D003 | 不使用 QuickJS/Node.js 运行时 | Skills/MCP 自己运行，我们只管理和调用 |\n| D004 | Module Federation 实现热更新 | 成熟方案、独立构建、共享依赖 |\n| D005 | Skills 和 MCP 使用现有标准 | 不重新发明轮子、生态兼容 |\n| D006 | 权限模型粗粒度（模块级） | V1 简化实现，后续细化 |\n| D007 | 局域网始终开启 | 简化配置，端口可调 |\n| D008 | 统一设计系统强制复用 | 避免每个模块自定义样式 |\n| D009 | 无限画布分多版本实现 | 不阻塞 V1，框架优先 |\n| D010 | 应用市场人工审核 | V1.5+ 完善，暂不自动化 |\n\n详细决策见 [V1 冻结决策](../../06-决策记录/V1-冻结决策.md)。\n\n## 7. 验收标准\n\n### 7.1 核心能力验收\n\n- [ ] 可配置至少 1 个 Provider 并成功调用模型\n- [ ] 可从远程仓库查看 Skills 列表\n- [ ] 可安装至少 1 个 Skill 并成功调用\n- [ ] 可连接至少 1 个 MCP 服务器并调用工具\n- [ ] 可安装官方模块（AI 工作台、系统设置）\n- [ ] 模块更新后无需重启即可生效\n- [ ] 所有模块使用统一设计系统，无自定义样式\n\n### 7.2 运行模式验收\n\n**单机模式**\n- [ ] 本地启动成功，无需网络\n- [ ] SQLite 数据库正常读写\n- [ ] 创建本地用户成功\n- [ ] Provider 配置持久化\n\n**局域网模式**\n- [ ] HTTP 服务自动启动\n- [ ] 远程设备可访问主机\n- [ ] 简单认证通过后可使用\n- [ ] 远程设备只读，不能修改配置\n- [ ] 实时显示连接用户\n\n### 7.3 性能验收\n\n- [ ] 应用启动时间 < 2 秒\n- [ ] 模块加载时间 < 1 秒\n- [ ] API 响应时间（P95）< 200ms\n- [ ] SQLite 数据库 < 1GB\n\n### 7.4 质量验收\n\n- [ ] 所有 Rust 文件 < 1000 行\n- [ ] 所有 TypeScript 组件文件 < 500 行\n- [ ] 零 P0/P1 安全漏洞\n- [ ] 核心功能单元测试覆盖率 > 60%\n- [ ] 文档覆盖率 > 80%\n\n## 8. 版本时间线\n\n```\nPhase 1: 核心框架（Week 1-4）\n├── Provider 框架\n├── Skills 管理\n├── MCP 管理\n└── 数据库 Schema\n\nPhase 2: 模块系统（Week 5-6）\n├── Module Federation 集成\n├── 模块加载器\n└── 权限系统\n\nPhase 3: 基础应用（Week 7-9）\n├── AI 工作台\n├── 系统设置\n└── 统一设计系统\n\nPhase 4: 局域网模式（Week 10）\n├── HTTP API\n├── 认证机制\n└── 测试与优化\n\nPhase 5: 测试与发布（Week 11-12）\n├── E2E 测试\n├── 性能测试\n└── 文档完善\n\n预计时间：3 个月\n```\n\n## 9. 风险与依赖\n\n### 9.1 技术风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n|------|------|------|----------|\n| Module Federation 不稳定 | 中 | 高 | 早期原型验证，准备降级方案 |\n| SQLite 性能不足 | 低 | 中 | 限制数据量，优化索引 |\n| Skills/MCP 调用失败 | 中 | 中 | 完善错误处理和重试机制 |\n\n### 9.2 外部依赖\n\n- Tauri 生态稳定性\n- SQLite 兼容性\n- Skills/MCP 远程仓库可用性\n\n### 9.3 内部依赖\n\n- 核心框架必须先完成\n- Provider 框架是 Skills/MCP 的基础\n- 统一设计系统必须在模块开发前完成\n\n## 10. 后续版本预览\n\n**V1.2（+2 个月）：无限画布基础**\n- 画布核心（视口、缩放、拖拽）\n- 基础节点类型（5 种）\n- 节点连线\n- 实时执行\n\n**V1.5（+3 个月）：应用市场**\n- 应用浏览与搜索\n- 应用安装与更新\n- 开发者提交\n- 人工审核流程\n\n**V2.0（+6 个月）：云端与协同**\n- 账号系统\n- 官方 Provider（积分）\n- 跨设备同步\n- 实时协同编辑\n\n详见 [版本路线图](../版本路线图.md)。\n\n## 11. 审批与维护\n\n| 日期 | 角色 | 状态 | 备注 |\n|------|------|------|------|\n| 2024-01-XX | Product Manager | Draft | 初始版本，基于完整对话整理 |\n| - | Technical Lead | Pending | 待技术评审 |\n| - | Stakeholder | Pending | 待产品评审 |\n\n本文档一旦冻结，后续变更必须通过变更记录文档追踪，不得直接修改历史版本内容。\n", "doc-011": "# DGOS 版本路线图\n\n## 1. 文档目标\n\n本文档是 DGOS 产品版本规划的权威索引，定义版本编号、范围边界、依赖关系和进入条件。\n\n产品、研发、测试和运营讨论版本范围时，以本文档的版本矩阵为准；跨版本查看同一项能力如何增强时，使用[功能演进矩阵](功能演进矩阵.md)；各版本 PRD 负责展开详细的功能、接口、数据、业务规则和验收用例。\n\n## 2. 版本命名规则\n\n统一使用 `V1` 到 `V8` 作为产品版本编号。\n\n**不使用**小数点版本号（例如不使用 V1.1、V1.2、V2.1）。每个版本是独立的产品阶段，有明确的业务目标和技术边界。\n\n**版本编号**：V1、V2、V3、V4、V5、V6、V7、V8\n\n**版本内阶段**：如果需要分阶段交付，使用发布门禁或阶段标记（例如 V1-P1、V1-P2），但对外仍然是 V1。\n\n## 3. 业务术语口径\n\nPRD 中业务概念优先使用中文名。英文只在第三方协议/API 名称、接口路径、数据库表字段、示例代码中保留。\n\n| 中文术语 | 含义 |\n| --- | --- |\n| Provider 适配器 | 统一适配各厂商 AI 模型 API 的接口层，提供模型列表、调用、分类等能力 |\n| Skills | 现有标准 AI 工具协议（LangChain Tools），DGOS 只管理和调用，不实现协议 |\n| MCP | Model Context Protocol（Anthropic），DGOS 连接 MCP 服务器，桥接工具调用 |\n| 应用模块 | 可热更新的独立功能单元，如 AI 工作台、无限画布、文件管理等 |\n| 统一设计系统 | 所有模块强制复用的主题、色彩、字体、间距和 UI 组件规范 |\n| 本地优先 | 默认完全离线可用，云端为可选增强，数据存储在本地 SQLite |\n| 局域网模式 | 一台电脑启动 DGOS 后，局域网内其他设备可通过浏览器访问使用 |\n| 发布门禁 | 某版本对外发布或进入下一版本前必须补齐的质量、安全、文档项 |\n| 模型分类标签 | 内置维护的模型能力标签，如 text-generation、image-generation 等 |\n\n## 4. PRD 文件索引\n\n| 版本 | 文件 | 版本目标 | 上线边界 |\n| --- | --- | --- | --- |\n| 总蓝图 | [产品蓝图.md](产品蓝图.md) | 描述完整产品愿景、使命、核心价值、用户角色和长期规划 | 不作为单个迭代的交付范围 |\n| 功能演进 | [功能演进矩阵.md](功能演进矩阵.md) | 按底层能力、应用模块、系统功能追踪跨版本增强 | 只聚合现有权威，不替代版本范围或实现状态 |\n| 全版本约束 | [全版本产品与交互约束.md](全版本产品与交互约束.md) | 所有版本必须遵守的产品和交互原则 | 硬约束，不得被单版本降低 |\n| V1 | [当前版本/V1-版本总览.md](当前版本/V1-版本总览.md) | 打通底层能力框架最小闭环 | Provider 框架、Skills/MCP 管理、模块系统、AI 工作台、系统设置、局域网协同 |\n| V2 | [后续版本/V2-画布系统.md](后续版本/V2-画布系统.md) | 提供无限画布核心能力 | 画布视口、基础节点、连线系统、节点执行、循环节点、工作流导出 |\n| V3 | [后续版本/V3-应用市场.md](后续版本/V3-应用市场.md) | 建立应用模块生态 | 应用浏览、安装、更新、开发者提交、人工审核、版本管理 |\n| V4 | [后续版本/V4-云端与协同.md](后续版本/V4-云端与协同.md) | 提供云端增强和实时协同 | 账号系统、官方 Provider、跨设备同步、实时协同编辑、冲突解决 |\n| V5 | [后续版本/V5-企业化.md](后续版本/V5-企业化.md) | 支持企业团队使用 | 组织管理、成员权限、企业 Provider、组织账单、审计日志 |\n| V6 | [后续版本/V6-移动端.md](后续版本/V6-移动端.md) | 扩展到移动平台 | iOS/Android 应用、移动端 UI 适配、离线同步 |\n| V7 | [后续版本/V7-AI-Agent.md](后续版本/V7-AI-Agent.md) | 提供 AI Agent 能力 | 自主任务执行、多 Agent 协作、工作流自动化 |\n| V8 | [后续版本/V8-开发者生态.md](后续版本/V8-开发者生态.md) | 完善开发者生态 | 开发者门户、文档中心、API 市场、SDK、示例库 |\n\n## 5. 跨版本范围决策\n\n### 5.1 V1 冻结决策\n\nV1 聚焦底层能力框架，不求功能完整，只求架构正确、可扩展。\n\n**核心能力（必须）**：\n- Provider 适配框架：统一接口、OpenAI 适配器、模型分类标签\n- Skills 管理：远程仓库连接、安装卸载、调用接口\n- MCP 管理：服务器连接、工具列表、调用桥接\n- 模块系统：Module Federation 动态加载、热更新、权限管理\n- 统一设计系统：主题系统、色彩规范、UI 组件库（10+ 组件）\n\n**基础应用（必须）**：\n- AI 工作台：简单对话、Provider 选择、历史记录\n- 系统设置：Provider 管理、Skills 管理、MCP 管理、模块管理\n\n**运行模式（必须）**：\n- 单机模式：SQLite 本地存储、完全离线可用\n- 局域网模式：HTTP 服务自动启动、简单认证、远程只读\n\n**明确不包含**：\n- ❌ 无限画布（V2）\n- ❌ 应用市场（V3）\n- ❌ 云端账号（V4）\n- ❌ 跨设备同步（V4）\n- ❌ 实时协同编辑（V4）\n- ❌ 组织管理（V5）\n- ❌ 移动端（V6）\n- ❌ Windows 支持（V1 先保证 macOS，Windows 作为 V1 发布门禁后首周补齐）\n\n**技术债务上限**：\n- 单个 Rust 文件不超过 1000 行（CI 检查）\n- 单个 TypeScript 组件不超过 500 行\n- 核心功能单元测试覆盖率 > 60%\n- 文档覆盖率 > 80%\n\n详见 [V1 冻结决策](../06-决策记录/V1-冻结决策.md) D001-D015。\n\n### 5.2 V1 发布门禁\n\nV1 功能完成后，正式发布前必须通过发布门禁。发布门禁不扩大 V1 主范围，只补齐上线安全项：\n\n**必须完成**：\n- [ ] 所有 P0 功能验收通过\n- [ ] 应用启动时间 < 2 秒\n- [ ] 模块加载时间 < 1 秒\n- [ ] API 响应时间（P95）< 200ms\n- [ ] 零 P0/P1 安全漏洞\n- [ ] 核心功能单元测试覆盖率 > 60%\n- [ ] 用户文档完成度 > 80%\n- [ ] 开发者文档完成度 > 80%\n- [ ] macOS 安装包构建成功\n- [ ] 安装测试通过（全新环境）\n\n**可延后但需记录**：\n- Windows 支持（发布门禁后首周补齐）\n- Linux 支持（V2）\n- 性能监控系统（V2）\n- 完整的崩溃报告（V2）\n\n### 5.3 画布系统边界\n\n无限画布是 DGOS 的核心价值功能，但复杂度高，单独作为 V2 完整交付：\n\n**V2 画布系统（完整版本）**：\n- 画布视口（缩放、拖拽、平移）\n- 完整节点类型（10+ 种：Image、Prompt、LLM、Generator、Loop、Conditional、Transform、Function 等）\n- LLM 节点可选择 Skills\n- 节点连线系统\n- 实时执行（用户操作立即执行）\n- 循环节点（LoopNode）\n- 工作流 JSON 格式定义\n- 工作流导入导出\n- 布局算法（自动排版）\n- 工作流模板库\n\n**从老项目学习**：\n- ✅ 保留交互体验（拖拽手感、连线交互）\n- ✅ 保留节点类型设计（经过验证的节点类型）\n- ✅ 兼容老项目工作流格式（可选，便于用户迁移）\n- ❌ 不复制单体架构（避免单文件巨石）\n- ❌ 不复制耦合设计（画布独立模块）\n\n**V2 不拆分子版本**：画布系统作为一个完整版本交付，内部可以分阶段开发，但对外只有一个 V2。\n\n### 5.4 应用市场边界\n\n应用市场让第三方开发者发布模块，作为 V3 完整交付：\n\n**V3 应用市场（完整版本）**：\n- 应用浏览（分类、搜索、筛选）\n- 应用详情（截图、描述、评分、评论）\n- 应用安装（从市场下载）\n- 应用更新（自动推送、手动确认）\n- 应用卸载\n- 开发者提交（表单、资料、截图）\n- 人工审核流程（审核队列、审核标准）\n- 版本管理（多版本共存、回滚）\n- 评分评论系统\n- 下载统计\n\n**市场模式**：\n- 中心化（官方服务器）\n- 必须登录云端账号\n- 人工审核（V3），自动化检查（V4+）\n- V3 全部免费，V4+ 支持付费\n\n**V3 不拆分子版本**：应用市场作为一个完整版本交付。\n\n### 5.5 云端与协同边界\n\n云端功能为可选增强，不影响本地优先原则，作为 V4 完整交付：\n\n**V4 云端与协同（完整版本）**：\n- 账号系统（注册、登录、个人资料）\n- 官方 Provider（积分制、按 token/张/秒计费）\n- 跨设备数据同步（选择性同步）\n- 实时协同编辑（画布、工作流）\n- 指针显示和锁机制\n- CRDT/OT 冲突解决\n- 充值支付系统\n- 用量统计和账单\n\n**协同细节**：\n- A 用户移动节点，B 用户实时看到\n- 显示其他用户指针（带用户标记）\n- 编辑节点时锁定，其他用户只读\n- 冲突自动合并或提示用户选择\n\n### 5.6 企业化边界\n\n企业功能服务团队和组织，作为 V5 完整交付：\n\n**V5 企业化（完整版本）**：\n- 组织管理（创建组织、组织设置）\n- 成员管理（邀请成员、角色权限）\n- 组织 Provider（组织级别配置）\n- 项目管理（组织内项目分组）\n- 企业账单（组织用量统计）\n- 审计日志（操作记录、合规审计）\n\n**不做的企业功能**：\n- 企业 SSO（V6+）\n- 细粒度 RBAC（V6+）\n- 私有化部署（V7+）\n\n### 5.7 移动端边界\n\n移动端扩展到 iOS 和 Android 平台，作为 V6 完整交付：\n\n**V6 移动端（完整版本）**：\n- iOS 应用（Swift/SwiftUI）\n- Android 应用（Kotlin/Jetpack Compose）\n- 移动端 UI 适配\n- 触摸手势优化\n- 离线同步\n- 推送通知\n\n**依赖**：V4 云端同步必须稳定，否则移动端数据无法同步。\n\n## 6. 版本主链路\n\n```\nV1 (3个月)       底层框架 + 基础应用\n    ↓\nV2 (2个月)       画布系统（完整）\n    ↓\nV3 (2个月)       应用市场（完整）\n    ↓\nV4 (3个月)       云端与协同（完整）\n    ↓\nV5 (3个月)       企业化（完整）\n    ↓\nV6 (3个月)       移动端（完整）\n    ↓\nV7 (4个月)       AI Agent（完整）\n    ↓\nV8 (持续)        开发者生态（持续完善）\n```\n\n**总计时间线**：\n- V1-V3：约 7 个月（第一年）\n- V4-V5：约 6 个月（第二年上半年）\n- V6-V8：持续迭代（第二年下半年+）\n\n## 7. 跨版本依赖与进入条件\n\n| 进入阶段 | 必须已经稳定的底座 | 本阶段解锁的能力 | 缺失时的阻塞 |\n| --- | --- | --- | --- |\n| V1 对外发布 | Provider 框架、Skills/MCP 管理、模块系统、基础应用、通过发布门禁 | 最小可用框架正式开放 | 不得扩大用户开放或进入 V2 |\n| V2 画布系统 | V1 稳定，模块系统验证通过 | 画布视口、完整节点、工作流 | 模块系统不稳定会导致画布无法独立开发 |\n| V3 应用市场 | V1 模块系统稳定 | 应用浏览、安装、提交、审核 | 模块加载不稳定会导致应用市场不可用 |\n| V4 云端与协同 | V2 画布稳定，V3 应用市场稳定 | 账号系统、跨设备同步、实时协同 | 本地功能不稳定会导致同步冲突频繁 |\n| V5 企业化 | V4 账号系统稳定 | 组织管理、成员权限、企业账单 | 账号系统不稳定会导致权限混乱 |\n| V6 移动端 | V4 云端同步稳定 | iOS/Android 应用 | 云端同步不稳定会导致移动端数据丢失 |\n| V7 AI Agent | V2 画布稳定，V4 云端稳定 | 自主任务、多 Agent 协作 | 画布和云端不稳定会影响 Agent 执行 |\n| V8 开发者生态 | V3 应用市场稳定，V4 云端稳定 | 开发者门户、API 市场 | 市场和云端不稳定会影响生态建设 |\n\n### 7.1 门禁依赖图\n\n```\nV1 (底层框架)\n    ├── V2 (画布系统)\n    │   └── V7 (AI Agent)\n    ├── V3 (应用市场)\n    │   └── V8 (开发者生态)\n    └── V4 (云端与协同)\n        ├── V5 (企业化)\n        ├── V6 (移动端)\n        └── V7 (AI Agent)\n```\n\n## 8. 研发推进建议\n\n### 8.1 V1 最小 MVP\n\n先冻结并交付 V1，通过发布门禁后再进入 V2。\n\n**理由**：Provider 框架、Skills/MCP 管理、模块系统是所有后续功能的共同底座。如果 V1 的架构、接口、数据模型不稳定，后续版本会产生较高返工成本。\n\n**V1 开发节奏**（12 周）：\n```\nWeek 1-2:   核心框架骨架（Tauri + Rust + React）\nWeek 3-4:   Provider 框架（OpenAI 适配器）\nWeek 5-6:   Skills/MCP 管理（连接、调用）\nWeek 7-8:   模块系统（Module Federation）\nWeek 9-10:  基础应用（AI 工作台、系统设置）\nWeek 11:    局域网模式（HTTP 服务、认证）\nWeek 12:    测试、文档、发布准备\n```\n\n### 8.2 V2 画布系统完整交付\n\nV2 作为独立版本交付画布完整功能，不拆分子版本。\n\n**理由**：画布是核心价值，拆分会导致用户体验不完整。一次性交付完整画布系统，用户可以立即获得完整价值。\n\n**V2 开发节奏**（8 周）：\n```\nWeek 1-2:   画布视口、基础节点（5 种）\nWeek 3-4:   完整节点（10+ 种）、实时执行\nWeek 5-6:   循环节点、工作流导入导出\nWeek 7-8:   测试、优化、文档\n```\n\n### 8.3 V3-V8 滚动推进\n\nV3 到 V8 按版本顺序滚动推进，每个版本独立立项、独立验收、独立发布。\n\n**原则**：\n- 不允许两个大版本并行开发\n- 每个版本通过发布门禁后才进入下一版本\n- 紧急 Bug 修复不占用版本号\n\n## 9. 维护规则\n\n1. 新增或调整版本范围时，先修改本文档，再同步版本 PRD 和功能规格。\n2. V1 功能使用稳定编号（V1-FR-001 到 V1-FR-010）；V2+ 功能在通过版本进入开发门禁前不分配正式编号。\n3. 版本范围迁移必须同时标注原位置、目标位置和历史材料角色，避免两个版本同时宣称同一范围。\n4. 当前完成度只链接实现状态和执行证据，不用路线图或演进矩阵替代验证。\n5. 图表只可视化本文档已有事实；调整图中版本、状态或依赖时，必须同步对应表格。\n6. 新增功能或调整主责能力时，必须同步[功能演进矩阵](功能演进矩阵.md)。\n\n## 10. 风险与应对\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| V1 时间估算不准 | 高 | 高 | 每周回顾，及时调整范围；保持 MVP 最小化 |\n| V2 画布功能范围蔓延 | 中 | 中 | 严格按版本边界开发；完整功能列表冻结 |\n| V3 应用市场安全问题 | 中 | 高 | 人工审核；代码扫描；安全测试 |\n| V4 协同编辑冲突频繁 | 中 | 中 | 完善冲突解决；用户测试；逐步放量 |\n| 团队规模不足 | 高 | 高 | 优先交付 V1-V2；后续版本根据团队规模调整 |\n\n## 11. 后续规划\n\nV8 之后的版本规划将根据以下因素动态调整：\n- 用户反馈和需求优先级\n- 技术发展趋势\n- 竞品动态\n- 团队规模和能力\n\n可能的后续方向：\n- V9：多语言支持\n- V10：插件市场（不同于应用市场，更轻量）\n- V11：嵌入式版本（可嵌入其他应用）\n- V12：完全分布式（P2P 协同）\n\n---\n\n**最后更新**：2024-01-XX  \n**更新人**：Kiro  \n**状态**：Active  \n**版本**：v1.0\n", "doc-012": "# 版本进入开发门禁\n\n## 1. 文档目标\n\n本文档定义版本进入开发阶段的**强制门禁条件**，确保开发前规格已充分收敛，避免边开发边改需求导致的返工。\n\n**权威性**：\n- ✅ 版本开发的唯一门禁标准\n- ✅ 所有门禁条件必须通过才能开始开发\n- ✅ 门禁结果作为项目管理决策依据\n\n**适用范围**：\n- 所有版本（V1、V2、V3...）在进入开发前必须通过门禁检查\n- 门禁通过后，需求冻结，只能通过变更流程修改\n\n---\n\n## 2. 12 项门禁条件\n\n### 2.1 范围冻结\n\n**条件**：版本总览文档已完成，交付范围明确冻结\n\n**检查标准**：\n- ✅ 存在 `02-产品与版本/当前版本/VX-版本总览.md`\n- ✅ 明确列出\"包含功能\"和\"不包含功能\"\n- ✅ 定义了验收标准和发布门禁\n\n**为什么重要**：\n范围不冻结，开发过程中随意增删功能，导致进度失控。\n\n---\n\n### 2.2 稳定编号\n\n**条件**：所有功能使用稳定的功能编号（VX-FR-XXX）\n\n**检查标准**：\n- ✅ 所有功能规格使用格式：`V1-FR-001`、`V1-FR-002`...\n- ✅ 编号一旦分配，永不改变、永不复用\n- ✅ 所有文档引用功能时使用编号\n\n**为什么重要**：\n稳定编号是追踪链路的基础，编号变化会破坏追踪关系。\n\n---\n\n### 2.3 架构设计\n\n**条件**：总体架构文档已完成\n\n**检查标准**：\n- ✅ 存在 `04-技术架构/总体架构.md`\n- ✅ 定义了技术栈、分层架构、模块划分\n- ✅ 明确了技术选型和架构决策\n\n**为什么重要**：\n架构不清晰，开发过程中频繁重构，浪费时间。\n\n---\n\n### 2.4 API 契约\n\n**条件**：接口契约文档已完成\n\n**检查标准**：\n- ✅ 存在 `04-技术架构/当前版本/VX-接口契约.md`\n- ✅ 定义了所有 Tauri Commands\n- ✅ 定义了所有 HTTP API（如有）\n- ✅ 明确了请求/响应格式、错误码\n\n**为什么重要**：\n接口不明确，前后端无法并行开发，频繁扯皮。\n\n---\n\n### 2.5 数据模型\n\n**条件**：数据模型文档已完成\n\n**检查标准**：\n- ✅ 存在 `04-技术架构/当前版本/VX-数据模型.md`\n- ✅ 定义了所有数据表、字段、约束\n- ✅ 明确了表关系、索引、迁移策略\n\n**为什么重要**：\n数据模型不稳定，开发过程中频繁迁移数据库，影响进度。\n\n---\n\n### 2.6 功能规格\n\n**条件**：所有功能规格文档已完成\n\n**检查标准**：\n- ✅ 所有功能都有独立的功能规格文档\n- ✅ 每个功能规格包含：\n  - 功能概述（一句话描述、详细说明、功能边界）\n  - 核心流程（3-5 个关键流程）\n  - 数据模型（涉及的表）\n  - AC 逐项测试设计表\n  - 接口设计\n  - 错误码设计\n\n**为什么重要**：\n功能规格不完整，开发过程中频繁澄清需求，进度拖延。\n\n---\n\n### 2.7 技术设计\n\n**条件**：关键功能有详细的技术设计（分支追踪 ID）\n\n**检查标准**：\n- ✅ 高风险功能有详细的技术设计伪代码\n- ✅ 关键分支标注了分支 ID（B01-01、B01-02...）\n- ✅ 有\"分支到测试追踪表\"\n\n**为什么重要**：\n高风险功能设计不清晰，容易出现并发、原子性、幂等性问题。\n\n---\n\n### 2.8 测试矩阵\n\n**条件**：每个功能有 AC 逐项测试设计表\n\n**检查标准**：\n- ✅ 每个功能规格包含\"AC 逐项测试设计表\"\n- ✅ 每个 AC 映射到：测试层级、目标资产、目标命令\n- ✅ 明确了初始资产状态（规划中 / 已实现）\n\n**为什么重要**：\n测试计划不明确，开发完成后不知道如何验证。\n\n---\n\n### 2.9 需求追踪\n\n**条件**：存在需求追踪矩阵\n\n**检查标准**：\n- ✅ 存在 `03-功能规格/VX/00-VX需求追踪矩阵.md`\n- ✅ 追踪矩阵包含：功能 → AC → 分支 → 测试的完整链路\n- ✅ 统计了 AC 总数、分支总数、E2E 场景数\n\n**为什么重要**：\n没有追踪矩阵，需求和实现脱节，验收困难。\n\n---\n\n### 2.10 验收标准\n\n**条件**：每个功能有明确的 AC（验收标准）\n\n**检查标准**：\n- ✅ 每个功能至少有 5 个 AC\n- ✅ 每个 AC 使用 Given/When/Then 格式\n- ✅ AC 可执行、可验证\n\n**为什么重要**：\n验收标准不明确，完成后无法判断是否满足需求。\n\n---\n\n### 2.11 文档浏览器\n\n**条件**：生成了文档浏览器\n\n**检查标准**：\n- ✅ 存在 `90-参考资料/产品文档浏览器.html`（或增强版）\n- ✅ 可以通过浏览器访问所有文档\n- ✅ 支持搜索和导航\n\n**为什么重要**：\n文档散落，开发过程中查找困难，降低效率。\n\n---\n\n### 2.12 决策记录\n\n**条件**：重要决策已记录\n\n**检查标准**：\n- ✅ 存在 `06-决策记录/VX-冻结决策.md`\n- ✅ 记录了至少 5 个关键决策（技术选型、架构决策等）\n- ✅ 每个决策包含：背景、决策内容、理由\n\n**为什么重要**：\n决策不记录，后期忘记为什么这样设计，容易推翻重来。\n\n---\n\n## 3. V1 门禁检查结果\n\n**检查时间**：2024-10-26  \n**检查人**：Kiro  \n**检查版本**：V1\n\n### 3.1 检查结果总览\n\n| 门禁条件 | 状态 | 证据 |\n|---------|------|------|\n| 1. 范围冻结 | ✅ 通过 | `V1-版本总览.md` 存在，范围明确 |\n| 2. 稳定编号 | ✅ 通过 | 所有功能使用 V1-FR-XXX 编号 |\n| 3. 架构设计 | ✅ 通过 | `总体架构.md` 存在 |\n| 4. API 契约 | ✅ 通过 | `V1-接口契约.md` 存在，定义 40+ 接口 |\n| 5. 数据模型 | ✅ 通过 | `V1-数据模型.md` 存在，定义 23 张表 |\n| 6. 功能规格 | ✅ 通过 | 10 个功能规格文档，共 255KB |\n| 7. 技术设计 | ✅ 通过 | 162 个分支追踪 ID，有分支追踪表 |\n| 8. 测试矩阵 | ✅ 通过 | 所有功能有 AC 逐项测试设计表 |\n| 9. 需求追踪 | ✅ 通过 | `V1需求追踪矩阵.md` 存在 |\n| 10. 验收标准 | ✅ 通过 | 136 条 AC，所有 AC 可执行 |\n| 11. 文档浏览器 | ✅ 通过 | 增强版浏览器已生成 |\n| 12. 决策记录 | ✅ 通过 | `V1-冻结决策.md` 存在，10 个决策 |\n\n**通过率**：✅ **12/12（100%）**\n\n### 3.2 详细检查记录\n\n#### ✅ 1. 范围冻结\n- 文档：`02-产品与版本/当前版本/V1-版本总览.md`\n- 大小：20KB\n- 包含功能：10 个（V1-FR-001 ~ V1-FR-010）\n- 不包含功能：明确列出（无限画布、应用市场等）\n- **结论**：范围冻结清晰\n\n#### ✅ 2. 稳定编号\n- 编号格式：V1-FR-001 ~ V1-FR-010\n- 编号分配：连续、无跳号\n- 引用一致性：所有文档引用统一使用编号\n- **结论**：编号稳定\n\n#### ✅ 3. 架构设计\n- 文档：`04-技术架构/总体架构.md`\n- 大小：11KB\n- 内容：技术栈、分层架构、模块划分\n- **结论**：架构清晰\n\n#### ✅ 4. API 契约\n- 文档：`04-技术架构/当前版本/V1-接口契约.md`\n- 大小：28KB\n- Tauri Commands：40+ 个\n- HTTP API：完整定义（局域网模式）\n- 错误响应格式：统一定义\n- **结论**：接口契约完整\n\n#### ✅ 5. 数据模型\n- 文档：`04-技术架构/当前版本/V1-数据模型.md`\n- 大小：36KB\n- 数据表：23 张\n- ERD：完整的实体关系图\n- 迁移策略：明确定义\n- **结论**：数据模型完整\n\n#### ✅ 6. 功能规格\n- 文档数量：10 个\n- 总大小：255KB\n- 平均大小：25.5KB/个\n- 包含章节：功能概述、核心流程、数据模型、AC、接口、错误码\n- **结论**：功能规格完整\n\n#### ✅ 7. 技术设计\n- 分支追踪 ID：162 个\n- 分支追踪表：所有功能都有\n- 高风险功能：V1-FR-004、V1-FR-009 有详细设计\n- **结论**：技术设计充分\n\n#### ✅ 8. 测试矩阵\n- AC 逐项测试设计表：10 个功能都有\n- 测试层级：单元测试、集成测试、E2E\n- 目标资产：明确的测试文件路径\n- 目标命令：可执行的测试命令\n- **结论**：测试矩阵完整\n\n#### ✅ 9. 需求追踪\n- 文档：`03-功能规格/V1/00-V1需求追踪矩阵.md`\n- 大小：22KB\n- 追踪链路：功能 → AC → 分支 → 测试\n- 统计信息：136 条 AC，162 个分支，10 个 E2E 场景\n- **结论**：需求追踪完整\n\n#### ✅ 10. 验收标准\n- AC 总数：136 条\n- 平均每功能：13.6 条\n- 格式：Given/When/Then\n- 可执行性：所有 AC 映射到测试\n- **结论**：验收标准明确\n\n#### ✅ 11. 文档浏览器\n- 文档：`90-参考资料/产品文档浏览器-增强版.html`\n- 大小：592KB\n- 功能：搜索、导航、元数据展示\n- 可用性：单文件，离线可用\n- **结论**：文档浏览器可用\n\n#### ✅ 12. 决策记录\n- 文档：`06-决策记录/V1-冻结决策.md`\n- 大小：16KB\n- 决策数量：10 个\n- 内容：技术选型（Rust、SQLite、React）、架构决策\n- **结论**：决策记录完整\n\n---\n\n## 4. 门禁结论\n\n### 4.1 V1 门禁状态\n\n🎉 **V1 通过开发门禁，可以进入开发阶段！**\n\n**通过时间**：2024-10-26  \n**通过率**：100%（12/12）  \n**文档完成度**：444KB 高质量设计文档\n\n### 4.2 建议\n\n虽然门禁全部通过，但建议：\n\n1. **优先实现顺序**：\n   - Week 1-2：用户管理（V1-FR-008，无依赖）\n   - Week 3-4：Provider 适配（V1-FR-001）\n   - Week 5-6：Skills + MCP（V1-FR-002、V1-FR-003）\n\n2. **高风险功能重点关注**：\n   - V1-FR-004（模块系统）：热更新、隔离、崩溃恢复\n   - V1-FR-009（权限管理）：权限检查、拦截、日志\n\n3. **边开发边更新**：\n   - 发现设计问题 → 记录到\"V1-冻结决策\"\n   - 实现完成 → 更新\"V1-实现状态\"\n   - 测试通过 → 更新验证证据\n\n---\n\n## 5. 门禁变更流程\n\n### 5.1 如果门禁不通过怎么办？\n\n**不通过的条件**：任何一项门禁条件未满足\n\n**处理流程**：\n1. 列出未通过的门禁条件\n2. 分析原因和影响\n3. 制定补齐计划\n4. 补齐后重新检查\n5. 通过后才能开发\n\n### 5.2 门禁通过后需求变更怎么办？\n\n**原则**：需求冻结，变更需要走流程\n\n**变更流程**：\n1. 提出变更申请（背景、内容、影响）\n2. 评估影响范围（文档、代码、测试）\n3. 决策：接受 / 拒绝 / 延后到下个版本\n4. 如果接受：\n   - 更新受影响的文档\n   - 记录到\"冻结决策\"\n   - 通知所有相关人员\n5. 如果拒绝：记录原因，可能在下个版本做\n\n---\n\n## 6. 使用说明\n\n### 6.1 如何检查门禁\n\n**手动检查**：\n```bash\ncd docs\n# 逐项检查 12 个条件\n```\n\n**自动检查**（可选，未来实现）：\n```bash\nnode scripts/check-gate.mjs V1\n```\n\n### 6.2 如何记录检查结果\n\n在本文档的\"第 3 节：VX 门禁检查结果\"中记录。\n\n---\n\n## 7. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n|------|---------|--------|\n| 2024-10-26 | 初始版本，定义 12 项门禁条件 | Kiro |\n| 2024-10-26 | 检查 V1 门禁，12/12 通过 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成  \n**V1 门禁状态**：✅ 通过（100%）  \n**下一步**：开始 V1 开发\n", "doc-013": "# 功能规格导航\n\n- [功能开发流程](功能开发流程.md)：从范围确认到实现、验证和回写的完整流程。\n- [功能文档规范](功能文档规范.md)：功能主文档的章节、状态和维护规则。\n- [V1 功能规格索引](V1/README.md)：按底层能力、应用模块和系统功能查找功能。\n- [V1 稳定需求编号](V1/00-V1需求编号.md)：功能、非功能和发布门禁的稳定 ID。\n- [V1 需求追踪矩阵](V1/00-V1需求追踪矩阵.md)：需求到功能、接口、数据与验收的映射。\n\n每个 V1 功能只维护一份中文主文档；核心系统功能额外维护一份同名\"系统设计\"文档。\n", "doc-014": "# V1 需求编号管理\n\n本文档管理 DGOS V1 版本的所有需求编号，确保编号的稳定性和可追溯性。\n\n---\n\n## 1. 编号规则\n\n### 1.1 功能需求编号\n\n**格式**：`V1-FR-XXX`\n\n- `V1`：版本号\n- `FR`：Feature Requirement（功能需求）\n- `XXX`：三位数字，从 001 开始\n\n**示例**：\n- `V1-FR-001`：Provider 适配框架\n- `V1-FR-002`：Skills 管理系统\n- `V1-FR-010`：局域网协同\n\n### 1.2 非功能需求编号\n\n**格式**：`V1-NFR-XXX`\n\n- `NFR`：Non-Functional Requirement（非功能需求）\n\n**示例**：\n- `V1-NFR-001`：启动时间 < 2 秒\n- `V1-NFR-002`：API 响应时间 P95 < 200ms\n\n### 1.3 E2E 测试编号\n\n**格式**：`V1-E2E-XXX`\n\n**示例**：\n- `V1-E2E-01`：完整的 Provider 配置流程\n- `V1-E2E-02`：完整的 Skill 安装和调用流程\n\n---\n\n## 2. 编号稳定性原则\n\n### 2.1 永不改变\n\n编号一旦分配，**永远不改变**，即使：\n- 功能名称修改\n- 功能被取消\n- 文档被移动\n\n### 2.2 永不复用\n\n即使功能被取消，编号也**永不复用**。\n\n### 2.3 跳号允许\n\n如果某个功能取消，编号可以跳号。例如：\n- V1-FR-001：Provider 适配框架 ✅\n- V1-FR-002：Skills 管理系统 ✅\n- V1-FR-003：~~画布编辑器~~（取消，移到 V1.2）\n- V1-FR-004：模块系统 ✅\n\n---\n\n## 3. V1 功能需求编号清单\n\n### 3.1 底层能力（01-底层能力/）\n\n| 编号 | 功能名称 | 优先级 | 状态 | 负责人 | 文档 |\n|------|---------|--------|------|--------|------|\n| V1-FR-001 | Provider 适配框架 | P0 | ✅ 规格完成 | TBD | [01-Provider适配框架.md](V1/01-底层能力/01-Provider适配框架.md) |\n| V1-FR-002 | Skills 管理系统 | P0 | ✅ 规格完成 | TBD | [02-Skills管理系统.md](V1/01-底层能力/02-Skills管理系统.md) |\n| V1-FR-003 | MCP 管理系统 | P0 | ✅ 规格完成 | TBD | [03-MCP管理系统.md](V1/01-底层能力/03-MCP管理系统.md) |\n| V1-FR-004 | 模块系统与热更新 | P0 | ✅ 规格完成 | TBD | [04-模块系统与热更新.md](V1/01-底层能力/04-模块系统与热更新.md) |\n| V1-FR-005 | 统一设计系统 | P0 | ✅ 规格完成 | TBD | [05-统一设计系统.md](V1/01-底层能力/05-统一设计系统.md) |\n\n### 3.2 应用模块（02-应用模块/）\n\n| 编号 | 功能名称 | 优先级 | 状态 | 负责人 | 文档 |\n|------|---------|--------|------|--------|------|\n| V1-FR-006 | AI 工作台 | P0 | ✅ 规格完成 | TBD | [01-AI工作台.md](V1/02-应用模块/01-AI工作台.md) |\n| V1-FR-007 | 系统设置 | P0 | ✅ 规格完成 | TBD | [02-系统设置.md](V1/02-应用模块/02-系统设置.md) |\n\n### 3.3 系统功能（03-系统功能/）\n\n| 编号 | 功能名称 | 优先级 | 状态 | 负责人 | 文档 |\n|------|---------|--------|------|--------|------|\n| V1-FR-008 | 本地用户管理 | P0 | ✅ 规格完成 | TBD | [01-本地用户管理.md](V1/03-系统功能/01-本地用户管理.md) |\n| V1-FR-009 | 模块权限管理 | P0 | ✅ 规格完成 | TBD | [02-模块权限管理.md](V1/03-系统功能/02-模块权限管理.md) |\n| V1-FR-010 | 局域网协同 | P0 | ✅ 规格完成 | TBD | [03-局域网协同.md](V1/03-系统功能/03-局域网协同.md) |\n\n### 3.4 保留编号（未来使用）\n\n| 编号 | 用途 | 说明 |\n|------|------|------|\n| V1-FR-011 ~ 020 | 新功能 | 预留给 V1 可能新增的功能 |\n\n---\n\n## 4. V1 非功能需求编号清单\n\n| 编号 | 需求名称 | 指标 | 状态 | 文档 |\n|------|---------|------|------|------|\n| V1-NFR-001 | 应用启动时间 | < 2 秒 | 规划中 | [V1-产品需求.md](../../02-产品与版本/当前版本/V1-产品需求.md#10-验收标准) |\n| V1-NFR-002 | API 响应时间 | P95 < 200ms | 规划中 | 同上 |\n| V1-NFR-003 | 模块加载时间 | < 1 秒 | 规划中 | 同上 |\n| V1-NFR-004 | UI 交互帧率 | > 60fps | 规划中 | 同上 |\n| V1-NFR-005 | 内存占用（空闲） | < 200MB | 规划中 | 同上 |\n\n---\n\n## 5. V1 E2E 测试编号清单\n\n| 编号 | 测试名称 | 覆盖功能 | 状态 | 测试资产 |\n|------|---------|---------|------|---------|\n| V1-E2E-01 | 完整 Provider 配置流程 | V1-FR-001 | 规划中 | `tests/e2e/provider_management.spec.ts` |\n| V1-E2E-02 | 完整 Skill 安装和调用流程 | V1-FR-002 | 规划中 | `tests/e2e/skills_workflow.spec.ts` |\n| V1-E2E-03 | 完整 MCP 连接和调用流程 | V1-FR-003 | 规划中 | `tests/e2e/mcp_workflow.spec.ts` |\n| V1-E2E-04 | 模块热重载流程 | V1-FR-004 | 规划中 | `tests/e2e/module_reload.spec.ts` |\n| V1-E2E-05 | AI 工作台对话流程 | V1-FR-006 | 规划中 | `tests/e2e/workbench_chat.spec.ts` |\n| V1-E2E-06 | 局域网协同流程 | V1-FR-010 | 规划中 | `tests/e2e/lan_collaboration.spec.ts` |\n\n---\n\n## 6. 编号分配流程\n\n### 6.1 申请新编号\n\n**步骤**：\n1. 查看本文档，找到下一个可用编号\n2. 在对应表格中添加一行\n3. 创建功能规格文档\n4. 提交 PR，包含本文档的更新\n\n**示例**：\n```markdown\n| V1-FR-011 | 新功能名称 | P1 | 规划中 | @developer | [文档链接] |\n```\n\n### 6.2 编号冲突\n\n如果多个 PR 同时申请编号导致冲突：\n1. 先合并的 PR 保留编号\n2. 后合并的 PR 使用下一个编号\n3. 更新本文档\n\n---\n\n## 7. 功能状态定义\n\n| 状态 | 说明 | 下一步 |\n|------|------|--------|\n| **规划中** | 需求已提出，待创建规格 | 创建功能规格文档 |\n| **✅ 规格完成** | 功能规格文档已完成 | 评审通过后进入开发 |\n| **开发中** | 正在开发实现 | 完成开发和测试 |\n| **测试中** | 开发完成，正在测试 | 通过所有测试 |\n| **✅ 已完成** | 测试通过，已交付 | 部署上线 |\n| **❌ 已取消** | 功能取消 | 归档文档 |\n\n---\n\n## 8. 编号变更历史\n\n### 8.1 V1.0 初始分配\n\n**日期**：2026-10-26\n\n**分配编号**：\n- V1-FR-001 ~ 010：10 个 P0 功能\n- V1-NFR-001 ~ 005：5 个性能指标\n- V1-E2E-01 ~ 06：6 个 E2E 测试\n\n### 8.2 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n|------|---------|--------|\n| 2026-10-26 | 初始版本，分配 V1-FR-001 ~ 010 | @developer |\n\n---\n\n## 9. 跨版本编号\n\n### 9.1 V2 编号预留\n\nV2 版本将使用新的编号系列：\n- `V2-FR-001`：画布核心\n- `V2-FR-002`：画布节点系统\n- ...\n\n**不混用版本编号**：V1 和 V2 的编号完全独立。\n\n### 9.2 跨版本功能\n\n如果一个功能跨多个版本实现：\n- V1：`V1-FR-001` Provider 适配框架（OpenAI 兼容）\n- V1.1：`V1.1-FR-001` Provider 适配框架增强（Claude、Gemini）\n- V2：如果有新的 Provider 架构，使用 `V2-FR-XXX`\n\n---\n\n## 10. 查询与统计\n\n### 10.1 按状态统计\n\n当前 V1 功能统计：\n- 规格完成：10 个\n- 开发中：0 个\n- 已完成：0 个\n- 已取消：0 个\n\n### 10.2 按优先级统计\n\n- P0（必须）：10 个\n- P1（重要）：0 个\n- P2（可选）：0 个\n\n### 10.3 按领域统计\n\n- 底层能力：5 个\n- 应用模块：2 个\n- 系统功能：3 个\n\n---\n\n## 11. 常见问题\n\n### Q1: 编号可以修改吗？\n\n**A**: 不可以。编号一旦分配，永远不变。\n\n### Q2: 功能取消后编号怎么办？\n\n**A**: 保留编号，标记为\"已取消\"，永不复用。\n\n### Q3: 编号跳号怎么办？\n\n**A**: 允许跳号。例如 FR-001、FR-002、FR-004（FR-003 被取消）。\n\n### Q4: 如何避免编号冲突？\n\n**A**: PR 提交前查看最新的本文档，使用下一个可用编号。\n\n### Q5: 功能名称变了怎么办？\n\n**A**: 更新功能规格文档和本文档的\"功能名称\"列，编号不变。\n\n---\n\n## 12. 相关文档\n\n- [功能开发流程](功能开发流程.md)\n- [功能文档规范](功能文档规范.md)\n- [V1 版本总览](../../02-产品与版本/当前版本/V1-版本总览.md)\n- [V1 实现状态](../../02-产品与版本/当前版本/V1-实现状态.md)\n\n---\n\n**最后更新**：2026-10-26  \n**维护人**：开发团队  \n**更新频率**：每次分配新编号时更新\n", "doc-015": "# V1 需求追踪矩阵\n\n## 1. 文档目标\n\n本文档建立从产品需求到实现验证的完整追踪链路，确保每个需求都有明确的验收标准、技术实现和测试覆盖。\n\n**核心价值**：\n- ✅ **完整性检查**：确保没有遗漏的需求\n- ✅ **进度追踪**：一目了然查看实现状态\n- ✅ **测试覆盖**：确保每个 AC 都有对应测试\n- ✅ **变更影响分析**：快速定位受影响的测试\n\n**更新频率**：\n- 功能规格变更时同步更新\n- 实现状态每周五更新\n\n---\n\n## 2. 追踪链路示意\n\n```\n产品蓝图\n  ↓\n版本路线图（V1 交付范围）\n  ↓\n功能规格（V1-FR-001 ~ V1-FR-010）\n  ↓\n验收标准（AC01 ~ AC15）\n  ↓\n技术设计（分支 ID：B01-01 ~ B01-17）\n  ↓\n测试用例（单元测试、集成测试、E2E）\n  ↓\n验证证据（测试通过、性能达标）\n  ↓\n发布门禁（Ready to Ship）\n```\n\n---\n\n## 3. 功能级追踪表\n\n### 3.1 总览\n\n| 层级 | 功能数 | AC 总数 | 分支总数 | E2E 场景 | 实现进度 | 测试进度 |\n|------|--------|---------|---------|---------|---------|---------|\n| **底层能力** | 5 | 71 | ~85 | 5 | 0% 🔴 | 0% 🔴 |\n| **应用模块** | 2 | 29 | ~30 | 2 | 0% 🔴 | 0% 🔴 |\n| **系统功能** | 3 | 36 | ~47 | 3  | 🔴 |\n| E2E 测试 | 100%（10/10 场景） | 0% | 🔴 |\n\n### 6.2 测试命令汇总\n\n**后端测试**：\n```bash\n# 全部测试\ncargo test --workspace\n\n# 按包测试\ncargo test -p dgos-providers\ncargo test -p dgos-skills\ncargo test -p dgos-mcp\ncargo test -p dgos-modules\ncargo test -p dgos-auth\ncargo test -p dgos-permissions\ncargo test -p dgos-lan\n\n# 覆盖率\ncargo tarpaulin --workspace\n```\n\n**前端测试**：\n```bash\n# 全部测试\npnpm test\n\n# 按模块测试\npnpm test skills\npnpm test mcp\npnpm test modules\npnpm test design-system\npnpm test workbench\npnpm test settings\npnpm test auth\n\n# 覆盖率\npnpm test:coverage\n```\n\n**E2E 测试**：\n```bash\n# 全部 E2E\npnpm test:e2e\n\n# 单个场景\npnpm test:e2e provider\npnpm test:e2e skills\npnpm test:e2e chat\npnpm test:e2e lan\n```\n\n---\n\n## 7. 依赖关系\n\n### 7.1 功能依赖图\n\n```\nV1-FR-008（用户管理）\n    ↓\nV1-FR-001（Provider）\nV1-FR-002（Skills）\nV1-FR-003（MCP）\n    ↓\nV1-FR-005（设计系统）\n    ↓\nV1-FR-004（模块系统） ← 🔴 高风险\n    ↓\nV1-FR-009（权限管理） ← 🔴 高风险\n    ↓\nV1-FR-006（AI 工作台）\nV1-FR-007（系统设置）\n    ↓\nV1-FR-010（局域网协同）\n```\n\n### 7.2 建议实现顺序\n\n| 优先级 | 功能 | 理由 |\n|--------|------|------|\n| 1 | V1-FR-008（用户管理） | 无依赖，基础功能 |\n| 2 | V1-FR-001（Provider） | 核心能力 |\n| 3 | V1-FR-002（Skills） | 核心能力 |\n| 4 | V1-FR-003（MCP） | 核心能力 |\n| 5 | V1-FR-005（设计系统） | 应用层依赖 |\n| 6 | V1-FR-004（模块系统） | 高风险，需要时间 |\n| 7 | V1-FR-009（权限管理） | 高风险，依赖模块系统 |\n| 8 | V1-FR-006（AI 工作台） | 应用层 |\n| 9 | V1-FR-007（系统设置） | 应用层 |\n| 10 | V1-FR-010（局域网协同） | 增强功能 |\n\n---\n\n## 8. 状态更新记录\n\n| 日期 | 更新内容 | 更新人 |\n|------|---------|--------|\n| 2024-01-XX | 初始版本，创建追踪矩阵 | Kiro |\n\n---\n\n## 9. 使用说明\n\n### 9.1 查找测试资产\n\n```bash\n# 找到某个 AC 的测试文件\ngrep \"AC05\" docs/03-功能规格/V1/00-V1需求追踪矩阵.md\n\n# 运行某个功能的所有测试\ncargo test -p dgos-providers\npnpm test skills\n```\n\n### 9.2 更新状态\n\n当功能实现或测试通过时，更新对应的状态标记：\n- 🔴 未开始\n- 🟡 进行中\n- 🟢 已完成\n- ✅ 已验收\n\n### 9.3 变更影响分析\n\n当修改某个功能时，通过追踪矩阵找到：\n1. 受影响的 AC\n2. 需要更新的测试\n3. 相关的 E2E 场景\n\n---\n\n**文档状态**：✅ 已完成  \n**下次更新**：功能规格变更时同步更新\n", "doc-016": "# V1 功能规格补充说明\n\n本文档统一补充所有 V1 功能规格中需要强化的内容，避免重复编辑每个文档。\n\n## 1. 决策引用补充\n\n所有功能规格应在相关章节引用冻结决策。以下是映射关系：\n\n### 1.1 Provider 适配框架（V1-FR-001）\n\n**引用决策**：\n- **D001**（Rust + Tauri 技术栈）：影响实现语言和框架选择\n- **D012**（Provider 同类型多配置和排序机制）：影响 Provider 管理逻辑\n- 建议在\"业务规则\"章节补充：Provider 管理采用 D012 决策的排序机制\n\n### 1.2 Skills 管理系统（V1-FR-002）\n\n**引用决策**：\n- **D003**（不使用 QuickJS/Node.js 作为 Skills/MCP 运行时）：DGOS 只管理和调用，不执行\n- **D005**（Skills 和 MCP 使用现有标准协议）：使用 LangChain Tools 标准\n- 建议在\"功能边界\"章节补充：引用 D003 和 D005，说明为什么不嵌入运行时\n\n### 1.3 MCP 管理系统（V1-FR-003）\n\n**引用决策**：\n- **D003**（不使用 QuickJS/Node.js 作为 Skills/MCP 运行时）\n- **D005**（Skills 和 MCP 使用现有标准协议）：使用 Anthropic Model Context Protocol\n- **D013**（局域网协同需要简单认证和实时状态显示）：MCP 连接状态需要心跳检测\n- 建议在\"核心流程\"章节补充：WebSocket 心跳机制遵循 D013\n\n### 1.4 模块系统与热更新（V1-FR-004）\n\n**引用决策**：\n- **D004**（使用 Module Federation 实现模块热更新）：技术选型依据\n- **D006**（权限模型采用粗粒度模块级权限）：权限设计依据\n- **D008**（所有模块强制使用统一设计系统）：模块审核标准\n- 建议在\"权限模型\"章节详细说明 D006 的 6 种权限类型\n\n### 1.5 统一设计系统（V1-FR-005）\n\n**引用决策**：\n- **D008**（所有模块强制使用统一设计系统）：整个功能的核心决策\n- 建议在\"功能概述\"章节补充：此功能实现 D008 决策，确保视觉一致性\n\n### 1.6 AI 工作台（V1-FR-006）\n\n**引用决策**：\n- **D005**（Skills 是可选增强）：Skills 选择是可选的，不是必须的\n- 建议在\"核心流程\"章节补充：Skills 调用失败不阻塞 LLM 调用（D005）\n\n### 1.7 系统设置（V1-FR-007）\n\n**引用决策**：\n- 无特定决策，但需要集成所有其他功能的配置界面\n\n### 1.8 本地用户管理（V1-FR-008）\n\n**引用决策**：\n- **D002**（使用 SQLite 而非 PostgreSQL）：影响数据隔离实现\n- 建议在\"数据隔离\"章节补充：基于 SQLite 单文件的用户数据隔离（D002）\n\n### 1.9 模块权限管理（V1-FR-009）\n\n**引用决策**：\n- **D006**（权限模型采用粗粒度模块级权限）：核心决策\n- 建议在\"权限设计\"章节详细展开 D006 的 6 种权限类型及授权流程\n\n### 1.10 局域网协同（V1-FR-010）\n\n**引用决策**：\n- **D007**（局域网 HTTP 服务始终开启）：服务启动策略\n- **D013**（局域网协同需要简单认证和实时状态显示）：认证和 WebSocket 设计\n- 建议在\"服务启动\"章节详细说明 D007 和 D013 的实现要求\n\n---\n\n## 2. 并发场景补充\n\n所有涉及外部调用或状态修改的功能，需要补充并发场景说明。\n\n### 2.1 Provider 适配框架（V1-FR-001）\n\n**并发场景 1：多个用户同时调用同一 Provider**\n- **冲突点**：API Key 使用次数、速率限制\n- **控制方式**：无锁设计，每个请求独立\n- **预期行为**：所有请求正常处理，Provider 端可能触发速率限制\n- **失败策略**：429 错误时自动重试（指数退避）\n\n**并发场景 2：多个请求同时写入 provider_usage_logs**\n- **冲突点**：数据库写入\n- **控制方式**：SQLite 内置锁，ACID 保证\n- **预期行为**：所有写入成功，顺序不保证\n- **失败策略**：写入失败记录错误日志\n\n**性能目标**：\n- 100+ QPS 并发调用不崩溃\n- 单个 Provider 调用延迟 < 30s（主要取决于上游 API）\n\n### 2.2 Skills 管理系统（V1-FR-002）\n\n**并发场景 1：多个用户同时调用同一 HTTP Skill**\n- **冲突点**：Skills 服务端负载\n- **控制方式**：无锁设计，Skills 服务自行处理并发\n- **预期行为**：所有请求转发到 Skills 服务\n- **失败策略**：Skills 超时或失败时记录错误\n\n**并发场景 2：用户 A 更新 Skill 时，用户 B 调用该 Skill**\n- **冲突点**：文件替换、进程重启\n- **控制方式**：更新时先禁用 Skill（原子操作）\n- **预期行为**：用户 B 调用失败，提示\"Skill 正在更新\"\n- **失败策略**：更新失败时回滚到备份版本\n\n**性能目标**：\n- 50+ QPS 并发 Skill 调用不崩溃\n- Skills 服务启动时间 < 5s\n\n### 2.3 MCP 管理系统（V1-FR-003）\n\n**并发场景：多个用户同时调用同一 MCP 工具**\n- **冲突点**：MCP 服务端负载\n- **控制方式**：无锁设计，MCP 服务自行处理\n- **预期行为**：所有请求转发到 MCP 服务\n- **失败策略**：超时或失败时记录错误\n\n**心跳检测**：\n- 每 30s 发送 ping，3 次超时后认为断线\n- 断线后自动重连（最多 5 次）\n\n### 2.4 模块系统与热更新（V1-FR-004）\n\n**并发场景：用户 A 热重载模块时，用户 B 调用该模块**\n- **冲突点**：模块代码替换\n- **控制方式**：引用计数，等待所有调用完成后卸载\n- **预期行为**：用户 B 使用旧版本直到调用完成，下次调用使用新版本\n- **失败策略**：重载失败时保留旧版本\n\n**性能目标**：\n- 模块加载时间 < 1s\n- 模块热重载无需重启应用\n\n### 2.5 本地用户管理（V1-FR-008）\n\n**并发场景：用户 A 登录时，用户 B 同时登录**\n- **冲突点**：会话创建、Token 生成\n- **控制方式**：无锁设计，每个会话独立\n- **预期行为**：两个用户同时登录成功\n- **失败策略**：生成 Token 失败时重试\n\n### 2.6 局域网协同（V1-FR-010）\n\n**并发场景：多个远程设备同时连接**\n- **冲突点**：WebSocket 连接数、内存占用\n- **控制方式**：无锁设计，每个连接独立\n- **预期行为**：所有设备同时连接成功\n- **失败策略**：连接失败时客户端重试\n\n**性能目标**：\n- 支持 10+ 并发连接\n- WebSocket 心跳每 30s，断线自动重连\n\n---\n\n## 3. 验证记录格式标准\n\n所有功能规格的\"实现与验证\"章节，必须按以下格式填写验证记录：\n\n### 标准格式\n\n```markdown\n#### YYYY-MM-DD 后端单元测试\n\n\\`\\`\\`bash\ncd server && DATABASE_URL=sqlite::memory: cargo test -p dgos-xxx --lib\n\\`\\`\\`\n\n**状态**：🟢 通过 / 🟡 部分通过 / 🔴 未开始\n\n**通过情况**：N/M 通过\n\n**详细覆盖说明**：\n- ✅ AC01: Provider 正常创建（包含数据库保存、模型列表自动获取）\n- ✅ AC02: API Key 无效检测（401 错误处理）\n- ⚠️ AC05: 同步调用成功（需要 mock OpenAI API，延后实现）\n- ❌ AC06: 流式调用成功（待实现）\n\n**遗留工作**：\n- AC05, AC06, AC07 需要 mock 外部 API，使用 wiremock 或真实测试账号\n```\n\n### 关键要素\n\n1. **日期**：YYYY-MM-DD 格式\n2. **完整命令**：包含环境变量、包名、测试范围\n3. **状态标识**：🟢 🟡 🔴 清晰可见\n4. **通过比例**：N/M 格式\n5. **逐 AC 说明**：✅ ⚠️ ❌ 标识每个 AC\n6. **遗留工作**：明确未完成的部分和原因\n\n---\n\n## 4. 分支追踪表强化\n\n所有包含伪代码的功能规格，分支追踪表必须包含\"风险级别\"列：\n\n### 标准格式\n\n```markdown\n| 分支编号 | 分支描述 | AC 映射 | E2E 映射 | NFR 映射 | 风险级别 |\n|---------|---------|---------|---------|---------|---------|\n| B01-01 | 查询 Provider 配置 | AC01, AC12 | V1-E2E-01 | - | 低 |\n| B01-04 | 重试循环主逻辑 | AC09, AC10 | - | V1-NFR-001 | 🔴 高 |\n| B01-08 | 429 速率限制重试 | AC09 | - | V1-NFR-001 | 🔴 高 |\n```\n\n### 风险级别定义\n\n- **🔴 高**：涉及金钱、权限、加密、外部回调、复杂并发、事务边界\n- **🟡 中**：涉及网络调用、文件操作、状态转换\n- **🟢 低**：纯计算、读取、简单转换\n\n### 高风险分支说明\n\n每个高风险分支必须在表格下方补充说明：\n\n```markdown\n**高风险分支说明**：\n- 🔴 **B01-04**: 重试循环是可靠性核心，必须充分测试边界（0次、1次、3次重试）\n- 🔴 **B01-08, B01-09**: 各种错误的重试逻辑，容易出现死循环或过早放弃\n```\n\n---\n\n## 5. 待补齐清单\n\n以下是各功能规格需要补齐的具体内容：\n\n### V1-FR-001 Provider 适配框架\n- [x] AC 表 ✅\n- [x] 分支追踪 ✅\n- [x] 验证记录框架 ✅\n- [ ] 补充决策引用（D001、D012）\n- [ ] 补充并发场景说明（已在本文档第 2.1 节）\n\n### V1-FR-002 Skills 管理系统\n- [x] AC 表 ✅\n- [x] 分支追踪 ✅\n- [x] 验证记录框架 ✅\n- [ ] 补充决策引用（D003、D005）\n- [ ] 补充并发场景说明（已在本文档第 2.2 节）\n\n### V1-FR-003 MCP 管理系统\n- [ ] 检查 AC 表完整性\n- [ ] 检查分支追踪\n- [ ] 补充决策引用（D003、D005、D013）\n- [ ] 补充心跳检测状态机\n\n### V1-FR-004 模块系统与热更新\n- [ ] 检查 AC 表完整性\n- [ ] 检查分支追踪\n- [ ] 补充决策引用（D004、D006、D008）\n- [ ] 补充模块加载并发场景\n\n### V1-FR-005 统一设计系统\n- [ ] 检查 AC 表（设计系统需要视觉测试 AC）\n- [ ] 补充决策引用（D008）\n- [ ] 补充 CI 检查规则\n\n### V1-FR-006 AI 工作台\n- [ ] 检查 AC 表\n- [ ] 补充流式响应状态机\n- [ ] 补充决策引用（D005）\n\n### V1-FR-007 系统设置\n- [ ] 检查 AC 表（每个配置项都需要 AC）\n- [ ] 补充配置持久化逻辑\n\n### V1-FR-008 本地用户管理\n- [ ] 检查 AC 表\n- [ ] 补充密码哈希算法说明（bcrypt vs Argon2）\n- [ ] 补充决策引用（D002）\n\n### V1-FR-009 模块权限管理\n- [ ] 检查 AC 表\n- [ ] 补充决策引用（D006）\n- [ ] 详细展开 6 种权限类型\n\n### V1-FR-010 局域网协同\n- [ ] 检查 AC 表\n- [ ] 补充 WebSocket 状态机\n- [ ] 补充决策引用（D007、D013）\n\n---\n\n## 6. 下一步行动\n\n按照优先级逐个补齐：\n\n1. ✅ **V1-产品需求.md** - 已补齐业务规则和状态机章节\n2. ⏭️ **V1-FR-003 MCP 管理系统** - 下一个处理\n3. ⏭️ **V1-FR-004 模块系统与热更新** - 关键底层能力\n4. ⏭️ **V1-FR-009 模块权限管理** - 与模块系统配套\n5. ⏭️ **V1-FR-010 局域网协同** - WebSocket 状态机需要补充\n\n**执行人**：Kiro + spec-docs-pro  \n**开始时间**：2026-10-26  \n**预计完成**：分步完成，每个文档逐一补齐\n", "doc-017": "# V1-FR-001：Provider 适配框架\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-001 |\n| 功能名称 | Provider 适配框架 |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 |\n| 优先级 | P0（必须） |\n| 风险级别 | 中等（涉及并发调用、缓存管理） |\n| 依赖功能 | 无（基础能力） |\n| 被依赖功能 | V1-FR-006（AI 工作台）、V2 画布系统 |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n统一适配各厂商 AI 模型 API，提供模型列表获取、分类标签、同步/流式调用能力，支持多 Provider 配置、排序和手动选择。\n\n### 2.2 详细说明\n\nProvider 适配框架是 DGOS 的底层核心能力，负责屏蔽各个 AI 模型提供商（OpenAI、Claude、通义千问等）的 API 差异，为上层应用提供统一的调用接口。\n\n**核心价值**：\n- ✅ 统一接口：应用层不需要关心具体 Provider 的 API 细节\n- ✅ 多 Provider 支持：用户可以配置多个同类型 Provider（如多个 OpenAI 账号）\n- ✅ 模型分类：自动给模型打标签（text-generation、image-generation 等）\n- ✅ 灵活选择：应用层可以手动选择 Provider，或使用默认排序\n\n**用户价值**：\n- 开发者：只需要调用统一接口，不用处理各厂商 API 差异\n- 最终用户：可以配置多个账号，灵活切换和管理\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ Provider CRUD 管理（增删改查）\n- ✅ 统一的 Provider trait 接口定义\n- ✅ OpenAI 兼容适配器实现（V1 唯一实现）\n- ✅ 模型列表获取与缓存（永久缓存，手动刷新）\n- ✅ 模型分类标签（内置维护：text-generation、image-generation、video-generation、audio-generation）\n- ✅ 同步调用接口\n- ✅ 流式调用接口（SSE）\n- ✅ 使用记录保存\n- ✅ 多 Provider 排序机制（用户拖拽）\n- ✅ Provider 启用/禁用开关\n- ✅ 并发调用支持（不排队）\n- ✅ 可配置重试策略（应用层配置）\n\n**不包含**（明确说明原因）：\n- ❌ 其他厂商适配器（Claude、通义千问等）→ V4 云端增强时实现\n- ❌ 自动切换到备用 Provider → 应用层自己决定策略\n- ❌ 连接池管理 → V1 简化实现，直接调用\n- ❌ 流式输出断点续传 → 复杂度高，V2 考虑\n- ❌ Provider 健康检查 → V2 监控功能\n- ❌ 请求排队机制 → 不需要，允许并发\n\n## 3. 核心流程\n\n### 3.1 配置 Provider 流程\n\n```\n用户打开系统设置\n  ↓\n点击\"Provider 管理\"\n  ↓\n点击\"添加 Provider\"\n  ↓\n选择类型：OpenAI 兼容\n  ↓\n填写配置：\n  - 名称：我的 OpenAI\n  - Base URL：https://api.openai.com/v1\n  - API Key：sk-xxx\n  ↓\n点击\"测试连接\"\n  ↓\n系统调用 Provider API 验证\n  ↓\n测试成功 → 保存配置\n  ↓\n自动获取模型列表（首次）\n  ↓\n模型列表缓存到本地\n  ↓\n显示在 Provider 列表中\n```\n\n### 3.2 调用 Provider 流程\n\n```\n应用层（AI 工作台）发起调用\n  ↓\n选择 Provider（或使用默认排序第一个）\n  ↓\n选择模型（从缓存的模型列表）\n  ↓\n构造请求参数（prompt、temperature 等）\n  ↓\n调用 Provider 适配器\n  ↓\n适配器转换为 Provider 原生格式\n  ↓\n发送 HTTP 请求到 Provider API\n  ↓\n（如果失败）检查重试配置\n  ↓\n（如果配置了重试）按指数退避重试\n  ↓\n（如果是流式）逐块返回结果\n  ↓\n（如果流式中断）保存已接收部分\n  ↓\n记录使用日志\n  ↓\n返回结果给应用层\n```\n\n### 3.3 刷新模型列表流程\n\n```\n用户在 Provider 管理界面\n  ↓\n选择某个 Provider\n  ↓\n点击\"刷新模型列表\"\n  ↓\n系统调用 Provider API 获取最新模型\n  ↓\n更新本地缓存\n  ↓\n重新给模型打分类标签\n  ↓\n显示\"已更新 X 个模型\"\n```\n\n### 3.4 多 Provider 排序流程\n\n```\n用户在 Provider 管理界面\n  ↓\n看到所有已配置的 Provider 列表\n  ↓\n拖拽某个 Provider 调整顺序\n  ↓\n系统保存新的排序\n  ↓\n应用层使用时，默认选择排序第一个\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**providers 表**（核心）：\n```sql\nCREATE TABLE providers (\n    id TEXT PRIMARY KEY,              -- UUID\n    name TEXT NOT NULL,               -- 用户自定义名称，如\"我的 OpenAI\"\n    provider_type TEXT NOT NULL,      -- 类型：openai_compatible, claude, qwen 等\n    base_url TEXT NOT NULL,           -- API Base URL\n    api_key TEXT NOT NULL,            -- 加密存储的 API Key\n    enabled BOOLEAN DEFAULT TRUE,     -- 是否启用\n    sort_order INTEGER DEFAULT 0,     -- 排序权重（越小越靠前）\n    config JSON,                      -- 额外配置（重试次数等）\n    created_at TIMESTAMP,\n    updated_at TIMESTAMP,\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n**models 表**（缓存）：\n```sql\nCREATE TABLE models (\n    id TEXT PRIMARY KEY,              -- UUID\n    provider_id TEXT NOT NULL,        -- 所属 Provider\n    model_id TEXT NOT NULL,           -- 模型 ID，如 gpt-4\n    model_name TEXT,                  -- 模型显示名称\n    capabilities JSON,                -- 能力标签数组：[\"text-generation\"]\n    context_length INTEGER,           -- 上下文长度\n    is_available BOOLEAN DEFAULT TRUE,-- 是否可用\n    synced_at TIMESTAMP,              -- 同步时间\n    FOREIGN KEY (provider_id) REFERENCES providers(id) ON DELETE CASCADE,\n    UNIQUE(provider_id, model_id)\n);\n```\n\n**provider_usage_logs 表**（使用记录）：\n```sql\nCREATE TABLE provider_usage_logs (\n    id TEXT PRIMARY KEY,\n    provider_id TEXT NOT NULL,\n    model_id TEXT NOT NULL,\n    user_id TEXT NOT NULL,\n    request_tokens INTEGER,\n    response_tokens INTEGER,\n    total_tokens INTEGER,\n    latency_ms INTEGER,              -- 响应时间（毫秒）\n    success BOOLEAN,\n    error_code TEXT,                 -- 如果失败，错误码\n    created_at TIMESTAMP,\n    FOREIGN KEY (provider_id) REFERENCES providers(id),\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 获取 Provider 列表：`SELECT * FROM providers WHERE user_id = ? ORDER BY sort_order`\n- 获取模型列表：`SELECT * FROM models WHERE provider_id = ? AND is_available = TRUE`\n- 查询使用记录：`SELECT * FROM provider_usage_logs WHERE user_id = ? ORDER BY created_at DESC`\n\n**写操作**：\n- 创建 Provider：`INSERT INTO providers`\n- 更新 Provider：`UPDATE providers SET ... WHERE id = ?`\n- 删除 Provider：`DELETE FROM providers WHERE id = ?`（级联删除 models）\n- 缓存模型列表：`INSERT OR REPLACE INTO models`\n- 记录使用日志：`INSERT INTO provider_usage_logs`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | Provider 正常创建 | 用户已登录 | 创建 OpenAI Provider 配置 | Provider 保存成功，模型列表自动获取 | 后端 API + 数据库 | `server/crates/providers/tests/provider_crud.rs` | `cargo test -p dgos-providers provider_create` | 规划中 |\n| AC02 | API Key 无效检测 | 用户输入错误的 API Key | 点击\"测试连接\" | 返回 401 错误，提示\"API Key 无效\" | 后端 API | `server/crates/providers/tests/provider_crud.rs` | `cargo test -p dgos-providers invalid_api_key` | 规划中 |\n| AC03 | 模型列表获取与缓存 | Provider 已配置 | 首次获取模型列表 | 调用 Provider API，缓存到 models 表 | 后端 API + 数据库 | `server/crates/providers/tests/model_sync.rs` | `cargo test -p dgos-providers model_sync` | 规划中 |\n| AC04 | 模型分类标签正确 | 模型列表已获取 | 查询模型 | gpt-4 标签为 text-generation，dall-e-3 为 image-generation | 后端逻辑 | `server/crates/providers/tests/model_capabilities.rs` | `cargo test -p dgos-providers model_capabilities` | 规划中 |\n| AC05 | 同步调用成功 | Provider 和模型已配置 | 调用 chat.completions | 返回完整响应，记录使用日志 | 后端 API + 外部集成 | `server/crates/providers/tests/provider_call.rs` | `cargo test -p dgos-providers sync_call` | 规划中 |\n| AC06 | 流式调用成功 | Provider 和模型已配置 | 调用 chat.completions（stream=true） | 返回 SSE 流，逐块接收 | 后端 API + 外部集成 | `server/crates/providers/tests/provider_call.rs` | `cargo test -p dgos-providers stream_call` | 规划中 |\n| AC07 | 流式输出中断处理 | 流式调用进行中 | 网络中断或 Provider 断开 | 保存已接收部分，返回错误码 | 后端 API | `server/crates/providers/tests/provider_call.rs` | `cargo test -p dgos-providers stream_interrupt` | 规划中 |\n| AC08 | 并发调用支持 | 多个应用同时调用 | 5 个并发请求同时发起 | 所有请求都能成功处理，无排队 | 后端 API + 并发测试 | `server/crates/providers/tests/concurrent_calls.rs` | `cargo test -p dgos-providers concurrent_calls` | 规划中 |\n| AC09 | 可配置重试策略 | Provider 配置了 retry_count=3 | API 调用返回 500 | 自动重试 3 次，间隔 1s/2s/4s | 后端逻辑 | `server/crates/providers/tests/retry_strategy.rs` | `cargo test -p dgos-providers retry_strategy` | 规划中 |\n| AC10 | 重试失败后返回错误 | Provider 配置了 retry_count=3 | API 调用 3 次都失败 | 返回错误，不再重试 | 后端逻辑 | `server/crates/providers/tests/retry_strategy.rs` | `cargo test -p dgos-providers retry_exhausted` | 规划中 |\n| AC11 | 多 Provider 排序 | 用户配置了 3 个 Provider | 拖拽调整排序 | 排序保存，默认使用排序第一个 | 后端 API + 前端集成 | `server/crates/providers/tests/provider_crud.rs` | `cargo test -p dgos-providers provider_sort` | 规划中 |\n| AC12 | Provider 启用/禁用 | Provider 已配置 | 禁用某个 Provider | 该 Provider 不出现在可选列表 | 后端 API | `server/crates/providers/tests/provider_crud.rs` | `cargo test -p dgos-providers provider_toggle` | 规划中 |\n| AC13 | 手动刷新模型列表 | 模型列表已缓存 | 点击\"刷新模型列表\" | 重新获取，更新缓存 | 后端 API + 数据库 | `server/crates/providers/tests/model_sync.rs` | `cargo test -p dgos-providers model_refresh` | 规划中 |\n| AC14 | 使用记录保存 | 调用成功 | 查询使用记录 | 包含 tokens、延迟、时间 | 后端 API + 数据库 | `server/crates/providers/tests/usage_logs.rs` | `cargo test -p dgos-providers usage_logs` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 空 Provider 列表 | 用户未配置任何 Provider | 提示\"请先配置 Provider\" |\n| 重复 Provider 名称 | 创建同名 Provider | 允许（名称可重复，ID 不重复） |\n| API Key 包含特殊字符 | API Key 有空格、换行 | 自动 trim，正常保存 |\n| 超长 Prompt | Prompt 长度超过模型限制 | 返回错误\"超过最大长度\" |\n| 并发超过 100 | 100+ 并发请求 | 正常处理，不崩溃 |\n| 网络完全断开 | 调用时无网络 | 返回\"网络错误\"，不无限等待 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// Provider CRUD\n#[tauri::command]\nasync fn list_providers(user_id: String) -> Result<Vec<Provider>>;\n\n#[tauri::command]\nasync fn create_provider(config: ProviderConfig) -> Result<Provider>;\n\n#[tauri::command]\nasync fn update_provider(id: String, config: ProviderConfig) -> Result<Provider>;\n\n#[tauri::command]\nasync fn delete_provider(id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn test_provider_connection(config: ProviderConfig) -> Result<bool>;\n\n// 模型管理\n#[tauri::command]\nasync fn list_models(provider_id: String) -> Result<Vec<Model>>;\n\n#[tauri::command]\nasync fn refresh_models(provider_id: String) -> Result<Vec<Model>>;\n\n// Provider 调用\n#[tauri::command]\nasync fn call_provider(\n    provider_id: String,\n    model_id: String,\n    request: ChatRequest\n) -> Result<ChatResponse>;\n\n#[tauri::command]\nasync fn stream_provider(\n    provider_id: String,\n    model_id: String,\n    request: ChatRequest\n) -> Result<Stream<ChatChunk>>;\n\n// 排序管理\n#[tauri::command]\nasync fn update_provider_order(provider_ids: Vec<String>) -> Result<()>;\n\n// 使用记录\n#[tauri::command]\nasync fn list_usage_logs(\n    user_id: String,\n    limit: Option<usize>\n) -> Result<Vec<UsageLog>>;\n```\n\n### 6.2 HTTP API（局域网）\n\n```\nPOST /api/v1/providers                    # 创建 Provider\nGET  /api/v1/providers                    # 获取 Provider 列表\nPUT  /api/v1/providers/:id                # 更新 Provider\nDELETE /api/v1/providers/:id              # 删除 Provider\nPOST /api/v1/providers/:id/test           # 测试连接\n\nGET  /api/v1/providers/:id/models         # 获取模型列表\nPOST /api/v1/providers/:id/models/refresh # 刷新模型列表\n\nPOST /api/v1/providers/:id/call           # 调用 Provider（同步）\nPOST /api/v1/providers/:id/stream         # 调用 Provider（流式）\n\nPUT  /api/v1/providers/order              # 更新排序\n\nGET  /api/v1/usage-logs                   # 使用记录\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 核心 Trait 定义\n\n```rust\n// server/crates/providers/src/traits.rs\n\nuse async_trait::async_trait;\nuse serde::{Deserialize, Serialize};\n\n#[async_trait]\npub trait ProviderAdapter: Send + Sync {\n    /// 获取 Provider 类型标识\n    fn provider_type(&self) -> &str;\n    \n    /// 获取模型列表\n    async fn list_models(&self) -> Result<Vec<Model>>;\n    \n    /// 同步调用\n    async fn call(\n        &self,\n        model_id: &str,\n        request: ChatRequest\n    ) -> Result<ChatResponse>;\n    \n    /// 流式调用\n    async fn stream(\n        &self,\n        model_id: &str,\n        request: ChatRequest\n    ) -> Result<Stream<ChatChunk>>;\n    \n    /// 测试连接\n    async fn test_connection(&self) -> Result<bool>;\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Model {\n    pub id: String,\n    pub name: String,\n    pub capabilities: Vec<Capability>,\n    pub context_length: Option<usize>,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub enum Capability {\n    TextGeneration,\n    ImageGeneration,\n    VideoGeneration,\n    AudioGeneration,\n}\n```\n\n### 7.2 OpenAI 适配器实现\n\n```rust\n// server/crates/providers/src/adapters/openai.rs\n\npub struct OpenAIAdapter {\n    base_url: String,\n    api_key: String,\n    client: reqwest::Client,\n    retry_config: Option<RetryConfig>,\n}\n\nimpl OpenAIAdapter {\n    pub fn new(base_url: String, api_key: String, retry_config: Option<RetryConfig>) -> Self {\n        Self {\n            base_url,\n            api_key,\n            client: reqwest::Client::new(),\n            retry_config,\n        }\n    }\n    \n    // B01-01: 给模型打分类标签（内置维护）\n    fn classify_model(&self, model_id: &str) -> Vec<Capability> {\n        match model_id {\n            \"gpt-4\" | \"gpt-3.5-turbo\" | \"gpt-4-turbo\" => {\n                vec![Capability::TextGeneration]\n            }\n            \"dall-e-3\" | \"dall-e-2\" => {\n                vec![Capability::ImageGeneration]\n            }\n            _ => vec![],\n        }\n    }\n}\n\n#[async_trait]\nimpl ProviderAdapter for OpenAIAdapter {\n    fn provider_type(&self) -> &str {\n        \"openai_compatible\"\n    }\n    \n    // B01-02: 获取模型列表\n    async fn list_models(&self) -> Result<Vec<Model>> {\n        let url = format!(\"{}/models\", self.base_url);\n        let response = self.client\n            .get(&url)\n            .bearer_auth(&self.api_key)\n            .send()\n            .await?;\n        \n        let models_data: OpenAIModelsResponse = response.json().await?;\n        \n        let models = models_data.data.into_iter()\n            .map(|m| Model {\n                id: m.id.clone(),\n                name: m.id,\n                capabilities: self.classify_model(&m.id), // B01-01\n                context_length: None,\n            })\n            .collect();\n        \n        Ok(models)\n    }\n    \n    // B01-03: 同步调用（支持重试）\n    async fn call(\n        &self,\n        model_id: &str,\n        request: ChatRequest\n    ) -> Result<ChatResponse> {\n        let url = format!(\"{}/chat/completions\", self.base_url);\n        let body = OpenAIChatRequest {\n            model: model_id.to_string(),\n            messages: request.messages,\n            temperature: request.temperature,\n            stream: false,\n        };\n        \n        // B01-04: 重试逻辑\n        let mut attempts = 0;\n        let max_attempts = self.retry_config\n            .as_ref()\n            .map(|c| c.max_retries + 1)\n            .unwrap_or(1);\n        \n        loop {\n            attempts += 1;\n            \n            let response = self.client\n                .post(&url)\n                .bearer_auth(&self.api_key)\n                .json(&body)\n                .send()\n                .await;\n            \n            match response {\n                Ok(resp) if resp.status().is_success() => {\n                    let data: OpenAIChatResponse = resp.json().await?;\n                    return Ok(ChatResponse {\n                        content: data.choices[0].message.content.clone(),\n                        tokens: data.usage.total_tokens,\n                    });\n                }\n                Ok(resp) if resp.status() == 500 && attempts < max_attempts => {\n                    // B01-05: 500 错误重试，指数退避\n                    let delay = 2u64.pow(attempts - 1);\n                    tokio::time::sleep(Duration::from_secs(delay)).await;\n                    continue;\n                }\n                Ok(resp) => {\n                    // B01-06: 其他错误不重试\n                    return Err(Error::ProviderError(resp.status()));\n                }\n                Err(e) if attempts < max_attempts => {\n                    // B01-07: 网络错误重试\n                    let delay = 2u64.pow(attempts - 1);\n                    tokio::time::sleep(Duration::from_secs(delay)).await;\n                    continue;\n                }\n                Err(e) => {\n                    return Err(Error::NetworkError(e));\n                }\n            }\n        }\n    }\n    \n    // B01-08: 流式调用\n    async fn stream(\n        &self,\n        model_id: &str,\n        request: ChatRequest\n    ) -> Result<Stream<ChatChunk>> {\n        let url = format!(\"{}/chat/completions\", self.base_url);\n        let body = OpenAIChatRequest {\n            model: model_id.to_string(),\n            messages: request.messages,\n            temperature: request.temperature,\n            stream: true,\n        };\n        \n        let response = self.client\n            .post(&url)\n            .bearer_auth(&self.api_key)\n            .json(&body)\n            .send()\n            .await?;\n        \n        // B01-09: 转换为 SSE Stream\n        let stream = response\n            .bytes_stream()\n            .map(|chunk| {\n                // 解析 SSE 格式\n                parse_sse_chunk(chunk)\n            });\n        \n        Ok(stream)\n    }\n    \n    // B01-10: 测试连接\n    async fn test_connection(&self) -> Result<bool> {\n        let url = format!(\"{}/models\", self.base_url);\n        let response = self.client\n            .get(&url)\n            .bearer_auth(&self.api_key)\n            .send()\n            .await?;\n        \n        Ok(response.status().is_success())\n    }\n}\n```\n\n### 7.3 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 | NFR 映射 |\n| --- | --- | --- | --- | --- |\n| B01-01 | 模型分类标签 | AC04 | - | - |\n| B01-02 | 获取模型列表 | AC03 | - | - |\n| B01-03 | 同步调用 | AC05 | V1-E2E-01 | - |\n| B01-04～07 | 重试逻辑 | AC09, AC10 | - | V1-NFR-001（可用性） |\n| B01-05 | 500 错误重试 | AC09 | - | - |\n| B01-06 | 其他错误不重试 | AC10 | - | - |\n| B01-07 | 网络错误重试 | AC09 | - | - |\n| B01-08 | 流式调用 | AC06 | V1-E2E-01 | - |\n| B01-09 | SSE Stream 解析 | AC06, AC07 | - | - |\n| B01-10 | 测试连接 | AC02 | - | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1001001 | provider_not_found | Provider 不存在 | 检查 Provider ID |\n| 1001002 | invalid_api_key | API Key 无效 | 检查 API Key 是否正确 |\n| 1001003 | provider_unavailable | Provider 不可用 | 检查网络或 Provider 状态 |\n| 1001004 | model_not_found | 模型不存在 | 刷新模型列表或检查模型 ID |\n| 1001005 | rate_limit_exceeded | 超过速率限制 | 稍后重试或切换 Provider |\n| 1001006 | timeout | 请求超时 | 检查网络或重试 |\n| 1001007 | stream_interrupted | 流式输出中断 | 重新生成 |\n| 1001008 | max_retries_exceeded | 重试次数耗尽 | 检查 Provider 状态或配置 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 模型列表获取 | < 3 秒 | 集成测试 |\n| 同步调用响应 | < 30 秒（取决于 Provider） | 集成测试 |\n| 流式首字节延迟 | < 2 秒 | 集成测试 |\n| 并发调用支持 | > 100 QPS | 压力测试 |\n| 数据库查询 | < 50ms（Provider 列表） | 单元测试 |\n\n### 9.2 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| API Key 加密存储 | 使用 SQLCipher 或 AES-256 加密 |\n| HTTPS 强制 | 调用 Provider 时强制 HTTPS |\n| 敏感信息脱敏 | 日志中 API Key 只显示前 4 位 |\n\n### 9.3 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 失败重试 | 可配置重试次数和间隔 |\n| 错误提示 | 用户友好的错误信息 |\n| 流式中断恢复 | 保存已接收部分，提示重新生成 |\n\n## 10. 实现与验证\n\n### 10.1 验证记录\n\n**说明**：每次验证后更新本节，记录日期、命令、通过率和覆盖说明。格式遵循 spec-docs-pro 标准。\n\n#### 2026-10-26 后端单元测试\n\n```bash\ncd server && cargo test -p dgos-providers --lib\n```\n\n**状态**：🔴 未开始\n\n**计划覆盖**：\n- Provider
