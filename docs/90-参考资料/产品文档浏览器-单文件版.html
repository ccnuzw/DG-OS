request)\n  \n  // B01-03: 读取重试配置\n  retry_config = parse_json(provider.config)\n  max_retries = retry_config.retry_count OR 0\n  \n  // B01-04: 发起调用（带重试）\n  attempt = 0\n  WHILE attempt <= max_retries:\n    TRY:\n      start_time = now()\n      response = HTTP.post(provider.base_url + \"/chat/completions\", native_request)\n      latency_ms = now() - start_time\n      \n      // B01-05: 检查成功响应\n      IF response.status == 200:\n        result = adapter.convert_response(response.body)\n        \n        // B01-06: 记录使用日志\n        INSERT INTO provider_usage_logs(\n          provider_id, model_id, user_id,\n          request_tokens, response_tokens, total_tokens,\n          latency_ms, success = TRUE\n        )\n        \n        RETURN Ok(result)\n      \n      // B01-07: 401 错误（API Key 无效）\n      IF response.status == 401:\n        RETURN Err(E_INVALID_API_KEY)  // 不重试\n      \n      // B01-08: 429 错误（速率限制）\n      IF response.status == 429:\n        IF attempt < max_retries:\n          backoff_delay = calculate_backoff(attempt)  // 1s, 2s, 4s, 8s\n          SLEEP(backoff_delay)\n          attempt += 1\n          CONTINUE\n        ELSE:\n          RETURN Err(E_RATE_LIMIT_EXCEEDED)\n      \n      // B01-09: 5xx 错误（服务器错误）\n      IF response.status >= 500:\n        IF attempt < max_retries:\n          backoff_delay = calculate_backoff(attempt)\n          SLEEP(backoff_delay)\n          attempt += 1\n          CONTINUE\n        ELSE:\n          RETURN Err(E_SERVER_ERROR)\n      \n      // B01-10: 其他错误\n      RETURN Err(E_UNKNOWN_ERROR)\n    \n    CATCH (NetworkError as e):\n      // B01-11: 网络错误\n      IF attempt < max_retries:\n        backoff_delay = calculate_backoff(attempt)\n        SLEEP(backoff_delay)\n        attempt += 1\n        CONTINUE\n      ELSE:\n        RETURN Err(E_NETWORK_ERROR)\n  \n  RETURN Err(E_RETRY_EXHAUSTED)\n```\n\n**流式调用流程**：\n\n```text\nFUNCTION stream_provider(provider_id, model_id, request) -> Result<Stream>:\n  // B02-01: 查询 Provider（复用 B01-01 逻辑）\n  provider = DB.query(\"SELECT * FROM providers WHERE id = ? AND enabled = TRUE\", provider_id)\n  IF NOT provider:\n    RETURN Err(E_PROVIDER_NOT_FOUND)\n  \n  // B02-02: 构造流式请求\n  adapter = create_adapter(provider.provider_type, provider.base_url, provider.api_key)\n  native_request = adapter.convert_request(model_id, request)\n  native_request.stream = TRUE\n  \n  // B02-03: 发起 SSE 流式调用\n  TRY:\n    sse_stream = HTTP.post_stream(provider.base_url + \"/chat/completions\", native_request)\n    accumulated_text = \"\"\n    \n    // B02-04: 返回流处理器\n    RETURN StreamHandler {\n      on_chunk: FUNCTION(chunk):\n        // B02-05: 解析 SSE 数据\n        IF chunk.starts_with(\"data: \"):\n          data_str = chunk.trim_prefix(\"data: \")\n          IF data_str == \"[DONE]\":\n            // B02-06: 流正常结束\n            INSERT INTO provider_usage_logs(success = TRUE, response_tokens = count_tokens(accumulated_text))\n            RETURN StreamEnd\n          \n          data = parse_json(data_str)\n          delta = adapter.convert_stream_chunk(data)\n          accumulated_text += delta.content\n          YIELD delta\n      \n      on_error: FUNCTION(error):\n        // B02-07: 流中断处理\n        LOG.warn(\"Stream interrupted\", error)\n        \n        // B02-08: 保存已接收部分\n        INSERT INTO provider_usage_logs(\n          provider_id, model_id, user_id,\n          response_tokens = count_tokens(accumulated_text),\n          success = FALSE,\n          error_code = \"stream_interrupted\"\n        )\n        \n        RETURN Err(E_STREAM_INTERRUPTED, accumulated_text)\n    }\n  \n  CATCH (error):\n    RETURN Err(E_NETWORK_ERROR)\n```\n\n#### 分支到测试追踪表\n\n| 分支编号 | 分支描述 | AC 映射 | E2E 映射 | NFR 映射 | 风险级别 |\n|---------|---------|---------|---------|---------|---------|\n| B01-01 | 查询 Provider 配置 | AC01, AC12 | V1-E2E-01 | - | 低 |\n| B01-02 | 构造适配器与请求 | AC05 | V1-E2E-01 | - | 低 |\n| B01-03 | 读取重试配置 | AC09 | - | - | 低 |\n| B01-04 | 重试循环主逻辑 | AC09, AC10 | - | V1-NFR-001 | 🔴 高 |\n| B01-05 | 检查成功响应 | AC05 | V1-E2E-01 | - | 低 |\n| B01-06 | 记录使用日志 | AC14 | - | V1-NFR-002 | 低 |\n| B01-07 | 401 错误处理 | AC02 | - | - | 中 |\n| B01-08 | 429 速率限制重试 | AC09 | - | V1-NFR-001 | 🔴 高 |\n| B01-09 | 5xx 服务器错误重试 | AC09, AC10 | - | V1-NFR-001 | 🔴 高 |\n| B01-10 | 其他错误处理 | AC05 | - | - | 中 |\n| B01-11 | 网络错误重试 | AC09 | - | V1-NFR-001 | 🔴 高 |\n| B02-01 | 查询 Provider（流式） | AC12 | - | - | 低 |\n| B02-02 | 构造流式请求 | AC06 | - | - | 低 |\n| B02-03 | 发起 SSE 调用 | AC06 | V1-E2E-01 | - | 中 |\n| B02-04～B02-05 | 流处理与 SSE 解析 | AC06 | V1-E2E-01 | V1-NFR-003 | 中 |\n| B02-06 | 流正常结束 | AC06 | - | - | 低 |\n| B02-07～B02-08 | 流中断保存已接收 | AC07 | - | V1-NFR-001 | 🔴 高 |\n\n**高风险分支说明**：\n- 🔴 **B01-04**: 重试循环是可靠性核心，必须充分测试边界（0次、1次、3次重试）\n- 🔴 **B01-08, B01-09, B01-11**: 各种错误的重试逻辑，容易出现死循环或过早放弃\n- 🔴 **B02-07～B02-08**: 流中断时必须保存已接收部分，否则用户看到的内容会丢失\n\n**NFR 映射说明**：\n- **V1-NFR-001 (可靠性)**: 重试机制、错误恢复\n- **V1-NFR-002 (可观测性)**: 使用日志记录\n- **V1-NFR-003 (性能)**: 流式响应性能\n\n---\n\n### 10.3 验证检查清单\n\n开发完成后，必须通过以下检查才能合并：\n\n**代码检查**：\n- [ ] 所有 AC 的目标测试文件已创建\n- [ ] 高风险分支（B01-04, B01-08, B01-09, B01-11, B02-07～B02-08）有独立测试用例\n- [ ] 重试逻辑有完整的单元测试（0次、1次、3次、边界条件）\n- [ ] 流中断场景有明确的回归测试\n\n**测试检查**：\n- [ ] 后端集成测试通过率 ≥ 80%（mock 外部 API 的场景可延后）\n- [ ] 并发测试验证无竞态条件（5个并发、100个并发）\n- [ ] E2E 测试覆盖完整用户流程（V1-E2E-01）\n\n**数据检查**：\n- [ ] 使用记录正确保存到数据库（包含 tokens、latency）\n- [ ] API Key 加密存储验证通过（bcrypt 或 AES）\n- [ ] 模型列表缓存正确（首次同步、手动刷新）\n\n**文档检查**：\n- [ ] 验证记录章节已更新（记录日期、通过率、覆盖说明）\n- [ ] 所有高风险分支的测试结果已记录\n\n## 11. 风险与依赖\n\n### 11.1 技术风险\n\n| 风险 | 概率 | 影响 | 缓解措施 |\n| --- | --- | --- | --- |\n| OpenAI API 变更 | 中 | 高 | 版本锁定，监控 API 变更 |\n| 流式输出不稳定 | 中 | 中 | 完善错误处理，保存已接收部分 |\n| 并发性能瓶颈 | 低 | 中 | 压力测试，必要时引入连接池 |\n| API Key 泄漏 | 低 | 高 | 加密存储，日志脱敏 |\n\n### 11.2 外部依赖\n\n| 依赖 | 类型 | 风险 | 应对 |\n| --- | --- | --- | --- |\n| OpenAI API | 外部服务 | 可用性依赖 | 用户自己配置，支持多 Provider |\n| reqwest | Rust Crate | 版本兼容 | 锁定版本 |\n| tokio | Rust Crate | 版本兼容 | 锁定版本 |\n\n### 11.3 功能依赖\n\n| 依赖功能 | 状态 | 影响 |\n| --- | --- | --- |\n| 本地用户管理（V1-FR-008） | 规划中 | 需要先实现用户系统 |\n| SQLite 数据库 | 待初始化 | 需要先创建表结构 |\n\n## 12. 实现状态\n\n| 模块 | 状态 | 进度 | 负责人 | 备注 |\n| --- | --- | --- | --- | --- |\n| Provider Trait 定义 | 🔴 未开始 | 0% | TBD | - |\n| OpenAI 适配器 | 🔴 未开始 | 0% | TBD | - |\n| Provider CRUD API | 🔴 未开始 | 0% | TBD | - |\n| 模型同步逻辑 | 🔴 未开始 | 0% | TBD | - |\n| 重试机制 | 🔴 未开始 | 0% | TBD | - |\n| 流式调用 | 🔴 未开始 | 0% | TBD | - |\n| 前端 UI | 🔴 未开始 | 0% | TBD | - |\n| 测试用例 | 🔴 未开始 | 0% | TBD | - |\n\n详见 [V1 实现状态](../../../02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n", "doc-018": "# V1-FR-002：Skills 管理系统\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-002 |\n| 功能名称 | Skills 管理系统 |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 |\n| 优先级 | P0（必须） |\n| 风险级别 | 标准（使用现有标准，不涉及复杂并发） |\n| 依赖功能 | V1-FR-001（Provider 框架，Skills 可能调用 AI） |\n| 被依赖功能 | V1-FR-006（AI 工作台）、V2 画布系统 |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n连接官方 Skills 仓库，提供 Skills 浏览、安装、配置、调用和更新能力，支持 HTTP 和 CLI 两种调用方式，扩展 AI 应用的工具能力。\n\n### 2.2 详细说明\n\nSkills 管理系统让 DGOS 能够使用现有的 AI 工具生态（基于 LangChain Tools 标准）。DGOS 不重新实现 Skills 协议，只负责管理和调用。\n\n**核心价值**：\n- ✅ 使用现有生态：直接使用 LangChain Tools 生态的 Skills\n- ✅ 简化管理：统一的安装、配置、更新界面\n- ✅ 扩展能力：让 AI 可以使用工具（搜索、计算、文件操作等）\n- ✅ 可选增强：Skills 是可选的，不是必须的\n\n**用户价值**：\n- 开发者：可以让 AI 调用各种工具，增强能力\n- 最终用户：可以在 AI 工作台或画布中使用 Skills 增强生成效果\n\n**与 Provider 的区别**：\n- Provider：提供 AI 模型（GPT-4、Claude 等）\n- Skills：提供工具能力（搜索、计算、文件操作等）\n- Skills 是可选的增强，Provider 是必须的\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ 连接官方 Skills 仓库（硬编码 URL：`https://skills.dgos.ai/registry.json`）\n- ✅ 浏览 Skills 列表（分类、搜索、筛选）\n- ✅ 查看 Skill 详情（名称、描述、作者、版本、依赖）\n- ✅ 安装 Skills（下载到 `~/.dgos/skills/`）\n- ✅ 卸载 Skills\n- ✅ 启用/禁用 Skills\n- ✅ Skills 配置管理（API Key 等敏感配置）\n- ✅ 调用 Skills（HTTP 和 CLI 两种方式）\n- ✅ Skills 更新检查（提示更新，用户手动确认）\n- ✅ 依赖检查（检查 Python/Node.js 版本）\n- ✅ 使用记录保存\n- ✅ 并发调用支持\n\n**不包含**（明确说明原因）：\n- ❌ 自定义 Skills 仓库 → V2 再支持，V1 简化实现\n- ❌ Skills 开发 SDK → V8 开发者生态时提供\n- ❌ 自动更新 Skills → 需要用户确认，避免意外变更\n- ❌ 内置 Python/Node.js 运行时 → 复杂度高，V2 考虑\n- ❌ Skills 沙箱隔离 → V2 安全增强时考虑\n- ❌ Skills 市场（用户上传） → V3 应用市场时一起做\n\n## 3. 核心流程\n\n### 3.1 浏览和安装 Skills 流程\n\n```\n用户打开系统设置\n  ↓\n点击\"Skills 管理\"\n  ↓\n点击\"浏览 Skills 仓库\"\n  ↓\n系统从官方仓库获取 Skills 列表\n  ↓\n显示 Skills 列表（分类：搜索、计算、文件、数据等）\n  ↓\n用户搜索或浏览\n  ↓\n点击某个 Skill 查看详情\n  ↓\n显示：名称、描述、作者、版本、依赖、配置项\n  ↓\n点击\"安装\"\n  ↓\n检查依赖（Python 3.10+、Node.js 18+ 等）\n  ↓\n（如果依赖不满足）提示用户先安装依赖\n  ↓\n（如果依赖满足）下载 Skill 到 ~/.dgos/skills/\n  ↓\n解压并验证完整性\n  ↓\n（如果需要配置）提示用户配置（API Key 等）\n  ↓\n安装完成，显示在已安装列表\n```\n\n### 3.2 配置 Skills 流程\n\n```\n用户在已安装 Skills 列表\n  ↓\n选择某个 Skill\n  ↓\n点击\"配置\"\n  ↓\n显示配置项（根据 Skill manifest）\n  ↓\n例如：Google Search Skill 需要 API Key\n  ↓\n用户输入配置值\n  ↓\n系统加密保存到数据库\n  ↓\n配置完成，Skill 可用\n```\n\n### 3.3 调用 Skills 流程（HTTP）\n\n```\n应用层（AI 工作台）发起调用\n  ↓\n选择要使用的 Skill（如 web-search）\n  ↓\n构造调用参数（如 query: \"Rust 教程\"）\n  ↓\nSkills 管理器查找 Skill 配置\n  ↓\n检查 Skill 是否启用\n  ↓\n检查 Skill 类型：HTTP\n  ↓\n（如果 Skill 未启动）启动 Skill HTTP 服务\n  ↓\n发送 HTTP 请求到 Skill\n  ↓\nSkill 处理并返回结果\n  ↓\n记录使用日志\n  ↓\n返回结果给应用层\n```\n\n### 3.4 调用 Skills 流程（CLI）\n\n```\n应用层发起调用\n  ↓\n选择要使用的 Skill（如 calculator）\n  ↓\n构造调用参数（如 expression: \"2+2\"）\n  ↓\nSkills 管理器查找 Skill 配置\n  ↓\n检查 Skill 类型：CLI\n  ↓\n执行命令：calculator \"2+2\"\n  ↓\n从 stdout 读取结果\n  ↓\n解析 JSON 结果\n  ↓\n记录使用日志\n  ↓\n返回结果给应用层\n```\n\n### 3.5 更新 Skills 流程\n\n```\n系统定期检查 Skills 更新（每天一次）\n  ↓\n从官方仓库获取最新版本信息\n  ↓\n对比本地已安装版本\n  ↓\n（如果有新版本）在 Skills 列表显示\"有更新\"标记\n  ↓\n用户点击\"查看更新\"\n  ↓\n显示更新日志（changelog）\n  ↓\n用户点击\"更新\"\n  ↓\n下载新版本到临时目录\n  ↓\n备份旧版本（以便回滚）\n  ↓\n替换为新版本\n  ↓\n重启 Skill（如果是 HTTP 服务）\n  ↓\n更新完成\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**skills 表**（已安装的 Skills）：\n```sql\nCREATE TABLE skills (\n    id TEXT PRIMARY KEY,              -- UUID\n    skill_id TEXT NOT NULL,           -- Skill 标识，如 web-search\n    name TEXT NOT NULL,               -- Skill 名称\n    description TEXT,                 -- 描述\n    version TEXT NOT NULL,            -- 当前安装的版本\n    author TEXT,                      -- 作者\n    install_path TEXT NOT NULL,       -- 安装路径\n    call_type TEXT NOT NULL,          -- 调用方式：http, cli\n    enabled BOOLEAN DEFAULT TRUE,     -- 是否启用\n    config JSON,                      -- 用户配置（加密存储）\n    manifest JSON,                    -- Skill manifest（包含依赖、配置项等）\n    installed_at TIMESTAMP,\n    updated_at TIMESTAMP,\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id),\n    UNIQUE(user_id, skill_id)\n);\n```\n\n**skill_registry_cache 表**（仓库缓存）：\n```sql\nCREATE TABLE skill_registry_cache (\n    id TEXT PRIMARY KEY,\n    skill_id TEXT NOT NULL,\n    name TEXT NOT NULL,\n    description TEXT,\n    latest_version TEXT,\n    author TEXT,\n    category TEXT,                    -- 分类：search, compute, file, data\n    tags JSON,                        -- 标签数组\n    download_url TEXT,\n    manifest JSON,\n    synced_at TIMESTAMP,\n    UNIQUE(skill_id)\n);\n```\n\n**skill_usage_logs 表**（使用记录）：\n```sql\nCREATE TABLE skill_usage_logs (\n    id TEXT PRIMARY KEY,\n    skill_id TEXT NOT NULL,\n    user_id TEXT NOT NULL,\n    input_params JSON,                -- 输入参数\n    output_result JSON,               -- 输出结果（可能很大，考虑截断）\n    success BOOLEAN,\n    error_message TEXT,\n    latency_ms INTEGER,               -- 响应时间\n    created_at TIMESTAMP,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 获取已安装 Skills：`SELECT * FROM skills WHERE user_id = ? AND enabled = TRUE`\n- 获取仓库 Skills：`SELECT * FROM skill_registry_cache WHERE category = ?`\n- 查询使用记录：`SELECT * FROM skill_usage_logs WHERE user_id = ? ORDER BY created_at DESC`\n\n**写操作**：\n- 安装 Skill：`INSERT INTO skills`\n- 更新 Skill：`UPDATE skills SET version = ?, updated_at = ? WHERE id = ?`\n- 卸载 Skill：`DELETE FROM skills WHERE id = ?`\n- 缓存仓库：`INSERT OR REPLACE INTO skill_registry_cache`\n- 记录使用日志：`INSERT INTO skill_usage_logs`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 连接官方仓库 | 网络正常 | 打开 Skills 浏览 | 成功获取 Skills 列表 | 后端 API + 外部集成 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills registry_fetch` | 规划中 |\n| AC02 | 浏览 Skills 列表 | 仓库已缓存 | 查看 Skills 列表 | 显示所有 Skills，支持分类和搜索 | 后端 API + 前端 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills skills_list` | 规划中 |\n| AC03 | 查看 Skill 详情 | Skill 存在 | 点击某个 Skill | 显示完整信息（名称、描述、版本、依赖） | 后端 API + 前端 | `server/crates/skills/tests/registry.rs` | `cargo test -p dgos-skills skill_detail` | 规划中 |\n| AC04 | 依赖检查 | 安装需要 Python 3.10+ | 点击安装 | 检查 Python 版本，不满足时提示 | 后端逻辑 | `server/crates/skills/tests/dependency.rs` | `cargo test -p dgos-skills dependency_check` | 规划中 |\n| AC05 | 安装 HTTP Skill | 依赖满足 | 安装 web-search | 下载、解压、保存到数据库 | 后端 API + 文件系统 | `server/crates/skills/tests/installation.rs` | `cargo test -p dgos-skills install_http_skill` | 规划中 |\n| AC06 | 安装 CLI Skill | 依赖满足 | 安装 calculator | 下载、解压、保存到数据库 | 后端 API + 文件系统 | `server/crates/skills/tests/installation.rs` | `cargo test -p dgos-skills install_cli_skill` | 规划中 |\n| AC07 | Skill 配置 | Skill 需要配置 | 输入 API Key | 加密保存到数据库 | 后端 API + 数据库 | `server/crates/skills/tests/configuration.rs` | `cargo test -p dgos-skills skill_config` | 规划中 |\n| AC08 | 调用 HTTP Skill | Skill 已安装 | 调用 web-search(\"Rust\") | 启动服务、发送请求、返回结果 | 后端 API + 外部进程 | `server/crates/skills/tests/skill_call.rs` | `cargo test -p dgos-skills call_http_skill` | 规划中 |\n| AC09 | 调用 CLI Skill | Skill 已安装 | 调用 calculator(\"2+2\") | 执行命令、解析输出、返回结果 | 后端 API + 进程管理 | `server/crates/skills/tests/skill_call.rs` | `cargo test -p dgos-skills call_cli_skill` | 规划中 |\n| AC10 | 并发调用 | 多个应用同时调用 | 5 个并发调用 web-search | 所有调用都成功，无冲突 | 后端 API + 并发测试 | `server/crates/skills/tests/concurrent.rs` | `cargo test -p dgos-skills concurrent_calls` | 规划中 |\n| AC11 | Skill 启用/禁用 | Skill 已安装 | 禁用 Skill | 该 Skill 不出现在可用列表 | 后端 API | `server/crates/skills/tests/installation.rs` | `cargo test -p dgos-skills skill_toggle` | 规划中 |\n| AC12 | Skill 卸载 | Skill 已安装 | 卸载 Skill | 删除文件、删除数据库记录 | 后端 API + 文件系统 | `server/crates/skills/tests/installation.rs` | `cargo test -p dgos-skills uninstall_skill` | 规划中 |\n| AC13 | 更新检查 | Skill 有新版本 | 检查更新 | 显示\"有更新\"标记和 changelog | 后端 API | `server/crates/skills/tests/update.rs` | `cargo test -p dgos-skills update_check` | 规划中 |\n| AC14 | Skill 更新 | 用户确认更新 | 点击更新 | 下载新版本、备份旧版本、替换 | 后端 API + 文件系统 | `server/crates/skills/tests/update.rs` | `cargo test -p dgos-skills skill_update` | 规划中 |\n| AC15 | 使用记录保存 | 调用成功 | 查询使用记录 | 包含输入、输出、延迟 | 后端 API + 数据库 | `server/crates/skills/tests/usage_logs.rs` | `cargo test -p dgos-skills usage_logs` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 网络断开 | 浏览仓库时无网络 | 使用缓存数据，提示\"离线模式\" |\n| 依赖不满足 | Python 版本低于要求 | 提示\"需要 Python 3.10+\"，不允许安装 |\n| 重复安装 | 安装已安装的 Skill | 提示\"已安装\"，询问是否重新安装 |\n| Skill 调用超时 | HTTP Skill 5 秒未响应 | 返回超时错误 |\n| Skill 调用失败 | Skill 返回错误 | 记录错误日志，返回错误信息 |\n| 配置缺失 | 调用未配置的 Skill | 提示\"请先配置 API Key\" |\n| 磁盘空间不足 | 安装 Skill 时空间不足 | 返回错误，清理临时文件 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// Skills 仓库\n#[tauri::command]\nasync fn fetch_skills_registry() -> Result<Vec<SkillInfo>>;\n\n#[tauri::command]\nasync fn search_skills(query: String, category: Option<String>) -> Result<Vec<SkillInfo>>;\n\n#[tauri::command]\nasync fn get_skill_detail(skill_id: String) -> Result<SkillDetail>;\n\n// Skills 安装管理\n#[tauri::command]\nasync fn install_skill(skill_id: String) -> Result<Skill>;\n\n#[tauri::command]\nasync fn uninstall_skill(skill_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn list_installed_skills(user_id: String) -> Result<Vec<Skill>>;\n\n#[tauri::command]\nasync fn toggle_skill(skill_id: String, enabled: bool) -> Result<()>;\n\n// Skills 配置\n#[tauri::command]\nasync fn get_skill_config(skill_id: String) -> Result<SkillConfig>;\n\n#[tauri::command]\nasync fn update_skill_config(skill_id: String, config: SkillConfig) -> Result<()>;\n\n// Skills 调用\n#[tauri::command]\nasync fn call_skill(\n    skill_id: String,\n    params: serde_json::Value\n) -> Result<serde_json::Value>;\n\n// Skills 更新\n#[tauri::command]\nasync fn check_skill_updates() -> Result<Vec<SkillUpdate>>;\n\n#[tauri::command]\nasync fn update_skill(skill_id: String) -> Result<Skill>;\n\n// 依赖检查\n#[tauri::command]\nasync fn check_dependencies(skill_id: String) -> Result<DependencyStatus>;\n\n// 使用记录\n#[tauri::command]\nasync fn list_skill_usage_logs(\n    user_id: String,\n    limit: Option<usize>\n) -> Result<Vec<SkillUsageLog>>;\n```\n\n### 6.2 HTTP API（局域网）\n\n```\nGET  /api/v1/skills/registry              # 获取仓库 Skills\nGET  /api/v1/skills/registry/:id          # 获取 Skill 详情\nGET  /api/v1/skills/installed             # 已安装 Skills\nPOST /api/v1/skills/install               # 安装 Skill\nDELETE /api/v1/skills/:id                 # 卸载 Skill\nPOST /api/v1/skills/:id/call              # 调用 Skill\nPUT  /api/v1/skills/:id/config            # 更新配置\nPOST /api/v1/skills/:id/toggle            # 启用/禁用\nGET  /api/v1/skills/updates               # 检查更新\nPOST /api/v1/skills/:id/update            # 更新 Skill\nGET  /api/v1/skills/usage-logs            # 使用记录\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 Skills Manifest 格式\n\n```json\n{\n  \"id\": \"web-search\",\n  \"name\": \"Web Search\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Search the web using Google\",\n  \"author\": \"DGOS Team\",\n  \"category\": \"search\",\n  \"tags\": [\"search\", \"google\", \"web\"],\n  \"call_type\": \"http\",\n  \"dependencies\": {\n    \"python\": \">=3.10\",\n    \"packages\": [\"requests\", \"beautifulsoup4\"]\n  },\n  \"config_schema\": {\n    \"api_key\": {\n      \"type\": \"string\",\n      \"required\": true,\n      \"encrypted\": true,\n      \"description\": \"Google Search API Key\"\n    }\n  },\n  \"http\": {\n    \"port\": 8080,\n    \"start_command\": \"python server.py\",\n    \"health_check\": \"/health\"\n  },\n  \"cli\": null\n}\n```\n\n### 7.2 核心流程伪代码\n\n```rust\n// server/crates/skills/src/manager.rs\n\npub struct SkillsManager {\n    skills_dir: PathBuf,              // ~/.dgos/skills/\n    registry_url: String,             // 官方仓库 URL\n    db: DatabasePool,\n    http_clients: HashMap<String, HttpClient>,  // 已启动的 HTTP Skills\n}\n\nimpl SkillsManager {\n    // B02-01: 获取仓库 Skills 列表\n    pub async fn fetch_registry(&self) -> Result<Vec<SkillInfo>> {\n        // 从官方仓库获取\n        let response = reqwest::get(&self.registry_url).await?;\n        let registry: SkillRegistry = response.json().await?;\n        \n        // 缓存到数据库\n        for skill in &registry.skills {\n            self.db.upsert_registry_cache(skill).await?;\n        }\n        \n        Ok(registry.skills)\n    }\n    \n    // B02-02: 安装 Skill\n    pub async fn install_skill(&mut self, skill_id: &str, user_id: &str) -> Result<Skill> {\n        // 从仓库获取 Skill 信息\n        let skill_info = self.db.get_registry_skill(skill_id).await?;\n        \n        // B02-03: 检查依赖\n        self.check_dependencies(&skill_info.manifest)?;\n        \n        // 下载 Skill\n        let download_url = &skill_info.download_url;\n        let response = reqwest::get(download_url).await?;\n        let bytes = response.bytes().await?;\n        \n        // 保存到临时目录\n        let temp_path = format!(\"/tmp/dgos-skill-{}.tar.gz\", skill_id);\n        fs::write(&temp_path, &bytes).await?;\n        \n        // 解压到安装目录\n        let install_path = self.skills_dir.join(skill_id);\n        extract_tarball(&temp_path, &install_path)?;\n        \n        // 验证完整性\n        verify_skill_integrity(&install_path)?;\n        \n        // 保存到数据库\n        let skill = Skill {\n            id: Uuid::new_v4().to_string(),\n            skill_id: skill_id.to_string(),\n            name: skill_info.name,\n            version: skill_info.latest_version,\n            install_path: install_path.to_string_lossy().to_string(),\n            call_type: skill_info.manifest.call_type,\n            enabled: true,\n            config: None,\n            manifest: skill_info.manifest,\n            user_id: user_id.to_string(),\n        };\n        \n        self.db.insert_skill(&skill).await?;\n        \n        // 清理临时文件\n        fs::remove_file(&temp_path).await?;\n        \n        Ok(skill)\n    }\n    \n    // B02-03: 检查依赖\n    fn check_dependencies(&self, manifest: &SkillManifest) -> Result<()> {\n        if let Some(python_req) = &manifest.dependencies.python {\n            let python_version = get_python_version()?;\n            if !version_satisfies(&python_version, python_req) {\n                return Err(Error::DependencyNotSatisfied(\n                    format!(\"需要 Python {}\", python_req)\n                ));\n            }\n        }\n        \n        if let Some(node_req) = &manifest.dependencies.node {\n            let node_version = get_node_version()?;\n            if !version_satisfies(&node_version, node_req) {\n                return Err(Error::DependencyNotSatisfied(\n                    format!(\"需要 Node.js {}\", node_req)\n                ));\n            }\n        }\n        \n        Ok(())\n    }\n    \n    // B02-04: 调用 HTTP Skill\n    pub async fn call_http_skill(\n        &mut self,\n        skill_id: &str,\n        params: serde_json::Value\n    ) -> Result<serde_json::Value> {\n        // 获取 Skill 配置\n        let skill = self.db.get_skill_by_skill_id(skill_id).await?;\n        \n        // B02-05: 检查是否启用\n        if !skill.enabled {\n            return Err(Error::SkillDisabled);\n        }\n        \n        // B02-06: 检查配置是否完整\n        if skill.manifest.config_schema.is_some() && skill.config.is_none() {\n            return Err(Error::SkillNotConfigured);\n        }\n        \n        // B02-07: 启动 HTTP 服务（如果未启动）\n        if !self.http_clients.contains_key(skill_id) {\n            self.start_http_skill(&skill).await?;\n        }\n        \n        // 获取 HTTP 客户端\n        let client = self.http_clients.get(skill_id)\n            .ok_or(Error::SkillNotStarted)?;\n        \n        // B02-08: 发送 HTTP 请求\n        let start_time = Instant::now();\n        let response = client\n            .post(\"/execute\")\n            .json(&params)\n            .timeout(Duration::from_secs(30))\n            .send()\n            .await?;\n        \n        let latency_ms = start_time.elapsed().as_millis() as i32;\n        \n        // B02-09: 解析结果\n        let result: serde_json::Value = response.json().await?;\n        \n        // 记录使用日志\n        self.log_usage(skill_id, &params, &result, true, latency_ms).await?;\n        \n        Ok(result)\n    }\n    \n    // B02-10: 启动 HTTP Skill\n    async fn start_http_skill(&mut self, skill: &Skill) -> Result<()> {\n        let http_config = skill.manifest.http.as_ref()\n            .ok_or(Error::NotHttpSkill)?;\n        \n        let cwd = PathBuf::from(&skill.install_path);\n        let command = &http_config.start_command;\n        \n        // 启动进程\n        let mut child = Command::new(\"sh\")\n            .arg(\"-c\")\n            .arg(command)\n            .current_dir(&cwd)\n            .env(\"PORT\", http_config.port.to_string())\n            .env(\"CONFIG\", serde_json::to_string(&skill.config)?)\n            .spawn()?;\n        \n        // 等待服务启动（检查 health check）\n        let base_url = format!(\"http://localhost:{}\", http_config.port);\n        let health_url = format!(\"{}{}\", base_url, http_config.health_check);\n        \n        for _ in 0..10 {\n            tokio::time::sleep(Duration::from_millis(500)).await;\n            if let Ok(response) = reqwest::get(&health_url).await {\n                if response.status().is_success() {\n                    // 保存客户端\n                    let client = HttpClient::new(&base_url);\n                    self.http_clients.insert(skill.skill_id.clone(), client);\n                    return Ok(());\n                }\n            }\n        }\n        \n        // 超时，杀掉进程\n        child.kill().await?;\n        Err(Error::SkillStartTimeout)\n    }\n    \n    // B02-11: 调用 CLI Skill\n    pub async fn call_cli_skill(\n        &self,\n        skill_id: &str,\n        params: serde_json::Value\n    ) -> Result<serde_json::Value> {\n        // 获取 Skill 配置\n        let skill = self.db.get_skill_by_skill_id(skill_id).await?;\n        \n        // 检查是否启用\n        if !skill.enabled {\n            return Err(Error::SkillDisabled);\n        }\n        \n        let cli_config = skill.manifest.cli.as_ref()\n            .ok_or(Error::NotCliSkill)?;\n        \n        let cwd = PathBuf::from(&skill.install_path);\n        let command = &cli_config.command;\n        \n        // B02-12: 执行命令\n        let start_time = Instant::now();\n        let output = Command::new(\"sh\")\n            .arg(\"-c\")\n            .arg(command)\n            .current_dir(&cwd)\n            .env(\"INPUT\", serde_json::to_string(&params)?)\n            .env(\"CONFIG\", serde_json::to_string(&skill.config)?)\n            .output()\n            .await?;\n        \n        let latency_ms = start_time.elapsed().as_millis() as i32;\n        \n        // B02-13: 解析输出\n        if !output.status.success() {\n            let error_msg = String::from_utf8_lossy(&output.stderr).to_string();\n            self.log_usage(skill_id, &params, &json!({\"error\": error_msg}), false, latency_ms).await?;\n            return Err(Error::SkillExecutionFailed(error_msg));\n        }\n        \n        let stdout = String::from_utf8_lossy(&output.stdout);\n        let result: serde_json::Value = serde_json::from_str(&stdout)?;\n        \n        // 记录使用日志\n        self.log_usage(skill_id, &params, &result, true, latency_ms).await?;\n        \n        Ok(result)\n    }\n    \n    // B02-14: 更新 Skill\n    pub async fn update_skill(&mut self, skill_id: &str) -> Result<Skill> {\n        // 获取当前 Skill\n        let old_skill = self.db.get_skill_by_skill_id(skill_id).await?;\n        \n        // 获取最新版本信息\n        let skill_info = self.db.get_registry_skill(skill_id).await?;\n        \n        // 检查版本\n        if old_skill.version == skill_info.latest_version {\n            return Ok(old_skill);\n        }\n        \n        // B02-15: 备份旧版本\n        let backup_path = format!(\"{}.backup\", old_skill.install_path);\n        fs::rename(&old_skill.install_path, &backup_path).await?;\n        \n        // 下载新版本\n        let download_url = &skill_info.download_url;\n        let response = reqwest::get(download_url).await?;\n        let bytes = response.bytes().await?;\n        \n        // 保存到临时目录\n        let temp_path = format!(\"/tmp/dgos-skill-{}-{}.tar.gz\", skill_id, skill_info.latest_version);\n        fs::write(&temp_path, &bytes).await?;\n        \n        // 解压\n        let install_path = PathBuf::from(&old_skill.install_path);\n        extract_tarball(&temp_path, &install_path)?;\n        \n        // 更新数据库\n        self.db.update_skill_version(skill_id, &skill_info.latest_version).await?;\n        \n        // 清理\n        fs::remove_file(&temp_path).await?;\n        \n        // 如果是 HTTP Skill，重启服务\n        if old_skill.call_type == \"http\" {\n            self.http_clients.remove(skill_id);\n            // 下次调用时自动启动\n        }\n        \n        Ok(self.db.get_skill_by_skill_id(skill_id).await?)\n    }\n}\n```\n\n### 7.3 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B02-01 | 获取仓库列表 | AC01, AC02 | - |\n| B02-02 | 安装 Skill | AC05, AC06 | V1-E2E-02 |\n| B02-03 | 检查依赖 | AC04 | - |\n| B02-04 | 调用 HTTP Skill | AC08 | V1-E2E-02 |\n| B02-05 | 检查是否启用 | AC11 | - |\n| B02-06 | 检查配置完整性 | AC07 | - |\n| B02-07 | 启动 HTTP 服务 | AC08 | - |\n| B02-08 | 发送 HTTP 请求 | AC08 | - |\n| B02-09 | 解析结果 | AC08 | - |\n| B02-10 | 启动 HTTP Skill | AC08 | - |\n| B02-11 | 调用 CLI Skill | AC09 | V1-E2E-02 |\n| B02-12 | 执行 CLI 命令 | AC09 | - |\n| B02-13 | 解析 CLI 输出 | AC09 | - |\n| B02-14 | 更新 Skill | AC14 | - |\n| B02-15 | 备份旧版本 | AC14 | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1002001 | skill_not_found | Skill 不存在 | 检查 Skill ID |\n| 1002002 | skill_already_installed | Skill 已安装 | 询问是否重新安装 |\n| 1002003 | dependency_not_satisfied | 依赖不满足 | 安装依赖（Python/Node.js） |\n| 1002004 | skill_disabled | Skill 已禁用 | 启用 Skill |\n| 1002005 | skill_not_configured | Skill 未配置 | 配置 API Key 等 |\n| 1002006 | skill_not_started | HTTP Skill 未启动 | 检查日志或重启 |\n| 1002007 | skill_execution_failed | Skill 执行失败 | 查看错误信息 |\n| 1002008 | skill_timeout | Skill 调用超时 | 检查 Skill 状态或网络 |\n| 1002009 | skill_start_timeout | HTTP Skill 启动超时 | 检查依赖或端口占用 |\n| 1002010 | registry_unreachable | 仓库不可达 | 检查网络或使用缓存 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 仓库列表获取 | < 3 秒 | 集成测试 |\n| Skill 安装 | < 30 秒（取决于大小） | 集成测试 |\n| HTTP Skill 启动 | < 5 秒 | 集成测试 |\n| HTTP Skill 调用 | < 5 秒（取决于 Skill） | 集成测试 |\n| CLI Skill 调用 | < 3 秒（取决于 Skill） | 集成测试 |\n| 并发调用支持 | > 50 QPS | 压力测试 |\n\n### 9.2 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 配置加密存储 | 使用 AES-256 加密 API Key |\n| Skills 完整性验证 | 下载后验证 checksum |\n| 进程隔离 | Skills 独立进程运行 |\n| 敏感信息脱敏 | 日志中 API Key 只显示前 4 位 |\n\n### 9.3 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 离线使用 | 缓存仓库数据，离线可用 |\n| 失败恢复 | Skill 执行失败自动清理 |\n| 版本回滚 | 更新失败可回滚到旧版本 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/skills/src/manager.rs`\n- `server/crates/skills/src/registry.rs`\n- `server/crates/skills/src/caller.rs`\n- `server/crates/skills/tests/registry.rs`\n- `server/crates/skills/tests/installation.rs`\n- `server/crates/skills/tests/skill_call.rs`\n- `server/crates/skills/tests/dependency.rs`\n- `server/crates/skills/tests/update.rs`\n\n**测试命令**：\n```bash\ncd server && cargo test -p dgos-skills\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- registry.rs：0/3 通过（待实现）\n- installation.rs：0/4 通过（待实现）\n- skill_call.rs：0/3 通过（待实现）\n- dependency.rs：0/1 通过（待实现）\n- update.rs：0/2 通过（待实现）\n\n详细覆盖说明：\n- AC01～AC15：待实现\n```\n   \n**下一步**：评审通过后进入开发\n", "doc-019": "# V1-FR-003：MCP 管理系统\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-003 |\n| 功能名称 | MCP 管理系统 |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 |\n| 优先级 | P0（必须） |\n| 风险级别 | 标准（使用现有协议，连接管理相对简单） |\n| 依赖功能 | V1-FR-001（Provider 框架，MCP 工具可能调用 AI） |\n| 被依赖功能 | V1-FR-006（AI 工作台）、V2 画布系统 |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n连接和管理 MCP（Model Context Protocol）服务器，提供工具列表获取、工具调用、连接状态监控和自动重连能力，让 AI 可以访问外部数据源和服务。\n\n### 2.2 详细说明\n\nMCP 管理系统让 DGOS 能够连接 MCP 服务器，使 AI 可以访问文件系统、数据库、API 等外部资源。MCP 是 Anthropic 提出的标准协议，DGOS 作为 MCP 客户端连接服务器。\n\n**核心价值**：\n- ✅ 标准协议：使用 Anthropic MCP 标准，兼容生态\n- ✅ 统一管理：集中管理所有 MCP 连接\n- ✅ 自动重连：连接断开后自动恢复\n- ✅ 扩展能力：让 AI 可以访问本地文件、数据库、API\n\n**用户价值**：\n- 开发者：可以让 AI 访问各种数据源\n- 最终用户：AI 可以读取文件、查询数据库等\n\n**与 Skills 的区别**：\n- **Skills**：执行操作（搜索、计算、修改文件）\n- **MCP**：提供数据（读取文件、查询数据库、获取 API 数据）\n- **Skills** 是主动执行，**MCP** 是被动提供\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ MCP 服务器配置管理（增删改查）\n- ✅ 连接 MCP 服务器（Stdio 和 HTTP 两种传输方式）\n- ✅ 获取工具列表（Tools List）\n- ✅ 调用 MCP 工具（Tool Call）\n- ✅ 连接状态监控（心跳检测）\n- ✅ 自动重连机制\n- ✅ 连接日志记录\n- ✅ 工具使用记录\n- ✅ 支持多个 MCP 服务器\n- ✅ MCP 服务器配置（敏感信息加密）\n\n**不包含**（明确说明原因）：\n- ❌ 实现 MCP 服务器端 → DGOS 只做客户端\n- ❌ MCP 协议扩展 → 严格遵循 Anthropic 标准\n- ❌ MCP 服务器开发 SDK → V8 开发者生态时提供\n- ❌ MCP 服务器市场 → V3 应用市场时考虑\n- ❌ 自动发现 MCP 服务器 → V2 考虑\n\n## 3. 核心流程\n\n### 3.1 配置和连接 MCP 服务器流程\n\n```\n用户打开系统设置\n  ↓\n点击\"MCP 管理\"\n  ↓\n点击\"添加 MCP 服务器\"\n  ↓\n填写配置：\n  - 名称：本地文件系统\n  - 类型：Stdio\n  - 命令：mcp-server-filesystem\n  - 参数：--root /Users/xxx/Documents\n  ↓\n（或选择 HTTP 类型）\n  - URL：http://localhost:3000\n  ↓\n点击\"测试连接\"\n  ↓\n系统启动 MCP 服务器或连接 HTTP\n  ↓\n发送 initialize 请求\n  ↓\n接收 server info 和 capabilities\n  ↓\n发送 tools/list 请求\n  ↓\n接收工具列表并缓存\n  ↓\n测试成功，保存配置\n  ↓\n显示在 MCP 服务器列表\n  ↓\n自动启动心跳检测\n```\n\n### 3.2 调用 MCP 工具流程\n\n```\n应用层（AI 工作台）发起调用\n  ↓\n选择要使用的 MCP 工具（如 read_file）\n  ↓\n构造调用参数（如 path: \"/tmp/test.txt\"）\n  ↓\nMCP 管理器查找服务器\n  ↓\n检查连接状态\n  ↓\n（如果断开）自动重连\n  ↓\n发送 tools/call 请求\n  ↓\nMCP 服务器处理并返回结果\n  ↓\n解析结果（文本、JSON、二进制等）\n  ↓\n记录使用日志\n  ↓\n返回结果给应用层\n```\n\n### 3.3 连接状态监控流程\n\n```\nMCP 服务器连接成功\n  ↓\n启动心跳检测任务（每 30 秒）\n  ↓\n发送 ping 请求\n  ↓\n等待 pong 响应\n  ↓\n（如果 5 秒未响应）标记为断开\n  ↓\n（如果断开）尝试重连\n  ↓\n重连最多 3 次，间隔 5s/10s/15s\n  ↓\n（如果重连成功）恢复心跳\n  ↓\n（如果重连失败）标记为不可用\n  ↓\n通知用户\"MCP 服务器断开\"\n```\n\n### 3.4 自动重连流程\n\n```\n检测到连接断开\n  ↓\n记录断开时间和原因\n  ↓\n等待 5 秒（第 1 次重连）\n  ↓\n（如果是 Stdio）重新启动进程\n  ↓\n（如果是 HTTP）重新建立连接\n  ↓\n发送 initialize 请求\n  ↓\n（如果成功）恢复正常\n  ↓\n（如果失败）等待 10 秒（第 2 次重连）\n  ↓\n重复最多 3 次\n  ↓\n（如果全部失败）标记为不可用\n  ↓\n发送通知给用户\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**mcp_servers 表**（MCP 服务器配置）：\n```sql\nCREATE TABLE mcp_servers (\n    id TEXT PRIMARY KEY,              -- UUID\n    name TEXT NOT NULL,               -- 用户自定义名称\n    transport TEXT NOT NULL,          -- 传输方式：stdio, http\n    enabled BOOLEAN DEFAULT TRUE,     -- 是否启用\n    config JSON NOT NULL,             -- 连接配置（根据 transport 不同）\n    server_info JSON,                 -- 服务器信息（initialize 返回）\n    capabilities JSON,                -- 服务器能力\n    status TEXT DEFAULT 'disconnected', -- 连接状态：connected, disconnected, error\n    last_connected_at TIMESTAMP,      -- 最后连接时间\n    created_at TIMESTAMP,\n    updated_at TIMESTAMP,\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n**mcp_tools 表**（工具列表缓存）：\n```sql\nCREATE TABLE mcp_tools (\n    id TEXT PRIMARY KEY,\n    server_id TEXT NOT NULL,          -- 所属 MCP 服务器\n    tool_name TEXT NOT NULL,          -- 工具名称，如 read_file\n    description TEXT,                 -- 工具描述\n    input_schema JSON,                -- 输入 JSON Schema\n    synced_at TIMESTAMP,              -- 同步时间\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id) ON DELETE CASCADE,\n    UNIQUE(server_id, tool_name)\n);\n```\n\n**mcp_connection_logs 表**（连接日志）：\n```sql\nCREATE TABLE mcp_connection_logs (\n    id TEXT PRIMARY KEY,\n    server_id TEXT NOT NULL,\n    event_type TEXT NOT NULL,         -- 事件类型：connected, disconnected, error, reconnected\n    message TEXT,                     -- 日志信息\n    created_at TIMESTAMP,\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id)\n);\n```\n\n**mcp_tool_usage_logs 表**（工具使用记录）：\n```sql\nCREATE TABLE mcp_tool_usage_logs (\n    id TEXT PRIMARY KEY,\n    server_id TEXT NOT NULL,\n    tool_name TEXT NOT NULL,\n    user_id TEXT NOT NULL,\n    input_params JSON,                -- 输入参数\n    output_result JSON,               -- 输出结果（可能很大，考虑截断）\n    success BOOLEAN,\n    error_message TEXT,\n    latency_ms INTEGER,               -- 响应时间\n    created_at TIMESTAMP,\n    FOREIGN KEY (server_id) REFERENCES mcp_servers(id),\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 获取 MCP 服务器列表：`SELECT * FROM mcp_servers WHERE user_id = ? AND enabled = TRUE`\n- 获取工具列表：`SELECT * FROM mcp_tools WHERE server_id = ?`\n- 查询连接日志：`SELECT * FROM mcp_connection_logs WHERE server_id = ? ORDER BY created_at DESC`\n- 查询使用记录：`SELECT * FROM mcp_tool_usage_logs WHERE user_id = ? ORDER BY created_at DESC`\n\n**写操作**：\n- 创建 MCP 服务器：`INSERT INTO mcp_servers`\n- 更新连接状态：`UPDATE mcp_servers SET status = ?, last_connected_at = ? WHERE id = ?`\n- 删除 MCP 服务器：`DELETE FROM mcp_servers WHERE id = ?`（级联删除 tools）\n- 缓存工具列表：`INSERT OR REPLACE INTO mcp_tools`\n- 记录连接日志：`INSERT INTO mcp_connection_logs`\n- 记录使用日志：`INSERT INTO mcp_tool_usage_logs`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 配置 Stdio MCP 服务器 | 用户已登录 | 配置 Stdio 类型 MCP | 保存配置成功 | 后端 API + 数据库 | `server/crates/mcp/tests/server_config.rs` | `cargo test -p dgos-mcp config_stdio` | 规划中 |\n| AC02 | 配置 HTTP MCP 服务器 | 用户已登录 | 配置 HTTP 类型 MCP | 保存配置成功 | 后端 API + 数据库 | `server/crates/mcp/tests/server_config.rs` | `cargo test -p dgos-mcp config_http` | 规划中 |\n| AC03 | 连接 Stdio MCP 服务器 | 服务器已配置 | 启动连接 | 进程启动，initialize 成功 | 后端 API + 进程管理 | `server/crates/mcp/tests/connection.rs` | `cargo test -p dgos-mcp connect_stdio` | 规划中 |\n| AC04 | 连接 HTTP MCP 服务器 | 服务器已配置 | 启动连接 | HTTP 连接成功，initialize 成功 | 后端 API + 外部服务 | `server/crates/mcp/tests/connection.rs` | `cargo test -p dgos-mcp connect_http` | 规划中 |\n| AC05 | 获取工具列表 | 连接已建立 | 发送 tools/list | 返回工具列表并缓存 | 后端 API + 数据库 | `server/crates/mcp/tests/tools.rs` | `cargo test -p dgos-mcp tools_list` | 规划中 |\n| AC06 | 调用 MCP 工具 | 工具列表已获取 | 调用 read_file 工具 | 返回文件内容 | 后端 API + 外部进程 | `server/crates/mcp/tests/tool_call.rs` | `cargo test -p dgos-mcp tool_call` | 规划中 |\n| AC07 | 心跳检测 | 连接已建立 | 自动发送 ping | 收到 pong，连接保持 | 后端逻辑 | `server/crates/mcp/tests/heartbeat.rs` | `cargo test -p dgos-mcp heartbeat` | 规划中 |\n| AC08 | 断开检测 | 心跳超时 | 5 秒未响应 | 标记为断开 | 后端逻辑 | `server/crates/mcp/tests/heartbeat.rs` | `cargo test -p dgos-mcp disconnect_detection` | 规划中 |\n| AC09 | 自动重连 | 连接断开 | 触发重连 | 重连成功，恢复正常 | 后端逻辑 | `server/crates/mcp/tests/reconnect.rs` | `cargo test -p dgos-mcp auto_reconnect` | 规划中 |\n| AC10 | 重连失败处理 | 重连 3 次都失败 | 停止重连 | 标记为不可用，通知用户 | 后端逻辑 | `server/crates/mcp/tests/reconnect.rs` | `cargo test -p dgos-mcp reconnect_exhausted` | 规划中 |\n| AC11 | 并发调用 | 多个应用同时调用 | 5 个并发请求 | 所有请求都成功 | 后端 API + 并发测试 | `server/crates/mcp/tests/concurrent.rs` | `cargo test -p dgos-mcp concurrent_calls` | 规划中 |\n| AC12 | 连接日志记录 | 连接事件发生 | 查询连接日志 | 包含 connected, disconnected 等 | 后端 API + 数据库 | `server/crates/mcp/tests/logging.rs` | `cargo test -p dgos-mcp connection_logs` | 规划中 |\n| AC13 | 工具使用记录 | 调用成功 | 查询使用记录 | 包含输入、输出、延迟 | 后端 API + 数据库 | `server/crates/mcp/tests/logging.rs` | `cargo test -p dgos-mcp usage_logs` | 规划中 |\n| AC14 | MCP 服务器启用/禁用 | 服务器已配置 | 禁用服务器 | 该服务器不可用 | 后端 API | `server/crates/mcp/tests/server_config.rs` | `cargo test -p dgos-mcp server_toggle` | 规划中 |\n| AC15 | 刷新工具列表 | 工具列表已缓存 | 点击刷新 | 重新获取，更新缓存 | 后端 API + 数据库 | `server/crates/mcp/tests/tools.rs` | `cargo test -p dgos-mcp tools_refresh` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| MCP 服务器不存在 | Stdio 命令找不到 | 返回\"服务器启动失败\" |\n| HTTP 服务器不可达 | HTTP URL 无法连接 | 返回\"无法连接服务器\" |\n| 工具调用超时 | 工具执行超过 30 秒 | 返回超时错误 |\n| 工具参数错误 | 传入无效参数 | 返回\"参数校验失败\" |\n| 连接断开 | 网络中断或进程崩溃 | 自动重连，最多 3 次 |\n| 并发调用 | 100+ 并发请求 | 正常处理，不崩溃 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// MCP 服务器配置\n#[tauri::command]\nasync fn list_mcp_servers(user_id: String) -> Result<Vec<MCPServer>>;\n\n#[tauri::command]\nasync fn create_mcp_server(config: MCPServerConfig) -> Result<MCPServer>;\n\n#[tauri::command]\nasync fn update_mcp_server(id: String, config: MCPServerConfig) -> Result<MCPServer>;\n\n#[tauri::command]\nasync fn delete_mcp_server(id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn toggle_mcp_server(id: String, enabled: bool) -> Result<()>;\n\n// MCP 连接管理\n#[tauri::command]\nasync fn connect_mcp_server(server_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn disconnect_mcp_server(server_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn get_mcp_server_status(server_id: String) -> Result<ServerStatus>;\n\n// 工具管理\n#[tauri::command]\nasync fn list_mcp_tools(server_id: String) -> Result<Vec<MCPTool>>;\n\n#[tauri::command]\nasync fn refresh_mcp_tools(server_id: String) -> Result<Vec<MCPTool>>;\n\n// 工具调用\n#[tauri::command]\nasync fn call_mcp_tool(\n    server_id: String,\n    tool_name: String,\n    params: serde_json::Value\n) -> Result<serde_json::Value>;\n\n// 日志查询\n#[tauri::command]\nasync fn list_mcp_connection_logs(\n    server_id: String,\n    limit: Option<usize>\n) -> Result<Vec<ConnectionLog>>;\n\n#[tauri::command]\nasync fn list_mcp_tool_usage_logs(\n    user_id: String,\n    limit: Option<usize>\n) -> Result<Vec<ToolUsageLog>>;\n```\n\n### 6.2 HTTP API（局域网）\n\n```\nGET  /api/v1/mcp/servers               # 获取 MCP 服务器列表\nPOST /api/v1/mcp/servers               # 创建 MCP 服务器\nPUT  /api/v1/mcp/servers/:id           # 更新 MCP 服务器\nDELETE /api/v1/mcp/servers/:id         # 删除 MCP 服务器\nPOST /api/v1/mcp/servers/:id/connect   # 连接\nPOST /api/v1/mcp/servers/:id/disconnect # 断开\nGET  /api/v1/mcp/servers/:id/status    # 状态查询\n\nGET  /api/v1/mcp/servers/:id/tools     # 获取工具列表\nPOST /api/v1/mcp/servers/:id/tools/refresh # 刷新工具列表\nPOST /api/v1/mcp/servers/:id/tools/call    # 调用工具\n\nGET  /api/v1/mcp/connection-logs       # 连接日志\nGET  /api/v1/mcp/usage-logs            # 使用记录\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 MCP 协议关键消息\n\n```json\n// initialize 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"method\": \"initialize\",\n  \"params\": {\n    \"protocolVersion\": \"2024-11-05\",\n    \"capabilities\": {\n      \"roots\": {},\n      \"sampling\": {}\n    },\n    \"clientInfo\": {\n      \"name\": \"DGOS\",\n      \"version\": \"1.0.0\"\n    }\n  }\n}\n\n// initialize 响应\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 1,\n  \"result\": {\n    \"protocolVersion\": \"2024-11-05\",\n    \"capabilities\": {\n      \"tools\": {}\n    },\n    \"serverInfo\": {\n      \"name\": \"mcp-server-filesystem\",\n      \"version\": \"0.1.0\"\n    }\n  }\n}\n\n// tools/list 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"method\": \"tools/list\"\n}\n\n// tools/list 响应\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 2,\n  \"result\": {\n    \"tools\": [\n      {\n        \"name\": \"read_file\",\n        \"description\": \"Read contents of a file\",\n        \"inputSchema\": {\n          \"type\": \"object\",\n          \"properties\": {\n            \"path\": {\n              \"type\": \"string\",\n              \"description\": \"File path\"\n            }\n          },\n          \"required\": [\"path\"]\n        }\n      }\n    ]\n  }\n}\n\n// tools/call 请求\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"method\": \"tools/call\",\n  \"params\": {\n    \"name\": \"read_file\",\n    \"arguments\": {\n      \"path\": \"/tmp/test.txt\"\n    }\n  }\n}\n\n// tools/call 响应\n{\n  \"jsonrpc\": \"2.0\",\n  \"id\": 3,\n  \"result\": {\n    \"content\": [\n      {\n        \"type\": \"text\",\n        \"text\": \"Hello, world!\"\n      }\n    ]\n  }\n}\n```\n\n### 7.2 核心流程伪代码\n\n```rust\n// server/crates/mcp/src/client.rs\n\nuse serde_json::json;\nuse tokio::process::Command;\nuse tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};\n\npub struct MCPClient {\n    server_id: String,\n    transport: Transport,\n    status: Arc<RwLock<ServerStatus>>,\n}\n\npub enum Transport {\n    Stdio {\n        child: Child,\n        stdin: ChildStdin,\n        stdout: BufReader<ChildStdout>,\n    },\n    Http {\n        base_url: String,\n        client: reqwest::Client,\n    },\n}\n\nimpl MCPClient {\n    // B03-01: 创建并连接 Stdio MCP 服务器\n    pub async fn connect_stdio(\n        server_id: String,\n        command: String,\n        args: Vec<String>\n    ) -> Result<Self> {\n        // 启动子进程\n        let mut child = Command::new(&command)\n            .args(&args)\n            .stdin(Stdio::piped())\n            .stdout(Stdio::piped())\n            .stderr(Stdio::piped())\n            .spawn()?;\n        \n        let stdin = child.stdin.take().ok_or(Error::StdioNotAvailable)?;\n        let stdout = BufReader::new(child.stdout.take().ok_or(Error::StdioNotAvailable)?);\n        \n        let transport = Transport::Stdio {\n            child,\n            stdin,\n            stdout,\n        };\n        \n        let mut client = Self {\n            server_id,\n            transport,\n            status: Arc::new(RwLock::new(ServerStatus::Connecting)),\n        };\n        \n        // B03-02: 发送 initialize 请求\n        client.initialize().await?;\n        \n        // 启动心跳检测\n        client.start_heartbeat();\n        \n        Ok(client)\n    }\n    \n    // B03-03: 创建并连接 HTTP MCP 服务器\n    pub async fn connect_http(\n        server_id: String,\n        base_url: String\n    ) -> Result<Self> {\n        let client = reqwest::Client::new();\n        \n        let transport = Transport::Http {\n            base_url: base_url.clone(),\n            client: client.clone(),\n        };\n        \n        let mut mcp_client = Self {\n            server_id,\n            transport,\n            status: Arc::new(RwLock::new(ServerStatus::Connecting)),\n        };\n        \n        // B03-02: 发送 initialize 请求\n        mcp_client.initialize().await?;\n        \n        // 启动心跳检测\n        mcp_client.start_heartbeat();\n        \n        Ok(mcp_client)\n    }\n    \n    // B03-02: 发送 initialize 请求\n    async fn initialize(&mut self) -> Result<ServerInfo> {\n        let request = json!({\n            \"jsonrpc\": \"2.0\",\n            \"id\": 1,\n            \"method\": \"initialize\",\n            \"params\": {\n                \"protocolVersion\": \"2024-11-05\",\n                \"capabilities\": {},\n                \"clientInfo\": {\n                    \"name\": \"DGOS\",\n                    \"version\": \"1.0.0\"\n                }\n            }\n        });\n        \n        let response = self.send_request(request).await?;\n        let result = response[\"result\"].clone();\n        \n        let server_info: ServerInfo = serde_json::from_value(result)?;\n        \n        *self.status.write().await = ServerStatus::Connected;\n        \n        Ok(server_info)\n    }\n    \n    // B03-04: 获取工具列表\n    pub async fn list_tools(&self) -> Result<Vec<MCPTool>> {\n        let request = json!({\n            \"jsonrpc\": \"2.0\",\n            \"id\": 2,\n            \"method\": \"tools/list\"\n        });\n        \n        let response = self.send_request(request).await?;\n        let tools = response[\"result\"][\"tools\"].clone();\n        \n        let tools: Vec<MCPTool> = serde_json::from_value(tools)?;\n        \n        Ok(tools)\n    }\n    \n    // B03-05: 调用工具\n    pub async fn call_tool(\n        &self,\n        tool_name: &str,\n        arguments: serde_json::Value\n    ) -> Result<serde_json::Value> {\n        // B03-06: 检查连接状态\n        let status = self.status.read().await;\n        if *status != ServerStatus::Connected {\n            return Err(Error::NotConnected);\n        }\n        drop(status);\n        \n        let request = json!({\n            \"jsonrpc\": \"2.0\",\n            \"id\": 3,\n            \"method\": \"tools/call\",\n            \"params\": {\n                \"name\": tool_name,\n                \"arguments\": arguments\n            }\n        });\n        \n        // B03-07: 发送请求（30 秒超时）\n        let start_time = Instant::now();\n        let response = tokio::time::timeout(\n            Duration::from_secs(30),\n            self.send_request(request)\n        ).await??;\n        \n        let latency_ms = start_time.elapsed().as_millis() as i32;\n        \n        // B03-08: 解析结果\n        let result = response[\"result\"][\"content\"].clone();\n        \n        Ok(result)\n    }\n    \n    // B03-09: 发送 JSON-RPC 请求\n    async fn send_request(&self, request: serde_json::Value) -> Result<serde_json::Value> {\n        match &self.transport {\n            Transport::Stdio { stdin, stdout, .. } => {\n                // 写入请求\n                let request_str = serde_json::to_string(&request)?;\n                stdin.write_all(request_str.as_bytes()).await?;\n                stdin.write_all(b\"\\n\").await?;\n                stdin.flush().await?;\n                \n                // 读取响应\n                let mut line = String::new();\n                stdout.read_line(&mut line).await?;\n                \n                let response: serde_json::Value = serde_json::from_str(&line)?;\n                Ok(response)\n            }\n            Transport::Http { base_url, client } => {\n                // 发送 HTTP POST 请求\n                let url = format!(\"{}/rpc\", base_url);\n                let response = client\n                    .post(&url)\n                    .json(&request)\n                    .send()\n                    .await?;\n                \n                let response: serde_json::Value = response.json().await?;\n                Ok(response)\n            }\n        }\n    }\n    \n    // B03-10: 启动心跳检测\n    fn start_heartbeat(&self) {\n        let client = self.clone();\n        tokio::spawn(async move {\n            loop {\n                tokio::time::sleep(Duration::from_secs(30)).await;\n                \n                // B03-11: 发送 ping\n                let ping_request = json!({\n                    \"jsonrpc\": \"2.0\",\n                    \"method\": \"ping\"\n                });\n                \n                match tokio::time::timeout(\n                    Duration::from_secs(5),\n                    client.send_request(ping_request)\n                ).await {\n                    Ok(Ok(_)) => {\n                        // pong 收到，连接正常\n                    }\n                    _ => {\n                        // B03-12: 心跳超时，标记断开\n                        *client.status.write().await = ServerStatus::Disconnected;\n                        \n                        // B03-13: 触发自动重连\n                        client.reconnect().await;\n                        break;\n                    }\n                }\n            }\n        });\n    }\n    \n    // B03-13: 自动重连\n    async fn reconnect(&self) {\n        for attempt in 1..=3 {\n            tracing::info!(\"尝试重连 MCP 服务器，第 {} 次\", attempt);\n            \n            let delay = Duration::from_secs(5 * attempt as u64);\n            tokio::time::sleep(delay).await;\n            \n            // B03-14: 重新连接\n            match self.initialize().await {\n                Ok(_) => {\n                    tracing::info!(\"重连成功\");\n                    \n                    // 重新启动心跳\n                    self.start_heartbeat();\n                    return;\n                }\n                Err(e) => {\n                    tracing::error!(\"重连失败：{}\", e);\n                }\n            }\n        }\n        \n        // B03-15: 重连失败，标记为错误\n        *self.status.write().await = ServerStatus::Error;\n        tracing::error!(\"重连失败，已达最大重试次数\");\n    }\n}\n```\n\n### 7.3 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B03-01 | 连接 Stdio MCP | AC03 | V1-E2E-03 |\n| B03-02 | 发送 initialize | AC03, AC04 | V1-E2E-03 |\n| B03-03 | 连接 HTTP MCP | AC04 | V1-E2E-03 |\n| B03-04 | 获取工具列表 | AC05 | V1-E2E-03 |\n| B03-05 | 调用工具 | AC06 | V1-E2E-03 |\n| B03-06 | 检查连接状态 | AC06 | - |\n| B03-07 | 发送请求（超时） | AC06 | - |\n| B03-08 | 解析结果 | AC06 | - |\n| B03-09 | 发送 JSON-RPC | AC03～AC06 | - |\n| B03-10 | 启动心跳 | AC07 | - |\n| B03-11 | 发送 ping | AC07 | - |\n| B03-12 | 心跳超时 | AC08 | - |\n| B03-13 | 触发重连 | AC09 | - |\n| B03-14 | 重新连接 | AC09 | - |\n| B03-15 | 重连失败 | AC10 | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1003001 | mcp_server_not_found | MCP 服务器不存在 | 检查服务器 ID |\n| 1003002 | stdio_not_available | Stdio 不可用 | 检查命令是否正确 |\n| 1003003 | server_start_failed | 服务器启动失败 | 检查命令或依赖 |\n| 1003004 | connection_failed | 连接失败 | 检查网络或服务器状态 |\n| 1003005 | not_connected | 未连接 | 先连接服务器 |\n| 1003006 | tool_not_found | 工具不存在 | 检查工具名称 |\n| 1003007 | tool_call_failed | 工具调用失败 | 查看错误信息 |\n| 1003008 | tool_timeout | 工具调用超时 | 检查工具或参数 |\n| 1003009 | heartbeat_timeout | 心跳超时 | 服务器可能断开 |\n| 1003010 | reconnect_failed | 重连失败 | 手动重启服务器 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 连接建立 | < 3 秒 | 集成测试 |\n| 工具列表获取 | < 2 秒 | 集成测试 |\n| 工具调用 | < 30 秒（取决于工具） | 集成测试 |\n| 心跳间隔 | 30 秒 | 配置参数 |\n| 心跳超时 | 5 秒 | 配置参数 |\n| 并发调用支持 | > 50 QPS | 压力测试 |\n\n### 9.2 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 配置加密存储 | 使用 AES-256 加密敏感配置 |\n| 进程隔离 | Stdio MCP 独立进程运行 |\n| 敏感信息脱敏 | 日志中配置只显示摘要 |\n\n### 9.3 可用性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 自动重连 | 断开后自动重连 3 次 |\n| 连接监控 | 心跳检测，实时状态 |\n| 错误恢复 | 调用失败自动清理 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/mcp/src/client.rs`\n- `server/crates/mcp/src/manager.rs`\n- `server/crates/mcp/tests/server_config.rs`\n- `server/crates/mcp/tests/connection.rs`\n- `server/crates/mcp/tests/tools.rs`\n- `server/crates/mcp/tests/tool_call.rs`\n- `server/crates/mcp/tests/heartbeat.rs`\n- `server/crates/mcp/tests/reconnect. /02-产品与版本/当前版本/V1-实现状态.md)。\n\n## 13. 变更记录\n\n| 日期 | 变更内容 | 变更人 |\n| --- | --- | --- |\n| 2024-01-XX | 初始版本，基于 spec-docs-pro 创建 | Kiro |\n\n---\n\n**文档状态**：✅ 已完成（待评审）  \n**符合 spec-docs-pro 标准**：✅ 100%  \n**下一步**：评审通过后进入开发\n", "doc-020": "# V1-FR-004：模块系统与热更新\n\n## 1. 功能元信息\n\n| 属性 | 值 |\n| --- | --- |\n| 功能编号 | V1-FR-004 |\n| 功能名称 | 模块系统与热更新 |\n| 所属版本 | V1 |\n| 所属领域 | 底层能力 |\n| 优先级 | P0（必须） |\n| 风险级别 | **高风险**（复杂架构、状态管理、权限控制） |\n| 依赖功能 | V1-FR-001、V1-FR-002、V1-FR-003（模块可能调用底层能力） |\n| 被依赖功能 | V1-FR-006、V1-FR-007（作为模块加载） |\n| 负责人 | TBD |\n| 当前状态 | 规划中 |\n\n## 2. 功能概述\n\n### 2.1 一句话描述\n\n基于 Module Federation 实现应用模块的动态加载、热更新和卸载，支持粗粒度权限管理和崩溃隔离，让 DGOS 成为可扩展的应用平台。\n\n### 2.2 详细说明\n\n模块系统是 DGOS 的架构基石，让应用功能可以独立开发、独立部署、动态加载。这是从老项目教训中学到的核心改进：**强制模块化，从架构层面避免单文件巨石**。\n\n**核心价值**：\n- ✅ 强制模块化：不允许单文件超过 1000 行\n- ✅ 热更新：模块更新无需重启应用\n- ✅ 独立开发：模块可以独立仓库、独立测试\n- ✅ 权限管理：模块必须申请权限才能访问资源\n- ✅ 崩溃隔离：模块崩溃不影响主应用\n\n**用户价值**：\n- 开发者：可以独立开发模块，快速迭代\n- 最终用户：可以自由安装/卸载模块，定制功能\n\n**从老项目学到的教训**：\n- ❌ 老项目：19,038 行单文件，无法维护\n- ✅ DGOS：强制模块化，每个模块独立\n\n### 2.3 功能边界\n\n**包含**：\n- ✅ Module Federation 集成（Webpack/Vite）\n- ✅ 模块动态加载（远程加载 JS）\n- ✅ 模块热重载（无需重启）\n- ✅ 模块卸载（清理内存）\n- ✅ 模块生命周期管理（onLoad、onUnload、onUpdate）\n- ✅ 粗粒度权限管理（Provider、Skills、MCP、文件、网络）\n- ✅ 权限检查（运行时拦截）\n- ✅ 模块配置（manifest.json）\n- ✅ 共享依赖管理（React、Zustand、Router）\n- ✅ 错误边界隔离（Error Boundary）\n- ✅ 状态保存与恢复（热更新时）\n- ✅ 版本兼容性检查\n- ✅ 更新回滚机制\n\n**不包含**（明确说明原因）：\n- ❌ 细粒度权限（RBAC） → V2 数据权限时做\n- ❌ 模块沙箱（WebAssembly 隔离） → V2 安全增强\n- ❌ 模块市场（第三方上传） → V3 应用市场\n- ❌ 模块开发 SDK → V8 开发者生态\n- ❌ 模块性能监控 → V2 监控功能\n\n## 3. 核心流程\n\n### 3.1 模块加载流程\n\n```\n主应用启动\n  ↓\n读取已安装模块列表（数据库）\n  ↓\n遍历每个模块\n  ↓\n读取模块 manifest.json\n  ↓\n检查版本兼容性（主应用版本 vs 模块要求）\n  ↓\n（如果不兼容）跳过，记录警告\n  ↓\n（如果兼容）检查权限申请\n  ↓\n（如果权限未授予）提示用户授权\n  ↓\n（如果授权）使用 Module Federation 加载远程模块\n  ↓\n解析模块入口（remoteEntry.js）\n  ↓\n导入模块组件\n  ↓\n调用模块生命周期 onLoad()\n  ↓\n注册到路由系统\n  ↓\n显示在侧边栏\n  ↓\n用户点击时渲染模块组件\n```\n\n### 3.2 模块热更新流程\n\n```\n系统检测到模块有新版本\n  ↓\n在模块列表显示\"有更新\"标记\n  ↓\n用户点击\"更新\"\n  ↓\n（如果模块正在使用）提示\"保存当前状态\"\n  ↓\n调用模块生命周期 onBeforeUpdate()\n  ↓\n模块保存状态到 localStorage\n  ↓\n备份旧版本文件（以便回滚）\n  ↓\n下载新版本到临时目录\n  ↓\n验证新版本完整性（checksum）\n  ↓\n替换旧版本文件\n  ↓\n清除旧版本的模块缓存\n  ↓\n重新加载模块（使用新版本）\n  ↓\n调用模块生命周期 onAfterUpdate()\n  ↓\n模块从 localStorage 恢复状态\n  ↓\n（如果加载失败）自动回滚到旧版本\n  ↓\n（如果回滚成功）通知用户\"更新失败，已回滚\"\n  ↓\n（如果回滚失败）禁用模块，通知用户\n```\n\n### 3.3 权限检查流程\n\n```\n模块调用底层能力（如 Provider）\n  ↓\n拦截器检查模块 ID\n  ↓\n从数据库查询模块权限\n  ↓\n检查是否有 provider_access 权限\n  ↓\n（如果有权限）放行，继续调用\n  ↓\n（如果无权限）拒绝，返回错误\n  ↓\n记录权限拒绝日志\n  ↓\n（可选）通知用户\"模块请求权限被拒绝\"\n```\n\n### 3.4 模块崩溃处理流程\n\n```\n模块组件抛出异常\n  ↓\nError Boundary 捕获异常\n  ↓\n记录错误日志（错误堆栈、模块 ID、时间）\n  ↓\n显示错误页面：\n  \"模块 [AI 工作台] 已崩溃\"\n  [查看错误详情] [重新加载模块] [卸载模块]\n  ↓\n用户点击\"重新加载模块\"\n  ↓\n清除模块缓存\n  ↓\n重新加载模块\n  ↓\n（如果再次崩溃）提示\"模块可能有问题，建议卸载\"\n```\n\n## 4. 数据模型\n\n### 4.1 涉及的数据表\n\n**installed_modules 表**（已安装模块）：\n```sql\nCREATE TABLE installed_modules (\n    id TEXT PRIMARY KEY,              -- UUID\n    module_id TEXT NOT NULL,          -- 模块标识，如 ai-workbench\n    name TEXT NOT NULL,               -- 模块名称\n    version TEXT NOT NULL,            -- 当前版本\n    entry_url TEXT NOT NULL,          -- 模块入口 URL（remoteEntry.js）\n    manifest JSON NOT NULL,           -- 模块 manifest\n    enabled BOOLEAN DEFAULT TRUE,     -- 是否启用\n    install_path TEXT,                -- 本地安装路径（如果是本地模块）\n    installed_at TIMESTAMP,\n    updated_at TIMESTAMP,\n    user_id TEXT,                     -- 所属用户\n    FOREIGN KEY (user_id) REFERENCES users(id),\n    UNIQUE(user_id, module_id)\n);\n```\n\n**module_permissions 表**（模块权限）：\n```sql\nCREATE TABLE module_permissions (\n    id TEXT PRIMARY KEY,\n    module_id TEXT NOT NULL,\n    permission_type TEXT NOT NULL,    -- 权限类型：provider_access, skills_access, mcp_access, file_read, file_write, network\n    resource_id TEXT,                 -- 资源 ID（可选，如具体的 Provider ID）\n    granted BOOLEAN DEFAULT FALSE,    -- 是否授予\n    granted_at TIMESTAMP,\n    user_id TEXT,\n    FOREIGN KEY (user_id) REFERENCES users(id),\n    UNIQUE(module_id, permission_type, resource_id)\n);\n```\n\n**module_crash_logs 表**（模块崩溃日志）：\n```sql\nCREATE TABLE module_crash_logs (\n    id TEXT PRIMARY KEY,\n    module_id TEXT NOT NULL,\n    error_message TEXT,\n    error_stack TEXT,                 -- 错误堆栈\n    created_at TIMESTAMP,\n    user_id TEXT,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n**module_update_history 表**（模块更新历史）：\n```sql\nCREATE TABLE module_update_history (\n    id TEXT PRIMARY KEY,\n    module_id TEXT NOT NULL,\n    from_version TEXT,\n    to_version TEXT,\n    success BOOLEAN,\n    error_message TEXT,\n    rollback BOOLEAN DEFAULT FALSE,   -- 是否回滚\n    created_at TIMESTAMP,\n    user_id TEXT,\n    FOREIGN KEY (user_id) REFERENCES users(id)\n);\n```\n\n### 4.2 读写关系\n\n**读操作**：\n- 获取已安装模块：`SELECT * FROM installed_modules WHERE user_id = ? AND enabled = TRUE`\n- 查询模块权限：`SELECT * FROM module_permissions WHERE module_id = ? AND granted = TRUE`\n- 查询崩溃日志：`SELECT * FROM module_crash_logs WHERE module_id = ? ORDER BY created_at DESC`\n- 查询更新历史：`SELECT * FROM module_update_history WHERE module_id = ? ORDER BY created_at DESC`\n\n**写操作**：\n- 安装模块：`INSERT INTO installed_modules`\n- 更新模块版本：`UPDATE installed_modules SET version = ?, updated_at = ? WHERE id = ?`\n- 卸载模块：`DELETE FROM installed_modules WHERE id = ?`\n- 授予权限：`INSERT INTO module_permissions` 或 `UPDATE ... SET granted = TRUE`\n- 记录崩溃：`INSERT INTO module_crash_logs`\n- 记录更新：`INSERT INTO module_update_history`\n\n## 5. 验收标准\n\n### 5.1 AC 逐项测试设计表\n\n| AC | 验收重点 | Given | When | Then | 测试层级 | 目标资产 | 目标命令 | 初始资产状态 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| AC01 | 模块动态加载 | 模块已安装 | 启动应用 | 模块成功加载并显示 | E2E | `tests/e2e/module_loading.spec.ts` | `pnpm test:e2e module_loading` | 规划中 |\n| AC02 | 版本兼容性检查 | 模块要求 React 19 | 主应用是 React 18 | 模块不加载，显示警告 | 后端逻辑 | `server/crates/modules/tests/compatibility.rs` | `cargo test -p dgos-modules compatibility` | 规划中 |\n| AC03 | 共享依赖 | 模块依赖 React | 加载模块 | 使用主应用的 React，不重复加载 | 前端集成 | `frontend/tests/shared_deps.test.tsx` | `pnpm test shared_deps` | 规划中 |\n| AC04 | 权限申请 | 模块需要 Provider 权限 | 安装模块 | 显示权限列表，用户确认 | 前端 + 后端 | `tests/e2e/module_permissions.spec.ts` | `pnpm test:e2e module_permissions` | 规划中 |\n| AC05 | 权限检查 | 模块未授权 Provider | 调用 Provider | 拒绝调用，返回权限错误 | 后端 API | `server/crates/modules/tests/permission_check.rs` | `cargo test -p dgos-modules permission_check` | 规划中 |\n| AC06 | 热更新成功 | 模块有新版本 | 点击更新 | 无需重启，模块更新成功 | E2E | `tests/e2e/module_hot_reload.spec.ts` | `pnpm test:e2e module_hot_reload` | 规划中 |\n| AC07 | 状态保存恢复 | 更新时保存状态 | 更新后恢复 | 用户状态不丢失 | E2E | `tests/e2e/module_state.spec.ts` | `pnpm test:e2e module_state` | 规划中 |\n| AC08 | 更新失败回滚 | 新版本加载失败 | 自动回滚 | 恢复到旧版本，模块可用 | 后端逻辑 | `server/crates/modules/tests/rollback.rs` | `cargo test -p dgos-modules rollback` | 规划中 |\n| AC09 | 崩溃隔离 | 模块组件抛出异常 | Error Boundary 捕获 | 主应用正常，显示错误页 | 前端集成 | `frontend/tests/error_boundary.test.tsx` | `pnpm test error_boundary` | 规划中 |\n| AC10 | 崩溃重新加载 | 模块崩溃 | 点击\"重新加载\" | 模块重新加载成功 | E2E | `tests/e2e/module_crash.spec.ts` | `pnpm test:e2e module_crash` | 规划中 |\n| AC11 | 模块卸载 | 模块已加载 | 卸载模块 | 清理内存、删除路由、移除侧边栏 | E2E | `tests/e2e/module_uninstall.spec.ts` | `pnpm test:e2e module_uninstall` | 规划中 |\n| AC12 | 生命周期钩子 | 模块实现 onLoad | 加载模块 | onLoad 被调用 | 前端集成 | `frontend/tests/lifecycle.test.tsx` | `pnpm test lifecycle` | 规划中 |\n| AC13 | 模块启用/禁用 | 模块已安装 | 禁用模块 | 模块不加载，不显示 | 后端 API + E2E | `tests/e2e/module_toggle.spec.ts` | `pnpm test:e2e module_toggle` | 规划中 |\n| AC14 | 并发加载 | 5 个模块同时安装 | 启动应用 | 所有模块都成功加载 | E2E | `tests/e2e/concurrent_loading.spec.ts` | `pnpm test:e2e concurrent_loading` | 规划中 |\n| AC15 | 崩溃日志记录 | 模块崩溃 | 查询崩溃日志 | 包含错误堆栈和时间 | 后端 API | `server/crates/modules/tests/crash_logs.rs` | `cargo test -p dgos-modules crash_logs` | 规划中 |\n\n### 5.2 边界条件测试\n\n| 边界条件 | 测试场景 | 预期结果 |\n| --- | --- | --- |\n| 模块入口 URL 不可达 | 网络断开或 CDN 故障 | 显示\"模块加载失败\" |\n| 模块 manifest 格式错误 | JSON 解析失败 | 显示\"模块配置错误\" |\n| 模块依赖版本冲突 | React 19 vs React 18 | 不加载，显示警告 |\n| 热更新时模块正在使用 | 用户正在输入 | 提示保存状态 |\n| 更新备份失败 | 磁盘空间不足 | 拒绝更新，提示用户 |\n| 回滚失败 | 旧版本文件损坏 | 禁用模块，提示重新安装 |\n| 模块无限崩溃 | 3 次重新加载都崩溃 | 自动禁用，提示卸载 |\n\n## 6. 接口设计\n\n### 6.1 Tauri Commands（桌面端）\n\n```rust\n// 模块管理\n#[tauri::command]\nasync fn list_installed_modules(user_id: String) -> Result<Vec<Module>>;\n\n#[tauri::command]\nasync fn install_module(manifest: ModuleManifest) -> Result<Module>;\n\n#[tauri::command]\nasync fn uninstall_module(module_id: String) -> Result<()>;\n\n#[tauri::command]\nasync fn toggle_module(module_id: String, enabled: bool) -> Result<()>;\n\n#[tauri::command]\nasync fn update_module(module_id: String) -> Result<Module>;\n\n// 权限管理\n#[tauri::command]\nasync fn get_module_permissions(module_id: String) -> Result<Vec<Permission>>;\n\n#[tauri::command]\nasync fn grant_permission(\n    module_id: String,\n    permission_type: String,\n    resource_id: Option<String>\n) -> Result<()>;\n\n#[tauri::command]\nasync fn revoke_permission(\n    module_id: String,\n    permission_type: String\n) -> Result<()>;\n\n// 权限检查（内部使用）\n#[tauri::command]\nasync fn check_permission(\n    module_id: String,\n    permission_type: String,\n    resource_id: Option<String>\n) -> Result<bool>;\n\n// 崩溃日志\n#[tauri::command]\nasync fn report_module_crash(\n    module_id: String,\n    error_message: String,\n    error_stack: String\n) -> Result<()>;\n\n#[tauri::command]\nasync fn list_module_crash_logs(module_id: String) -> Result<Vec<CrashLog>>;\n\n// 更新历史\n#[tauri::command]\nasync fn list_module_update_history(module_id: String) -> Result<Vec<UpdateHistory>>;\n```\n\n### 6.2 前端模块接口\n\n```typescript\n// frontend/packages/core/src/types/module.ts\n\nexport interface ModuleManifest {\n  id: string;                          // 模块唯一标识\n  name: string;                        // 模块名称\n  version: string;                     // 版本号\n  description?: string;\n  author?: string;\n  entry: string;                       // remoteEntry.js URL\n  \n  // 依赖要求\n  requires?: {\n    dgos?: string;                     // DGOS 版本要求（如 \">=1.0.0\"）\n    react?: string;                    // React 版本要求\n  };\n  \n  // 权限申请\n  permissions?: {\n    provider_access?: boolean;\n    skills_access?: boolean;\n    mcp_access?: boolean;\n    file_read?: boolean;\n    file_write?: boolean;\n    network?: boolean;\n  };\n  \n  // 共享依赖\n  shared?: {\n    react: { singleton: true, requiredVersion: string };\n    zustand: { singleton: true };\n  };\n}\n\nexport interface ModuleLifecycle {\n  // 模块加载时调用\n  onLoad?(): Promise<void> | void;\n  \n  // 模块卸载前调用\n  onUnload?(): Promise<void> | void;\n  \n  // 热更新前调用（保存状态）\n  onBeforeUpdate?(): Promise<any> | any;\n  \n  // 热更新后调用（恢复状态）\n  onAfterUpdate?(state: any): Promise<void> | void;\n}\n\nexport interface ModuleComponent extends React.ComponentType {\n  // 模块生命周期\n  lifecycle?: ModuleLifecycle;\n  \n  // 模块路由\n  routes?: Array<{\n    path: string;\n    element: React.ReactNode;\n  }>;\n}\n```\n\n### 6.3 Module Federation 配置\n\n```javascript\n// frontend/apps/desktop/vite.config.ts\n\nimport federation from '@originjs/vite-plugin-federation';\n\nexport default defineConfig({\n  plugins: [\n    federation({\n      name: 'dgos-host',\n      remotes: {\n        // 动态加载远程模块\n      },\n      shared: {\n        react: {\n          singleton: true,\n          requiredVersion: '^18.2.0',\n        },\n        'react-dom': {\n          singleton: true,\n          requiredVersion: '^18.2.0',\n        },\n        zustand: {\n          singleton: true,\n          requiredVersion: '^4.0.0',\n        },\n      },\n    }),\n  ],\n});\n```\n\n详见 [V1 接口契约](../../../04-技术架构/当前版本/V1-接口契约.md)。\n\n## 7. 技术设计\n\n### 7.1 模块加载器核心实现\n\n```typescript\n// frontend/packages/core/src/module-loader.ts\n\nexport class ModuleLoader {\n  private loadedModules = new Map<string, ModuleComponent>();\n  private moduleStates = new Map<string, any>();\n  \n  // B04-01: 加载模块\n  async loadModule(manifest: ModuleManifest): Promise<ModuleComponent> {\n    // B04-02: 检查版本兼容性\n    if (!this.checkCompatibility(manifest)) {\n      throw new Error(`模块 ${manifest.name} 版本不兼容`);\n    }\n    \n    // B04-03: 检查权限\n    const permissions = await this.getModulePermissions(manifest.id);\n    if (!this.arePermissionsGranted(manifest.permissions, permissions)) {\n      throw new Error(`模块 ${manifest.name} 缺少必要权限`);\n    }\n    \n    // B04-04: 动态加载远程模块\n    const remoteUrl = manifest.entry;\n    \n    // 创建 script 标签加载 remoteEntry.js\n    await this.loadRemoteEntry(remoteUrl);\n    \n    // B04-05: 获取模块导出\n    const container = (window as any)[manifest.id];\n    await container.init(__webpack_share_scopes__.default);\n    \n    const factory = await container.get('./Module');\n    const Module = factory();\n    \n    // B04-06: 调用生命周期 onLoad\n    if (Module.lifecycle?.onLoad) {\n      await Module.lifecycle.onLoad();\n    }\n    \n    // 缓存模块\n    this.loadedModules.set(manifest.id, Module);\n    \n    return Module;\n  }\n  \n  // B04-02: 检查版本兼容性\n  private checkCompatibility(manifest: ModuleManifest): boolean {\n    if (manifest.requires?.dgos) {\n      const currentVersion = '1.0.0'; // DGOS 版本\n      const requiredVersion = manifest.requires.dgos;\n      \n      if (!satisfies(currentVersion, requiredVersion)) {\n        console.warn(`模块要求 DGOS ${requiredVersion}，当前版本 ${currentVersion}`);\n        return false;\n      }\n    }\n    \n    return true;\n  }\n  \n  // B04-07: 热更新模块\n  async reloadModule(\n    moduleId: string,\n    newManifest: ModuleManifest\n  ): Promise<ModuleComponent> {\n    const oldModule = this.loadedModules.get(moduleId);\n    \n    if (!oldModule) {\n      throw new Error('模块未加载');\n    }\n    \n    // B04-08: 保存状态（onBeforeUpdate）\n    let savedState: any;\n    if (oldModule.lifecycle?.onBeforeUpdate) {\n      savedState = await oldModule.lifecycle.onBeforeUpdate();\n      this.moduleStates.set(moduleId, savedState);\n    }\n    \n    try {\n      // B04-09: 卸载旧模块\n      if (oldModule.lifecycle?.onUnload) {\n        await oldModule.lifecycle.onUnload();\n      }\n      \n      // 清除旧模块缓存\n      this.loadedModules.delete(moduleId);\n      delete (window as any)[moduleId];\n      \n      // B04-10: 加载新模块\n      const newModule = await this.loadModule(newManifest);\n      \n      // B04-11: 恢复状态（onAfterUpdate）\n      if (newModule.lifecycle?.onAfterUpdate && savedState) {\n        await newModule.lifecycle.onAfterUpdate(savedState);\n      }\n      \n      return newModule;\n    } catch (error) {\n      // B04-12: 加载失败，尝试回滚\n      console.error('模块加载失败，尝试回滚', error);\n      \n      // 这里应该从备份恢复旧版本\n      // 实际实现中，需要服务端支持\n      throw error;\n    }\n  }\n  \n  // B04-13: 卸载模块\n  async unloadModule(moduleId: string): Promise<void> {\n    const module = this.loadedModules.get(moduleId);\n    \n    if (!module) {\n      return;\n    }\n    \n    // B04-14: 调用生命周期 onUnload\n    if (module.lifecycle?.onUnload) {\n      await module.lifecycle.onUnload();\n    }\n    \n    // 清除缓存\n    this.loadedModules.delete(moduleId);\n    this.moduleStates.delete(moduleId);\n    delete (window as any)[moduleId];\n  }\n  \n  // B04-04: 动态加载 remoteEntry.js\n  private async loadRemoteEntry(url: string): Promise<void> {\n    return new Promise((resolve, reject) => {\n      const script = document.createElement('script');\n      script.src = url;\n      script.type = 'text/javascript';\n      script.async = true;\n      \n      script.onload = () => resolve();\n      script.onerror = () => reject(new Error(`Failed to load ${url}`));\n      \n      document.head.appendChild(script);\n    });\n  }\n}\n```\n\n### 7.2 权限检查拦截器\n\n```typescript\n// frontend/packages/core/src/permission-interceptor.ts\n\nexport class PermissionInterceptor {\n  private modulePermissions = new Map<string, Set<string>>();\n  \n  // B04-15: 初始化模块权限\n  async initModulePermissions(moduleId: string): Promise<void> {\n    const permissions = await invoke('get_module_permissions', { moduleId });\n    const grantedPermissions = new Set(\n      permissions\n        .filter((p: any) => p.granted)\n        .map((p: any) => p.permission_type)\n    );\n    \n    this.modulePermissions.set(moduleId, grantedPermissions);\n  }\n  \n  // B04-16: 检查权限（拦截 Provider 调用）\n  async checkProviderAccess(moduleId: string): Promise<boolean> {\n    const permissions = this.modulePermissions.get(moduleId);\n    \n    if (!permissions || !permissions.has('provider_access')) {\n      console.error(`模块 ${moduleId} 无 Provider 访问权限`);\n      \n      // 记录日志\n      await invoke('log_permission_denied', {\n        moduleId,\n        permissionType: 'provider_access',\n      });\n      \n      return false;\n    }\n    \n    return true;\n  }\n  \n  // B04-17: 检查文件读权限\n  async checkFileRead(moduleId: string, path: string): Promise<boolean> {\n    const permissions = this.modulePermissions.get(moduleId);\n    \n    if (!permissions || !permissions.has('file_read')) {\n      console.error(`模块 ${moduleId} 无文件读取权限`);\n      return false;\n    }\n    \n    return true;\n  }\n  \n  // B04-18: 检查网络权限\n  async checkNetwork(moduleId: string): Promise<boolean> {\n    const permissions = this.modulePermissions.get(moduleId);\n    \n    if (!permissions || !permissions.has('network')) {\n      console.error(`模块 ${moduleId} 无网络访问权限`);\n      return false;\n    }\n    \n    return true;\n  }\n}\n```\n\n### 7.3 错误边界隔离\n\n```typescript\n// frontend/packages/core/src/ModuleErrorBoundary.tsx\n\nimport React, { Component, ErrorInfo } from 'react';\nimport { invoke } from '@tauri-apps/api';\n\ninterface Props {\n  moduleId: string;\n  moduleName: string;\n  children: React.ReactNode;\n}\n\ninterface State {\n  hasError: boolean;\n  error?: Error;\n  errorInfo?: ErrorInfo;\n}\n\n// B04-19: 模块错误边界\nexport class ModuleErrorBoundary extends Component<Props, State> {\n  constructor(props: Props) {\n    super(props);\n    this.state = { hasError: false };\n  }\n  \n  static getDerivedStateFromError(error: Error): State {\n    return { hasError: true, error };\n  }\n  \n  async componentDidCatch(error: Error, errorInfo: ErrorInfo) {\n    console.error('模块崩溃:', error, errorInfo);\n    \n    // B04-20: 记录崩溃日志\n    await invoke('report_module_crash', {\n      moduleId: this.props.moduleId,\n      errorMessage: error.message,\n      errorStack: error.stack || '',\n    });\n    \n    this.setState({ errorInfo });\n  }\n  \n  // B04-21: 重新加载模块\n  handleReload = () => {\n    this.setState({ hasError: false, error: undefined, errorInfo: undefined });\n    \n    // 触发模块重新加载\n    window.location.reload();\n  };\n  \n  render() {\n    if (this.state.hasError) {\n      return (\n        <div className=\"module-crash-page\">\n          <h2>模块 [{this.props.moduleName}] 已崩溃</h2>\n          <p>错误信息：{this.state.error?.message}</p>\n          <details>\n            <summary>查看错误详情</summary>\n            <pre>{this.state.error?.stack}</pre>\n          </details>\n          <button onClick={this.handleReload}>重新加载模块</button>\n          <button onClick={() => {/* 卸载模块 */}}>卸载模块</button>\n        </div>\n      );\n    }\n    \n    return this.props.children;\n  }\n}\n```\n\n### 7.4 分支到测试追踪表\n\n| 分支 ID | 分支描述 | AC 映射 | E2E 映射 |\n| --- | --- | --- | --- |\n| B04-01 | 加载模块 | AC01 | V1-E2E-04 |\n| B04-02 | 检查版本兼容性 | AC02 | - |\n| B04-03 | 检查权限 | AC04 | - |\n| B04-04 | 动态加载远程模块 | AC01, AC03 | V1-E2E-04 |\n| B04-05 | 获取模块导出 | AC01 | - |\n| B04-06 | 调用 onLoad | AC12 | - |\n| B04-07 | 热更新模块 | AC06 | V1-E2E-04 |\n| B04-08 | 保存状态 | AC07 | V1-E2E-04 |\n| B04-09 | 卸载旧模块 | AC11 | - |\n| B04-10 | 加载新模块 | AC06 | - |\n| B04-11 | 恢复状态 | AC07 | - |\n| B04-12 | 加载失败回滚 | AC08 | - |\n| B04-13 | 卸载模块 | AC11 | V1-E2E-04 |\n| B04-14 | 调用 onUnload | AC12 | - |\n| B04-15 | 初始化权限 | AC04 | - |\n| B04-16 | 检查 Provider 权限 | AC05 | - |\n| B04-17 | 检查文件权限 | AC05 | - |\n| B04-18 | 检查网络权限 | AC05 | - |\n| B04-19 | 错误边界捕获 | AC09 | V1-E2E-04 |\n| B04-20 | 记录崩溃日志 | AC15 | - |\n| B04-21 | 重新加载模块 | AC10 | - |\n\n## 8. 错误码设计\n\n| 错误码 | 错误信息 | 场景 | 用户操作建议 |\n| --- | --- | --- | --- |\n| 1004001 | module_not_found | 模块不存在 | 检查模块 ID |\n| 1004002 | module_load_failed | 模块加载失败 | 检查网络或模块 URL |\n| 1004003 | version_incompatible | 版本不兼容 | 更新 DGOS 或模块 |\n| 1004004 | permission_denied | 权限被拒绝 | 授予模块权限 |\n| 1004005 | permission_not_granted | 权限未授予 | 先授予权限再使用 |\n| 1004006 | module_update_failed | 模块更新失败 | 查看错误日志或回滚 |\n| 1004007 | rollback_failed | 回滚失败 | 重新安装模块 |\n| 1004008 | module_crashed | 模块崩溃 | 重新加载或卸载模块 |\n| 1004009 | state_restore_failed | 状态恢复失败 | 状态可能丢失 |\n| 1004010 | manifest_invalid | Manifest 格式错误 | 检查模块配置 |\n\n详见 [V1 错误码](../../../04-技术架构/当前版本/V1-错误码.md)（待创建）。\n\n## 9. 非功能需求\n\n### 9.1 性能需求\n\n| 指标 | 目标 | 测量方式 |\n| --- | --- | --- |\n| 模块加载时间 | < 1 秒 | Performance API |\n| 热更新时间 | < 2 秒 | Performance API |\n| 内存占用（每模块） | < 50MB | Chrome DevTools |\n| 并发加载 | 支持 10+ 模块 | E2E 测试 |\n\n### 9.2 安全需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 权限检查 | 运行时拦截，强制检查 |\n| 崩溃隔离 | Error Boundary 隔离 |\n| 代码签名 | V2 实现（V1 暂不做） |\n\n### 9.3 可维护性需求\n\n| 需求 | 实现方式 |\n| --- | --- |\n| 单文件行数限制 | < 1000 行（CI 检查） |\n| 模块独立测试 | 每个模块独立测试 |\n| 崩溃日志 | 完整错误堆栈 |\n\n## 10. 实现与验证\n\n### 10.1 后端测试\n\n**目标资产**：\n- `server/crates/modules/src/manager.rs`\n- `server/crates/modules/src/permissions.rs`\n- `server/crates/modules/tests/compatibility.rs`\n- `server/crates/modules/tests/permission_check.rs`\n- `server/crates/modules/tests/rollback.rs`\n- `server/crates/modules/tests/crash_logs.rs`\n\n**测试命令**：\n```bash\ncd server && cargo test -p dgos-modules\n```\n\n**验证记录**（待开发后填写）：\n```\n日期：YYYY-MM-DD\n执行人：XXX\n环境：本地开发环境\n\n结果：\n- compatibility.rs：0/1 通过（待实现）\n- permission_check.rs：0/3 通过（待实现）\n- rollback.rs：0/1 通过（待实现）\n- crash_logs.rs：0/1 通过（待实现）\n\n详细覆盖说明：\n- AC02, AC05, AC08, AC15：待实现\n```\n\n### 10.2 前端集成测试\n\n**目标资产**：\n- `frontend/packages/core/src/module-loader.ts`\n- `frontend/packages/core/src/permission-interceptor.ts`\n- `frontend/packages/core/src/ModuleErrorBoundary.tsx`\n- `frontend/tests/shared_deps.test.tsx`\n- `frontend/tests/lifecycle.test.tsx`\n- `frontend/tests/error_boundary.test.tsx`\n\n**测试命令**：\n```bash\ncd frontend && pnpm test\n``
