<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGOS 产品文档浏览器</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #ffffff;
      --surface-alt: #fbfaf7;
      --ink: #1d1f22;
      --muted: #69707a;
      --faint: #8b929a;
      --line: #dedbd2;
      --line-strong: #c6c1b5;
      --teal: #087d75;
      --teal-soft: #dcefeb;
      --indigo: #4056a1;
      --indigo-soft: #e6e9f6;
      --amber: #a96810;
      --amber-soft: #f6ead6;
      --rose: #aa2d4d;
      --rose-soft: #f4dde4;
      --green: #2f7d4f;
      --green-soft: #e1f0e8;
      --code-bg: #f1eee7;
      --shadow: 0 12px 32px rgba(31, 35, 40, 0.08);
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr) 292px;
      grid-template-rows: 58px minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 282px minmax(240px, 1fr) 292px;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--indigo));
      font-weight: 760;
      letter-spacing: 0;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .searchbar {
      position: relative;
      min-width: 0;
    }

    .searchbar input {
      width: 100%;
      height: 38px;
      padding: 0 42px 0 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .searchbar input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }

    .search-icon,
    .clear-search {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-icon {
      left: 14px;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .clear-search {
      right: 8px;
      display: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
    }

    .clear-search:hover {
      background: var(--code-bg);
      color: var(--ink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
      max-width: 330px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-alt);
    }

    .segmented button {
      min-width: 0;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(31, 35, 40, 0.1);
    }

    .sidebar {
      grid-row: 2;
      border-right: 1px solid var(--line);
      background: var(--surface-alt);
      overflow: auto;
      padding: 14px;
    }

    .side-title {
      margin: 2px 2px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .doc-list {
      display: grid;
      gap: 8px;
    }

    .doc-item {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .doc-item:hover {
      background: var(--surface);
      border-color: var(--line);
    }

    .doc-item.active {
      background: var(--surface);
      border-color: var(--accent, var(--teal));
      box-shadow: var(--shadow);
    }

    .doc-badge {
      display: grid;
      place-items: center;
      width: 42px;
      height: 40px;
      border-radius: 8px;
      background: var(--accent-soft, var(--teal-soft));
      color: var(--accent, var(--teal));
      font-weight: 780;
      font-size: 13px;
    }

    .doc-name {
      min-width: 0;
    }

    .doc-name strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.2;
    }

    .doc-name span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      position: relative;
      grid-row: 2;
      min-width: 0;
      overflow: auto;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    .content {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 72px;
    }

    .rightbar {
      grid-row: 2;
      border-left: 1px solid var(--line);
      background: var(--surface-alt);
      overflow: auto;
      padding: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(31, 35, 40, 0.02);
    }

    .panel + .panel {
      margin-top: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
    }

    .panel-body {
      padding: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 25px;
      line-height: 1;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(8, minmax(86px, 1fr));
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .feature-query {
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .feature-query h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .feature-query > p {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .feature-controls {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(260px, 1.15fr);
      gap: 10px;
    }

    .feature-field {
      display: grid;
      gap: 6px;
    }

    .feature-field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .feature-field input,
    .feature-field select {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .feature-field input:focus,
    .feature-field select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }

    .feature-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 8px;
      background: var(--surface);
    }

    .feature-summary h2 {
      margin: 7px 0 8px;
      font-size: 23px;
      line-height: 1.2;
    }

    .feature-summary p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .feature-summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .feature-summary-links {
      display: grid;
      gap: 8px;
      min-width: 160px;
    }

    .feature-summary-links a,
    .milestone-source a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 650;
    }

    .feature-summary-links a:hover,
    .milestone-source a:hover {
      text-decoration: underline;
    }

    .feature-timeline-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .feature-timeline-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .feature-timeline-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .feature-timeline-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .timeline-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px 12px;
      max-width: 430px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .timeline-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .timeline-legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--indigo);
    }

    .timeline-legend .current i {
      background: var(--green);
    }

    .timeline-legend .gate i {
      background: var(--amber);
    }

    .timeline-legend .history i {
      background: var(--muted);
    }

    .feature-timeline-scroll {
      padding: 24px 28px 28px;
    }

    .feature-version-timeline {
      --timeline-axis-width: 112px;
      --timeline-axis-gap: 24px;
      position: relative;
      display: grid;
      gap: 14px;
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .feature-version-timeline::before {
      content: "";
      position: absolute;
      top: 25px;
      bottom: 25px;
      left: calc(var(--timeline-axis-width) - 1px);
      width: 2px;
      border-radius: 2px;
      background: var(--line-strong);
    }

    .feature-milestone {
      position: relative;
      display: grid;
      grid-template-columns: var(--timeline-axis-width) minmax(0, 1fr);
      gap: var(--timeline-axis-gap);
      align-items: start;
      min-width: 0;
    }

    .milestone-axis {
      position: relative;
      min-height: 50px;
      padding: 12px 21px 0 0;
      text-align: right;
    }

    .milestone-axis strong,
    .milestone-axis small {
      display: block;
    }

    .milestone-axis strong {
      color: var(--text);
      font-size: 13px;
      line-height: 1.3;
    }

    .milestone-axis small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      line-height: 1.35;
    }

    .milestone-dot {
      position: absolute;
      top: 17px;
      right: -7px;
      z-index: 1;
      width: 14px;
      height: 14px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--indigo);
      box-shadow: 0 0 0 2px var(--indigo);
    }

    .milestone-card {
      min-width: 0;
      padding: 9px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .feature-milestone:last-child .milestone-card {
      padding-bottom: 4px;
      border-bottom: 0;
    }

    .feature-milestone.current .milestone-dot {
      background: var(--green);
      box-shadow: 0 0 0 2px var(--green);
    }

    .feature-milestone.gate .milestone-dot {
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber);
    }

    .feature-milestone.history .milestone-dot,
    .feature-milestone.empty .milestone-dot {
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--muted);
    }

    .milestone-state-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      min-height: 18px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .milestone-state,
    .implementation-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .milestone-state::before,
    .implementation-state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--indigo);
    }

    .milestone-state.current::before,
    .implementation-state.completed::before {
      background: var(--green);
    }

    .milestone-state.gate::before,
    .implementation-state.implementing::before,
    .implementation-state.partial::before {
      background: var(--amber);
    }

    .milestone-state.history::before,
    .milestone-state.empty::before,
    .implementation-state.foundation::before {
      background: var(--muted);
    }

    .implementation-state.local-verified::before {
      background: var(--teal);
    }

    .completion-state {
      margin-left: auto;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-weight: 650;
    }

    .completion-state.completed {
      color: var(--green);
    }

    .milestone-mobile-meta {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .milestone-mobile-meta strong {
      color: var(--text);
      font-size: 11px;
    }

    .milestone-mobile-meta span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .milestone-card h4 {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.3;
    }

    .milestone-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.58;
    }

    .milestone-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .milestone-fact {
      min-width: 0;
      padding: 9px 10px;
      font-size: 11px;
      line-height: 1.55;
    }

    .milestone-fact + .milestone-fact {
      border-left: 1px solid var(--line);
    }

    .milestone-fact span,
    .milestone-detail strong {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .milestone-fact strong {
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
    }

    .milestone-detail {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dotted var(--line-strong);
      font-size: 11px;
      line-height: 1.55;
    }

    .milestone-detail strong {
      margin: 0;
    }

    .milestone-source {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.5;
    }

    .feature-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .feature-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .feature-status.local-verified::before {
      background: var(--teal);
    }

    .feature-status.implementing::before,
    .feature-status.partial::before {
      background: var(--amber);
    }

    .feature-status.completed::before {
      background: var(--green);
    }

    .feature-empty-result {
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .visual-grid.single {
      grid-template-columns: 1fr;
    }

    .diagram {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .diagram-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .diagram-head h3 {
      margin: 0;
      font-size: 13px;
    }

    .diagram-body {
      overflow-x: auto;
      padding: 10px;
    }

    .diagram svg {
      display: block;
      width: 100%;
      min-width: 640px;
      height: auto;
    }

    .diagram-caption {
      padding: 0 13px 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--legend, var(--teal));
    }

    .map-stack {
      display: grid;
      gap: 12px;
    }

    .version-node {
      min-height: 126px;
      padding: 12px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent, var(--teal));
      border-radius: 8px;
      background: var(--surface);
      text-align: left;
    }

    .version-node:hover {
      border-color: var(--accent, var(--teal));
    }

    .version-node strong {
      display: block;
      font-size: 14px;
    }

    .version-node span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .matrix th,
    .matrix td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .matrix th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      background: var(--surface-alt);
    }

    .matrix tr:last-child td {
      border-bottom: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .decision-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .decision-list li {
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--teal));
      border-radius: 8px;
      background: var(--surface);
      line-height: 1.5;
    }

    .doc-header {
      margin-bottom: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .doc-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .doc-header h2 {
      margin: 10px 0 8px;
      font-size: 25px;
      line-height: 1.18;
    }

    .doc-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .article {
      padding: 10px 26px 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      line-height: 1.72;
      overflow: hidden;
    }

    .article h1,
    .article h2,
