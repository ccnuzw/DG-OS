<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DGOS 产品文档浏览器</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #ffffff;
      --surface-alt: #fbfaf7;
      --ink: #1d1f22;
      --muted: #69707a;
      --faint: #8b929a;
      --line: #dedbd2;
      --line-strong: #c6c1b5;
      --teal: #087d75;
      --teal-soft: #dcefeb;
      --indigo: #4056a1;
      --indigo-soft: #e6e9f6;
      --amber: #a96810;
      --amber-soft: #f6ead6;
      --rose: #aa2d4d;
      --rose-soft: #f4dde4;
      --green: #2f7d4f;
      --green-soft: #e1f0e8;
      --code-bg: #f1eee7;
      --shadow: 0 12px 32px rgba(31, 35, 40, 0.08);
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 282px minmax(0, 1fr) 292px;
      grid-template-rows: 58px minmax(0, 1fr);
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 282px minmax(240px, 1fr) 292px;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--indigo));
      font-weight: 760;
      letter-spacing: 0;
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .searchbar {
      position: relative;
      min-width: 0;
    }

    .searchbar input {
      width: 100%;
      height: 38px;
      padding: 0 42px 0 42px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .searchbar input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }

    .search-icon,
    .clear-search {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .search-icon {
      left: 14px;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .clear-search {
      right: 8px;
      display: none;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
    }

    .clear-search:hover {
      background: var(--code-bg);
      color: var(--ink);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
      max-width: 330px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-alt);
    }

    .segmented button {
      min-width: 0;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(31, 35, 40, 0.1);
    }

    .sidebar {
      grid-row: 2;
      border-right: 1px solid var(--line);
      background: var(--surface-alt);
      overflow: auto;
      padding: 14px;
    }

    .side-title {
      margin: 2px 2px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .doc-list {
      display: grid;
      gap: 8px;
    }

    .doc-item {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 58px;
      padding: 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .doc-item:hover {
      background: var(--surface);
      border-color: var(--line);
    }

    .doc-item.active {
      background: var(--surface);
      border-color: var(--accent, var(--teal));
      box-shadow: var(--shadow);
    }

    .doc-badge {
      display: grid;
      place-items: center;
      width: 42px;
      height: 40px;
      border-radius: 8px;
      background: var(--accent-soft, var(--teal-soft));
      color: var(--accent, var(--teal));
      font-weight: 780;
      font-size: 13px;
    }

    .doc-name {
      min-width: 0;
    }

    .doc-name strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.2;
    }

    .doc-name span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      position: relative;
      grid-row: 2;
      min-width: 0;
      overflow: auto;
      scroll-behavior: smooth;
      background: var(--bg);
    }

    .content {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 72px;
    }

    .rightbar {
      grid-row: 2;
      border-left: 1px solid var(--line);
      background: var(--surface-alt);
      overflow: auto;
      padding: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(31, 35, 40, 0.02);
    }

    .panel + .panel {
      margin-top: 12px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 13px;
      line-height: 1.2;
    }

    .panel-body {
      padding: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 25px;
      line-height: 1;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(8, minmax(86px, 1fr));
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .feature-query {
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .feature-query h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .feature-query > p {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .feature-controls {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(260px, 1.15fr);
      gap: 10px;
    }

    .feature-field {
      display: grid;
      gap: 6px;
    }

    .feature-field label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .feature-field input,
    .feature-field select {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
    }

    .feature-field input:focus,
    .feature-field select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px var(--teal-soft);
    }

    .feature-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 8px;
      background: var(--surface);
    }

    .feature-summary h2 {
      margin: 7px 0 8px;
      font-size: 23px;
      line-height: 1.2;
    }

    .feature-summary p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .feature-summary-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .feature-summary-links {
      display: grid;
      gap: 8px;
      min-width: 160px;
    }

    .feature-summary-links a,
    .milestone-source a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 650;
    }

    .feature-summary-links a:hover,
    .milestone-source a:hover {
      text-decoration: underline;
    }

    .feature-timeline-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .feature-timeline-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .feature-timeline-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .feature-timeline-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .timeline-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px 12px;
      max-width: 430px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .timeline-legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .timeline-legend i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--indigo);
    }

    .timeline-legend .current i {
      background: var(--green);
    }

    .timeline-legend .gate i {
      background: var(--amber);
    }

    .timeline-legend .history i {
      background: var(--muted);
    }

    .feature-timeline-scroll {
      padding: 24px 28px 28px;
    }

    .feature-version-timeline {
      --timeline-axis-width: 112px;
      --timeline-axis-gap: 24px;
      position: relative;
      display: grid;
      gap: 14px;
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .feature-version-timeline::before {
      content: "";
      position: absolute;
      top: 25px;
      bottom: 25px;
      left: calc(var(--timeline-axis-width) - 1px);
      width: 2px;
      border-radius: 2px;
      background: var(--line-strong);
    }

    .feature-milestone {
      position: relative;
      display: grid;
      grid-template-columns: var(--timeline-axis-width) minmax(0, 1fr);
      gap: var(--timeline-axis-gap);
      align-items: start;
      min-width: 0;
    }

    .milestone-axis {
      position: relative;
      min-height: 50px;
      padding: 12px 21px 0 0;
      text-align: right;
    }

    .milestone-axis strong,
    .milestone-axis small {
      display: block;
    }

    .milestone-axis strong {
      color: var(--text);
      font-size: 13px;
      line-height: 1.3;
    }

    .milestone-axis small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      line-height: 1.35;
    }

    .milestone-dot {
      position: absolute;
      top: 17px;
      right: -7px;
      z-index: 1;
      width: 14px;
      height: 14px;
      border: 3px solid var(--surface);
      border-radius: 50%;
      background: var(--indigo);
      box-shadow: 0 0 0 2px var(--indigo);
    }

    .milestone-card {
      min-width: 0;
      padding: 9px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .feature-milestone:last-child .milestone-card {
      padding-bottom: 4px;
      border-bottom: 0;
    }

    .feature-milestone.current .milestone-dot {
      background: var(--green);
      box-shadow: 0 0 0 2px var(--green);
    }

    .feature-milestone.gate .milestone-dot {
      background: var(--amber);
      box-shadow: 0 0 0 2px var(--amber);
    }

    .feature-milestone.history .milestone-dot,
    .feature-milestone.empty .milestone-dot {
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--muted);
    }

    .milestone-state-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      min-height: 18px;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .milestone-state,
    .implementation-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .milestone-state::before,
    .implementation-state::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--indigo);
    }

    .milestone-state.current::before,
    .implementation-state.completed::before {
      background: var(--green);
    }

    .milestone-state.gate::before,
    .implementation-state.implementing::before,
    .implementation-state.partial::before {
      background: var(--amber);
    }

    .milestone-state.history::before,
    .milestone-state.empty::before,
    .implementation-state.foundation::before {
      background: var(--muted);
    }

    .implementation-state.local-verified::before {
      background: var(--teal);
    }

    .completion-state {
      margin-left: auto;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-weight: 650;
    }

    .completion-state.completed {
      color: var(--green);
    }

    .milestone-mobile-meta {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .milestone-mobile-meta strong {
      color: var(--text);
      font-size: 11px;
    }

    .milestone-mobile-meta span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .milestone-card h4 {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.3;
    }

    .milestone-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.58;
    }

    .milestone-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .milestone-fact {
      min-width: 0;
      padding: 9px 10px;
      font-size: 11px;
      line-height: 1.55;
    }

    .milestone-fact + .milestone-fact {
      border-left: 1px solid var(--line);
    }

    .milestone-fact span,
    .milestone-detail strong {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .milestone-fact strong {
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
    }

    .milestone-detail {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px dotted var(--line-strong);
      font-size: 11px;
      line-height: 1.55;
    }

    .milestone-detail strong {
      margin: 0;
    }

    .milestone-source {
      margin-top: 9px;
      font-size: 11px;
      line-height: 1.5;
    }

    .feature-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .feature-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .feature-status.local-verified::before {
      background: var(--teal);
    }

    .feature-status.implementing::before,
    .feature-status.partial::before {
      background: var(--amber);
    }

    .feature-status.completed::before {
      background: var(--green);
    }

    .feature-empty-result {
      padding: 12px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .visual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .visual-grid.single {
      grid-template-columns: 1fr;
    }

    .diagram {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .diagram-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-alt);
    }

    .diagram-head h3 {
      margin: 0;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .diagram-body {
      overflow-x: auto;
      padding: 10px;
    }

    .diagram svg {
      display: block;
      width: 100%;
      min-width: 640px;
      height: auto;
    }

    .diagram-caption {
      padding: 0 13px 13px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--legend, var(--teal));
    }

    .map-stack {
      display: grid;
      gap: 12px;
    }

    .version-node {
      min-height: 126px;
      padding: 12px;
      border: 1px solid var(--line);
      border-top: 4px solid var(--accent, var(--teal));
      border-radius: 8px;
      background: var(--surface);
      text-align: left;
    }

    .version-node:hover {
      border-color: var(--accent, var(--teal));
    }

    .version-node strong {
      display: block;
      font-size: 14px;
    }

    .version-node span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .matrix {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .matrix th,
    .matrix td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .matrix th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
      background: var(--surface-alt);
    }

    .matrix tr:last-child td {
      border-bottom: 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .decision-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .decision-list li {
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent, var(--teal));
      border-radius: 8px;
      background: var(--surface);
      line-height: 1.5;
    }

    .doc-header {
      margin-bottom: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .doc-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .doc-header h2 {
      margin: 10px 0 8px;
      font-size: 25px;
      line-height: 1.18;
    }

    .doc-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .article {
      padding: 10px 26px 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      line-height: 1.72;

    async function loadDoc(doc) {
      let content = window.DGOS_DOC_BROWSER_DATA?.[doc.id];
      if (location.protocol !== "file:") {
        try {
          const response = await fetch(encodeURI(doc.file), { cache: "no-store" });
          if (!response.ok) throw new Error(`${doc.file}: ${response.status}`);
          content = await response.text();
        } catch (error) {
          if (typeof content !== "string") throw error;
        }
      }
      if (typeof content !== "string") {
        throw new Error(`缺少离线文档数据: ${doc.id}`);
      }
      const headings = extractHeadings(content);
      return {
        ...doc,
        content,
        headings,
        lines: content.split(/\r?\n/).length,
        words: content.replace(/\s+/g, "").length
      };
    }

    function filterFeatures(query) {

    function updateFeatureOptions(select, query, activeId) {

    function extractEvolutionStages(trackId) {
      const doc = state.docs.find(item => item.id === "evolution");
      const track = FEATURE_TRACKS[trackId];
      if (!doc || !track) return [];
      const lines = doc.content.replace(/\r\n/g, "\n").split("\n");
      const sectionStart = lines.findIndex(line => /^##\s+/.test(line) && line.includes(track.title));
      if (sectionStart < 0) return [];
      const sectionEnd = lines.findIndex((line, index) => index > sectionStart && /^##\s+/.test(line));
      const end = sectionEnd < 0 ? lines.length : sectionEnd;
      const tableStart = lines.findIndex((line, index) => index > sectionStart && index < end && isTableStart(lines, index));
      if (tableStart < 0) return [];

      const rows = [];
      for (let index = tableStart + 2; index < end && /^\s*\|.*\|\s*$/.test(lines[index]); index += 1) {
        const cells = lines[index].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
        if (cells.length >= 5) {
          rows.push({ stage: cells[0], change: cells[1], dependencies: cells[2], completion: cells[3], source: cells[4], sourceFile: doc.file });
        }
      }

      const overviewStart = lines.findIndex(line => /^\|\s*能力主线\s*\|/.test(line));
      if (overviewStart >= 0) {
        let index = overviewStart + 2;
        while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
          const cells = lines[index].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim());
          if (cells[0] === track.overview) {
            const columns = [
              ["v2", "V2", 2], ["v4", "V4", 4], ["v5", "V5", 5], ["v6", "V6", 6],
              ["v7", "V7", 7], ["v8", "V8", 8], ["future", "后续", 9]
            ];
            columns.forEach(([versionId, label, cellIndex]) => {
              const version = FEATURE_TIMELINE_VERSIONS.find(item => item.id === versionId);
              if (!cells[cellIndex] || stagesForVersion(rows, version).length) return;
              rows.push({
                stage: label === "后续" ? "后续独立增强" : `${label} 总览关联`,
                change: cells[cellIndex],
                dependencies: "对应能力详表尚未单独展开；版本进入条件以第 12 节为准",
                completion: "该版本进入开发门禁后补充正式功能编号、完成判定和验收证据",
                source: "[跨版本总览](功能演进矩阵.md#3-跨版本总览)",
                sourceFile: doc.file,
                overview: true
              });
            });
            break;
          }
          index += 1;
        }
      }
      return rows;
    }

    function stagesForVersion(stages, version) {
      if (version.id === "gate") return stages.filter(stage => /^V1\s+发布门禁/.test(stage.stage));
      if (version.id === "future") return stages.filter(stage => /^后续/.test(stage.stage));
      if (/^v[2-8]$/.test(version.id)) {
        const label = version.label;
        return stages.filter(stage => stage.stage === label || stage.stage.startsWith(`${label} `));
      }
      return [];
    }

    function renderFeatureMilestone(feature, version, stages) {

        return `

            <div class="milestone-axis">

    function renderReader() {
      const doc = getActiveDoc();
      const rendered = renderMarkdown(doc.content, doc.file);

      els.content.innerHTML = `
        <section class="doc-header" style="--accent:${doc.accent}">
          <div class="doc-kicker">
            <span class="tag">${escapeHtml(doc.version)}</span>
            <span>${escapeHtml(doc.phase)}</span>
            <span>${escapeHtml(doc.file)}</span>
          </div>
          <h2>${escapeHtml(doc.title)}</h2>
          <div class="doc-meta">
            <span class="tag">${doc.lines} 行</span>
            <span class="tag">${rendered.outline.length} 章节</span>
            <span class="tag">${escapeHtml(doc.goal)}</span>
          </div>
        </section>
        <article class="article" id="article">${rendered.html}</article>
      `;

      renderOutline(rendered.outline);
      updateProgress();
    }

    function renderOutline(outline) {
      els.outlineCount.textContent = String(outline.length);
      els.outline.innerHTML = outline.slice(0, 80).map(item => `
        <a href="#${item.id}" class="lv${item.level}" data-target="${item.id}">${escapeHtml(item.text)}</a>
      `).join("");

      els.outline.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          const target = document.getElementById(link.dataset.target);
          if (target) target.scrollIntoView({ block: "start" });
        });
      });
    }

    function renderSideDecisions() {
      els.sideDecisions.innerHTML = DECISIONS.map(item => `
        <li style="--accent:${item.accent}">${escapeHtml(item.text)}</li>
      `).join("");
    }

    }

    function renderRiskHeatmapSvg() {
      const cards = [
        ["凭据与敏感数据", ["Provider API Key、Token", "不进入普通 DTO、SQLite、", "日志和错误消息"], "#f4dde4", "#aa2d4d"],
        ["权限与调用者上下文", ["Tauri command 身份由宿主派生", "模块权限运行时拦截"], "#f4dde4", "#aa2d4d"],
        ["外部 Provider / MCP", ["超时、重试、取消、幂等", "和未知结果必须显式定义"], "#f6ead6", "#a96810"],
        ["数据迁移兼容", ["已执行 migration 只追加", "升级失败要可恢复"], "#f6ead6", "#a96810"],
        ["模块隔离与热更新", ["动态模块不能绕过公开接口", "或跨域读取私有状态"], "#e6e9f6", "#4056a1"],
        ["协议兼容与错误语义", ["OpenAI、Skills、MCP 适配", "保持向后兼容"], "#dcefeb", "#087d75"]
      ];
      return `<svg viewBox="0 0 960 374" role="img" aria-label="DGOS 风险热区图">
        <rect width="960" height="374" rx="8" fill="#fbfaf7"></rect>
        <text x="36" y="38" font-size="18" font-weight="760" fill="#1d1f22">架构风险热区</text>
        <text x="36" y="62" font-size="12" fill="#69707a">颜色越深，越需要在实现和验收中保留可追溯证据。</text>
        ${cards.map((card, i) => {
          const x = 36 + (i % 3) * 300;
          const y = 92 + Math.floor(i / 3) * 132;
          return `<g class="risk-card">
            <rect x="${x}" y="${y}" width="288" height="116" rx="8" fill="${card[2]}" stroke="${card[3]}"></rect>
            ${diagramTextLines([card[0]], x + 16, y + 28, { size: 14, weight: 760, fill: "#1d1f22" })}
            ${diagramTextLines(card[1], x + 16, y + 53, { size: 12 })}
          </g>`;
        }).join("")}
      </svg>`;
    }

    function renderSearch() {
      if (!state.query) {
        els.searchResults.classList.remove("open");
        els.searchResults.innerHTML = "";
        return;
      }

      const query = state.query.toLowerCase();
      const results = [];
      const featureResults = filterFeatures(state.query).slice(0, 20);

      state.docs.forEach(doc => {
        doc.content.split(/\r?\n/).forEach((line, index) => {
          if (line.toLowerCase().includes(query)) {
            results.push({
              doc,
              line: line.trim() || "(空行)",
              lineNo: index + 1
            });
          }
        });
      });

      const limited = results.slice(0, Math.max(0, 80 - featureResults.length));
      els.searchResults.innerHTML = featureResults.length || limited.length
        ? `${featureResults.map(feature => `
            <button class="result-item" data-feature="${escapeHtml(feature.id)}">
              <span class="result-top">
                <span>${escapeHtml(feature.id)} · 具体功能时间线</span>
                <span>${escapeHtml(feature.trackName)}</span>
              </span>
              <span class="result-line">${highlight(`${feature.title} · ${feature.goal}`, state.query)}</span>
            </button>
          `).join("")}${limited.map(result => `
            <button class="result-item" data-doc="${result.doc.id}">
              <span class="result-top">
                <span>${escapeHtml(result.doc.version)} · ${escapeHtml(result.doc.title)}</span>
                <span>Line ${result.lineNo}</span>
              </span>
              <span class="result-line">${highlight(result.line, state.query)}</span>
            </button>
          `).join("")}`
        : `<div class="empty">没有匹配项</div>`;

      els.searchResults.classList.add("open");
      els.searchResults.querySelectorAll("[data-doc]").forEach(button => {
        button.addEventListener("click", () => openDoc(button.dataset.doc));
      });
      els.searchResults.querySelectorAll("[data-feature]").forEach(button => {
        button.addEventListener("click", () => {
          state.activeFeatureId = button.dataset.feature;
          localStorage.setItem("prd.activeFeature", state.activeFeatureId);
          els.searchResults.classList.remove("open");
          setView("feature-timeline");
        });
      });
    }

    function renderMarkdown(source, sourceFile = "") {
      const lines = source.replace(/\r\n/g, "\n").split("\n");
      const html = [];
      const outline = [];
      let index = 0;

      while (index < lines.length) {
        const line = lines[index];

        if (/^```/.test(line)) {
          const lang = line.replace(/^```/, "").trim();
          const code = [];
          index += 1;
          while (index < lines.length && !/^```/.test(lines[index])) {
            code.push(lines[index]);
            index += 1;
          }
          index += 1;
          html.push(`<pre><code data-lang="${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }

        const heading = /^(#{1,4})\s+(.+)$/.exec(line);
        if (heading) {
          const level = heading[1].length;
          const text = heading[2].trim();
          const id = makeHeadingId(text, outline.length);
          outline.push({ id, text, level });
          html.push(`<h${level} id="${id}">${inline(text, sourceFile)}</h${level}>`);
          index += 1;
          continue;
        }

        if (isTableStart(lines, index)) {
          const block = [];
          while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
            block.push(lines[index]);
            index += 1;
          }
          html.push(renderTable(block, sourceFile));
          continue;
        }

        if (/^\s*[-*]\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*[-*]\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*[-*]\s+/, ""));
            index += 1;
          }
          html.push(`<ul>${items.map(item => `<li>${inline(item, sourceFile)}</li>`).join("")}</ul>`);
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (index < lines.length && /^\s*\d+\.\s+/.test(lines[index])) {
            items.push(lines[index].replace(/^\s*\d+\.\s+/, ""));
            index += 1;
          }
          html.push(`<ol>${items.map(item => `<li>${inline(item, sourceFile)}</li>`).join("")}</ol>`);
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^\s*>\s?/.test(lines[index])) {
            quote.push(lines[index].replace(/^\s*>\s?/, ""));
            index += 1;
          }
          html.push(`<blockquote>${quote.map(item => inline(item, sourceFile)).join("<br>")}</blockquote>`);
          continue;
        }

        const standaloneImage = /^!\[([^\]]*)\]\(([^)]+)\)\s*$/.exec(line.trim());
        if (standaloneImage) {
          html.push(renderDocFigure(standaloneImage[1], standaloneImage[2], sourceFile));
          index += 1;
          continue;
        }

        if (line.trim() === "") {
          index += 1;
          continue;
        }

        const paragraph = [line];
        index += 1;
        while (
          index < lines.length &&
          lines[index].trim() !== "" &&
          !/^(#{1,4})\s+/.test(lines[index]) &&
          !/^```/.test(lines[index]) &&
          !/^!\[[^\]]*\]\([^)]+\)\s*$/.test(lines[index].trim()) &&
          !/^\s*[-*]\s+/.test(lines[index]) &&
          !/^\s*\d+\.\s+/.test(lines[index]) &&
          !isTableStart(lines, index)
        ) {
          paragraph.push(lines[index]);
          index += 1;
        }
        html.push(`<p>${inline(paragraph.join(" "), sourceFile)}</p>`);
      }

      return { html: html.join("\n"), outline };
    }

    function renderDocFigure(alt, href, sourceFile) {
      const decodedHref = decodeMarkdownHref(href);
      const resolvedHref = resolveDocHref(decodedHref, sourceFile);
      const safeAlt = escapeHtml(alt || "文档图表");
      return `
        <figure class="doc-figure">
          <a href="${escapeHtml(resolvedHref)}" target="_blank" rel="noopener">
            <img src="${escapeHtml(resolvedHref)}" alt="${safeAlt}" loading="lazy" decoding="async">
          </a>
          <figcaption>${safeAlt} · 点击查看原图</figcaption>
        </figure>
      `;
    }

    function isTableStart(lines, index) {
      return (
        index + 1 < lines.length &&
        /^\s*\|.*\|\s*$/.test(lines[index]) &&
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1])
      );
    }

    function renderTable(block, sourceFile = "") {
      const rows = block
        .filter((_, index) => index !== 1)
        .map(line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(cell => cell.trim()));

      if (!rows.length) return "";
      const head = rows[0];
      const body = rows.slice(1);
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${head.map(cell => `<th>${inline(cell, sourceFile)}</th>`).join("")}</tr></thead>
            <tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inline(cell, sourceFile)}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      `;
    }

    function extractHeadings(content) {
      return content
        .split(/\r?\n/)
        .filter(line => /^(#{1,4})\s+/.test(line))
        .map(line => line.replace(/^(#{1,4})\s+/, "").trim());
    }

    function inline(value, sourceFile = "") {
      let output = escapeHtml(value);
      output = output.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      output = output.replace(/`([^`]+)`/g, "<code>$1</code>");
      output = output.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_match, label, href) => {
        const decodedHref = decodeMarkdownHref(href);
        return `<a href="${escapeHtml(resolveDocHref(decodedHref, sourceFile))}">${label}</a>`;
      });
      return output;
    }

    function decodeMarkdownHref(href) {
      return href.replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#039;/g, "'");
    }

    function resolveDocHref(href, sourceFile) {
      if (!sourceFile || /^(?:[a-z][a-z\d+.-]*:|#|\/)/i.test(href)) return href;
      try {
        const sourceUrl = new URL(encodeURI(sourceFile), window.location.href);
        return new URL(encodeURI(href), sourceUrl).href;
      } catch {
        return href;
      }
    }

    function statBlock(label, value, caption) {
      return `
        <div class="stat">
          <span>${escapeHtml(label)}</span>
          <strong>${value}</strong>
          <span>${escapeHtml(caption)}</span>
        </div>
      `;
    }

    function getActiveDoc() {
      return state.docs.find(doc => doc.id === state.activeDocId) || state.docs[0];
    }

    function makeHeadingId(text, index) {
      const base = text
        .toLowerCase()
        .replace(/`/g, "")
        .replace(/[^\p{Letter}\p{Number}]+/gu, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 64);
      return `h-${index}-${base || "section"}`;
    }

    function updateProgress() {
      const max = els.mainScroll.scrollHeight - els.mainScroll.clientHeight;
      const value = max > 0 ? Math.min(100, Math.max(0, (els.mainScroll.scrollTop / max) * 100)) : 0;
      els.readProgress.style.width = `${value}%`;
    }

    function updateActiveOutline() {
      const article = document.getElementById("article");
      if (!article) return;

      const headings = [...article.querySelectorAll("h1,h2,h3,h4")];
      let active = "";
      for (const heading of headings) {
        if (heading.getBoundingClientRect().top < 110) active = heading.id;
      }
      els.outline.querySelectorAll("a").forEach(link => {
        link.classList.toggle("active", link.dataset.target === active);
      });
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("zh-CN").format(value);
    }

    function highlight(line, query) {
      const escaped = escapeHtml(line);
      const pattern = new RegExp(escapeRegExp(query), "gi");
      return escaped.replace(pattern, match => `<mark>${match}</mark>`);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value) {
      return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function debounce(fn, delay) {
      let timer = null;
      return (...args) => {
        window.clearTimeout(timer);
        timer = window.setTimeout(() => fn(...args), delay);
      };
    }
  </script>
