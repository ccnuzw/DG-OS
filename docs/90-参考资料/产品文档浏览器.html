<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="generator" content="spec-docs-pro">
  <title>DGOS 产品文档浏览器</title>
  <style>
:root {
  --bg: #f7f5ef;
  --surface: #ffffff;
  --surface-alt: #fbfaf7;
  --ink: #1d1f22;
  --muted: #69707a;
  --faint: #8b929a;
  --line: #dedbd2;
  --line-strong: #c6c1b5;
  --teal: #087d75;
  --teal-soft: #dcefeb;
  --indigo: #4056a1;
  --indigo-soft: #e6e9f6;
  --amber: #a96810;
  --amber-soft: #f6ead6;
  --rose: #aa2d4d;
  --rose-soft: #f4dde4;
  --green: #2f7d4f;
  --green-soft: #e1f0e8;
  --code-bg: #f1eee7;
  --shadow: 0 12px 32px rgba(31, 35, 40, 0.08);
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: 0;
}

body {
  overflow: hidden;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: grid;
  grid-template-columns: 282px minmax(0, 1fr) 292px;
  grid-template-rows: 58px minmax(0, 1fr);
  height: 100vh;
}

.topbar {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 282px minmax(240px, 1fr) 292px;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  color: white;
  background: linear-gradient(135deg, var(--teal), var(--indigo));
  font-weight: 760;
  letter-spacing: 0;
  flex: 0 0 auto;
}

.brand h1 {
  margin: 0;
  font-size: 15px;
  line-height: 1.1;
}

.brand small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.searchbar {
  position: relative;
  min-width: 0;
}

.searchbar input {
  width: 100%;
  height: 38px;
  padding: 0 42px 0 42px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
}

.searchbar input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-soft);
}

.search-icon,
.clear-search {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
}

.search-icon {
  left: 14px;
  width: 18px;
  height: 18px;
  pointer-events: none;
}

.clear-search {
  right: 8px;
  display: none;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
}

.clear-search:hover {
  background: var(--code-bg);
  color: var(--ink);
}

.top-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-width: 0;
}

.segmented {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  width: 100%;
  max-width: 380px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-alt);
}

.segmented button {
  min-width: 0;
  height: 30px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.segmented button.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 4px rgba(31, 35, 40, 0.1);
}

.sidebar {
  grid-row: 2;
  border-right: 1px solid var(--line);
  background: var(--surface-alt);
  overflow: auto;
  padding: 14px;
}

.side-title {
  margin: 2px 2px 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 720;
}

.doc-list {
  display: grid;
  gap: 8px;
}

.doc-item {
  width: 100%;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  text-align: left;
}

.doc-item:hover {
  background: var(--surface);
  border-color: var(--line);
}

.doc-item.active {
  background: var(--surface);
  border-color: var(--accent, var(--teal));
  box-shadow: var(--shadow);
}

.doc-badge {
  display: grid;
  place-items: center;
  width: 42px;
  height: 40px;
  border-radius: 8px;
  background: var(--accent-soft, var(--teal-soft));
  color: var(--accent, var(--teal));
  font-weight: 780;
  font-size: 13px;
}

.doc-name {
  min-width: 0;
}

.doc-name strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  line-height: 1.2;
}

.doc-name span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.main {
  position: relative;
  grid-row: 2;
  min-width: 0;
  overflow: auto;
  scroll-behavior: smooth;
  background: var(--bg);
}

.content {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
  padding: 18px 0 72px;
}

.rightbar {
  grid-row: 2;
  border-left: 1px solid var(--line);
  background: var(--surface-alt);
  overflow: auto;
  padding: 14px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 1px 0 rgba(31, 35, 40, 0.02);
}

.panel + .panel {
  margin-top: 12px;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 42px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
}

.panel-head h2,
.panel-head h3 {
  margin: 0;
  font-size: 13px;
  line-height: 1.2;
}

.panel-body {
  padding: 13px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.stat {
  min-height: 86px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.stat span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.stat strong {
  display: block;
  margin-top: 10px;
  font-size: 25px;
  line-height: 1;
}

.version-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}

.feature-query {
  margin-bottom: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.feature-query h2 {
  margin: 0 0 6px;
  font-size: 18px;
}

.feature-query > p {
  margin: 0 0 13px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.feature-controls {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(260px, 1.15fr);
  gap: 10px;
}

.feature-field {
  display: grid;
  gap: 6px;
}

.feature-field label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.feature-field input,
.feature-field select {
  width: 100%;
  height: 40px;
  padding: 0 11px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
}

.feature-field input:focus,
.feature-field select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px var(--teal-soft);
}

.feature-summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: start;
  margin-bottom: 12px;
  padding: 18px;
  border: 1px solid var(--line);
  border-left: 5px solid var(--teal);
  border-radius: 8px;
  background: var(--surface);
}

.feature-summary h2 {
  margin: 7px 0 8px;
  font-size: 23px;
  line-height: 1.2;
}

.feature-summary p {
  margin: 0;
  color: var(--muted);
  line-height: 1.65;
}

.feature-summary-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.feature-summary-links {
  display: grid;
  gap: 8px;
  min-width: 160px;
}

.feature-summary-links a,
.milestone-source a {
  color: var(--teal);
  text-decoration: none;
  font-weight: 650;
}

.feature-summary-links a:hover,
.milestone-source a:hover {
  text-decoration: underline;
}

.feature-timeline-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
}

.feature-timeline-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-alt);
}

.feature-timeline-head h3 {
  margin: 0;
  font-size: 15px;
}

.feature-timeline-title p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.timeline-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px 12px;
  max-width: 430px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

.timeline-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.timeline-legend i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--indigo);
}

.timeline-legend .current i {
  background: var(--green);
}

.timeline-legend .gate i {
  background: var(--amber);
}

.timeline-legend .history i {
  background: var(--muted);
}

.feature-timeline-scroll {
  padding: 24px 28px 28px;
}

.feature-version-timeline {
  --timeline-axis-width: 112px;
  --timeline-axis-gap: 24px;
  position: relative;
  display: grid;
  gap: 14px;
  width: min(100%, 920px);
  margin: 0 auto;
}

.feature-version-timeline::before {
  content: "";
  position: absolute;
  top: 25px;
  bottom: 25px;
  left: calc(var(--timeline-axis-width) - 1px);
  width: 2px;
  border-radius: 2px;
  background: var(--line-strong);
}

.feature-milestone {
  position: relative;
  display: grid;
  grid-template-columns: var(--timeline-axis-width) minmax(0, 1fr);
  gap: var(--timeline-axis-gap);
  align-items: start;
  min-width: 0;
}

.milestone-axis {
  position: relative;
  min-height: 50px;
  padding: 12px 21px 0 0;
  text-align: right;
}

.milestone-axis strong,
.milestone-axis small {
  display: block;
}

.milestone-axis strong {
  color: var(--text);
  font-size: 13px;
  line-height: 1.3;
}

.milestone-axis small {
  margin-top: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  line-height: 1.35;
}

.milestone-dot {
  position: absolute;
  top: 17px;
  right: -7px;
  z-index: 1;
  width: 14px;
  height: 14px;
  border: 3px solid var(--surface);
  border-radius: 50%;
  background: var(--indigo);
  box-shadow: 0 0 0 2px var(--indigo);
}

.milestone-card {
  min-width: 0;
  padding: 9px 0 22px;
  border-bottom: 1px solid var(--line);
}

.feature-milestone:last-child .milestone-card {
  padding-bottom: 4px;
  border-bottom: 0;
}

.feature-milestone.current .milestone-dot {
  background: var(--green);
  box-shadow: 0 0 0 2px var(--green);
}

.feature-milestone.gate .milestone-dot {
  background: var(--amber);
  box-shadow: 0 0 0 2px var(--amber);
}

.feature-milestone.history .milestone-dot,
.feature-milestone.empty .milestone-dot {
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--muted);
}

.milestone-state-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  min-height: 18px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
}

.milestone-state,
.implementation-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.milestone-state::before,
.implementation-state::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--indigo);
}

.milestone-state.current::before,
.implementation-state.completed::before {
  background: var(--green);
}

.milestone-state.gate::before,
.implementation-state.implementing::before,
.implementation-state.partial::before {
  background: var(--amber);
}

.milestone-state.history::before,
.milestone-state.empty::before,
.implementation-state.foundation::before {
  background: var(--muted);
}

.implementation-state.local-verified::before {
  background: var(--teal);
}

.completion-state {
  margin-left: auto;
  padding-left: 12px;
  border-left: 1px solid var(--line);
  color: var(--muted);
  font-weight: 650;
}

.completion-state.completed {
  color: var(--green);
}

.milestone-mobile-meta {
  display: none;
  align-items: center;
  gap: 8px;
}

.milestone-mobile-meta strong {
  color: var(--text);
  font-size: 11px;
}

.milestone-mobile-meta span {
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
}

.milestone-card h4 {
  margin: 0 0 7px;
  font-size: 17px;
  line-height: 1.3;
}

.milestone-card p {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.58;
}

.milestone-facts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-top: 13px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface-alt);
}

.milestone-fact {
  min-width: 0;
  padding: 9px 10px;
  font-size: 11px;
  line-height: 1.55;
}

.milestone-fact + .milestone-fact {
  border-left: 1px solid var(--line);
}

.milestone-fact span,
.milestone-detail strong {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
}

.milestone-fact strong {
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
}

.milestone-detail {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px dotted var(--line-strong);
  font-size: 11px;
  line-height: 1.55;
}

.milestone-detail strong {
  margin: 0;
}

.milestone-source {
  margin-top: 9px;
  font-size: 11px;
  line-height: 1.5;
}

.feature-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.feature-status::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
}

.feature-status.local-verified::before {
  background: var(--teal);
}

.feature-status.implementing::before,
.feature-status.partial::before {
  background: var(--amber);
}

.feature-status.completed::before {
  background: var(--green);
}

.feature-empty-result {
  padding: 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
}

.visual-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

.visual-grid.single {
  grid-template-columns: 1fr;
}

.diagram {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
}

.diagram-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-alt);
}

.diagram-head h3 {
  margin: 0;
  font-size: 13px;
}

.diagram-body {
  overflow-x: auto;
  padding: 10px;
}

.diagram svg {
  display: block;
  width: 100%;
  min-width: 640px;
  height: auto;
}

.diagram-caption {
  padding: 0 13px 13px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
}

.legend-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--legend, var(--teal));
}

.map-stack {
  display: grid;
  gap: 12px;
}

.version-node {
  min-height: 126px;
  padding: 12px;
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent, var(--teal));
  border-radius: 8px;
  background: var(--surface);
  text-align: left;
}

.version-node:hover {
  border-color: var(--accent, var(--teal));
}

.version-node strong {
  display: block;
  font-size: 14px;
}

.version-node span {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.matrix {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.matrix th,
.matrix td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.matrix th {
  color: var(--muted);
  font-size: 12px;
  font-weight: 720;
  background: var(--surface-alt);
}

.matrix tr:last-child td {
  border-bottom: 0;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 22px;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-alt);
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}

.decision-list {
  display: grid;
  gap: 9px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.decision-list li {
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent, var(--teal));
  border-radius: 8px;
  background: var(--surface);
  line-height: 1.5;
}

.doc-header {
  margin-bottom: 12px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.doc-kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  flex-wrap: wrap;
}

.doc-header h2 {
  margin: 10px 0 8px;
  font-size: 25px;
  line-height: 1.18;
}

.doc-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.article {
  padding: 10px 26px 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  line-height: 1.72;
  overflow: hidden;
}

.article h1,
.article h2,
.article h3,
.article h4 {
  line-height: 1.25;
  scroll-margin-top: 76px;
}

.article h1 {
  margin: 22px 0 18px;
  font-size: 28px;
}

.article h2 {
  margin: 34px -26px 15px;
  padding: 15px 26px 13px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface-alt);
  font-size: 20px;
}

.article h3 {
  margin: 25px 0 10px;
  font-size: 16px;
}

.article h4 {
  margin: 18px 0 8px;
  color: var(--muted);
  font-size: 14px;
}

.article p {
  margin: 9px 0;
}

.article ul,
.article ol {
  margin: 8px 0 13px;
  padding-left: 23px;
}

.article li {

  <script>
"use strict";
// spec-docs-pro document viewer. Reads only window.SPEC_DOCS_DATA; contains no project-specific data.

const DATA = window.SPEC_DOCS_DATA || null;
const VIEWS = ["overview", "reader", "features", "map", "evolution", "timeline"];
const STORAGE_PREFIX = `spec-docs:${DATA && DATA.project ? DATA.project.name : "default"}:`;
const KIND_LABELS = {
  current: "当前版本",
  planned: "规划",
  released: "已发布",
  history: "历史"
};
const STATUS_ORDER = ["planned", "in-progress", "local-verified", "pending-acceptance", "done", "blocked", "deprecated", "unknown"];

const state = {
  view: "overview",
  activeDocId: null,
  activeFeatureId: null,
  featureFilter: "",
  query: ""
};

const els = {};
let docIndex = new Map();
let featureIndex = new Map();
let trackIndex = new Map();
let versionIndex = new Map();

document.addEventListener("DOMContentLoaded", init);

function init() {
  for (const id of ["loadStatus", "docList", "content", "mainScroll", "outline", "outlineCount", "sideDecisions",
    "searchInput", "searchResults", "clearSearch", "readProgress", "sideQuality", "sideQualityPanel", "sideQualityCount"]) {
    els[id] = document.getElementById(id);
  }
  els.tabs = [...document.querySelectorAll(".segmented button")];

  if (!DATA || !Array.isArray(DATA.docs)) {
    els.loadStatus.textContent = "加载失败";
    els.content.innerHTML = panel("无法读取文档数据", `
      <p>没有找到 <code>window.SPEC_DOCS_DATA</code>。请确认数据文件与当前 HTML 位于同一目录，然后重新运行：</p>
      <pre><code>node &lt;skill&gt;/scripts/generate-browser.mjs --docs docs</code></pre>`);
    return;
  }

  docIndex = new Map(DATA.docs.map(doc => [doc.id, doc]));
  featureIndex = new Map((DATA.features || []).map(feature => [feature.id, feature]));
  trackIndex = new Map((DATA.tracks || []).map(track => [track.id, track]));
  versionIndex = new Map((DATA.versions || []).map(version => [version.id, version]));

  const counts = [`${DATA.docs.length} 份文档`];
  if (DATA.features && DATA.features.length) counts.push(`${DATA.features.length} 个功能`);
  if (location.protocol === "file:") counts.push("离线");
  els.loadStatus.textContent = counts.join(" · ");
  els.loadStatus.title = DATA.generatedAt ? `生成于 ${DATA.generatedAt}` : "";

  renderSideDecisions();
  renderSideQuality();
  bindEvents();
  renderDocList();

  const fromHash = parseHash();
  const saved = {
    view: readStore("view"),
    doc: readStore("doc"),
    feature: readStore("feature")
  };
  state.activeDocId = docIndex.has(fromHash.doc) ? fromHash.doc : docIndex.has(saved.doc) ? saved.doc : DATA.docs[0] && DATA.docs[0].id;
  state.activeFeatureId = featureIndex.has(fromHash.feature) ? fromHash.feature
    : featureIndex.has(saved.feature) ? saved.feature
    : DATA.features && DATA.features[0] ? DATA.features[0].id : null;
  setView(fromHash.view || saved.view || "overview", { replace: true });
}

function readStore(key) {
  try { return localStorage.getItem(STORAGE_PREFIX + key); } catch { return null; }
}

function writeStore(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, value); } catch { /* storage may be disabled for file:// */ }
}

function parseHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ""));
  return { view: params.get("view"), doc: params.get("doc"), feature: params.get("feature") };
}

function updateHash(replace) {
  const params = new URLSearchParams({ view: state.view });
  if (state.view === "reader" && state.activeDocId) params.set("doc", state.activeDocId);
  if (state.view === "timeline" && state.activeFeatureId) params.set("feature", state.activeFeatureId);
  const next = `#${params.toString()}`;
  if (next === location.hash) return;
  if (replace) history.replaceState(null, "", next);
  else history.pushState(null, "", next);
}

function bindEvents() {
  els.tabs.forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));

  els.searchInput.addEventListener("input", debounce(() => {
    state.query = els.searchInput.value.trim();
    els.clearSearch.style.display = state.query ? "block" : "none";
    renderSearch();
  }, 150));

  els.clearSearch.addEventListener("click", closeSearch);

  document.addEventListener("keydown", event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
      event.preventDefault();
      els.searchInput.focus();
      els.searchInput.select();
    }
    if (event.key === "Escape") els.searchResults.classList.remove("open");
  });

  document.addEventListener("click", event => {
    if (!els.searchResults.contains(event.target) && event.target !== els.searchInput) {
      els.searchResults.classList.remove("open");
    }
    const link = event.target.closest("[data-open-doc],[data-open-feature]");
    if (!link) return;
    event.preventDefault();
    if (link.dataset.openDoc) openDoc(link.dataset.openDoc, link.dataset.anchor);
    else openFeature(link.dataset.openFeature);
  });

  window.addEventListener("popstate", () => {
    const hash = parseHash();
    if (docIndex.has(hash.doc)) state.activeDocId = hash.doc;
    if (featureIndex.has(hash.feature)) state.activeFeatureId = hash.feature;
    setView(hash.view || "overview", { fromHistory: true });
  });

  els.mainScroll.addEventListener("scroll", () => {
    updateProgress();
    updateActiveOutline();
  });
}

function closeSearch() {
  els.searchInput.value = "";
  state.query = "";
  els.clearSearch.style.display = "none";
  els.searchResults.classList.remove("open");
}

function setView(view, options = {}) {
  if (!VIEWS.includes(view)) view = "overview";
  if (view === "timeline" && !(DATA.features || []).length) view = "features";
  state.view = view;
  writeStore("view", view);
  els.tabs.forEach(tab => {
    const active = tab.dataset.view === view;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-pressed", String(active));
  });

  if (view === "overview") renderOverview();
  if (view === "reader") renderReader();
  if (view === "features") renderFeatures();
  if (view === "map") renderMap();
  if (view === "evolution") renderEvolution();
  if (view === "timeline") renderTimeline();

  renderDocList();
  if (!options.fromHistory) updateHash(options.replace);
  if (!options.keepScroll) els.mainScroll.scrollTop = 0;
  updateProgress();
}

function openDoc(docId, anchor) {
  if (!docIndex.has(docId)) return;
  state.activeDocId = docId;
  writeStore("doc", docId);
  els.searchResults.classList.remove("open");
  setView("reader");
  if (anchor) {
    const target = findHeading(anchor);
    if (target) target.scrollIntoView({ block: "start" });
  }
}

function openFeature(featureId) {
  if (!featureIndex.has(featureId)) return;
  state.activeFeatureId = featureId;
  writeStore("feature", featureId);
  els.searchResults.classList.remove("open");
  setView("timeline");
}

// Accepts a GitHub-style slug, a heading id, or a stable ID prefix such as "D061" / "AC03".
function findHeading(anchor) {
  let decoded = anchor;
  try { decoded = decodeURIComponent(anchor); } catch { /* keep raw */ }
  const wanted = slug(decoded);
  const headings = [...document.querySelectorAll("#article h1,#article h2,#article h3,#article h4")];
  return headings.find(heading => heading.dataset.slug === wanted || heading.id === anchor)
    || headings.find(heading => heading.textContent.trim().toLowerCase().startsWith(`${decoded.toLowerCase()} `))
    || headings.find(heading => heading.dataset.slug.startsWith(wanted));
}

// ---------- shared rendering helpers ----------

function panel(title, body, tag = "") {
  return `
    <section class="panel">
      <div class="panel-head"><h2>${escapeHtml(title)}</h2>${tag ? `<span class="tag">${escapeHtml(tag)}</span>` : ""}</div>
      <div class="panel-body">${body}</div>
    </section>`;
}

function statBlock(label, value, caption) {
  return `
    <div class="stat">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(String(value))}</strong>
      <span>${escapeHtml(caption)}</span>
    </div>`;
}

function statusPill(implementation) {
  const info = implementation || { statusKey: "unknown", statusLabel: "未同步" };
  return `<span class="status-pill ${escapeHtml(info.statusKey)}">${escapeHtml(info.statusLabel)}</span>`;
}

function docLink(docId, label, anchor = "") {
  if (!docIndex.has(docId)) return escapeHtml(label);
  return `<a href="#view=reader&doc=${encodeURIComponent(docId)}" data-open-doc="${escapeHtml(docId)}"${anchor ? ` data-anchor="${escapeHtml(anchor)}"` : ""}>${escapeHtml(label)}</a>`;
}

function featureLink(featureId, label) {
  return `<a href="#view=timeline&feature=${encodeURIComponent(featureId)}" data-open-feature="${escapeHtml(featureId)}">${escapeHtml(label || featureId)}</a>`;
}

function renderSideDecisions() {
  const items = DATA.keyDecisions || [];
  els.sideDecisions.innerHTML = items.length
    ? items.map(item => `<li>
        ${item.id ? `<strong>${escapeHtml(item.id)}</strong> ` : ""}${item.doc ? docLink(item.doc, item.title, item.id) : escapeHtml(item.title)}
        ${item.summary ? `<small>${escapeHtml(item.summary)}</small>` : ""}
      </li>`).join("")
    : `<li class="muted">未发现冻结决策。在 <code>06-决策记录/V1-冻结决策.md</code> 中按 <code>## D001 标题</code> 记录。</li>`;
}

function renderSideQuality() {
  const warnings = DATA.warnings || [];
  if (!warnings.length) return;
  els.sideQualityPanel.hidden = false;
  els.sideQualityCount.textContent = String(warnings.length);
  els.sideQuality.innerHTML = `<ul class="quality-list">${warnings.slice(0, 12).map(item => `
    <li><code>${escapeHtml(item.code)}</code> ${item.doc ? docLink(item.doc, item.message) : escapeHtml(item.message)}</li>`).join("")}</ul>
    ${warnings.length > 12 ? `<p class="muted">另有 ${warnings.length - 12} 条，运行 <code>check-docs.mjs</code> 查看完整列表。</p>` : ""}`;
}

function renderDocList() {
  const groups = new Map();
  for (const doc of DATA.docs) {
    if (!groups.has(doc.group)) groups.set(doc.group, []);
    groups.get(doc.group).push(doc);
  }
  const html = [];
  for (const [group, docs] of groups) {
    const open = docs.some(doc => doc.id === state.activeDocId) || groups.size <= 3;
    html.push(`<details class="doc-group" ${open ? "open" : ""}>
      <summary><span>${escapeHtml(docs[0].groupLabel || group)}</span><span class="tag">${docs.length}</span></summary>
      ${docs.map(doc => `
        <button type="button" class="doc-item ${doc.id === state.activeDocId && state.view === "reader" ? "active" : ""}" data-open-doc="${escapeHtml(doc.id)}"
          style="--accent:${safeColor(doc.accent)};--accent-soft:${safeColor(doc.soft)}" title="${escapeHtml(doc.path)}">
          <span class="doc-badge">${escapeHtml(doc.badge || "··")}</span>
          <span class="doc-name">
            <strong>${escapeHtml(doc.title)}</strong>
            <span>${escapeHtml(doc.subgroup || doc.groupLabel)} · ${doc.lines} 行</span>
          </span>
        </button>`).join("")}
    </details>`);
  }
  els.docList.innerHTML = html.join("");
}

function renderOutline(items) {
  els.outlineCount.textContent = String(items.length);
  els.outline.innerHTML = items.slice(0, 120).map(item => `
    <a href="#${escapeHtml(item.id)}" class="lv${item.level}" data-target="${escapeHtml(item.id)}">${escapeHtml(item.text)}</a>`).join("");
  els.outline.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();
      const target = document.getElementById(link.dataset.target);
      if (target) target.scrollIntoView({ block: "start" });
    });
  });
}

function updateProgress() {
  const max = els.mainScroll.scrollHeight - els.mainScroll.clientHeight;
  const value = max > 0 ? Math.min(100, Math.max(0, (els.mainScroll.scrollTop / max) * 100)) : 0;
  els.readProgress.style.width = `${value}%`;
}

function updateActiveOutline() {
  const headings = [...els.content.querySelectorAll("h1[id],h2[id],h3[id],h4[id]")];
  let active = "";
  for (const heading of headings) {
    if (heading.getBoundingClientRect().top < 110) active = heading.id;
  }
  els.outline.querySelectorAll("a").forEach(link => link.classList.toggle("active", link.dataset.target === active));
}

function versionsOrdered() {
  return DATA.versions || [];
}

function currentVersion() {
  return versionIndex.get(DATA.currentVersion) || versionsOrdered()[0] || null;
}

function countBy(list, key) {
  return list.reduce((acc, item) => {
    const value = typeof key === "function" ? key(item) : item[key];
    acc[value] = (acc[value] || 0) + 1;
    return acc;
  }, {});
}

function safeColor(value) {
  return /^#[0-9a-f]{3,8}$/i.test(String(value || "")) ? value : "#69707a";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function slug(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/<[^>]+>/g, "")
    .replace(/[`*_~]/g, "")
    .replace(/[^\p{Letter}\p{Number}\s-]/gu, "")
    .trim()
    .replace(/\s+/g, "-");
}

function debounce(fn, delay) {
  let timer = null;
  return (...args) => {
    window.clearTimeout(timer);
    timer = window.setTimeout(() => fn(...args), delay);
  };
}


// ---------- markdown rendering (escape first, then add a small whitelist of markup) ----------

function stripFrontmatter(source) {
  return String(source || "").replace(/^\uFEFF?---\r?\n[\s\S]*?\r?\n---[ \t]*(\r?\n|$)/, "");
}

function renderMarkdown(source, sourcePath) {
  const lines = String(source || "").replace(/\r\n/g, "\n").split("\n");
  const html = [];
  const outline = [];
  const used = new Map();
  let index = 0;

  const headingId = text => {
    const base = slug(text) || "section";
    const count = used.get(base) || 0;
    used.set(base, count + 1);
    return { id: `h-${count ? `${base}-${count}` : base}`, slug: base };
  };

  while (index < lines.length) {
    const line = lines[index];

    const fence = /^\s*(`{3,}|~{3,})\s*([\w+-]*)/.exec(line);
    if (fence) {
      const marker = fence[1];
      const code = [];
      index += 1;
      while (index < lines.length && !new RegExp(`^\\s*${marker[0] === "`" ? "`" : "~"}{${marker.length},}\\s*$`).test(lines[index])) {
        code.push(lines[index]);
        index += 1;
      }
      index += 1;
      html.push(`<pre><code data-lang="${escapeHtml(fence[2])}">${escapeHtml(code.join("\n"))}</code></pre>`);
      continue;
    }

    const heading = /^(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
    if (heading) {
      const level = Math.min(heading[1].length, 4);
      const text = heading[2].replace(/[`*_]/g, "");
      const { id, slug: key } = headingId(text);
      outline.push({ id, text, level });
      html.push(`<h${level} id="${id}" data-slug="${escapeHtml(key)}">${inline(heading[2], sourcePath)}</h${level}>`);
      index += 1;
      continue;
    }

    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      html.push("<hr>");
      index += 1;
      continue;
    }

    if (isTableStartLine(lines, index)) {
      const block = [];
      while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
        block.push(lines[index]);
        index += 1;
      }
      html.push(renderTable(block, sourcePath));
      continue;
    }

    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const block = [];
      while (index < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[index]) || (/^\s{2,}\S/.test(lines[index]) && block.length))) {
        block.push(lines[index]);
        index += 1;
      }
      html.push(renderList(block, sourcePath));
      continue;
    }

    if (/^\s*>/.test(line)) {
      const quote = [];
      while (index < lines.length && /^\s*>/.test(lines[index])) {
        quote.push(lines[index].replace(/^\s*>\s?/, ""));
        index += 1;
      }
      html.push(`<blockquote>${renderMarkdown(quote.join("\n"), sourcePath).html}</blockquote>`);
      continue;
    }

    const image = /^\s*!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)\s*$/.exec(line);
    if (image) {
      html.push(renderFigure(image[1], image[2], sourcePath));
      index += 1;
      continue;
    }

    if (!line.trim()) {
      index += 1;
      continue;
    }

    const paragraph = [line];
    index += 1;
    while (index < lines.length && lines[index].trim() && !/^\s*(#{1,6}\s|`{3,}|~{3,}|>|([-*+]|\d+[.)])\s)/.test(lines[index]) && !isTableStartLine(lines, index)) {
      paragraph.push(lines[index]);
      index += 1;
    }
    html.push(`<p>${inline(paragraph.join("\n"), sourcePath).replace(/\n/g, " ")}</p>`);
  }

  return { html: html.join("\n"), outline };
}

function renderList(block, sourcePath) {
  const items = [];
  for (const raw of block) {
    const match = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(raw);
    if (match) items.push({ indent: match[1].replace(/\t/g, "  ").length, ordered: /\d/.test(match[2]), text: match[3] });
    else if (items.length) items[items.length - 1].text += ` ${raw.trim()}`;
  }
  const build = (start, indent) => {
    const ordered = items[start].ordered;
    const out = [];
    let i = start;
    while (i < items.length && items[i].indent >= indent) {
      if (items[i].indent > indent) {
        const nested = build(i, items[i].indent);
        out[out.length - 1] = out[out.length - 1].replace(/<\/li>$/, `${nested.html}</li>`);
        i = nested.next;
        continue;
      }
      const task = /^\[([ xX])\]\s+(.*)$/.exec(items[i].text);
      const body = task
        ? `<input type="checkbox" disabled ${task[1].trim() ? "checked" : ""} aria-label="${task[1].trim() ? "已完成" : "未完成"}"> ${inline(task[2], sourcePath)}`
        : inline(items[i].text, sourcePath);
      out.push(`<li>${body}</li>`);
      i += 1;
    }
    const tag = ordered ? "ol" : "ul";
    return { html: `<${tag}>${out.join("")}</${tag}>`, next: i };
  };
  const parts = [];
  let i = 0;
  while (i < items.length) {
    const result = build(i, items[i].indent);
    parts.push(result.html);
    i = result.next;
  }
  return parts.join("");
}

function isTableStartLine(lines, index) {
  return index + 1 < lines.length &&
    /^\s*\|.*\|\s*$/.test(lines[index]) &&
    /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(lines[index + 1]);
}

function splitTableRow(line) {
  const text = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  const cells = [];
  let current = "";
  let code = false;
  for (let i = 0; i < text.length; i += 1) {
    if (text[i] === "\\" && text[i + 1] === "|") { current += "|"; i += 1; continue; }
    if (text[i] === "`") code = !code;
    if (text[i] === "|" && !code) { cells.push(current.trim()); current = ""; continue; }
    current += text[i];
  }
  cells.push(current.trim());
  return cells;
}

function renderTable(block, sourcePath) {
  const rows = block.filter((_, i) => i !== 1).map(splitTableRow);
  if (!rows.length) return "";
  const [head, ...body] = rows;
  return `<div class="table-wrap"><table>
    <thead><tr>${head.map(cell => `<th scope="col">${inline(cell, sourcePath)}</th>`).join("")}</tr></thead>
    <tbody>${body.map(row => `<tr>${row.map(cell => `<td>${inline(cell, sourcePath)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}

function renderFigure(alt, href, sourcePath) {
  const url = safeUrl(resolveHref(href, sourcePath));
  const label = escapeHtml(alt || "文档图表");
  if (!url) return `<p class="muted">[图片已忽略：${label}]</p>`;
  return `<figure class="doc-figure">
    <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><img src="${escapeHtml(url)}" alt="${label}" loading="lazy" decoding="async"></a>
    <figcaption>${label}</figcaption>
  </figure>`;
}

// Inline spans: code first (protected), then links, emphasis and <br>.
function inline(value, sourcePath) {
  const codes = [];
  let text = String(value ?? "").replace(/`([^`]+)`/g, (_, code) => {
    codes.push(`<code>${escapeHtml(code)}</code>`);
    return `\u0000${codes.length - 1}\u0000`;
  });
  text = escapeHtml(text);
  text = text.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, href) => {
    const url = safeUrl(resolveHref(unescapeHtml(href), sourcePath));
    return url ? `<img class="inline-img" src="${escapeHtml(url)}" alt="${alt}">` : alt;
  });
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, label, href) => linkHtml(label, unescapeHtml(href), sourcePath));
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<em>$2</em>");
  text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => codes[Number(i)]);
}

function linkHtml(label, href, sourcePath) {
  const [target, anchor = ""] = href.split("#");
  if (!/^[a-z][a-z\d+.-]*:/i.test(href) && /\.md$/i.test(target || "")) {
    const docPath = joinPath(sourcePath, decodeURIComponentSafe(target));
    const docId = docPath.replace(/\.md$/i, "");
    if (docIndex.has(docId)) {
      return `<a href="#view=reader&doc=${encodeURIComponent(docId)}" data-open-doc="${escapeHtml(docId)}"${anchor ? ` data-anchor="${escapeHtml(anchor)}"` : ""}>${label}</a>`;
    }
    return `<span class="broken-link" title="链接目标不存在：${escapeHtml(docPath)}">${label}</span>`;
  }
  if (!target && anchor) {
    return `<a href="#${escapeHtml(anchor)}" data-open-doc="${escapeHtml(state.activeDocId || "")}" data-anchor="${escapeHtml(anchor)}">${label}</a>`;
  }
  const url = safeUrl(resolveHref(href, sourcePath));
  if (!url) return label;
  const external = /^https?:/i.test(url);
  return `<a href="${escapeHtml(url)}"${external ? ` target="_blank" rel="noopener noreferrer"` : ""}>${label}</a>`;
}

// Paths in the data are relative to docs/; the HTML lives in docs/<outputDir>/.
function resolveHref(href, sourcePath) {
  if (!href || /^(?:[a-z][a-z\d+.-]*:|#|\/)/i.test(href)) return href;
  const joined = joinPath(sourcePath, href);
  return `${DATA.docsBase || ""}${joined.split("/").map(encodeURIComponent).join("/")}`;
}

function joinPath(sourcePath, href) {
  const base = String(sourcePath || "").split("/").slice(0, -1);
  for (const part of String(href).split("/")) {
    if (!part || part === ".") continue;
    if (part === "..") base.pop();
    else base.push(part);
  }
  return base.join("/");
}

function safeUrl(url) {
  const value = String(url || "").trim();
  if (!value) return "";
  if (/^(https?:|mailto:|#|\.{0,2}\/|[^:]*$)/i.test(value)) return value;
  return "";
}

function unescapeHtml(value) {
  return String(value).replace(/&amp;/g, "&").replace(/&quot;/g, "\"").replace(/&#039;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
}

function decodeURIComponentSafe(value) {
  try { return decodeURIComponent(value); } catch { return value; }
}


// ---------- views ----------

function renderOverview() {
  const features = DATA.features || [];
  const current = currentVersion();
  const statusCounts = countBy(features, item => (item.implementation || {}).statusKey || "unknown");
  const done = statusCounts.done || 0;
  const frozen = (DATA.decisions || []).filter(item => item.statusKey === "frozen").length;
  const versions = versionsOrdered();

  els.content.innerHTML = `
    <section class="doc-header">
      <div class="doc-kicker"><span class="tag">总览</span><span>${escapeHtml(DATA.project.name)}</span>${current ? `<span>当前版本 ${escapeHtml(current.id)}</span>` : ""}</div>
      <h2>${escapeHtml(DATA.project.name)} 文档总览</h2>
      ${DATA.project.description ? `<p class="muted">${escapeHtml(DATA.project.description)}</p>` : ""}
    </section>

    <section class="stats">
      ${statBlock("文档", DATA.docs.length, "Markdown")}
      ${statBlock("功能", features.length, current ? `${current.id} 等版本` : "功能主文档")}
      ${statBlock("已完成", features.length ? `${done}/${features.length}` : "—", "以实现状态表为准")}
      ${statBlock("冻结决策", frozen || (DATA.decisions || []).length, `${(DATA.adrs || []).length} 份 ADR`)}
    </section>

    ${versions.length ? panel("版本链路", `
      <div class="version-strip">
        ${versions.map(version => `
          <button type="button" class="version-node ${escapeHtml(version.kind)}" ${version.doc ? `data-open-doc="${escapeHtml(version.doc)}"` : "disabled"}>
            <strong>${escapeHtml(version.id)}${version.title ? ` · ${escapeHtml(version.title)}` : ""}</strong>
            <span class="tag">${escapeHtml(KIND_LABELS[version.kind] || version.kind)}</span>
            <span>${escapeHtml(version.goal || "（版本路线图未写目标）")}</span>
          </button>`).join("")}
      </div>`, `${versions.length} 个版本`) : ""}

    ${features.length ? panel("实现状态分布", statusBars(statusCounts, features.length), "来源：实现状态表") : ""}

    ${panel("文档结构", groupTable(), `${new Set(DATA.docs.map(doc => doc.group)).size} 个分区`)}
  `;
  renderOutline([]);
}

function statusBars(counts, total) {
  const labels = {
    planned: "规划中", "in-progress": "开发中", "local-verified": "本地验证", "pending-acceptance": "待验收",
    done: "已完成", blocked: "阻塞", deprecated: "已废弃", unknown: "未同步"
  };
  return `<div class="status-bars">${STATUS_ORDER.filter(key => counts[key]).map(key => `
    <div class="status-bar">
      <span class="status-pill ${key}">${labels[key]}</span>
      <span class="bar"><i style="width:${((counts[key] / total) * 100).toFixed(1)}%"></i></span>
      <strong>${counts[key]}</strong>
    </div>`).join("")}</div>
    ${counts.unknown ? `<p class="muted">“未同步”表示该功能没有出现在版本实现状态表中。状态只在实现状态表维护，功能主文档不重复记录。</p>` : ""}`;
}

function groupTable() {
  const groups = new Map();
  for (const doc of DATA.docs) {
    const entry = groups.get(doc.group) || { label: doc.groupLabel, count: 0, lines: 0, first: doc.id };
    entry.count += 1;
    entry.lines += doc.lines;
    groups.set(doc.group, entry);
  }
  return `<table class="matrix"><thead><tr><th>分区</th><th>文档</th><th>行数</th></tr></thead><tbody>
    ${[...groups].map(([group, entry]) => `<tr><td>${docLink(entry.first, group)}</td><td>${entry.count}</td><td>${formatNumber(entry.lines)}</td></tr>`).join("")}
  </tbody></table>`;
}

function renderReader() {
  const doc = docIndex.get(state.activeDocId) || DATA.docs[0];
  if (!doc) {
    els.content.innerHTML = panel("没有文档", "<p>docs/ 目录下没有 Markdown 文件。</p>");
    return;
  }
  state.activeDocId = doc.id;
  const source = (DATA.content || {})[doc.id];
  if (typeof source !== "string") {
    els.content.innerHTML = panel("缺少文档内容", `<p>数据文件中没有 <code>${escapeHtml(doc.path)}</code> 的内容，请重新生成。</p>`);
    renderOutline([]);
    return;
  }
  const rendered = renderMarkdown(stripFrontmatter(source), doc.path);
  const feature = doc.featureId ? featureIndex.get(doc.featureId) : null;

  els.content.innerHTML = `
    <section class="doc-header" style="--accent:${safeColor(doc.accent)}">
      <div class="doc-kicker">
        <span class="tag">${escapeHtml(doc.groupLabel)}</span>

      </div>

  renderOutline(rendered.outline);
}

function renderFeatures() {

  els.content.innerHTML = `
    <section class="doc-header">
      <div class="doc-kicker"><span class="tag">功能</span><span>${features.length} 个功能 · ${domains.length} 个领域</span></div>

        <div class="feature-field">
          <label for="featureFilter">筛选（编号 / 名称 / 领域 / 状态）</label>

function renderEvolution() {
  const doc = DATA.evolutionDoc ? docIndex.get(DATA.evolutionDoc) : null;
  const tracks = DATA.tracks || [];
  if (!doc) {
    els.content.innerHTML = panel("没有功能演进矩阵", `

    return;
  }
  const versions = versionsOrdered();

    const stages = stagesFor(track, version);
    if (stages.length) return stages.map(stage => `<div class="cell-stage ${stage.gate ? "gate" : ""}">${escapeHtml(stage.stage)}</div>`).join("");
    const overview = track.overviewCells && track.overviewCells[version];
    return overview ? `<div class="cell-overview">${escapeHtml(overview)}</div>` : `<span class="muted">—</span>`;
  };
  const rendered = renderMarkdown(stripFrontmatter((DATA.content || {})[doc.id] || ""), doc.path);

  els.content.innerHTML = `
    <section class="doc-header">
      <div class="doc-kicker"><span class="tag">演进</span><span>${tracks.length} 条能力主线 · ${versions.length} 个版本</span></div>
      <h2>${escapeHtml(doc.title)}</h2>
      <div class="doc-meta">${docLink(doc.id, "打开原文")}</div>
    </section>
    ${tracks.length ? `<div class="table-wrap evolution-grid"><table>
      <thead><tr><th>能力主线</th>${columns.map(id => `<th>${escapeHtml(id === "future" ? "后续" : id)}${versionIndex.get(id) ? `<br><small>${escapeHtml(KIND_LABELS[versionIndex.get(id).kind] || "")}</small>` : ""}</th>`).join("")}</tr></thead>
      <tbody>${tracks.map(track => `<tr>
        <th style="border-left:4px solid ${safeColor(track.accent)}">${escapeHtml(track.title)}</th>
        ${columns.map(id => `<td>${cell(track, id)}</td>`).join("")}
      </tr>`).join("")}</tbody>

function stagesFor(track, versionId) {
  return (track.stages || []).filter(stage => stage.version === versionId);
}

      <div>
        <div class="feature-summary-meta">
          <span class="tag">${escapeHtml(feature.id)}</span>
          ${statusPill(impl)}
          <span class="tag">${escapeHtml(feature.domain || "未标注领域")}</span>
          ${feature.risk === "high" ? `<span class="risk high">高风险</span>` : ""}
          <span class="tag">主责：${escapeHtml(track ? track.title : "未关联能力主线")}</span>
        </div>
        <h2>${escapeHtml(feature.title)}</h2>
        <p>${escapeHtml(feature.goal || "功能目标以主文档为准。")}</p>
      </div>
      <div class="feature-summary-links">
        ${docLink(feature.doc, "打开功能主文档")}
        ${feature.design ? docLink(feature.design, "打开技术设计") : ""}

          <p>${track ? (feature.trackSource === "domain" ? "主责能力按领域名称推断，可在功能主文档 frontmatter 中用 track 字段指定。" : "主责能力来自显式映射。") : "该功能没有关联能力主线，只显示当前版本节点。"}</p>
        </div>
        <div class="timeline-legend" aria-label="图例">
          <span class="current"><i></i>当前版本</span>

function milestone(feature, track, version) {
  const axis = (label, caption) => `
    <div class="milestone-axis"><span class="milestone-dot" aria-hidden="true"></span><strong>${escapeHtml(label)}</strong><small>${escapeHtml(caption)}</small></div>`;
  const mobile = (label, caption) => `<div class="milestone-mobile-meta"><strong>${escapeHtml(label)}</strong><span>${escapeHtml(caption)}</span></div>`;
  const stages = track ? stagesFor(track, version.id) : [];
  const ownVersion = version.id === feature.version;

  if (ownVersion) {
    const impl = feature.implementation || {};
    const gates = stages.filter(stage => stage.gate);
    return `
      <article class="feature-milestone current">
        ${axis(version.id, "本功能所在版本")}
        <div class="milestone-card">
          <div class="milestone-state-line">${mobile(version.id, "本功能所在版本")}<span class="milestone-state current">${escapeHtml(KIND_LABELS[version.kind] || "版本")}</span>${statusPill(impl)}</div>
          <h4>${escapeHtml(feature.title)}</h4>
          <p>${escapeHtml(feature.goal || "功能行为以主文档为准。")}</p>
          <div class="milestone-facts">
            <div class="milestone-fact"><span>后端</span><strong>${escapeHtml(impl.backend || "—")}</strong></div>
            <div class="milestone-fact"><span>前端</span><strong>${escapeHtml(impl.frontend || "—")}</strong></div>
            <div class="milestone-fact"><span>验证</span><strong>${escapeHtml(impl.verification || "—")}</strong></div>
          </div>
          ${impl.gap ? `<div class="milestone-detail"><strong>当前差距</strong><span>${escapeHtml(impl.gap)}</span></div>` : ""}
          ${feature.dependencies ? `<div class="milestone-detail"><strong>上游依赖</strong><span>${escapeHtml(feature.dependencies)}</span></div>` : ""}
          ${gates.map(stage => `<div class="milestone-detail"><strong>${escapeHtml(stage.stage)}</strong><span>${inline(stage.change, DATA.evolutionPath)}</span></div>`).join("")}
          <div class="milestone-source">状态更新：${escapeHtml(impl.updatedAt || "未标注")}${impl.statusKey === "unknown" ? " · 实现状态表中没有该功能" : ""}</div>
        </div>
      </article>`;
  }

  if (version.kind === "history" && !stages.length) {
    return `
      <article class="feature-milestone history">
        ${axis(version.id, "历史")}
        <div class="milestone-card">
          <div class="milestone-state-line">${mobile(version.id, "历史")}<span class="milestone-state history">历史范围</span></div>
          <h4>${escapeHtml(version.title || "不参与当前规划")}</h4>
          <p>${escapeHtml(version.goal || "该版本已归档，不参与当前规划。")}</p>
        </div>
      </article>`;
  }

  if (!stages.length) {
    const overview = track && track.overviewCells ? track.overviewCells[version.id] : "";
    const caption = overview ? "总览关联" : "无单独规划";
    return `
      <article class="feature-milestone ${overview ? "planned" : "empty"}">
        ${axis(version.label || version.id, caption)}
        <div class="milestone-card">
          <div class="milestone-state-line">${mobile(version.label || version.id, caption)}<span class="milestone-state ${overview ? "" : "empty"}">${overview ? "总览关联" : "无阶段"}</span></div>
          <h4>${escapeHtml(overview ? `${version.label || version.id} 总览` : "该能力在此版本没有阶段变化")}</h4>
          <p>${escapeHtml(overview || "空白不代表取消；调整规划时先更新版本路线图和功能演进矩阵。")}</p>
        </div>
      </article>`;
  }

  const main = stages.find(stage => !stage.gate) || stages[0];
  const caption = main.gate ? "发布门禁" : "关联能力规划";
  return `
    <article class="feature-milestone ${main.gate ? "gate" : "planned"}">
      ${axis(version.label || version.id, caption)}
      <div class="milestone-card">
        <div class="milestone-state-line">${mobile(version.label || version.id, caption)}<span class="milestone-state ${main.gate ? "gate" : ""}">${escapeHtml(caption)}</span></div>
        <h4>${escapeHtml(main.stage)}</h4>
        <p>${inline(main.change, DATA.evolutionPath)}</p>
        ${main.dependencies ? `<div class="milestone-detail"><strong>依赖与边界</strong><span>${inline(main.dependencies, DATA.evolutionPath)}</span></div>` : ""}
        ${main.completion ? `<div class="milestone-detail"><strong>完成判定</strong><span>${inline(main.completion, DATA.evolutionPath)}</span></div>` : ""}
        ${main.source ? `<div class="milestone-source">${inline(main.source, DATA.evolutionPath)}</div>` : ""}
        ${stages.length > 1 ? `<div class="milestone-source">同版本另有 ${stages.length - 1} 个阶段，详见功能演进矩阵。</div>` : ""}
      </div>
    </article>`;
}

function renderSearch() {
  if (!state.query) {
    els.searchResults.classList.remove("open");
    els.searchResults.innerHTML = "";
    return;
  }
  const query = state.query.toLowerCase();
  const featureHits = (DATA.features || []).filter(item => [item.id, item.title, item.domain, item.goal]
    .some(value => String(value || "").toLowerCase().includes(query))).slice(0, 12);
  const decisionHits = (DATA.decisions || []).filter(item => `${item.id} ${item.title} ${item.summary}`.toLowerCase().includes(query)).slice(0, 8);
  const lineHits = [];
  for (const doc of DATA.docs) {
    const source = (DATA.content || {})[doc.id] || "";
    const lines = source.split(/\r?\n/);
    for (let index = 0; index < lines.length && lineHits.length < 80; index += 1) {
      if (lines[index].toLowerCase().includes(query)) lineHits.push({ doc, line: lines[index].trim(), lineNo: index + 1 });
    }
  }
  const item = (attrs, top, right, body) => `
    <button type="button" class="result-item" ${attrs}>
      <span class="result-top"><span>${top}</span><span>${right}</span></span>
      <span class="result-line">${body}</span>
    </button>`;
  const html = [
    ...featureHits.map(feature => item(`data-open-feature="${escapeHtml(feature.id)}"`, `${escapeHtml(feature.id)} · 功能`, escapeHtml((feature.implementation || {}).statusLabel || ""), highlight(`${feature.title} · ${feature.goal || ""}`, state.query))),
    ...decisionHits.map(decision => item(`data-open-doc="${escapeHtml(decision.doc)}" data-anchor="${escapeHtml(decision.id)}"`, `${escapeHtml(decision.id)} · 决策`, escapeHtml(decision.status), highlight(`${decision.title} ${decision.summary || ""}`, state.query))),
    ...lineHits.map(hit => item(`data-open-doc="${escapeHtml(hit.doc.id)}"`, escapeHtml(hit.doc.title), `第 ${hit.lineNo} 行`, highlight(hit.line || "(空行)", state.query)))
  ];
  els.searchResults.innerHTML = html.length ? html.join("") : `<div class="empty">没有匹配项</div>`;
  els.searchResults.classList.add("open");
}

function diagram(title, caption, svg) {
  if (!svg) return "";
  return `
    <section class="diagram">
      <div class="diagram-head"><h3>${escapeHtml(title)}</h3></div>
      <div class="diagram-body">${svg}</div>
      <div class="diagram-caption">${escapeHtml(caption)}</div>
    </section>`;
}

function svgText(x, y, text, attrs = "") {
  return `<text x="${x}" y="${y}" ${attrs}>${escapeHtml(text)}</text>`;
}

function clip(text, max) {
  const value = String(text || "");
  return value.length > max ? `${value.slice(0, max - 1)}…` : value;
}

function versionRoadmapSvg() {
  const versions = versionsOrdered();
  if (!versions.length) return "";
  const colors = { current: "#2f7d4f", planned: "#4056a1", released: "#087d75", history: "#8b929a" };
  const perRow = 4;
  const width = 960;
  const cardW = 210;
  const gap = (width - 72 - perRow * cardW) / (perRow - 1);
  const rows = Math.ceil(versions.length / perRow);
  const height = 70 + rows * 120;
  const cards = versions.map((version, index) => {
    const x = 36 + (index % perRow) * (cardW + gap);
    const y = 56 + Math.floor(index / perRow) * 120;
    const color = colors[version.kind] || colors.planned;
    const dashed = version.kind === "history" ? ` stroke-dasharray="5 5"` : "";
    return `<g>
      <rect x="${x}" y="${y}" width="${cardW}" height="92" rx="8" fill="#ffffff" stroke="${color}"${dashed}></rect>
      <rect x="${x}" y="${y}" width="6" height="92" rx="3" fill="${color}"></rect>
      ${svgText(x + 18, y + 26, `${version.id}${version.title ? ` · ${clip(version.title, 10)}` : ""}`, `font-size="14" font-weight="700" fill="#1d1f22"`)}
      ${svgText(x + 18, y + 46, KIND_LABELS[version.kind] || version.kind, `font-size="11" fill="${color}"`)}
      ${svgText(x + 18, y + 68, clip(version.goal || "", 15), `font-size="11" fill="#69707a"`)}
      ${svgText(x + 18, y + 84, clip((version.goal || "").slice(15), 15), `font-size="11" fill="#69707a"`)}
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="版本路线">
    <rect width="${width}" height="${height}" rx="8" fill="#fbfaf7"></rect>
    ${svgText(36, 34, `${versions.length} 个版本`, `font-size="16" font-weight="700" fill="#1d1f22"`)}
    ${cards}
  </svg>`;
}

function heatmapSvg() {
  const tracks = DATA.tracks || [];
  const versions = versionsOrdered();
  if (!tracks.length || !versions.length) return "";
  const columns = [...versions.map(version => version.id), "future"];
  const labelW = 230;
  const cellW = Math.max(56, Math.floor((960 - labelW - 48) / columns.length));
  const cellH = 34;
  const width = labelW + cellW * columns.length + 48;
  const height = 70 + tracks.length * (cellH + 6);
  const header = columns.map((id, index) => svgText(labelW + index * cellW + cellW / 2, 52, id === "future" ? "后续" : id, `font-size="12" text-anchor="middle" fill="#69707a"`)).join("");
  const rows = tracks.map((track, row) => {
    const y = 62 + row * (cellH + 6);
    const cells = columns.map((id, index) => {
      const stages = stagesFor(track, id);
      const overview = track.overviewCells && track.overviewCells[id];
      const fill = stages.some(stage => stage.gate) ? "#f6ead6" : stages.length ? "#dcefeb" : overview ? "#eef1f8" : "#ffffff";
      const stroke = stages.length ? safeColor(track.accent) : "#dedbd2";
      const label = stages.length ? String(stages.length) : overview ? "·" : "";
      const x = labelW + index * cellW;
      return `<rect x="${x + 3}" y="${y}" width="${cellW - 6}" height="${cellH}" rx="6" fill="${fill}" stroke="${stroke}"></rect>
        ${label ? svgText(x + cellW / 2, y + 22, label, `font-size="12" text-anchor="middle" fill="#1d1f22"`) : ""}`;
    }).join("");
    return `${svgText(36, y + 22, clip(track.title.replace(/演进$/, ""), 14), `font-size="12" fill="#1d1f22"`)}${cells}`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="能力版本热力图">
    <rect width="${width}" height="${height}" rx="8" fill="#fbfaf7"></rect>
    ${svgText(36, 30, "数字 = 阶段数；· = 仅在总览中提及；浅橙 = 含发布门禁", `font-size="12" fill="#69707a"`)}
    ${header}${rows}
  </svg>`;
}

function domainStatusSvg() {
  const features = DATA.features || [];
  if (!features.length) return "";
  const colors = {
    planned: "#c6c1b5", "in-progress": "#a96810", "local-verified": "#087d75", "pending-acceptance": "#4056a1",
    done: "#2f7d4f", blocked: "#aa2d4d", deprecated: "#8b929a", unknown: "#e5e1d8"
  };
  const domains = [...new Set(features.map(item => item.domain || "未分组"))];
  const barW = 600;
  const height = 70 + domains.length * 38 + 30;
  const rows = domains.map((domain, row) => {
    const list = features.filter(item => (item.domain || "未分组") === domain);
    const counts = countBy(list, item => (item.implementation || {}).statusKey || "unknown");
    let x = 260;
    const y = 56 + row * 38;
    const segments = STATUS_ORDER.filter(key => counts[key]).map(key => {
      const w = (counts[key] / list.length) * barW;
      const rect = `<rect x="${x}" y="${y}" width="${Math.max(w, 2)}" height="24" fill="${colors[key]}"><title>${escapeHtml(key)}: ${counts[key]}</title></rect>`;
      x += w;
      return rect;
    }).join("");
    return `${svgText(36, y + 17, `${clip(domain, 12)}（${list.length}）`, `font-size="12" fill="#1d1f22"`)}${segments}`;
  }).join("");
  const legendLabels = { planned: "规划中", "in-progress": "开发中", "local-verified": "本地验证", "pending-acceptance": "待验收", done: "已完成", blocked: "阻塞", deprecated: "已废弃", unknown: "未同步" };
  const legend = STATUS_ORDER.map((key, index) => `<rect x="${36 + index * 110}" y="${height - 26}" width="12" height="12" fill="${colors[key]}"></rect>${svgText(54 + index * 110, height - 16, legendLabels[key], `font-size="11" fill="#69707a"`)}`).join("");
  return `<svg viewBox="0 0 960 ${height}" role="img" aria-label="领域与实现状态">
    <rect width="960" height="${height}" rx="8" fill="#fbfaf7"></rect>
    ${svgText(36, 32, `${domains.length} 个领域 · ${features.length} 个功能`, `font-size="14" font-weight="700" fill="#1d1f22"`)}
    ${rows}${legend}
  </svg>`;
}

function riskSvg() {
  const features = DATA.features || [];
  if (!features.length) return "";
  const high = features.filter(item => item.risk === "high");
  const missingDesign = high.filter(item => !item.design).length;
  const width = 960;
  const height = 150;
  const ratio = features.length ? high.length / features.length : 0;
  return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="风险分布">
    <rect width="${width}" height="${height}" rx="8" fill="#fbfaf7"></rect>
    ${svgText(36, 36, `高风险 ${high.length} / ${features.length}`, `font-size="16" font-weight="700" fill="#1d1f22"`)}
    <rect x="36" y="56" width="888" height="26" rx="6" fill="#e1f0e8"></rect>
    <rect x="36" y="56" width="${(888 * ratio).toFixed(1)}" height="26" rx="6" fill="#f4dde4" stroke="#aa2d4d"></rect>
    ${svgText(36, 112, missingDesign ? `${missingDesign} 个高风险功能缺少独立技术设计` : "所有高风险功能都有独立技术设计", `font-size="13" fill="${missingDesign ? "#aa2d4d" : "#2f7d4f"}"`)}
  </svg>`;
}

function formatNumber(value) {
  return new Intl.NumberFormat("zh-CN").format(value);
}

function highlight(line, query) {
  const escaped = escapeHtml(clip(line, 220));
  if (!query) return escaped;
  return escaped.replace(new RegExp(escapeRegExp(escapeHtml(query)), "gi"), match => `<mark>${match}</mark>`);
}
