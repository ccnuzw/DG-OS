openapi: 3.1.0
info:
  title: DGOS V1 局域网协同 API
  description: |
    V1-FR-010 局域网协同的 HTTP 与 WebSocket 白名单（D099，2026-11-01；2026-11-01 已由 crates/dgos-lan 实现）。
    实现状态与验证证据见 docs/02-产品与版本/当前版本/V1-实现状态.md。桌面端使用 Tauri commands，
    见 docs/04-技术架构/当前版本/V1-接口契约.md。

    本文件是 HTTP 字段的唯一权威；公共语义（准入顺序、Cookie、撤销、WebSocket 帧与关闭码、主机命令）
    见接口契约 §14，实现规则见 docs/03-功能规格/V1/03-系统功能/10-局域网协同-技术设计.md。

    **白名单**：只有下列路径。白名单之外的 `/api/` 路径返回 404，已登记路径的其他方法返回 405，
    均为空包体；不映射任何 Tauri command（D039、D088）。

    **ASST-FOUNDATION 边界**：桌面 `host.ai` 与 `chat_*` 新增的资料导入/删除、foundation 配置、
    上下文检查、结构输出后校验、限期结果读取/确认、显式摘要/继续均不新增 LAN 路由或工具权限。
    `LanSendInput`/`LanRegenerateInput` 保持独立白名单和 `additionalProperties: false`，不能提交
    `foundation`、`context_refs`、`source_run_id`、`skill_mode`、`authorized_skill_refs`、`tools` 或宿主 scope；未知字段按解码失败处理，
    不把桌面共享 DTO 的扩展自动映射到远程输入。具体桌面契约见接口契约 §10.1、§17.5，
    技术依据为 AI助手运行基础技术设计（ASST-FOUNDATION）；无隐藏聊天或业务应用扩围。

    **认证**：主机签发的单次访问凭据经 `POST /api/v1/lan/pair` 换取 Cookie `dgos_lan`
    （`HttpOnly; SameSite=Strict; Path=/`，无 TLS 不设 `Secure`）。不使用 JWT、用户名/密码、
    `Authorization: Bearer` 或浏览器存储（D053、D088）。远程会话没有独立用户身份。

    **网络**：只绑定一个私网 IPv4 接口地址（10/8、172.16/12、192.168/16），不监听 `0.0.0.0`、
    回环与 IPv6。`Host` 必须等于绑定的 `IP:端口`；`POST`、`DELETE` 与 WebSocket 升级要求同源
    `Origin`。不返回任何 CORS 头（D088）。

    **错误**：业务错误为 `LanError`，`code` 是 V1-错误码 的 7 位数字码，HTTP 状态取错误码表。
    传输层错误（404、405、400 解码失败、413、415）为空包体。

    **历史**：D099 之前的草图（Bearer JWT、`/auth/login`、`/auth/me`、Provider/Skills/MCP/模块/
    对话的通用路径）已作废，原文归档在 docs/99-历史归档/V1-FR-010/2026-11-01-旧OpenAPI草图.yaml。
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://{lanIp}:{port}
    description: 主机绑定的私网 IPv4 地址与端口（首选端口默认 8635，被占用时临时回退到其后 19 个端口，D088、D107）
    variables:
      lanIp:
        default: 192.168.1.100
        description: 只能是 10/8、172.16/12、192.168/16 中的接口地址
      port:
        default: '8635'

tags:
  - name: spa
    description: 远程 SPA 静态资源（无需会话）
  - name: session
    description: 配对、会话状态与登出
  - name: targets
    description: 只读目标列表
  - name: chat
    description: 远程聊天（只限本设备本次配对创建的会话）
  - name: stream
    description: WebSocket 流式接收

security:
  - lanSession: []

paths:
  /api/v1/lan/bootstrap:
    get:
      tags: [spa]
      operationId: getLanBootstrap
      summary: 读取主机解析语言和资源版本（FR-016、D118）
      description: 配对前可读，仍经过私网、Host 和 Origin 准入。不返回偏好、用户或凭据；重载远程页面时重新获取。
      security: []
      responses:
        '200':
          description: 当前解析语言
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [locale, catalog_version]
                properties:
                  locale:
                    type: string
                    enum: [zh-CN, en-US]
                  catalog_version:
                    type: string
                    const: v1
        '503':
          description: 主机语言暂不可读，远程页面继续使用中文后备文案，不展示内部详情
  /:
    get:
      tags: [spa]
      operationId: getLanSpa
      summary: 远程 SPA 入口
      description: 其他非 `/api/` 的 `GET` 路径同样返回 `index.html`（客户端路由）；`/assets/*` 返回打包的静态资源。
      security: []
      responses:
        '200':
          description: index.html
          content:
            text/html:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/pair:
    post:
      tags: [session]
      operationId: pairLanDevice
      summary: 用访问凭据配对
      description: |
        凭据单次有效；成功后凭据作废并经 `Set-Cookie` 下发会话。带有效 Cookie 且来源 IP 与该会话相同的设备再次配对时，
        旧会话以 `re_paired` 被替换，会话数不增加；凭据错误时旧会话保留（D101）。带有效 Cookie 但来源 IP 不同时，
        先以 `ip_changed` 撤销该旧会话，再按普通配对处理；凭据错误时旧会话也已撤销（D105）。
        限速：每来源 IP 每分钟 5 次、全局每分钟 20 次；已有 8 个会话时拒绝且不消耗凭据（同 IP 的重新配对除外）。没有幂等键。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanPairInput'
      responses:
        '200':
          description: 配对成功
          headers:
            Set-Cookie:
              description: '`dgos_lan=<令牌>; HttpOnly; SameSite=Strict; Path=/`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanSessionStatus'
        '401':
          description: 1010004 访问凭据无效或已使用；1010005 访问凭据过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanError'
        '403':
          $ref: '#/components/responses/NotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/lan/session:
    get:
      tags: [session]
      operationId: getLanSession
      summary: 当前远程会话状态
      responses:
        '200':
          description: 会话有效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanSessionStatus'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/logout:
    post:
      tags: [session]
      operationId: logoutLanSession
      summary: 登出
      description: 有有效会话时撤销（原因 `logout`）；没有时同样返回 204。总是清除 Cookie。
      security: []
      responses:
        '204':
          description: 已登出
          headers:
            Set-Cookie:
              description: '`dgos_lan=; Max-Age=0; Path=/`'
              schema:
                type: string
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/targets:
    get:
      tags: [targets]
      operationId: listLanTargets
      summary: 只读目标列表
      description: 已启用 Provider 的文本生成模型与已启用技能；不含 endpoint、credential_ref、配置、用量与连接状态。
      responses:
        '200':
          description: 目标列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanTargets'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/chat/sessions:
    post:
      tags: [chat]
      operationId: createLanChatSession
      summary: 新建聊天会话
      description: 目标在新建时固定，之后不能修改。每个远程会话最多创建 100 个聊天会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanCreateChatSessionInput'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          $ref: '#/components/responses/ChatError'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'
        '409':
          $ref: '#/components/responses/ChatError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [chat]
      operationId: listLanChatSessions
      summary: 列出本设备本次配对创建的聊天会话
      description: 不分页，按 `updated_at` 倒序。
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [chat]
      operationId: listLanChatMessages
      summary: 读取会话消息
      description: 分页规则同桌面 `list_chat_messages`。集合外的会话返回 404 1006001。
      parameters:
        - name: before_seq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: 一页消息，按 seq 升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagePage'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'
        '404':
          $ref: '#/components/responses/ChatError'
    post:
      tags: [chat]
      operationId: sendLanChatMessage
      summary: 发送消息
      description: |
        生成登记后返回；事件只经 `GET /api/v1/lan/stream` 推送。`client_request_id` 即任务 ID，
        同键同内容返回原确认（`replayed = true`），同键不同内容 409 1006011。目标指纹变化返回 409 1006012
        且不带 `detail`，须在主机上确认。不接受 `tools`、`accept_destination`、`foundation`、资料引用或来源运行。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanSendInput'
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAck'
        '400':
          $ref: '#/components/responses/ChatError'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'
        '404':
          $ref: '#/components/responses/ChatError'
        '409':
          $ref: '#/components/responses/ChatError'
        '502':
          $ref: '#/components/responses/ChatError'

  /api/v1/lan/chat/messages/{messageId}/regenerate:
    parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      operationId: regenerateLanChatMessage
      summary: 重新生成最后一条助手回复
      description: 只对本设备本次配对创建的会话；其他情况统一 409 1006014。幂等规则同发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanRegenerateInput'
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendAck'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'
        '409':
          $ref: '#/components/responses/ChatError'

  /api/v1/lan/chat/tasks/{taskId}/cancel:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      operationId: cancelLanChatTask
      summary: 取消本设备发起的生成
      description: 只取消本远程会话发起、尚未结束的任务；其他一律 `cancelled = false`，重复调用无副作用。
      responses:
        '200':
          description: 结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cancelled]
                properties:
                  cancelled:
                    type: boolean
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'

  /api/v1/lan/stream:
    get:
      tags: [stream]
      operationId: openLanStream
      summary: WebSocket 流式接收
      description: |
        WebSocket 升级。握手要求同源 `Origin` 与有效 Cookie。只有服务端到客户端的文本帧，
        每帧为 `LanStreamFrame`；客户端发数据帧即以 1008 关闭。每个远程会话同时只有一条连接。
        没有连接时的事件丢弃；断线不取消生成。关闭码：4401 会话已撤销或过期、4409 被新连接取代、
        4413 发送队列满、1001 服务停止、1008 协议违规。ping 30 秒，无 pong 60 秒关闭。
      responses:
        '101':
          description: 协议切换；之后的帧见 `LanStreamFrame`
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          $ref: '#/components/responses/NotAllowed'

components:
  securitySchemes:
    lanSession:
      type: apiKey
      in: cookie
      name: dgos_lan
      description: 256 位不透明令牌（base64url），服务端只存哈希；闲置 30 分钟、最长 12 小时。

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotAllowed:
      description: 1010007 来源地址、Host 或 Origin 不被允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LanError'
    SessionInvalid:
      description: 1010006 远程会话不存在、已过期或已撤销；响应清除 Cookie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LanError'
    RateLimited:
      description: 1010011 lan_rate_limited；`pair_ip`、`pair_global` 时带 `Retry-After` 头
      headers:
        Retry-After:
          description: 秒数，仅 `pair_ip`、`pair_global`
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/LanError'
              - type: object
                properties:
                  detail:
                    $ref: '#/components/schemas/LanRateLimitDetail'
    ChatError:
      description: FR-006 的 1006xxx 或 Provider 的 1001xxx（原样透传），HTTP 状态取错误码表
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LanError'

  schemas:
    LanError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: V1-错误码 的 7 位数字码
          examples: [1010006]
        message:
          type: string
          description: 固定文本，不回显入参
        detail:
          type: object
          additionalProperties: true

    LanRateLimitDetail:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [pair_ip, pair_global, session_limit, chat_sessions]
        retry_after_seconds:
          type: integer
          minimum: 1
          description: 仅 pair_ip、pair_global

    LanPairInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          maxLength: 64
          description: 26 个 Crockford Base32 字符；'-' 与空白被忽略，大小写不敏感

    LanSessionStatus:
      type: object
      additionalProperties: false
      required: [short_id, device_label, created_at, expires_at, idle_expires_at]
      properties:
        short_id:
          type: string
          pattern: '^[0-9a-f]{8}$'
        device_label:
          type: string
        created_at:
          type: integer
        expires_at:
          type: integer
          description: created_at + 12 小时
        idle_expires_at:
          type: integer
          description: 最近一次准入 + 30 分钟

    LanTargets:
      type: object
      additionalProperties: false
      required: [providers, skills]
      properties:
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, models]
            properties:
              id:
                type: string
              name:
                type: string
              models:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
        skills:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, version]
            properties:
              id:
                type: string
              name:
                type: string
              version:
                type: string

    LanCreateChatSessionInput:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: object
          additionalProperties: false
          required: [provider_id, model_id]
          description: 技能默认不选择；skill_id省略或null允许发送。非空skill_id与no_skill=true互斥，所选技能不可用仍拒绝。
          properties:
            provider_id:
              type: string
            model_id:
              type: string
            skill_id:
              type: [string, 'null']
            no_skill:
              type: boolean
              default: false
              description: 旧客户端兼容字段；省略、false或true均允许空技能，不作为发送或重新生成的许可门槛。

    LanSendInput:
      type: object
      additionalProperties: false
      description: 独立LAN白名单；不接收桌面foundation、资源引用、输出契约、结果保留、显式继续或MCP工具配置。
      required: [content, client_request_id]
      properties:
        content:
          type: string
          minLength: 1
          description: 去首尾空白后非空，不超过 16384 UTF-8 字节
        client_request_id:
          type: string
          format: uuid

    LanRegenerateInput:
      type: object
      additionalProperties: false
      description: 仅本次配对会话的原重新生成；不接收桌面skill_mode/authorized_skill_refs、foundation或资料/来源运行参数，不开放按需技能授权或桌面显式继续；保留既有会话手选技能的固定版本重验。
      required: [client_request_id]
      properties:
        client_request_id:
          type: string
          format: uuid

    ChatSession:
      type: object
      description: 与接口契约 §10.1 的 ChatSession 相同
      required: [id, title, title_source, provider_id, model_id, skill_id, skill_version_id, no_skill_confirmed, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        title_source:
          type: string
          enum: [auto, user]
        provider_id:
          type: [string, 'null']
        model_id:
          type: [string, 'null']
        skill_id:
          type: [string, 'null']
        skill_version_id:
          type: [string, 'null']
        no_skill_confirmed:
          type: boolean
          description: 旧客户端兼容元数据；空技能会话的false与true均允许发送及重新生成，旧行无需迁移。
        created_at:
          type: integer
        updated_at:
          type: integer

    ChatMessage:
      type: object
      description: 与接口契约 §10.1 的 ChatMessage 相同
      required: [id, session_id, seq, role, content, status, task_id, finish_reason, error_code, total_tokens, result_unknown, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        seq:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        status:
          type: string
          enum: [generating, completed, interrupted, failed]
        task_id:
          type: [string, 'null']
        finish_reason:
          type: [string, 'null']
        error_code:
          type: [string, 'null']
          description: 固定类别字符串，不是错误码
        total_tokens:
          type: [integer, 'null']
          description: null 表示用量未知，界面不得显示 0
        result_unknown:
          type: boolean
        created_at:
          type: integer
        updated_at:
          type: integer

    ChatMessagePage:
      type: object
      required: [items, next_before_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        next_before_seq:
          type: [integer, 'null']

    SendAck:
      type: object
      description: 与接口契约 §10.1 的 SendAck 相同
      required: [task_id, user_message_id, assistant_message_id, dropped_turns, replayed]
      properties:
        task_id:
          type: string
          format: uuid
        user_message_id:
          type: string
          format: uuid
        assistant_message_id:
          type: string
          format: uuid
        dropped_turns:
          type: integer
        replayed:
          type: boolean

    LanRevokeReason:
      type: string
      enum: [host_disconnect, host_disconnect_all, switch_off, app_exit, service_failed, network_changed, port_changed, issuer_ended, ip_changed, idle_expired, absolute_expired, re_paired, logout]

    LanStreamFrame:
      description: WebSocket 文本帧（服务端到客户端）
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, event]
          properties:
            type:
              const: chat
            event:
              type: object
              description: 接口契约 §10.1 的 ChatStreamEvent（started、delta、reasoning_delta、done、error），不含 tool_proposal
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [started, delta, reasoning_delta, done, error]
        - type: object
          additionalProperties: false
          required: [type, reason]
          properties:
            type:
              const: session_ended
            reason:
              $ref: '#/components/schemas/LanRevokeReason'
