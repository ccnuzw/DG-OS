[package]
name = "dgos-agents"
version = "0.1.0"
edition = "2021"

[dependencies]
dgos-db = { path = "../dgos-db" }
dgos-providers = { path = "../dgos-providers" }
dgos-skills = { path = "../dgos-skills" }
dgos-mcp = { path = "../dgos-mcp" }
dgos-types = { path = "../dgos-types" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
subtle = "2.6"
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
cap-std = "3"
ignore = "0.4"
similar = "2.7"
toml_edit = "0.25.17"
semver = "1.0"
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2"] }
serde_yaml = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = "3"
