[package]
name = "dgos-agents"
version = "0.1.0"
edition = "2021"

[dependencies]
dgos-db = { path = "../dgos-db" }
dgos-providers = { path = "../dgos-providers" }
dgos-skills = { path = "../dgos-skills" }
dgos-mcp = { path = "../dgos-mcp" }
dgos-types = { path = "../dgos-types" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
subtle = "2.6"
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
cap-std = "3"
ignore = "0.4"
similar = "2.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { workspace = true }
