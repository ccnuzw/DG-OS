[package]
name = "dgos-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
dgos-types = { path = "../dgos-types" }
dgos-db = { path = "../dgos-db" }

tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
async-trait = "0.1"
semver = "1.0"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
mockito = "1.0"
tempfile = "3.8"
