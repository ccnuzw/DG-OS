[package]
name = "dgos"
version = "0.1.0"
description = "DG-OS: A local-first AI application development framework"
authors = ["DG-OS Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dgos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace crates
dgos-types = { path = "../crates/dgos-types" }
dgos-db = { path = "../crates/dgos-db" }
dgos-providers = { path = "../crates/dgos-providers" }
dgos-skills = { path = "../crates/dgos-skills" }
dgos-workbench = { path = "../crates/dgos-workbench" }
dgos-mcp = { path = "../crates/dgos-mcp" }
dgos-modules = { path = "../crates/dgos-modules" }
dgos-application = { path = "../crates/dgos-application" }

# Tauri
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
anyhow = { workspace = true }
once_cell = "1.19"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }


[features]
# Real-WebView smoke harness for the module lifecycle commands (D035). Off by
# default; it embeds ../dist and drives a hidden WKWebView/WebView2 window.
# Run: npm run smoke:tauri
webview-smoke = ["tauri/custom-protocol", "dep:sha2", "dgos-providers/test-support"]

[dependencies.sha2]
workspace = true
optional = true

[[test]]
name = "webview_smoke"
path = "tests/webview_smoke.rs"
harness = false
required-features = ["webview-smoke"]

[[test]]
name = "webview_smoke_real"
path = "tests/webview_smoke_real.rs"
harness = false
required-features = ["webview-smoke"]

[[test]]
name = "webview_smoke_call"
path = "tests/webview_smoke_call.rs"
harness = false
required-features = ["webview-smoke"]

[[test]]
name = "webview_smoke_modules"
path = "tests/webview_smoke_modules.rs"
harness = false
required-features = ["webview-smoke"]
